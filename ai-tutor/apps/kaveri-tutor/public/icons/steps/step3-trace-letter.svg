<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="s3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="s3pencil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#s3bg)"/>
  <!-- Dotted letter outline अ -->
  <text x="22" y="42" font-family="'Noto Sans Devanagari', serif" font-size="28" font-weight="900"
        fill="none" stroke="#BFDBFE" stroke-width="3" stroke-dasharray="4 3" text-anchor="middle"
        dominant-baseline="middle">अ</text>
  <!-- Traced portion (solid, partial) -->
  <text x="22" y="42" font-family="'Noto Sans Devanagari', serif" font-size="28" font-weight="900"
        fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="14 50" text-anchor="middle"
        dominant-baseline="middle">अ</text>
  <!-- Pencil (rotated, drawing) -->
  <g transform="translate(44,18) rotate(45)">
    <!-- Pencil body -->
    <rect x="-4" y="-18" width="8" height="24" rx="2" fill="url(#s3pencil)"/>
    <!-- Pencil tip area -->
    <polygon points="-4,6 4,6 0,14" fill="#D97706"/>
    <!-- Lead tip -->
    <polygon points="-2,10 2,10 0,14" fill="#374151"/>
    <!-- Eraser -->
    <rect x="-4" y="-22" width="8" height="5" rx="1" fill="#FCA5A5"/>
    <!-- Metal band -->
    <rect x="-4" y="-18" width="8" height="3" fill="#9CA3AF"/>
    <!-- Shine -->
    <rect x="-1" y="-17" width="2" height="14" rx="1" fill="white" opacity="0.3"/>
  </g>
  <!-- Dotted trace path -->
  <path d="M10 50 Q18 44 26 46 Q34 48 40 42" stroke="#93C5FD" stroke-width="2"
        stroke-dasharray="3 3" stroke-linecap="round" fill="none"/>
  <!-- Finger pointer -->
  <circle cx="40" cy="42" r="4" fill="#3B82F6" opacity="0.25"/>
  <circle cx="40" cy="42" r="2.5" fill="#3B82F6"/>
</svg>
