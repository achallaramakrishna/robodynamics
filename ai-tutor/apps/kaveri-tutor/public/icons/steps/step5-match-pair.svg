  <!-- Check on matched -->
  <circle cx="56" cy="12" r="6" fill="#10B981"/>
  <path d="M53 12 L55 14.5 L59 9.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
