<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="s7bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
    <linearGradient id="s7mag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#s7bg)"/>
  <!-- Big Hindi letter -->
  <text x="26" y="36" font-family="'Noto Sans Devanagari', serif" font-size="30" font-weight="900"
        fill="#F43F5E" text-anchor="middle" dominant-baseline="middle">अ</text>
  <!-- Magnifying glass -->
  <circle cx="42" cy="24" r="12" fill="white" stroke="url(#s7mag)" stroke-width="3"/>
  <!-- Lens shine -->
  <circle cx="38" cy="20" r="3.5" fill="white" opacity="0.6"/>
  <!-- Handle -->
  <line x1="51" y1="33" x2="58" y2="40" stroke="url(#s7mag)" stroke-width="4" stroke-linecap="round"/>
  <!-- Letter inside magnifier -->
  <text x="42" y="24" font-family="'Noto Sans Devanagari', serif" font-size="11" font-weight="900"
        fill="#F43F5E" text-anchor="middle" dominant-baseline="middle">अ?</text>
  <!-- Options row at bottom -->
  <rect x="6" y="50" width="12" height="9" rx="4" fill="#F43F5E" opacity="0.9"/>
  <text x="12" y="54.5" font-family="'Noto Sans Devanagari', serif" font-size="7" font-weight="900"
        fill="white" text-anchor="middle" dominant-baseline="middle">अ</text>
  <rect x="21" y="50" width="12" height="9" rx="4" fill="white" stroke="#FECDD3" stroke-width="1.5"/>
  <text x="27" y="54.5" font-family="'Noto Sans Devanagari', serif" font-size="7" font-weight="700"
        fill="#9F1239" text-anchor="middle" dominant-baseline="middle">आ</text>
  <rect x="36" y="50" width="12" height="9" rx="4" fill="white" stroke="#FECDD3" stroke-width="1.5"/>
  <text x="42" y="54.5" font-family="'Noto Sans Devanagari', serif" font-size="7" font-weight="700"
        fill="#9F1239" text-anchor="middle" dominant-baseline="middle">इ</text>
</svg>
