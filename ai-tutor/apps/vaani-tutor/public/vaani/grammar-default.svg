<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" rx="20" fill="#fdf4ff"/>
  <rect x="20" y="20" width="360" height="260" rx="16" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8 5"/>
  <!-- Open book icon -->
  <g transform="translate(200,110)">
    <path d="M-60,30 L-60,-30 Q-60,-40 -50,-40 L0,-40 L0,40 L-50,40 Q-60,40 -60,30 Z" fill="#e9d5ff" stroke="#7c3aed" stroke-width="2"/>
    <path d="M60,30 L60,-30 Q60,-40 50,-40 L0,-40 L0,40 L50,40 Q60,40 60,30 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#7c3aed" stroke-width="2"/>
    <!-- Lines on left page -->
    <line x1="-45" y1="-20" x2="-10" y2="-20" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
    <line x1="-45" y1="-8"  x2="-10" y2="-8"  stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
    <line x1="-45" y1="4"   x2="-10" y2="4"   stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
    <line x1="-45" y1="16"  x2="-25" y2="16"  stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
    <!-- Lines on right page -->
    <line x1="10" y1="-20" x2="45" y2="-20" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="-8"  x2="45" y2="-8"  stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="4"   x2="45" y2="4"   stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="16"  x2="30" y2="16"  stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Hindi label -->
  <text x="200" y="220" text-anchor="middle" font-family="serif" font-size="28" fill="#7c3aed" font-weight="bold">व्याकरण</text>
  <text x="200" y="248" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9333ea">Hindi Grammar · Level 6</text>
</svg>
