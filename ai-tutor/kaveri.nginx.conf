# Kaveri (Kannada AI Tutor) - Nginx Reverse Proxy Configuration
# This config routes requests to /kaveri/ to the Next.js app running on port 3002
#
# Usage:
# 1. Copy this file to /etc/nginx/sites-available/kaveri.conf
# 2. Create symlink: ln -s /etc/nginx/sites-available/kaveri.conf /etc/nginx/sites-enabled/
# 3. Test: sudo nginx -t
# 4. Reload: sudo systemctl reload nginx
#
# Certificate auto-configured by certbot (HTTPS SSL)

upstream kaveri_backend {
    server 127.0.0.1:3002;
}

# HTTP redirect to HTTPS (added by certbot)
server {
    listen 80;
    server_name robodynamics.in;

    location /kaveri/ {
        return 301 https://robodynamics.in$request_uri;
    }

    # Allow certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# HTTPS server (configured by certbot)
server {
    listen 443 ssl http2;
    server_name robodynamics.in;

    # SSL certificates (auto-managed by certbot)
    ssl_certificate /etc/letsencrypt/live/robodynamics.in-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/robodynamics.in-0001/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/robodynamics.in-0001/chain.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logging
    access_log /var/log/nginx/kaveri-access.log;
    error_log /var/log/nginx/kaveri-error.log;

    # =====================================================
    # Kaveri App - /kaveri/ subpath
    # =====================================================

    location /kaveri/ {
        proxy_pass http://kaveri_backend;
        proxy_http_version 1.1;

        # Headers for reverse proxy
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Performance
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # =====================================================
    # Static Assets - /kaveri/assets/ and /_next/
    # =====================================================

    location /kaveri/assets/ {
        alias /var/www/kaveri-tutor/public/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /kaveri/_next/ {
        alias /var/www/kaveri-tutor/.next/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /kaveri/public/ {
        alias /var/www/kaveri-tutor/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # =====================================================
    # Security Headers
    # =====================================================

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
