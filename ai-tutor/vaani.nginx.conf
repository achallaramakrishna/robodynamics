# Nginx Configuration for Vaani (Hindi AI Tutor)
#
# Installation:
#   1. Copy this file to: /etc/nginx/sites-available/vaani.conf
#   2. Create symlink: ln -s /etc/nginx/sites-available/vaani.conf /etc/nginx/sites-enabled/vaani.conf
#   3. Test config: sudo nginx -t
#   4. Reload nginx: sudo systemctl reload nginx
#
# Verify:
#   curl -H "Host: robodynamics.in" http://localhost/vaani/
#

upstream vaani_backend {
    # Direct to PM2-managed Vaani instance on port 3001
    server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# HTTP redirect to HTTPS (if SSL is enabled)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name robodynamics.in www.robodynamics.in;
#     location /vaani/ {
#         return 301 https://$server_name$request_uri;
#     }
# }

# Main server block
server {
    listen 80;
    listen [::]:80;

    server_name robodynamics.in www.robodynamics.in;
    client_max_body_size 50M;

    # Redirect www to non-www (optional)
    # if ($host = "www.robodynamics.in") {
    #     return 301 https://robodynamics.in$request_uri;
    # }

    # Access & Error Logs
    access_log /var/log/nginx/vaani-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/vaani-error.log warn;

    # ======================================
    # VAANI TUTOR ROUTES
    # ======================================

    location /vaani/ {
        # Proxy to PM2-managed Vaani app
        proxy_pass http://vaani_backend;

        # HTTP version for backend communication
        proxy_http_version 1.1;

        # Preserve original request headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (for real-time features, if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Connection management
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        keepalive_timeout 60s;

        # Caching headers (let app control via Cache-Control)
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header X-Proxy-By "Vaani-Nginx" always;

        # Buffer settings for performance
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ======================================
    # STATIC ASSETS (Images, CSS, JS)
    # ======================================

    location /vaani/public/ {
        # Serve static assets from Vaani's public directory
        alias /c/roboworkspace/robodynamics/ai-tutor/apps/vaani-tutor/public/;

        # Cache static assets aggressively
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Gzip compression
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;

        # Fallback to app if file not found
        error_page 404 =200 /vaani/;
    }

    location /vaani/assets/ {
        # Serve generated images and assets
        alias /c/roboworkspace/robodynamics/ai-tutor/apps/vaani-tutor/public/assets/;

        # Cache generated images
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";

        # Enable compression for PNG/JPG
        gzip on;
        gzip_types image/png image/jpeg;
    }

    # ======================================
    # HEALTH CHECK & MONITORING
    # ======================================

    location /vaani/health {
        # Quick health check endpoint
        access_log off;
        proxy_pass http://vaani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    # ======================================
    # SECURITY HEADERS
    # ======================================

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ======================================
    # GZIP COMPRESSION
    # ======================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/atom+xml image/svg+xml;
    gzip_disable "msie6";

    # ======================================
    # RATE LIMITING (Optional)
    # ======================================

    # Limit requests to /vaani/ to prevent abuse
    # limit_req_zone $binary_remote_addr zone=vaani_limit:10m rate=50r/s;
    # location /vaani/ {
    #     limit_req zone=vaani_limit burst=100 nodelay;
    #     ...
    # }
}

