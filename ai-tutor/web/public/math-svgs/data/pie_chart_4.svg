  <text x="122" y="112" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">25%</text>
  <text x="52" y="120" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">25%</text>
  <text x="38" y="55" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">25%</text>
