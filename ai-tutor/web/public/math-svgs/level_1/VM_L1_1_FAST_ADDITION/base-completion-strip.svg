<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .bar-bg { fill: #1e293b; rx: 12px; }
      .bar-fill { fill: #3b82f6; rx: 12px; }
      .bar-gap { fill: #22c55e; fill-opacity: 0.2; stroke: #22c55e; stroke-width: 3; stroke-dasharray: 6,4; rx: 12px; }
      .text-light { fill: #f8fafc; font-family: system-ui, sans-serif; font-weight: bold; font-size: 28px; }
      .text-gap { fill: #22c55e; font-family: system-ui, sans-serif; font-weight: bold; font-size: 28px; }
      .text-base { fill: #eab308; font-family: system-ui, sans-serif; font-weight: bold; font-size: 32px; }
    </style>
  </defs>

  <rect width="600" height="200" class="bg" rx="16"/>

  <!-- Base 100 label -->
  <text x="540" y="50" class="text-base" text-anchor="middle">100</text>
  <line x1="540" y1="65" x2="540" y2="90" stroke="#eab308" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Main completion bar -->
  <rect x="40" y="100" width="520" height="40" class="bar-bg"/>
  
  <!-- Filled portion (e.g. 97) -->
  <rect x="40" y="100" width="460" height="40" class="bar-fill"/>
  <text x="270" y="130" class="text-light" text-anchor="middle">97</text>

  <!-- Gap portion (e.g. +3) -->
  <rect x="500" y="100" width="60" height="40" class="bar-gap"/>
  <text x="530" y="130" class="text-gap" text-anchor="middle">+3</text>

  <path d="M 500 150 L 500 160 L 560 160 L 560 150" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="530" y="185" class="text-gap" text-anchor="middle" font-size="20">Gap</text>
</svg>
