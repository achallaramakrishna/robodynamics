<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: none; }
      .shield-bg { fill: #22c55e; stroke: #166534; stroke-width: 6; stroke-linejoin: round; }
      .text-title { fill: #1e293b; font-family: system-ui, sans-serif; font-weight: bold; font-size: 24px; }
      .text-sub { fill: #1e293b; font-family: system-ui, sans-serif; font-weight: 600; font-size: 18px; }
      .text-icon { fill: #1e293b; font-family: system-ui, sans-serif; font-weight: bold; font-size: 72px; }
    </style>
  </defs>

  <rect width="300" height="300" class="bg"/>

  <path d="M 150 20 C 220 20 270 50 270 50 L 270 140 C 270 210 210 260 150 280 C 90 260 30 210 30 140 L 30 50 C 30 50 80 20 150 20 Z" class="shield-bg"/>

  <text x="150" y="90" class="text-title" text-anchor="middle">PRODUCT</text>
  <text x="150" y="120" class="text-sub" text-anchor="middle">STAYS CONSTANT</text>
  
  <text x="150" y="220" class="text-icon" text-anchor="middle">=</text>

</svg>
