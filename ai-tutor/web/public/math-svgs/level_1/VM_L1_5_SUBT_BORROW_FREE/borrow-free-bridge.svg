<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="400" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Count Up Instead of Borrowing</text>
  <text x="400" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Move from the smaller number up to the next base, then finish the jump.</text>
  <g transform="translate(96 178)">
    <line x1="0" y1="72" x2="608" y2="72" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    <circle cx="120" cy="72" r="18" fill="#818cf8"/>
    <circle cx="420" cy="72" r="18" fill="#fb923c"/>
    <circle cx="560" cy="72" r="18" fill="#22c55e"/>
    <text x="120" y="34" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#3730a3">637</text>
    <text x="420" y="34" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#c2410c">640</text>
    <text x="560" y="34" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#166534">1000</text>
    <path d="M138 72 H402" stroke="#818cf8" stroke-width="5"/>
    <path d="M438 72 H542" stroke="#fb923c" stroke-width="5"/>
    <circle cx="180" cy="72" r="9" fill="#818cf8">
      <animate attributeName="cx" values="180;390;180" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="72" r="9" fill="#fb923c">
      <animate attributeName="cx" values="470;530;470" dur="2.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="270" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3730a3">+3</text>
    <text x="490" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#c2410c">+360</text>
    <text x="360" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">Total distance = 363</text>
  </g>
</svg>
