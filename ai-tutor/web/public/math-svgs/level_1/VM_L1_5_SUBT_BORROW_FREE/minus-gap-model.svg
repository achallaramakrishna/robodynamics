<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .bar-whole { fill: #1e293b; stroke: #3b82f6; stroke-width: 3; rx: 8px; }
      .bar-part { fill: #3b82f6; rx: 8px; }
      .bar-gap { fill: none; stroke: #eab308; stroke-width: 3; stroke-dasharray: 6 6; rx: 8px; }
      .text-light { fill: #f8fafc; font-family: system-ui, sans-serif; font-weight: bold; font-size: 32px; }
      .text-gap { fill: #eab308; font-family: system-ui, sans-serif; font-weight: bold; font-size: 32px; }
    </style>
  </defs>

  <rect width="600" height="250" class="bg" rx="16"/>

  <!-- Top Bar: Whole -->
  <rect x="50" y="50" width="500" height="50" class="bar-whole"/>
  <text x="300" y="85" class="text-light" text-anchor="middle">1000</text>

  <!-- Bottom Bar Left: 637 -->
  <rect x="50" y="140" width="318" height="50" class="bar-part"/>
  <text x="210" y="175" class="text-light" text-anchor="middle">637</text>

  <!-- Bottom Bar Right: GAP -->
  <rect x="375" y="140" width="175" height="50" class="bar-gap"/>
  <text x="460" y="175" class="text-gap" text-anchor="middle">GAP (?)</text>

  <!-- Connections -->
  <line x1="50" y1="110" x2="50" y2="130" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="550" y1="110" x2="550" y2="130" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>

</svg>
