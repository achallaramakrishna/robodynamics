<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs><style>.bg{fill:#0D1B2A;}.box{fill:#0A1628;stroke:#1E3A5F;stroke-width:1.5;}</style>
    <marker id="f" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6z" fill="#6366F1"/>
    </marker>
  </defs>
  <rect width="520" height="200" rx="14" class="bg"/>
  <text x="260" y="24" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">×5 = ÷2 then ×10 — Three Examples</text>
  <text x="260" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">Because 5 = 10 ÷ 2 — halve first, shift decimal right</text>

  <!-- Row 1: 48 × 5 -->
  <rect x="20" y="58" width="70" height="44" rx="8" class="box"/>
  <text x="55" y="75" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#F1F5F9">48</text>
  <text x="55" y="93" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748B">×5</text>

  <line x1="92" y1="80" x2="108" y2="80" stroke="#6366F1" stroke-width="2" marker-end="url(#f)"/>
  <text x="100" y="73" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#6366F1">÷2</text>

  <rect x="110" y="58" width="70" height="44" rx="8" class="box" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="145" y="75" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#3B82F6">24</text>
  <text x="145" y="93" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748B">half</text>

  <line x1="182" y1="80" x2="198" y2="80" stroke="#6366F1" stroke-width="2" marker-end="url(#f)"/>
  <text x="190" y="73" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#6366F1">×10</text>

  <rect x="200" y="52" width="90" height="56" rx="8" fill="rgba(34,197,94,0.1)" stroke="#22C55E" stroke-width="2"/>
  <text x="245" y="76" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="800" fill="#22C55E">240</text>
  <text x="245" y="98" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#34D399">48 × 5 ✓</text>

  <!-- Row 2: 36 × 5 -->
  <rect x="320" y="58" width="70" height="44" rx="8" class="box"/>
  <text x="355" y="75" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#F1F5F9">36</text>
  <text x="355" y="93" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748B">×5</text>

  <line x1="392" y1="80" x2="408" y2="80" stroke="#6366F1" stroke-width="2" marker-end="url(#f)"/>
  <text x="400" y="73" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#6366F1">÷2</text>

  <rect x="410" y="58" width="88" height="44" rx="8" fill="rgba(34,197,94,0.1)" stroke="#22C55E" stroke-width="2"/>
  <text x="454" y="75" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#22C55E">18</text>
  <text x="454" y="93" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#34D399">×10 = 180</text>

  <!-- Rule callout -->
  <rect x="20" y="120" width="480" height="60" rx="10" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="260" y="143" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" fill="#CBD5E1" font-weight="600">
    Rule:  N × 5  =  (N ÷ 2) × 10
  </text>
  <text x="260" y="162" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#94A3B8">
    If N is odd: keep the .5 → e.g. 37 × 5 = 18.5 × 10 = 185
  </text>
  <text x="260" y="177" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">
    Odd number trick: subtract 1, halve, add 5 at end  (37→36÷2=18, append 5 → 185)
  </text>
</svg>
