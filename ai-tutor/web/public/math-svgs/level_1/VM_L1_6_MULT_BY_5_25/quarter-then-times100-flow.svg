<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs><style>.bg{fill:#0D1B2A;}.box{fill:#0A1628;stroke:#1E3A5F;stroke-width:1.5;}</style>
    <marker id="q" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="520" height="200" rx="14" class="bg"/>
  <text x="260" y="24" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">×25 = ÷4 then ×100 — Three Examples</text>
  <text x="260" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">Because 25 = 100 ÷ 4 — quarter first, then ×100</text>

  <!-- Example: 48 × 25 -->
  <rect x="14" y="58" width="62" height="50" rx="8" class="box"/>
  <text x="45" y="77" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="700" fill="#F1F5F9">48</text>
  <text x="45" y="97" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748B">×25</text>

  <line x1="78" y1="83" x2="92" y2="83" stroke="#F59E0B" stroke-width="2" marker-end="url(#q)"/>
  <text x="85" y="76" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#F59E0B">÷2</text>

  <rect x="94" y="58" width="62" height="50" rx="8" class="box" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="125" y="77" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="700" fill="#F59E0B">24</text>
  <text x="125" y="97" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748B">½</text>

  <line x1="158" y1="83" x2="172" y2="83" stroke="#F59E0B" stroke-width="2" marker-end="url(#q)"/>
  <text x="165" y="76" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#F59E0B">÷2</text>

  <rect x="174" y="58" width="62" height="50" rx="8" class="box" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="205" y="77" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="700" fill="#F59E0B">12</text>
  <text x="205" y="97" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748B">¼</text>

  <line x1="238" y1="83" x2="252" y2="83" stroke="#F59E0B" stroke-width="2" marker-end="url(#q)"/>
  <text x="245" y="76" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#F59E0B">×100</text>

  <rect x="254" y="50" width="100" height="66" rx="8" fill="rgba(34,197,94,0.1)" stroke="#22C55E" stroke-width="2"/>
  <text x="304" y="80" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" font-weight="900" fill="#22C55E">1200</text>
  <text x="304" y="103" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#34D399">48 × 25 ✓</text>

  <!-- Second example: 36 × 25 -->
  <text x="380" y="66" font-family="Inter,sans-serif" font-size="12" fill="#CBD5E1">36 × 25:</text>
  <text x="380" y="82" font-family="Inter,sans-serif" font-size="12" fill="#F59E0B">36 ÷ 2 = 18</text>
  <text x="380" y="98" font-family="Inter,sans-serif" font-size="12" fill="#F59E0B">18 ÷ 2 = 9</text>
  <text x="380" y="114" font-family="Inter,sans-serif" font-size="13" fill="#22C55E" font-weight="700">9 × 100 = 900 ✓</text>

  <!-- Rule -->
  <rect x="14" y="130" width="492" height="56" rx="10" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="260" y="151" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" fill="#CBD5E1" font-weight="600">
    Rule:  N × 25  =  (N ÷ 4) × 100
  </text>
  <text x="260" y="170" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#94A3B8">
    Always works cleanly when N is divisible by 4
  </text>
  <text x="260" y="182" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">
    If not: 34 × 25 = (34 ÷ 4) × 100 = 8.5 × 100 = 850
  </text>
</svg>
