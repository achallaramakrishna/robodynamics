<svg xmlns="http://www.w3.org/2000/svg" width="360" height="140" viewBox="0 0 360 140">
  <rect width="360" height="140" rx="24" fill="#FFF7D6"/>
  <text x="24" y="30" font-family="Segoe UI, Arial" font-size="21" font-weight="700" fill="#6C5300">Three answer slots for a 2 x 2 product</text>
  <text x="24" y="50" font-family="Segoe UI, Arial" font-size="13" fill="#6E6751">1 product, 2 products, 1 product</text>

  <g font-family="Segoe UI, Arial" text-anchor="middle">
    <rect x="36" y="68" width="80" height="42" rx="12" fill="#FFFFFF" stroke="#D7B347" stroke-width="2"/>
    <rect x="140" y="68" width="80" height="42" rx="12" fill="#FFFFFF" stroke="#D7B347" stroke-width="2"/>
    <rect x="244" y="68" width="80" height="42" rx="12" fill="#FFFFFF" stroke="#D7B347" stroke-width="2"/>

    <text x="76" y="94" font-size="16" font-weight="700" fill="#1F2440">1 prod</text>
    <text x="180" y="94" font-size="16" font-weight="700" fill="#7A2458">2 prods</text>
    <text x="284" y="94" font-size="16" font-weight="700" fill="#1F2440">1 prod</text>

    <text x="76" y="126" font-size="13" fill="#5B6275">ones</text>
    <text x="180" y="126" font-size="13" fill="#7A2458">tens</text>
    <text x="284" y="126" font-size="13" fill="#5B6275">hundreds</text>
  </g>
</svg>
