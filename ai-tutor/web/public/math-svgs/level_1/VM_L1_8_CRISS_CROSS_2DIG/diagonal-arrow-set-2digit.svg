<svg xmlns="http://www.w3.org/2000/svg" width="320" height="220" viewBox="0 0 320 220">
  <rect width="320" height="220" rx="24" fill="#FFF8FB"/>
  <text x="24" y="30" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#7A2458">Middle band uses both diagonals</text>

  <rect x="42" y="56" width="196" height="104" rx="18" fill="#FFFFFF" stroke="#F0B9D3" stroke-width="2"/>
  <line x1="110" y1="74" x2="110" y2="142" stroke="#D7E0F8" stroke-width="2"/>
  <line x1="178" y1="74" x2="178" y2="142" stroke="#D7E0F8" stroke-width="2"/>
  <line x1="74" y1="108" x2="214" y2="108" stroke="#D7E0F8" stroke-width="2"/>

  <text x="92" y="98" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#1F2440">A</text>
  <text x="160" y="98" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#1F2440">B</text>
  <text x="92" y="132" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#8B1E6A">C</text>
  <text x="160" y="132" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#8B1E6A">D</text>

  <path d="M92 94 L160 128" stroke="#D9A500" stroke-width="6" stroke-linecap="round" fill="none">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <path d="M160 94 L92 128" stroke="#D3478E" stroke-width="6" stroke-linecap="round" fill="none">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
  </path>

  <rect x="248" y="70" width="54" height="74" rx="14" fill="#FFF0F8" stroke="#F0B9D3"/>
  <text x="275" y="92" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#7A2458">Add both</text>
  <text x="275" y="112" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#44506B">A x D</text>
  <text x="275" y="130" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#44506B">B x C</text>
</svg>
