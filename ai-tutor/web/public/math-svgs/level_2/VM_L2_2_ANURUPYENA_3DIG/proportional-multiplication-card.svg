<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Worked Example: 375 x 16</text>
  <g transform="translate(100 156)">
    <rect x="0" y="0" width="600" height="140" rx="24" fill="#f8fafc" stroke="#dbeafe"/>
    <text x="300" y="42" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="#111827">375 x 16 = 3 x 125 x 16</text>
    <text x="300" y="84" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="#111827">= 3 x 2000</text>
    <text x="300" y="118" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="36" font-weight="700" fill="#166534">= 6000</text>
  </g>
</svg>
