<svg xmlns="http://www.w3.org/2000/svg" width="460" height="150" viewBox="0 0 460 150">
  <rect width="460" height="150" rx="24" fill="#ECFBF5"/>
  <text x="28" y="34" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#156B4C">Carry travels left after each band</text>
  <text x="28" y="54" font-family="Segoe UI, Arial" font-size="13" fill="#5B6B66">Write one digit in the current slot, move the extra tens left.</text>

  <rect x="28" y="76" width="56" height="42" rx="12" fill="#FFFFFF" stroke="#9BDEBE" stroke-width="2"/>
  <rect x="96" y="76" width="56" height="42" rx="12" fill="#FFFFFF" stroke="#9BDEBE" stroke-width="2"/>
  <rect x="164" y="76" width="56" height="42" rx="12" fill="#FFFFFF" stroke="#9BDEBE" stroke-width="2"/>
  <rect x="232" y="76" width="56" height="42" rx="12" fill="#FFFFFF" stroke="#9BDEBE" stroke-width="2"/>
  <rect x="300" y="76" width="56" height="42" rx="12" fill="#FFFFFF" stroke="#9BDEBE" stroke-width="2"/>

  <text x="56" y="102" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#1F2440">1s</text>
  <text x="124" y="102" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#1F2440">10s</text>
  <text x="192" y="102" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#1F2440">100s</text>
  <text x="260" y="102" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#1F2440">1000s</text>
  <text x="328" y="102" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#1F2440">10000s</text>

  <path d="M86 97 H94" stroke="#2EAF78" stroke-width="6" stroke-linecap="round"/>
  <path d="M154 97 H162" stroke="#2EAF78" stroke-width="6" stroke-linecap="round"/>
  <path d="M222 97 H230" stroke="#2EAF78" stroke-width="6" stroke-linecap="round"/>
  <path d="M290 97 H298" stroke="#2EAF78" stroke-width="6" stroke-linecap="round"/>

  <text x="124" y="70" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#156B4C">carry 1</text>
  <text x="192" y="70" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#156B4C">carry 2</text>
  <text x="260" y="70" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#156B4C">carry 1</text>
