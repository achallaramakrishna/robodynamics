<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220">
  <rect width="420" height="220" rx="24" fill="#FFF8FB"/>
  <text x="28" y="34" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#7A2458">Center band: three products, not two</text>
  <text x="28" y="56" font-family="Segoe UI, Arial" font-size="13" fill="#6A7184">This is the band students most often forget.</text>

  <rect x="32" y="74" width="356" height="110" rx="18" fill="#FFFFFF" stroke="#F0B9D3" stroke-width="2"/>
  <line x1="110" y1="92" x2="110" y2="158" stroke="#D7E0F8" stroke-width="2"/>
  <line x1="190" y1="92" x2="190" y2="158" stroke="#D7E0F8" stroke-width="2"/>
  <line x1="270" y1="92" x2="270" y2="158" stroke="#D7E0F8" stroke-width="2"/>
  <line x1="70" y1="124" x2="310" y2="124" stroke="#D7E0F8" stroke-width="2"/>

  <text x="86" y="114" text-anchor="middle" font-family="Segoe UI, Arial" font-size="26" font-weight="700" fill="#1F2440">A</text>
  <text x="166" y="114" text-anchor="middle" font-family="Segoe UI, Arial" font-size="26" font-weight="700" fill="#1F2440">B</text>
  <text x="246" y="114" text-anchor="middle" font-family="Segoe UI, Arial" font-size="26" font-weight="700" fill="#1F2440">C</text>
  <text x="86" y="150" text-anchor="middle" font-family="Segoe UI, Arial" font-size="26" font-weight="700" fill="#8B1E6A">D</text>
  <text x="166" y="150" text-anchor="middle" font-family="Segoe UI, Arial" font-size="26" font-weight="700" fill="#8B1E6A">E</text>
  <text x="246" y="150" text-anchor="middle" font-family="Segoe UI, Arial" font-size="26" font-weight="700" fill="#8B1E6A">F</text>

  <path d="M86 110 L246 150" stroke="#D9A500" stroke-width="6" stroke-linecap="round" fill="none">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M166 110 L166 150" stroke="#4B79FF" stroke-width="6" stroke-linecap="round" fill="none">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="0.8s" repeatCount="indefinite"/>
  </path>
  <path d="M246 110 L86 150" stroke="#D3478E" stroke-width="6" stroke-linecap="round" fill="none">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="1.6s" repeatCount="indefinite"/>
  </path>

  <circle cx="166" cy="124" r="22" fill="#FFFFFF" stroke="#D3478E" stroke-width="4"/>
  <text x="166" y="130" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#1F2440">A x F</text>

  <rect x="296" y="88" width="92" height="80" rx="14" fill="#FFF0F8" stroke="#F0B9D3"/>
  <text x="342" y="112" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#7A2458">Add all 3</text>
  <text x="342" y="132" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#44506B">A x F</text>
  <text x="342" y="148" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#44506B">B x E</text>
  <text x="342" y="164" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#44506B">C x D</text>
</svg>
