<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120">
  <rect width="420" height="120" rx="24" fill="#ffffff"/>
  <text x="24" y="24" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#1f2440">Running quotient for 231 ÷ 9</text>
  <text x="24" y="42" font-family="Segoe UI, Arial" font-size="12" fill="#6b7280">Bring 2 down, then keep adding the next digit.</text>

  <rect x="26" y="56" width="66" height="42" rx="12" fill="#fff7d6" stroke="#e2b93b" stroke-width="2"/>
  <rect x="124" y="56" width="66" height="42" rx="12" fill="#eef6ff" stroke="#84b6ff" stroke-width="2"/>
  <rect x="222" y="56" width="66" height="42" rx="12" fill="#fdf2f8" stroke="#f0abcf" stroke-width="2"/>
  <rect x="320" y="56" width="66" height="42" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>

  <text x="59" y="73" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#7c5a00">bring down</text>
  <text x="59" y="90" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#1f2440">2</text>

  <text x="157" y="73" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#2454a6">2 + 3</text>
  <text x="157" y="90" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#1f2440">5</text>

  <text x="255" y="73" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#9d174d">5 + 1</text>
  <text x="255" y="90" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#1f2440">6</text>

  <text x="353" y="73" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#166534">final result</text>
  <text x="353" y="90" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#166534">25 R 6</text>

  <path d="M92 77 H122" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M190 77 H220" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M288 77 H318" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
