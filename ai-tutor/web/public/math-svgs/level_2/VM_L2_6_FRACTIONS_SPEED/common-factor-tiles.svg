<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Find the Common Factor</text>
  <g transform="translate(120 170)">
    <rect x="0" y="0" width="150" height="100" rx="22" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <rect x="250" y="0" width="150" height="100" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <rect x="500" y="0" width="150" height="100" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
    <text x="75" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3730a3">36</text>
    <text x="325" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#c2410c">48</text>
    <text x="575" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">common 12</text>
    <text x="75" y="74" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#111827">2 x 2 x 3 x 3</text>
    <text x="325" y="74" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#111827">2 x 2 x 2 x 2 x 3</text>
    <rect x="430" y="16" width="130" height="68" rx="18" fill="#ede9fe" stroke="#c4b5fd"><animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/></rect>
  </g>
</svg>
