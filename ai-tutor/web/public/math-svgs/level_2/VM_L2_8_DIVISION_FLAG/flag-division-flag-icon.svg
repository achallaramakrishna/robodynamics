<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240">
  <rect x="12" y="12" width="496" height="216" rx="24" fill="#F8FBFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" font-family="Arial" font-size="21" font-weight="700" fill="#B45309">Flag Division setup</text>
  <text x="24" y="54" font-family="Arial" font-size="13" fill="#64748B">Put the divisor on the flag. Then divide one digit group at a time.</text>

  <rect x="46" y="80" width="46" height="34" rx="10" fill="#FFEDD5" stroke="#F59E0B" stroke-width="2"/>
  <text x="69" y="102" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#B45309">3</text>
  <line x1="69" y1="114" x2="69" y2="144" stroke="#F59E0B" stroke-width="3"/>
  <text x="69" y="162" text-anchor="middle" font-family="Arial" font-size="12" fill="#B45309">flag</text>

  <rect x="132" y="74" width="58" height="42" rx="10" fill="#FFFFFF" stroke="#D6E1FA" stroke-width="2"/>
  <rect x="200" y="74" width="58" height="42" rx="10" fill="#FFFFFF" stroke="#D6E1FA" stroke-width="2"/>
  <rect x="268" y="74" width="58" height="42" rx="10" fill="#FFFFFF" stroke="#D6E1FA" stroke-width="2"/>
  <text x="161" y="102" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1F2440">4</text>
  <text x="229" y="102" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1F2440">8</text>
  <text x="297" y="102" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1F2440">3</text>
  <text x="228" y="136" text-anchor="middle" font-family="Arial" font-size="13" fill="#64748B">dividend digits</text>

  <rect x="48" y="176" width="420" height="34" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="258" y="198" text-anchor="middle" font-family="Arial" font-size="15" fill="#9A3412">Remainder prefixes the next digit: 1 carried to 8 becomes 18</text>
</svg>
