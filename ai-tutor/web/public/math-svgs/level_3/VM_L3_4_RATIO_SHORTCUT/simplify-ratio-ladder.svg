<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">VEDIKA RATIO SHORTCUTS</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Simplify the Ratio Step by Step</text>
  <text x="400" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Remove the common factor until the ratio is in its simplest form.</text>

  <g transform="translate(150 152)">
    <rect x="0" y="0" width="150" height="94" rx="22" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <rect x="220" y="0" width="150" height="94" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <rect x="440" y="0" width="150" height="94" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
    <text x="75" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3730a3">Start</text>
    <text x="295" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#c2410c">Divide by 6</text>
    <text x="515" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">Simplest form</text>
    <text x="75" y="74" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="32" font-weight="700" fill="#111827">12 : 18</text>
    <text x="295" y="74" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="32" font-weight="700" fill="#111827">2 : 3</text>
    <text x="515" y="74" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="32" font-weight="700" fill="#166534">2 : 3</text>
    <path d="M150 47 H220" stroke="#94a3b8" stroke-width="4"/>
    <path d="M370 47 H440" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="185" cy="47" r="9" fill="#f97316">
      <animate attributeName="cx" values="162;208;162" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="405" cy="47" r="9" fill="#22c55e">
      <animate attributeName="cx" values="382;428;382" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
