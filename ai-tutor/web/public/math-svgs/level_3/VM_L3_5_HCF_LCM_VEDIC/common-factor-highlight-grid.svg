<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">VEDIKA HCF AND LCM</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Highlight the Common Factors</text>
  <text x="400" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">The shared factors are exactly what build the HCF.</text>

  <g transform="translate(160 152)">
    <rect x="0" y="0" width="180" height="120" rx="24" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <rect x="300" y="0" width="180" height="120" rx="24" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
    <text x="90" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3730a3">12</text>
    <text x="390" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">18</text>
    <text x="90" y="80" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#111827">2 x 2 x 3</text>
    <text x="390" y="80" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#111827">2 x 3 x 3</text>
    <rect x="188" y="26" width="104" height="64" rx="20" fill="#ede9fe" stroke="#c4b5fd">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <text x="240" y="66" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="700" fill="#6d28d9">2 x 3</text>
  </g>
</svg>
