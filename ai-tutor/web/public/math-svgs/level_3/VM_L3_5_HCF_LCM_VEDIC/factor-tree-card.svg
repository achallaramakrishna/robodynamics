<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="24" fill="#FBFCFF"/>
  <rect x="24" y="24" width="752" height="352" rx="22" fill="#FFFFFF" stroke="#D9E2F5" stroke-width="2"/>
  <rect x="24" y="24" width="752" height="10" rx="5" fill="#14B8A6"/>
  <text x="48" y="68" fill="#10213F" font-size="28" font-family="Arial, sans-serif" font-weight="700">Use factor trees to expose prime factors</text>
  <text x="48" y="98" fill="#51627F" font-size="16" font-family="Arial, sans-serif">Once the prime factors are visible, HCF and LCM become easier to spot.</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="230" y="154" fill="#0F766E" font-size="30" font-weight="700">12</text>
    <line x1="230" y1="166" x2="180" y2="214" stroke="#94A3B8" stroke-width="3"/>
    <line x1="230" y1="166" x2="280" y2="214" stroke="#94A3B8" stroke-width="3"/>
    <text x="180" y="236" fill="#10213F" font-size="24" font-weight="700">3</text>
    <text x="280" y="236" fill="#10213F" font-size="24" font-weight="700">4</text>
    <line x1="280" y1="248" x2="250" y2="292" stroke="#94A3B8" stroke-width="3"/>
    <line x1="280" y1="248" x2="310" y2="292" stroke="#94A3B8" stroke-width="3"/>
    <text x="250" y="314" fill="#10213F" font-size="24" font-weight="700">2</text>
    <text x="310" y="314" fill="#10213F" font-size="24" font-weight="700">2</text>

    <text x="570" y="154" fill="#0F766E" font-size="30" font-weight="700">18</text>
    <line x1="570" y1="166" x2="520" y2="214" stroke="#94A3B8" stroke-width="3"/>
    <line x1="570" y1="166" x2="620" y2="214" stroke="#94A3B8" stroke-width="3"/>
    <text x="520" y="236" fill="#10213F" font-size="24" font-weight="700">3</text>
    <text x="620" y="236" fill="#10213F" font-size="24" font-weight="700">6</text>
    <line x1="620" y1="248" x2="590" y2="292" stroke="#94A3B8" stroke-width="3"/>
    <line x1="620" y1="248" x2="650" y2="292" stroke="#94A3B8" stroke-width="3"/>
    <text x="590" y="314" fill="#10213F" font-size="24" font-weight="700">2</text>
    <text x="650" y="314" fill="#10213F" font-size="24" font-weight="700">3</text>
  </g>

  <rect x="194" y="330" width="412" height="32" rx="10" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="400" y="351" fill="#0F766E" font-size="16" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">12 = 2 × 2 × 3 and 18 = 2 × 3 × 3</text>
</svg>
