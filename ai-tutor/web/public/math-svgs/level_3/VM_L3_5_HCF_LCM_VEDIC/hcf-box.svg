<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">VEDIKA HCF AND LCM</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Highest Common Factor</text>
  <text x="400" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">The overlap between factor sets gives the HCF.</text>

  <g transform="translate(200 164)">
    <circle cx="120" cy="68" r="76" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <circle cx="220" cy="68" r="76" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
    <ellipse cx="170" cy="68" rx="34" ry="56" fill="#ddd6fe" opacity="0.9">
      <animate attributeName="opacity" values="0.45;0.95;0.45" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <text x="95" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3730a3">12</text>
    <text x="245" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">18</text>
    <text x="94" y="82" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="700" fill="#111827">2 x 2 x 3</text>
    <text x="246" y="82" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="700" fill="#111827">2 x 3 x 3</text>
    <text x="170" y="88" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#6d28d9">2 x 3</text>
  </g>

  <rect x="252" y="314" width="296" height="42" rx="16" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="400" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#6d28d9">HCF = 6</text>
</svg>
