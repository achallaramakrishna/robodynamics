<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200">
  <rect width="420" height="200" rx="24" fill="#fff8e6"/>
  <rect x="16" y="16" width="388" height="168" rx="22" fill="#ffffff" stroke="#f5d98b" stroke-width="2"/>

  <text x="28" y="44" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2440">Paravartya Correction Rule</text>
  <text x="28" y="64" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">If the next working digit becomes negative, the quotient guess was too large.</text>

  <rect x="28" y="82" width="364" height="30" rx="12" fill="#fffdf5" stroke="#e7c96f" stroke-width="2"/>
  <text x="42" y="102" font-family="Arial, sans-serif" font-size="14" fill="#1f2440">1. Try a quotient digit and compute next - (q x flag)</text>

  <rect x="28" y="122" width="364" height="30" rx="12" fill="#fffdf5" stroke="#e7c96f" stroke-width="2"/>
  <text x="42" y="142" font-family="Arial, sans-serif" font-size="14" fill="#1f2440">2. If the result is negative, lower the quotient digit by 1</text>

  <rect x="28" y="162" width="364" height="18" rx="9" fill="#e8eeff" stroke="#3555b4" stroke-width="2"/>
  <text x="210" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#3555b4">3. Recalculate the working digit and continue</text>
</svg>
