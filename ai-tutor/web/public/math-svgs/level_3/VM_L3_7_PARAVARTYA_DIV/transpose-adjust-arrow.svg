<svg xmlns="http://www.w3.org/2000/svg" width="340" height="180" viewBox="0 0 340 180">
  <rect width="340" height="180" rx="24" fill="#EEF4FF"/>
  <text x="24" y="32" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#2C3E8F">132 ÷ 11</text>
  <text x="24" y="52" font-family="Segoe UI, Arial" font-size="13" fill="#5E6B85">Flag 1 changes the next digit after each quotient step.</text>

  <rect x="24" y="72" width="50" height="50" rx="14" fill="white" stroke="#3555B4" stroke-width="2"/>
  <rect x="96" y="72" width="50" height="50" rx="14" fill="white" stroke="#3555B4" stroke-width="2"/>
  <rect x="168" y="72" width="50" height="50" rx="14" fill="white" stroke="#3555B4" stroke-width="2"/>
  <text x="49" y="104" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#1F2440">1</text>
  <text x="121" y="104" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#1F2440">3</text>
  <text x="193" y="104" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#1F2440">2</text>

  <path d="M55 140 C92 116, 105 116, 120 140" fill="none" stroke="#3555B4" stroke-width="6" stroke-linecap="round"/>
  <polygon points="120,140 109,134 111,147" fill="#3555B4"/>
  <text x="86" y="164" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#3555B4">subtract 1×1</text>

  <rect x="238" y="74" width="78" height="46" rx="14" fill="#FFF3DD" stroke="#D58A00" stroke-width="2"/>
  <text x="277" y="94" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#9A6200">working</text>
  <text x="277" y="111" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#1F2440">3-1=2</text>

  <animate attributeName="opacity" values="0.85;1;0.85" dur="2.2s" repeatCount="indefinite"/>
</svg>
