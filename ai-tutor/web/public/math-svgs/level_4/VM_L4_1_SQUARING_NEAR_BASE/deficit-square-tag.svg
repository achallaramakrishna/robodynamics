<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="24" fill="#FBFCFF"/>
  <rect x="24" y="24" width="752" height="352" rx="22" fill="#FFFFFF" stroke="#D9E2F5" stroke-width="2"/>
  <rect x="24" y="24" width="752" height="10" rx="5" fill="#F97316"/>
  <text x="48" y="68" fill="#10213F" font-size="28" font-family="Arial, sans-serif" font-weight="700">Deficit tag</text>
  <text x="48" y="98" fill="#51627F" font-size="16" font-family="Arial, sans-serif">When a number is below the base, mark the shortfall first.</text>
  <rect x="70" y="138" width="280" height="180" rx="22" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="210" y="188" fill="#9A3412" font-size="20" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">Example: 97²</text>
  <text x="210" y="248" fill="#10213F" font-size="58" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">97</text>
  <path d="M250 225 L310 225" stroke="#EA580C" stroke-width="4"/>
  <text x="280" y="213" fill="#EA580C" font-size="22" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">−3</text>
  <rect x="414" y="138" width="316" height="180" rx="22" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="438" y="180" fill="#1E293B" font-size="20" font-family="Arial, sans-serif" font-weight="700">Why it matters</text>
  <text x="438" y="220" fill="#475569" font-size="18" font-family="Arial, sans-serif">Left side = 97 − 3 = 94</text>
  <text x="438" y="255" fill="#475569" font-size="18" font-family="Arial, sans-serif">Right side = 3² = 09</text>
  <text x="438" y="290" fill="#0F172A" font-size="26" font-family="Arial, sans-serif" font-weight="700">Result = 9409</text>
</svg>
