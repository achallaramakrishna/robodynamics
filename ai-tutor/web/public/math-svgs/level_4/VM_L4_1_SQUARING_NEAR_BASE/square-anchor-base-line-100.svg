  <text x="48" y="68" fill="#10213F" font-size="28" font-family="Arial, sans-serif" font-weight="700">Use base 100 as the anchor</text>
  <text x="48" y="98" fill="#51627F" font-size="16" font-family="Arial, sans-serif">Numbers close to 100 are easiest when we measure their distance from 100.</text>
  <line x1="94" y1="220" x2="704" y2="220" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>
  <circle cx="520" cy="220" r="26" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="3"/>
  <text x="520" y="228" fill="#4338CA" font-size="22" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">100</text>
  <circle cx="448" cy="220" r="22" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3"/>
  <text x="448" y="227" fill="#C2410C" font-size="18" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">97</text>
  <path d="M448 180 L520 180" stroke="#F97316" stroke-width="4"/>
  <text x="484" y="166" fill="#EA580C" font-size="18" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">deficit 3</text>
  <rect x="76" y="284" width="648" height="54" rx="14" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="100" y="318" fill="#5B21B6" font-size="18" font-family="Arial, sans-serif" font-weight="700">Rule: left = number − deficit, right = deficit²</text>
</svg>
