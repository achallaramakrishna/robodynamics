<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="24" fill="#FBFCFF"/>
  <rect x="24" y="24" width="752" height="352" rx="22" fill="#FFFFFF" stroke="#D9E2F5" stroke-width="2"/>
  <rect x="24" y="24" width="752" height="10" rx="5" fill="#059669"/>
  <text x="48" y="68" fill="#10213F" font-size="28" font-family="Arial, sans-serif" font-weight="700">Denominator product</text>
  <text x="48" y="98" fill="#51627F" font-size="16" font-family="Arial, sans-serif">The bottom numbers multiply once and stay as the common denominator.</text>
  <rect x="136" y="144" width="528" height="134" rx="24" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="400" y="205" fill="#047857" font-size="52" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">3 × 6 = 18</text>
  <text x="400" y="244" fill="#334155" font-size="20" font-family="Arial, sans-serif" text-anchor="middle">This becomes the denominator for both terms.</text>
  <rect x="218" y="306" width="364" height="40" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="400" y="332" fill="#0F172A" font-size="18" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">Write it once, then focus on the numerator.</text>
</svg>
