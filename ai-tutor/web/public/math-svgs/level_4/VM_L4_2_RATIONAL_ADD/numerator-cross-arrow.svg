<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="24" fill="#F8FBFF"/>
  <rect x="24" y="24" width="752" height="352" rx="22" fill="#FFFFFF" stroke="#D6E2FF" stroke-width="2"/>
  <rect x="24" y="24" width="752" height="10" rx="5" fill="#F97316"/>
  <text x="48" y="68" fill="#10213F" font-size="28" font-family="Arial, sans-serif" font-weight="700">Cross arrows build the numerator</text>
  <text x="48" y="98" fill="#51627F" font-size="16" font-family="Arial, sans-serif">Multiply top-left with bottom-right, then top-right with bottom-left.</text>
  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="240" y="180" fill="#10213F" font-size="38">2</text>
    <line x1="210" y1="192" x2="270" y2="192" stroke="#10213F" stroke-width="3"/>
    <text x="240" y="228" fill="#10213F" font-size="38">3</text>
    <text x="560" y="180" fill="#10213F" font-size="38">1</text>
    <line x1="530" y1="192" x2="590" y2="192" stroke="#10213F" stroke-width="3"/>
    <text x="560" y="228" fill="#10213F" font-size="38">6</text>
  </g>
  <path d="M248 150 C348 112, 452 112, 552 150" fill="none" stroke="#7C3AED" stroke-width="4"/>
  <polygon points="552,150 539,145 541,159" fill="#7C3AED"/>
  <path d="M552 252 C452 290, 348 290, 248 252" fill="none" stroke="#F97316" stroke-width="4"/>
  <polygon points="248,252 261,247 259,261" fill="#F97316"/>
  <text x="400" y="136" fill="#6D28D9" font-size="16" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">2 × 6 = 12</text>
  <text x="400" y="305" fill="#C2410C" font-size="16" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">1 × 3 = 3</text>
  <rect x="296" y="324" width="208" height="34" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="400" y="347" fill="#9A3412" font-size="17" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">12 + 3 = 15</text>
</svg>
