<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="24" fill="#F8FBFF"/>
  <rect x="24" y="24" width="752" height="352" rx="22" fill="#FFFFFF" stroke="#D6E2FF" stroke-width="2"/>
  <rect x="24" y="24" width="752" height="10" rx="5" fill="#2563EB"/>
  <text x="48" y="68" fill="#10213F" font-size="28" font-family="Arial, sans-serif" font-weight="700">Rational addition in one clean layout</text>
  <text x="48" y="98" fill="#51627F" font-size="16" font-family="Arial, sans-serif">Multiply across, add the top, and keep the product below.</text>
  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="240" y="180" fill="#10213F" font-size="38">2</text>
    <line x1="210" y1="192" x2="270" y2="192" stroke="#10213F" stroke-width="3"/>
    <text x="240" y="228" fill="#10213F" font-size="38">3</text>
    <text x="400" y="205" fill="#64748B" font-size="30">+</text>
    <text x="560" y="180" fill="#10213F" font-size="38">1</text>
    <line x1="530" y1="192" x2="590" y2="192" stroke="#10213F" stroke-width="3"/>
    <text x="560" y="228" fill="#10213F" font-size="38">6</text>
  </g>
  <path d="M258 148 C350 118, 450 118, 542 148" fill="none" stroke="#7C3AED" stroke-width="4"/>
  <path d="M542 252 C450 282, 350 282, 258 252" fill="none" stroke="#F97316" stroke-width="4"/>
  <text x="400" y="136" fill="#6D28D9" font-size="16" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">2 × 6</text>
  <text x="400" y="292" fill="#C2410C" font-size="16" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">1 × 3</text>
  <rect x="162" y="310" width="476" height="42" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="400" y="338" fill="#1D4ED8" font-size="18" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">Answer: (12 + 3) / 18 = 15 / 18 = 5 / 6</text>
</svg>
