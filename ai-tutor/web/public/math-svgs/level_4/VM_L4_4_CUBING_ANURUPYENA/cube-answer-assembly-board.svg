<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="200" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <g transform="translate(100, 50)">
     <rect width="200" height="100" rx="16" fill="#1E293B" stroke="#EC4899" stroke-width="4" filter="url(#glow)" />
     <text x="100" y="65" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="42" fill="#F8FAFC" text-anchor="middle">14³ = 2744</text>
  </g>

  <text x="200" y="170" font-family="Inter" font-weight="800" font-size="14" fill="#D946EF" text-anchor="middle" letter-spacing="2">CUBE MASTERED</text>
</svg>