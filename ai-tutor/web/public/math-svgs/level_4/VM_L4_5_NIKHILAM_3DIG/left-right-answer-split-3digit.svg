<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feFlood flood-color="#10B981" flood-opacity="0.3" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feFlood flood-color="#3B82F6" flood-opacity="0.3" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="60" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">
    Result Assembly
  </text>
  <text x="400" y="90" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#94A3B8" text-anchor="middle">
    Splitting the answer into two 3-digit segments
  </text>

  <!-- Boxes -->
  <g transform="translate(100, 150)">
    <!-- Left Part -->
    <g transform="translate(0, 0)">
      <rect width="280" height="150" rx="20" fill="#064E3B" stroke="#10B981" stroke-width="3" filter="url(#glowGreen)" opacity="0.4" />
      <rect width="280" height="150" rx="20" fill="none" stroke="#10B981" stroke-width="3" />
      <text x="140" y="-15" font-family="Inter" font-weight="800" font-size="14" fill="#34D399" text-anchor="middle" letter-spacing="1">LEFT PART (N₁ + d₂)</text>
      <text x="140" y="95" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="72" fill="#F8FAFC" text-anchor="middle">991</text>
      <text x="140" y="130" font-family="Inter" font-weight="600" font-size="12" fill="#10B981" text-anchor="middle">3 DIGITS</text>
    </g>

    <!-- Separator -->
    <rect x="290" y="20" width="20" height="110" rx="10" fill="#334155" />
    
    <!-- Right Part -->
    <g transform="translate(320, 0)">
      <rect width="280" height="150" rx="20" fill="#1E3A8A" stroke="#3B82F6" stroke-width="3" filter="url(#glowBlue)" opacity="0.4" />
      <rect width="280" height="150" rx="20" fill="none" stroke="#3B82F6" stroke-width="3" />
      <text x="140" y="-15" font-family="Inter" font-weight="800" font-size="14" fill="#60A5FA" text-anchor="middle" letter-spacing="1">RIGHT PART (d₁ × d₂)</text>
      <text x="140" y="95" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="72" fill="#F8FAFC" text-anchor="middle">014</text>
      <text x="140" y="130" font-family="Inter" font-weight="600" font-size="12" fill="#3B82F6" text-anchor="middle">MUST BE 3 DIGITS</text>
    </g>
  </g>

  <!-- Final Concatenation -->
  <g transform="translate(400, 360)">
    <text font-family="'JetBrains Mono', monospace" font-weight="900" font-size="32" text-anchor="middle">
      <tspan fill="#10B981">991</tspan>
      <tspan fill="#334155"> + </tspan>
      <tspan fill="#3B82F6">014</tspan>
      <tspan fill="#F8FAFC"> = 991014</tspan>
    </text>
  </g>
</svg>