<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Titles -->
  <text x="400" y="60" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">
    Base Comparison (1000)
  </text>
  <text x="400" y="90" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#94A3B8" text-anchor="middle">
    Visualizing deviations from the central base
  </text>

  <!-- Number Line -->
  <g transform="translate(100, 220)">
    <!-- Line -->
    <line x1="0" y1="0" x2="600" y2="0" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    
    <!-- Base Marker -->
    <g transform="translate(300, 0)">
       <line x1="0" y1="-20" x2="0" y2="20" stroke="#F59E0B" stroke-width="4" />
       <text y="50" font-family="Inter" font-weight="900" font-size="24" fill="#F59E0B" text-anchor="middle">1000</text>
       <text y="75" font-family="Inter" font-weight="700" font-size="12" fill="#F59E0B" text-anchor="middle" opacity="0.6">THE BASE</text>
    </g>

    <!-- Number 1: 998 -->
    <g transform="translate(260, 0)">
       <circle r="8" fill="#F43F5E" filter="url(#glow)" />
       <text y="-30" font-family="'JetBrains Mono'" font-weight="800" font-size="18" fill="#F43F5E" text-anchor="middle">998</text>
       <line x1="0" y1="0" x2="40" y2="0" stroke="#F43F5E" stroke-width="3" stroke-dasharray="2 2" />
       <text x="20" y="20" font-family="Inter" font-weight="700" font-size="12" fill="#F43F5E" text-anchor="middle">d = -002</text>
    </g>

    <!-- Number 2: 993 -->
    <g transform="translate(160, 0)">
       <circle r="8" fill="#F43F5E" filter="url(#glow)" />
       <text y="-30" font-family="'JetBrains Mono'" font-weight="800" font-size="18" fill="#F43F5E" text-anchor="middle">993</text>
       <path d="M 0,0 Q 70,-40 140,0" stroke="#F43F5E" stroke-width="2" fill="none" opacity="0.4" />
       <text x="70" y="30" font-family="Inter" font-weight="700" font-size="12" fill="#F43F5E" text-anchor="middle">d = -007</text>
    </g>

    <!-- Secondary Ticks -->
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#334155" stroke-width="2" />
    <line x1="100" y1="-10" x2="100" y2="10" stroke="#334155" stroke-width="2" />
    <line x1="200" y1="-10" x2="200" y2="10" stroke="#334155" stroke-width="2" />
    <line x1="400" y1="-10" x2="400" y2="10" stroke="#334155" stroke-width="2" />
    <line x1="500" y1="-10" x2="500" y2="10" stroke="#334155" stroke-width="2" />
    <line x1="600" y1="-10" x2="600" y2="10" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Legend -->
  <rect x="550" y="320" width="180" height="60" rx="12" fill="#1E293B" stroke="#334155" />
  <g transform="translate(570, 345)">
    <circle r="4" fill="#F59E0B" />
    <text x="15" y="5" font-family="Inter" font-size="12" fill="#94A3B8">Major Base</text>
    <circle cx="0" cy="20" r="4" fill="#F43F5E" />
    <text x="15" y="25" font-family="Inter" font-size="12" fill="#94A3B8">Input Numbers</text>
  </g>
</svg>