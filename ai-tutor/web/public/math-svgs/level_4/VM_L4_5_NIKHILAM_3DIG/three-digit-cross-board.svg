<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="24" fill="#FBFCFF"/>
  <rect x="24" y="24" width="752" height="352" rx="22" fill="#FFFFFF" stroke="#D9E2F5" stroke-width="2"/>
  <rect x="24" y="24" width="752" height="10" rx="5" fill="#2563EB"/>
  <text x="48" y="68" fill="#10213F" font-size="28" font-family="Arial, sans-serif" font-weight="700">Cross-adjust for 3-digit Nikhilam</text>
  <text x="48" y="98" fill="#51627F" font-size="16" font-family="Arial, sans-serif">Subtract one number's deficit from the other number to get the left side.</text>

  <rect x="92" y="142" width="256" height="162" rx="22" fill="#EFF6FF" stroke="#BFDBFE"/>
  <rect x="452" y="142" width="256" height="162" rx="22" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="220" y="182" fill="#1D4ED8" font-size="22" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">997</text>
  <text x="220" y="220" fill="#334155" font-size="18" font-family="Arial, sans-serif" text-anchor="middle">deficit 3</text>
  <text x="580" y="182" fill="#C2410C" font-size="22" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">996</text>
  <text x="580" y="220" fill="#334155" font-size="18" font-family="Arial, sans-serif" text-anchor="middle">deficit 4</text>
  <path d="M314 198 C380 150, 420 150, 486 198" fill="none" stroke="#7C3AED" stroke-width="4"/>
  <text x="400" y="146" fill="#6D28D9" font-size="17" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">997 - 4 = 993</text>
  <path d="M486 244 C420 292, 380 292, 314 244" fill="none" stroke="#F97316" stroke-width="4"/>
  <text x="400" y="314" fill="#C2410C" font-size="17" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">996 - 3 = 993</text>
  <rect x="244" y="336" width="312" height="30" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="400" y="356" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">Either cross-adjustment gives the same left part.</text>
</svg>
