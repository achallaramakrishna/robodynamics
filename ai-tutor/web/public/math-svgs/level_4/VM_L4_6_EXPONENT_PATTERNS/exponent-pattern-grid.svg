<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">VEDIKA EXPONENT PATTERNS</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Exponent Pattern Grid</text>
  <text x="400" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Compare how values grow as the power increases.</text>

  <g transform="translate(110 156)">
    <rect x="0" y="0" width="580" height="148" rx="22" fill="#f8fafc" stroke="#dbeafe"/>
    <line x1="145" y1="0" x2="145" y2="148" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="290" y1="0" x2="290" y2="148" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="435" y1="0" x2="435" y2="148" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="48" x2="580" y2="48" stroke="#cbd5e1" stroke-width="2"/>
    <text x="72" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#3730a3">2^1</text>
    <text x="217" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#c2410c">2^2</text>
    <text x="362" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">2^3</text>
    <text x="507" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7c3aed">2^4</text>
    <text x="72" y="96" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#111827">2</text>
    <text x="217" y="96" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#111827">4</text>
    <text x="362" y="96" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#111827">8</text>
    <text x="507" y="96" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#111827">16</text>
    <rect x="8" y="56" width="129" height="82" rx="18" fill="#eef2ff" opacity="0.5">
      <animate attributeName="x" values="8;153;298;443;8" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>
