<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="18" fill="#f8faff"/>
  <rect x="24" y="24" width="752" height="352" rx="20" fill="#ffffff" stroke="#dce5ff" stroke-width="2"/>

  <text x="48" y="58" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#64748b">VEDIKA EXPONENT PATTERNS</text>
  <text x="400" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2b3f98">Spot the Growth Pattern</text>
  <text x="400" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5e6b85">Exponents tell you how many times the same factor is multiplied.</text>

  <rect x="86" y="150" width="180" height="108" rx="22" fill="#eef3ff" stroke="#3555b4" stroke-width="3"/>
  <text x="176" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#3555b4">Repeated factor</text>
  <text x="176" y="228" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="700" fill="#1f2440">2 x 2 x 2</text>

  <rect x="310" y="150" width="180" height="108" rx="22" fill="#fff4e2" stroke="#d58a00" stroke-width="3"/>
  <text x="400" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a6200">Compact form</text>
  <text x="400" y="228" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="38" font-weight="700" fill="#1f2440">2^3</text>

  <rect x="534" y="150" width="180" height="108" rx="22" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
  <text x="624" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#166534">Value</text>
  <text x="624" y="228" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="38" font-weight="700" fill="#1f2440">8</text>

  <path d="M266 206 H306" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <polygon points="306,206 294,199 294,213" fill="#94a3b8"/>
  <path d="M490 206 H530" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <polygon points="530,206 518,199 518,213" fill="#94a3b8"/>
</svg>
