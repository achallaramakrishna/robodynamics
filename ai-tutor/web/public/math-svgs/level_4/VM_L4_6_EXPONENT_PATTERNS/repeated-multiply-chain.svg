<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">VEDIKA EXPONENT PATTERNS</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Repeated Multiplication Chain</text>
  <text x="400" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Exponents compress long multiplication into a clean form.</text>

  <g transform="translate(110 170)">
    <rect x="0" y="0" width="110" height="76" rx="20" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <rect x="160" y="0" width="110" height="76" rx="20" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <rect x="320" y="0" width="110" height="76" rx="20" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <rect x="520" y="0" width="150" height="76" rx="20" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
    <text x="55" y="48" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="700" fill="#111827">3</text>
    <text x="215" y="48" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="700" fill="#111827">3</text>
    <text x="375" y="48" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="700" fill="#111827">3</text>
    <text x="595" y="48" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="700" fill="#166534">3^3 = 27</text>
    <text x="135" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#f97316">x</text>
    <text x="295" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#f97316">x</text>
    <path d="M430 38 H520" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="450" cy="38" r="9" fill="#f97316">
      <animate attributeName="cx" values="450;500;450" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
