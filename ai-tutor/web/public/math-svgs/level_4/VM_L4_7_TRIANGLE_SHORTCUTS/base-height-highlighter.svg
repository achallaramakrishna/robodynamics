<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">VEDIKA TRIANGLE SHORTCUTS</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Spot Base and Height</text>
  <text x="400" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">The height must be perpendicular to the chosen base.</text>

  <g transform="translate(124 146)">
    <path d="M60 160 L300 160 L228 28 Z" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <rect x="176" y="128" width="22" height="22" fill="#fff7ed" stroke="#fb923c" stroke-width="3">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/>
    </rect>
    <line x1="188" y1="160" x2="188" y2="88" stroke="#f97316" stroke-width="5"/>
    <line x1="188" y1="88" x2="228" y2="28" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 7"/>
    <text x="156" y="185" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3730a3">base</text>
    <text x="200" y="120" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#c2410c">height</text>
  </g>

  <rect x="474" y="166" width="240" height="120" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
  <text x="594" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">Memory cue</text>
  <text x="594" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Base sits flat.</text>
  <text x="594" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Height drops straight.</text>
</svg>
