<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">VEDIKA TRIANGLE SHORTCUTS</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Triangle Area Formula</text>
  <text x="400" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Area equals half of base times perpendicular height.</text>

  <g transform="translate(120 152)">
    <path d="M40 150 L300 150 L210 20 Z" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <line x1="210" y1="20" x2="210" y2="150" stroke="#f97316" stroke-width="5" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="1.8s" repeatCount="indefinite"/>
    </line>
    <text x="170" y="170" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3730a3">base = 8</text>
    <text x="224" y="92" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#c2410c">height = 5</text>
  </g>

  <rect x="486" y="168" width="220" height="108" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
  <text x="596" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">Compute</text>
  <text x="596" y="246" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="#111827">1/2 x 8 x 5 = 20</text>
</svg>
