  <text x="136" y="150" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="700" fill="#3555B4">Pattern Grid</text>


  <rect x="104" y="140" width="592" height="154" rx="20" fill="#F8FAFF" stroke="#DCE5FF" stroke-width="2"/>
  <line x1="301" y1="140" x2="301" y2="294" stroke="#DCE5FF" stroke-width="2"/>
  <line x1="498" y1="140" x2="498" y2="294" stroke="#DCE5FF" stroke-width="2"/>
  <text x="202" y="176" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#3555B4">Pattern A</text>
  <text x="399" y="176" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#9A6200">Pattern B</text>
  <text x="597" y="176" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#0F9F6E">Pattern C</text>
  <text x="202" y="232" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#1F2440">(a+b)^2</text>
  <text x="399" y="232" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#1F2440">(a-b)^2</text>
  <text x="597" y="232" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#1F2440">(x+3)(x+5)</text>

  <rect x="80" y="282" width="642" height="72" rx="18" fill="#F8FAFF" stroke="#DCE5FF"/>
  <text x="108" y="308" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#3b82f6">Key Moves</text>
  <g transform="translate(108 320)">

    <g transform="translate(0 0)">
      <circle cx="13" cy="13" r="7" fill="#3b82f6" />
