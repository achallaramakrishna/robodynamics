<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="24" fill="#FBFCFF"/>
  <rect x="24" y="24" width="752" height="352" rx="22" fill="#FFFFFF" stroke="#D9E2F5" stroke-width="2"/>
  <rect x="24" y="24" width="752" height="10" rx="5" fill="#8B5CF6"/>
  <text x="48" y="68" fill="#10213F" font-size="28" font-family="Arial, sans-serif" font-weight="700">Group digits in pairs from the right</text>
  <text x="48" y="98" fill="#51627F" font-size="16" font-family="Arial, sans-serif">This tells us how many digits the square root will have.</text>
  <text x="400" y="210" fill="#10213F" font-size="64" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">7 0 | 5 6</text>
  <path d="M304 232 v22 h112 v-22" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
  <path d="M432 232 v22 h112 v-22" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
  <text x="360" y="286" fill="#6D28D9" font-size="17" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">first pair</text>
  <text x="488" y="286" fill="#1D4ED8" font-size="17" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">second pair</text>
  <rect x="144" y="314" width="512" height="34" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="400" y="337" fill="#5B21B6" font-size="17" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">Two pairs → the root has two digits.</text>
</svg>
