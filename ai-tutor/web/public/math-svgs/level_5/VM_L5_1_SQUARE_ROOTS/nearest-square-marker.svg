<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="24" fill="#F9FBFF"/>
  <rect x="24" y="24" width="752" height="352" rx="22" fill="#FFFFFF" stroke="#D9E2F5" stroke-width="2"/>
  <rect x="24" y="24" width="752" height="10" rx="5" fill="#2563EB"/>
  <text x="48" y="68" fill="#10213F" font-size="28" font-family="Arial, sans-serif" font-weight="700">Find the nearest perfect square below the first pair</text>
  <text x="48" y="98" fill="#51627F" font-size="16" font-family="Arial, sans-serif">For 70, the largest square below it is 64 = 8².</text>
  <line x1="120" y1="230" x2="680" y2="230" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>
  <circle cx="312" cy="230" r="24" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="3"/>
  <text x="312" y="238" fill="#0369A1" font-size="20" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">64</text>
  <circle cx="360" cy="230" r="18" fill="#DBEAFE" stroke="#93C5FD" stroke-width="3"/>
  <text x="360" y="236" fill="#1D4ED8" font-size="16" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">70</text>
  <path d="M312 178 L312 146" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round"/>
  <text x="312" y="132" fill="#0EA5E9" font-size="16" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">8²</text>
  <rect x="170" y="300" width="460" height="40" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="400" y="327" fill="#1D4ED8" font-size="17" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">So the first root digit is 8.</text>
</svg>
