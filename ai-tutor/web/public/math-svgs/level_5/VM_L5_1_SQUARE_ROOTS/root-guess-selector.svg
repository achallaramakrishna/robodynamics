<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="24" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="44" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Square Root: Choose the Ones Digit</text>
  <text x="44" y="84" font-family="Arial, sans-serif" font-size="15" fill="#475569">For sqrt(7056), the last digit gives two candidates. The left pair tells you which one works.</text>

  <rect x="44" y="110" width="220" height="98" rx="20" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="154" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3730a3">Number</text>
  <text x="154" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#111827">sqrt(7056)</text>

  <rect x="290" y="110" width="220" height="98" rx="20" fill="#fdf2f8" stroke="#f9a8d4"/>
  <text x="400" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9d174d">Last digit is 6</text>
  <text x="400" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#9d174d">root ends 4 or 6</text>

  <rect x="536" y="110" width="220" height="98" rx="20" fill="#ecfdf5" stroke="#86efac"/>
  <text x="646" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">Left pair is 70</text>
  <text x="646" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#166534">tens digit must be 8</text>

  <path d="M264 159 H288" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <polygon points="288,159 276,152 276,166" fill="#94a3b8"/>
  <path d="M510 159 H534" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <polygon points="534,159 522,152 522,166" fill="#94a3b8"/>

  <rect x="72" y="236" width="656" height="108" rx="22" fill="#f8fafc" stroke="#dbeafe"/>
  <text x="400" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Candidate check</text>
  <text x="400" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#7c3aed">84 or 86 ?</text>
  <text x="400" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">84 squared is 7056, so the correct root is 84.</text>
</svg>
