<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">VEDIKA LEVEL 5</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Cube Root by Inspection</text>
  <text x="400" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Use last-digit cues and digit-grouping to lock onto the cube root.</text>
  <g transform="translate(84 154)">
    
    <rect x="0" y="0" width="180" height="132" rx="22" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="90" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#4f46e5">Triples</text>
    <text x="90" y="76" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#111827">17576</text>
  
    
    <rect x="226" y="0" width="180" height="132" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="316" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ea580c">Inspect</text>
    <text x="316" y="76" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#111827">ends with 6</text>
  
    
    <rect x="452" y="0" width="180" height="132" rx="22" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
    <text x="542" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#16a34a">Cube Root</text>
    <text x="542" y="76" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#111827">26</text>
  
    <circle cx="316" cy="118" r="10" fill="#3b82f6">
      <animate attributeName="r" values="10;14;10" dur="1.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>