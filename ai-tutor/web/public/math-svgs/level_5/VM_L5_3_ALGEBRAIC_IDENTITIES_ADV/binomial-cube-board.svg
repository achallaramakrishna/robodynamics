<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="24" fill="#FBFCFF"/>
  <rect x="24" y="24" width="752" height="352" rx="22" fill="#FFFFFF" stroke="#D9E2F5" stroke-width="2"/>
  <rect x="24" y="24" width="752" height="10" rx="5" fill="#F43F5E"/>
  <text x="48" y="68" fill="#10213F" font-size="28" font-family="Arial, sans-serif" font-weight="700">Binomial cubes follow a 1 : 3 : 3 : 1 pattern</text>
  <text x="48" y="98" fill="#51627F" font-size="16" font-family="Arial, sans-serif">The coefficients stay fixed. Only the signs and powers change.</text>

  <rect x="70" y="144" width="660" height="152" rx="22" fill="#FFF1F2" stroke="#FDA4AF"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="92" y="186" width="132" height="68" rx="16" fill="#FCE7F3" stroke="#F9A8D4"/>
    <rect x="240" y="186" width="132" height="68" rx="16" fill="#FDF2F8" stroke="#FBCFE8"/>
    <rect x="388" y="186" width="132" height="68" rx="16" fill="#FFE4E6" stroke="#FDA4AF"/>
    <rect x="536" y="186" width="132" height="68" rx="16" fill="#FFF1F2" stroke="#FB7185"/>
    <text x="158" y="228" fill="#9F1239" font-size="24" font-weight="700">a³</text>
    <text x="306" y="228" fill="#9F1239" font-size="24" font-weight="700">3a²b</text>
    <text x="454" y="228" fill="#9F1239" font-size="24" font-weight="700">3ab²</text>
    <text x="602" y="228" fill="#9F1239" font-size="24" font-weight="700">b³</text>
  </g>
  <text x="400" y="170" fill="#BE123C" font-size="20" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">(a + b)³ = a³ + 3a²b + 3ab² + b³</text>

  <rect x="154" y="320" width="492" height="32" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="400" y="342" fill="#C2410C" font-size="16" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">For (a - b)³, keep the same coefficients but alternate the middle signs.</text>
</svg>
