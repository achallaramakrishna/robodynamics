<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">VEDIKA ADVANCED IDENTITIES</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Coefficient Flow for (a + b)^3</text>
  <text x="400" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Watch the coefficients flow into the four terms.</text>

  <g transform="translate(92 166)">
    <rect x="0" y="0" width="120" height="88" rx="22" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <rect x="154" y="0" width="120" height="88" rx="22" fill="#fdf2f8" stroke="#f472b6" stroke-width="3"/>
    <rect x="308" y="0" width="120" height="88" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <rect x="462" y="0" width="120" height="88" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>

    <text x="60" y="54" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="38" font-weight="700" fill="#1f2937">a^3</text>
    <text x="214" y="54" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="38" font-weight="700" fill="#1f2937">3a^2b</text>
    <text x="368" y="54" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="38" font-weight="700" fill="#1f2937">3ab^2</text>
    <text x="522" y="54" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="38" font-weight="700" fill="#1f2937">b^3</text>

    <circle cx="60" cy="-28" r="22" fill="#6366f1">
      <animate attributeName="cy" values="-28;-34;-28" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="214" cy="-28" r="22" fill="#ec4899">
      <animate attributeName="cy" values="-28;-34;-28" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="368" cy="-28" r="22" fill="#f97316">
      <animate attributeName="cy" values="-28;-34;-28" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="522" cy="-28" r="22" fill="#10b981">
      <animate attributeName="cy" values="-28;-34;-28" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <text x="60" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">1</text>
    <text x="214" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">3</text>
    <text x="368" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">3</text>
    <text x="522" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">1</text>

    <path d="M60 -2 V0 M214 -2 V0 M368 -2 V0 M522 -2 V0" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <rect x="112" y="300" width="576" height="46" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="400" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">Read the row as 1, 3, 3, 1 and attach the powers of a and b from left to right.</text>
</svg>
