<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">VEDIKA SIMULTANEOUS EQUATIONS</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Elimination Arrow Set</text>
  <text x="400" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Make opposite coefficients, then combine the equations.</text>

  <g transform="translate(100 156)">
    <rect x="0" y="0" width="180" height="98" rx="24" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <rect x="250" y="0" width="180" height="98" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <rect x="500" y="0" width="120" height="98" rx="24" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
    <text x="90" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3730a3">Equation 1</text>
    <text x="340" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#c2410c">Equation 2</text>
    <text x="560" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">Result</text>
    <text x="90" y="72" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#111827">x + y = 9</text>
    <text x="340" y="72" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#111827">x - y = 3</text>
    <text x="560" y="72" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#166534">2x = 12</text>
    <path d="M180 48 H250" stroke="#94a3b8" stroke-width="4"/>
    <path d="M430 48 H500" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="205" cy="48" r="9" fill="#f97316">
      <animate attributeName="cx" values="190;240;190" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="455" cy="48" r="9" fill="#22c55e">
      <animate attributeName="cx" values="440;490;440" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
