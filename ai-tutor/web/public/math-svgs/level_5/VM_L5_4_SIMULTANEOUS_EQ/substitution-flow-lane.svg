<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">VEDIKA SIMULTANEOUS EQUATIONS</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Substitution Flow Lane</text>
  <text x="400" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Isolate one variable, substitute it, and solve cleanly.</text>

  <g transform="translate(90 160)">
    <rect x="0" y="0" width="180" height="92" rx="22" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <rect x="240" y="0" width="180" height="92" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <rect x="480" y="0" width="180" height="92" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
    <text x="90" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3730a3">Isolate</text>
    <text x="330" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#c2410c">Substitute</text>
    <text x="570" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">Solve</text>
    <text x="90" y="68" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#111827">y = 9 - x</text>
    <text x="330" y="68" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#111827">x - (9 - x) = 3</text>
    <text x="570" y="68" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#166534">x = 6, y = 3</text>
    <path d="M180 46 H240" stroke="#94a3b8" stroke-width="4"/>
    <path d="M420 46 H480" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="205" cy="46" r="8" fill="#f97316">
      <animate attributeName="cx" values="195;232;195" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="445" cy="46" r="8" fill="#22c55e">
      <animate attributeName="cx" values="435;472;435" dur="1.9s" begin="0.35s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
