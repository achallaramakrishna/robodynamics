<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">VEDIKA SIMULTANEOUS EQUATIONS</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Two-Line Intersection</text>
  <text x="400" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">The common point is the answer pair that satisfies both lines.</text>

  <g transform="translate(120 146)">
    <rect x="0" y="0" width="560" height="190" rx="24" fill="#f8fafc" stroke="#dbeafe"/>
    <line x1="60" y1="20" x2="60" y2="170" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="20" y1="150" x2="520" y2="150" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="80" y1="150" x2="420" y2="40" stroke="#818cf8" stroke-width="5"/>
    <line x1="110" y1="40" x2="370" y2="170" stroke="#fb923c" stroke-width="5"/>
    <circle cx="280" cy="85" r="18" fill="#ecfdf5" stroke="#22c55e" stroke-width="4">
      <animate attributeName="r" values="14;18;14" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="280" y="91" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#166534">(6,3)</text>
  </g>
</svg>
