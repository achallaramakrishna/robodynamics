<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="800" height="400" rx="22" fill="#f8fafc"/>
  <rect x="18" y="18" width="764" height="364" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="42" y="56" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Middle Band Highlight</text>
  <text x="42" y="83" font-family="Arial, sans-serif" font-size="15" fill="#475569">This is the hardest band. List all four products before you add.</text>

  <text x="165" y="150" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1e293b">A   B   C   D</text>
  <text x="485" y="260" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1e293b">E   F   G   H</text>

  <line x1="158" y1="160" x2="560" y2="248" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="228" y1="160" x2="490" y2="248" stroke="#6366f1" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="298" y1="160" x2="420" y2="248" stroke="#4f46e5" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="368" y1="160" x2="350" y2="248" stroke="#8b5cf6" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="68" y="286" width="664" height="70" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="400" y="318" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#5b21b6" text-anchor="middle">Band 4 = A x H + B x G + C x F + D x E</text>
  <text x="400" y="343" font-family="Arial, sans-serif" font-size="16" fill="#6d28d9" text-anchor="middle">Grow to four terms, write one digit, carry the rest left.</text>
</svg>
