  <text x="42" y="56" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Carry Lane Example</text>
  <text x="42" y="83" font-family="Arial, sans-serif" font-size="15" fill="#475569">When a band total has two digits, write one digit and send the extra left.</text>

  <g transform="translate(54 132)" font-family="Arial, sans-serif">
    <rect x="0" y="58" width="88" height="88" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
