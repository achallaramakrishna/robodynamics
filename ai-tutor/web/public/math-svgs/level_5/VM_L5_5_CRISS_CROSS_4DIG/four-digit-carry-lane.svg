  <rect x="108" y="330" width="584" height="36" rx="18" fill="#ffe4e6" stroke="#fda4af"/>
  <text x="400" y="354" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9f1239" text-anchor="middle">10 becomes write 0 in this band, add 1 to the next band on the left.</text>
