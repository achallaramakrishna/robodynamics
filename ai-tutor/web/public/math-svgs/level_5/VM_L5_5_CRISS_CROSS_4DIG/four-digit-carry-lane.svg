    <line x1="338" y1="28" x2="240" y2="18" stroke="#dc2626" stroke-width="4" marker-end="url(#carryArrow)"/>
    <text x="290" y="16" font-size="18" font-weight="700" fill="#dc2626" text-anchor="middle">carry 1</text>
