    <rect x="196" y="58" width="88" height="88" rx="16" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="294" y="58" width="88" height="88" rx="16" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="392" y="58" width="88" height="88" rx="16" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="490" y="58" width="88" height="88" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
    <rect x="588" y="58" width="88" height="88" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>

    <text x="44" y="44" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">C7</text>
    <text x="142" y="44" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">C6</text>
    <text x="240" y="44" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">C5</text>
    <text x="338" y="44" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">C4</text>
    <text x="436" y="44" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">C3</text>
    <text x="534" y="44" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">C2</text>
    <text x="632" y="44" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">C1</text>

    <text x="44" y="112" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">1</text>
    <text x="142" y="112" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">3</text>
    <text x="240" y="112" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">7</text>
    <text x="338" y="112" font-size="30" font-weight="700" fill="#dc2626" text-anchor="middle">10</text>
    <text x="436" y="112" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">9</text>
