<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="22" fill="#fefce8"/>
  <rect x="18" y="18" width="764" height="364" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="42" y="56" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Worked Example: 1234 x 1111</text>
  <text x="42" y="83" font-family="Arial, sans-serif" font-size="15" fill="#475569">Because every lower digit is 1, each band becomes a simple running sum.</text>

  <rect x="42" y="104" width="716" height="56" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="139" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b" text-anchor="middle">1 2 3 4   x   1 1 1 1</text>

  <g font-family="Arial, sans-serif">
    <rect x="42" y="184" width="716" height="134" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="72" y="216" font-size="18" font-weight="700" fill="#0f172a">C1  = 4 x 1 = 4</text>
    <text x="72" y="244" font-size="18" font-weight="700" fill="#0f172a">C2  = 3 x 1 + 4 x 1 = 7</text>
    <text x="72" y="272" font-size="18" font-weight="700" fill="#0f172a">C3  = 2 x 1 + 3 x 1 + 4 x 1 = 9</text>
    <text x="72" y="300" font-size="18" font-weight="700" fill="#7c3aed">C4  = 1 x 1 + 2 x 1 + 3 x 1 + 4 x 1 = 10  -> write 0, carry 1</text>

    <text x="430" y="216" font-size="18" font-weight="700" fill="#0f172a">C5  = 1 x 1 + 2 x 1 + 3 x 1 + carry 1 = 7</text>
    <text x="430" y="244" font-size="18" font-weight="700" fill="#0f172a">C6  = 1 x 1 + 2 x 1 = 3</text>
    <text x="430" y="272" font-size="18" font-weight="700" fill="#0f172a">C7  = 1 x 1 = 1</text>
  </g>

  <rect x="148" y="332" width="504" height="36" rx="18" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="400" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#5b21b6" text-anchor="middle">Answer = 1 3 7 0 9 7 4</text>
</svg>
