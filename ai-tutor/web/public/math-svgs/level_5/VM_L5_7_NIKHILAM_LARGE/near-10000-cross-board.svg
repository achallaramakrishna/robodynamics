<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="18" fill="#F8FAFF"/>
  <rect x="24" y="24" width="752" height="352" rx="20" fill="#FFFFFF" stroke="#DCE5FF" stroke-width="2"/>

  <text x="48" y="58" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#64748B">ROBODYNAMICS MINDSUTRA</text>
  <text x="400" y="76" text-anchor="middle" font-family="Segoe UI, Arial" font-size="27" font-weight="700" fill="#2B3F98">Worked Nikhilam Near 10000</text>
  <text x="400" y="102" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="#5E6B85">Follow the sequence from left to right.</text>

  <rect x="54" y="128" width="164" height="34" rx="17" fill="#F3F6FF" stroke="#C9D7FF"/>
  <text x="136" y="150" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="700" fill="#3555B4">Worked Board</text>


