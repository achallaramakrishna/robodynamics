  <rect x="315" y="138" width="170" height="90" rx="18" fill="#FFF4E2" stroke="#D58A00" stroke-width="3"/>
  <rect x="520" y="138" width="170" height="90" rx="18" fill="#ECFDF5" stroke="#0F9F6E" stroke-width="3"/>
  <text x="195" y="174" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#3555B4">Left</text>
  <text x="400" y="174" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#9A6200">Middle</text>
  <text x="605" y="174" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#0F9F6E">Right</text>
  <text x="195" y="208" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="700" fill="#1F2440">9996 x 9994</text>
  <text x="400" y="208" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="700" fill="#1F2440">base = 10000</text>
  <text x="605" y="208" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="700" fill="#1F2440">pad to 4 right digits</text>
  <text x="132" y="282" font-family="Segoe UI, Arial" font-size="16" fill="#1F2440">Use 10000 as the base anchor.</text>
  <text x="132" y="308" font-family="Segoe UI, Arial" font-size="16" fill="#1F2440">Cross-adjust the left side first.</text>
  <text x="132" y="334" font-family="Segoe UI, Arial" font-size="16" fill="#1F2440">Right side uses the product of deficits with four digits.</text>
  <rect x="534" y="278" width="154" height="58" rx="16" fill="#E8EEFF" stroke="#3555B4" stroke-width="3"/>
  <text x="611" y="301" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#3555B4">Final focus</text>
  <text x="611" y="324" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="700" fill="#1F2440">pad to 4 right digits</text>

  <rect x="80" y="282" width="642" height="72" rx="18" fill="#F8FAFF" stroke="#DCE5FF"/>
  <text x="108" y="308" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#f97316">Key Moves</text>
  <g transform="translate(108 320)">

    <g transform="translate(0 0)">
      <circle cx="13" cy="13" r="7" fill="#f97316" />
      <text x="34" y="19" font-family="Segoe UI, Arial" font-size="19" fill="#334155">Use 10000 as the base anchor.</text>
    </g>
    <g transform="translate(0 40)">
      <circle cx="13" cy="13" r="7" fill="#f97316" />
      <text x="34" y="19" font-family="Segoe UI, Arial" font-size="19" fill="#334155">Cross-adjust the left side first.</text>
    </g>
    <g transform="translate(0 80)">
      <circle cx="13" cy="13" r="7" fill="#f97316" />
      <text x="34" y="19" font-family="Segoe UI, Arial" font-size="19" fill="#334155">Right side uses the product of deficits with four digits.</text>
