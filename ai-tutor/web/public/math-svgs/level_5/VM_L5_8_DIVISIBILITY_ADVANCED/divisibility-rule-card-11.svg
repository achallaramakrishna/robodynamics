<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">VEDIKA DIVISIBILITY</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Rule for 11</text>
  <text x="400" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Take the alternating sum of the digits. If the result is a multiple of 11, the number works.</text>

  <rect x="110" y="156" width="184" height="96" rx="24" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
  <rect x="308" y="156" width="184" height="96" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <rect x="506" y="156" width="184" height="96" rx="24" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>

  <text x="202" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3730a3">Example</text>
  <text x="400" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#c2410c">Alternating sum</text>
  <text x="598" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">Decision</text>

  <text x="202" y="230" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="36" font-weight="700" fill="#111827">2728</text>
  <text x="400" y="230" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#111827">(2 + 2) - (7 + 8)</text>
  <text x="598" y="230" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="#166534">= -11</text>

  <circle cx="160" cy="215" r="14" fill="#6366f1">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="201" cy="215" r="14" fill="#f97316">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="239" cy="215" r="14" fill="#6366f1">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="215" r="14" fill="#f97316">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
</svg>
