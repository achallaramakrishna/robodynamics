<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">VEDIKA DIVISIBILITY</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Rule for 13</text>
  <text x="400" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Add four times the last digit to the remaining number, then reduce again if needed.</text>

  <g transform="translate(116 158)">
    <rect x="0" y="0" width="170" height="102" rx="24" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <rect x="194" y="0" width="170" height="102" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <rect x="388" y="0" width="180" height="102" rx="24" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
    <text x="85" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3730a3">Start</text>
    <text x="279" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#c2410c">Transform</text>
    <text x="478" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">Reduce</text>
    <text x="85" y="76" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="700" fill="#111827">286</text>
    <text x="279" y="76" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#111827">28 + 4x6</text>
    <text x="478" y="76" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="700" fill="#166534">52</text>

    <circle cx="175" cy="51" r="8" fill="#6366f1">
      <animate attributeName="cx" values="175;188;175" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="369" cy="51" r="8" fill="#f97316">
      <animate attributeName="cx" values="369;382;369" dur="1.8s" begin="0.25s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="152" y="314" width="496" height="34" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="400" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">If the smaller result is divisible by 13, the original number is too.</text>
</svg>
