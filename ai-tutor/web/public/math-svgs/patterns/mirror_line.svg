<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160">
  <!-- Mirror line in center -->
  <line x1="100" y1="5" x2="100" y2="155" stroke="#ef4444" stroke-width="3" stroke-dasharray="8,5" stroke-linecap="round"/>
  <text x="100" y="160" font-family="Arial,sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">Mirror</text>
  <!-- Left shape: triangle -->
  <polygon points="30,40 70,40 50,100" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5"/>
  <!-- Right shape: mirrored triangle (question) -->
  <polygon points="130,40 170,40 150,100" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,3"/>
</svg>
