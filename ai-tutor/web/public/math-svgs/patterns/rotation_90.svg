  <polygon points="20,80 20,30 60,80" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5"/>
  <!-- 90° rotation arrow -->
  <path d="M80,50 Q110,20 140,50" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <polygon points="140,44 144,56 132,54" fill="#7c3aed"/>
  <text x="110" y="22" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#7c3aed" text-anchor="middle">90°</text>
  <!-- Rotated shape (question) -->
  <polygon points="160,20 200,20 160,60" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,3"/>
</svg>
