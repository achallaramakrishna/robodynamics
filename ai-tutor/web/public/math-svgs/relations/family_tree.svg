<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200">
  <!-- Grandparent -->
  <rect x="100" y="5" width="80" height="36" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="140" y="28" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Grand P</text>
  <!-- Line down -->
  <line x1="140" y1="41" x2="140" y2="65" stroke="#475569" stroke-width="2"/>
  <!-- Parent 1 -->
  <rect x="30" y="65" width="80" height="36" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="70" y="88" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">Father</text>
  <!-- Parent 2 -->
  <rect x="170" y="65" width="80" height="36" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="210" y="88" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">Mother</text>
  <!-- Connecting lines -->
  <line x1="140" y1="65" x2="70"  y2="65" stroke="#475569" stroke-width="2"/>
  <line x1="140" y1="65" x2="210" y2="65" stroke="#475569" stroke-width="2"/>
  <!-- Lines down to children -->
  <line x1="70"  y1="101" x2="70"  y2="130" stroke="#475569" stroke-width="2"/>
  <line x1="210" y1="101" x2="210" y2="130" stroke="#475569" stroke-width="2"/>
  <!-- Child 1 -->
  <rect x="30"  y="130" width="80" height="36" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="70"  y="153" font-family="Arial,sans-serif" font-size="13" fill="#d97706" text-anchor="middle">Son</text>
  <!-- Child 2 (question) -->
  <rect x="170" y="130" width="80" height="36" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="210" y="153" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#f59e0b" text-anchor="middle">?</text>
</svg>
