<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 70">
  <!-- 5 seats in a row with labels A-E -->
  <rect x="5"   y="5" width="60" height="60" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <rect x="75"  y="5" width="60" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="145" y="5" width="60" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="215" y="5" width="60" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="285" y="5" width="70" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="35"  y="42" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">A</text>
  <text x="105" y="42" font-family="Arial,sans-serif" font-size="18" fill="#475569" text-anchor="middle">B</text>
  <text x="175" y="42" font-family="Arial,sans-serif" font-size="18" fill="#475569" text-anchor="middle">C</text>
  <text x="245" y="42" font-family="Arial,sans-serif" font-size="18" fill="#475569" text-anchor="middle">D</text>
  <text x="320" y="42" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#f59e0b" text-anchor="middle">?</text>
</svg>
