<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80">
  <!-- 5 boxes in a row for number series -->
  <rect x="5"   y="5" width="70" height="70" rx="8" fill="white" stroke="#94a3b8" stroke-width="3"/>
  <rect x="88"  y="5" width="70" height="70" rx="8" fill="white" stroke="#94a3b8" stroke-width="3"/>
  <rect x="171" y="5" width="70" height="70" rx="8" fill="white" stroke="#94a3b8" stroke-width="3"/>
  <rect x="254" y="5" width="70" height="70" rx="8" fill="white" stroke="#94a3b8" stroke-width="3"/>
  <rect x="337" y="5" width="78" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8,4"/>
  <!-- arrows between boxes -->
  <polygon points="79,36 84,40 79,44" fill="#94a3b8"/>
  <polygon points="162,36 167,40 162,44" fill="#94a3b8"/>
  <polygon points="245,36 250,40 245,44" fill="#94a3b8"/>
  <polygon points="328,36 333,40 328,44" fill="#94a3b8"/>
</svg>
