<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/><stop offset="100%" stop-color="#060D1A"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="560" height="240" fill="url(#bg)" rx="12"/>
  <rect width="560" height="240" fill="none" stroke="#1E293B" stroke-width="1.5" rx="12"/>

  <text x="280" y="22" font-size="12" font-weight="800" fill="#E91E87" text-anchor="middle" letter-spacing="1">SQUARING NEAR 50 — Anchor Base Method</text>
  <text x="280" y="38" font-size="10" fill="#475569" text-anchor="middle">47² = ?  |  Base = 50  |  Deviation = 47 − 50 = −3</text>

  <!-- Two-column layout: Left part | Right part -->
  <!-- Header -->
  <rect x="30" y="48" width="240" height="28" rx="8" fill="#1E293B" stroke="#818CF840"/>
  <text x="150" y="66" font-size="11" font-weight="800" fill="#818CF8" text-anchor="middle">LEFT PART (hundreds)</text>
  <rect x="290" y="48" width="240" height="28" rx="8" fill="#1E293B" stroke="#E91E8740"/>
  <text x="410" y="66" font-size="11" font-weight="800" fill="#E91E87" text-anchor="middle">RIGHT PART (last 2 digits)</text>

  <!-- Left part working -->
  <rect x="30" y="82" width="240" height="110" rx="10" fill="#0D1525" stroke="#818CF840" stroke-width="1"/>
  <text x="150" y="108" font-size="11" fill="#94A3B8" text-anchor="middle">25 + deviation</text>
  <text x="150" y="130" font-size="18" font-weight="900" fill="#F8FAFC" text-anchor="middle">25 + (−3) = 22</text>
  <line x1="50" y1="140" x2="250" y2="140" stroke="#1E293B" stroke-width="1"/>
  <text x="150" y="158" font-size="10" fill="#64748B" text-anchor="middle">Rule: 25 + d where d = n − 50</text>
  <text x="150" y="174" font-size="10" fill="#64748B" text-anchor="middle">This gives the hundreds part</text>
  <text x="150" y="185" font-size="18" font-weight="900" fill="#818CF8" text-anchor="middle" filter="url(#glow)">22__</text>

  <!-- Right part working -->
  <rect x="290" y="82" width="240" height="110" rx="10" fill="#0D1525" stroke="#E91E8740" stroke-width="1"/>
  <text x="410" y="108" font-size="11" fill="#94A3B8" text-anchor="middle">deviation²</text>
  <text x="410" y="130" font-size="18" font-weight="900" fill="#F8FAFC" text-anchor="middle">(−3)² = 09</text>
  <line x1="310" y1="140" x2="510" y2="140" stroke="#1E293B" stroke-width="1"/>
  <text x="410" y="158" font-size="10" fill="#64748B" text-anchor="middle">Rule: d² — always 2 digits</text>
  <text x="410" y="174" font-size="10" fill="#64748B" text-anchor="middle">(pad with leading zero if &lt; 10)</text>
  <text x="410" y="185" font-size="18" font-weight="900" fill="#E91E87" text-anchor="middle" filter="url(#glow)">__09</text>

  <!-- Answer assembly -->
  <rect x="130" y="204" width="300" height="28" rx="10" fill="#140A18" stroke="#E91E87" stroke-width="2" filter="url(#glow)"/>
  <text x="280" y="222" font-size="15" font-weight="900" fill="#F8FAFC" text-anchor="middle">47² = <tspan fill="#818CF8">22</tspan><tspan fill="#E91E87">09</tspan> = 2209 ✓</text>
</svg>
