<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/><stop offset="100%" stop-color="#060D1A"/>
    </linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto">
      <polygon points="0 0,9 3,0 6" fill="#818CF8"/>
    </marker>
  </defs>
  <rect width="480" height="200" fill="url(#bg)" rx="12"/>
  <rect width="480" height="200" fill="none" stroke="#1E293B" stroke-width="1.5" rx="12"/>

  <text x="240" y="22" font-size="11" font-weight="800" fill="#818CF8" text-anchor="middle" letter-spacing="1">BORROW-FREE BRIDGE — Count-up Method</text>

  <!-- Number line style bridge: 473 → 500 → 800 → 1000 - 247 = 753 nah, simpler -->
  <!-- Show: 1000 − 247 via bridge -->
  <text x="240" y="40" font-size="13" font-weight="900" fill="#F8FAFC" text-anchor="middle">1000 − 247 = ?</text>

  <!-- Bridge arc from 247 to 1000, through 250 and 500 as landmarks -->
  <!-- Number line base -->
  <line x1="60" y1="130" x2="420" y2="130" stroke="#1E293B" stroke-width="2"/>
  <!-- Tick marks at landmarks -->
  <line x1="60" y1="124" x2="60" y2="136" stroke="#475569" stroke-width="1.5"/>
  <line x1="160" y1="124" x2="160" y2="136" stroke="#818CF8" stroke-width="1.5"/>
  <line x1="260" y1="124" x2="260" y2="136" stroke="#818CF8" stroke-width="1.5"/>
  <line x1="420" y1="124" x2="420" y2="136" stroke="#22C55E" stroke-width="2"/>

  <!-- Labels -->
  <text x="60" y="150" font-size="12" font-weight="800" fill="#E91E87" text-anchor="middle">247</text>
  <text x="160" y="150" font-size="12" fill="#818CF8" text-anchor="middle">250</text>
  <text x="260" y="150" font-size="12" fill="#818CF8" text-anchor="middle">500</text>
  <text x="420" y="150" font-size="12" font-weight="800" fill="#22C55E" text-anchor="middle">1000</text>

  <!-- Bridge arcs -->
  <path d="M60,130 Q110,80 160,130" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="110" y="74" font-size="10" fill="#F59E0B" text-anchor="middle">+3</text>

  <path d="M160,130 Q210,70 260,130" fill="none" stroke="#818CF8" stroke-width="2"/>
  <text x="210" y="64" font-size="10" fill="#818CF8" text-anchor="middle">+250</text>

  <path d="M260,130 Q340,55 420,130" fill="none" stroke="#22C55E" stroke-width="2"/>
  <text x="340" y="50" font-size="10" fill="#22C55E" text-anchor="middle">+500</text>

  <!-- Answer box -->
  <rect x="100" y="166" width="280" height="26" rx="8" fill="#0D1525" stroke="#22C55E40"/>
  <text x="240" y="183" font-size="12" font-weight="800" fill="#22C55E" text-anchor="middle">3 + 250 + 500 = 753 ✓ (no borrowing needed!)</text>
</svg>
