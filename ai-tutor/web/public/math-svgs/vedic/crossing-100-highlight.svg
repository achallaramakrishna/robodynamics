<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; stroke: #eab308; stroke-width: 2; rx: 12px; }
      .text-main { fill: #f8fafc; font-family: system-ui, sans-serif; font-weight: bold; font-size: 32px; }
      .text-light { fill: #cbd5e1; font-family: system-ui, sans-serif; font-size: 24px; }
      .text-gold { fill: #eab308; font-family: system-ui, sans-serif; font-weight: bold; font-size: 40px; }
      .text-blue { fill: #3b82f6; font-family: system-ui, sans-serif; font-size: 24px; font-weight: bold;}
      .arrow { fill: none; stroke: #3b82f6; stroke-width: 4; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6" /></marker>
  </defs>

  <rect width="700" height="250" class="bg"/>

  <text x="350" y="50" class="text-gold" text-anchor="middle">Crossing 100</text>

  <text x="120" y="120" class="text-main" text-anchor="middle">97 + 5</text>
  
  <path d="M 180 110 Q 350 40 520 110" class="arrow"/>
  
  <text x="350" y="85" class="text-blue" text-anchor="middle">Split 5 into 3 + 2</text>

  <text x="350" y="150" class="text-main" text-anchor="middle">=</text>
  
  <rect x="380" y="115" width="200" height="45" fill="#1e293b" rx="8" stroke="#334155" stroke-width="2"/>
  <text x="480" y="148" class="text-main" text-anchor="middle">(97 + 3) + 2</text>

  <text x="350" y="210" class="text-main" text-anchor="middle">=</text>
  
  <rect x="380" y="175" width="150" height="45" fill="#1e293b" rx="8" stroke="#eab308" stroke-width="2"/>
  <text x="440" y="208" class="text-gold" text-anchor="middle">100</text>
  <text x="495" y="208" class="text-main" text-anchor="middle">+ 2</text>
  
  <text x="600" y="210" class="text-gold" text-anchor="middle">= 102</text>

</svg>
