<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs><style>.bg{fill:#0D1B2A;}</style>
    <marker id="L" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6z" fill="#EF4444"/>
    </marker>
    <marker id="R" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6z" fill="#22C55E"/>
    </marker>
  </defs>
  <rect width="520" height="200" rx="14" class="bg"/>
  <text x="260" y="24" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">Decimal Shift — ×10 and ÷10</text>
  <text x="260" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">Shift decimal point to multiply or divide by powers of 10</text>

  <!-- Number display -->
  <rect x="160" y="56" width="200" height="60" rx="10" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="260" y="97" text-anchor="middle" font-family="Inter,sans-serif" font-size="34" font-weight="900" fill="#F1F5F9">3<tspan fill="#F59E0B" font-size="28">.</tspan>75</text>

  <!-- Left arrow (÷10) -->
  <line x1="155" y1="86" x2="44" y2="86" stroke="#EF4444" stroke-width="2.5" marker-end="url(#L)"/>
  <text x="100" y="76" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#F87171" font-weight="700">÷10</text>
  <rect x="20" y="100" width="120" height="34" rx="8" fill="rgba(239,68,68,0.1)" stroke="#EF4444" stroke-width="1.5"/>
  <text x="80" y="122" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="800" fill="#F87171">0<tspan fill="#F59E0B">.</tspan>375</text>

  <!-- Right arrow (×10) -->
  <line x1="365" y1="86" x2="476" y2="86" stroke="#22C55E" stroke-width="2.5" marker-end="url(#R)"/>
  <text x="420" y="76" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#34D399" font-weight="700">×10</text>
  <rect x="380" y="100" width="120" height="34" rx="8" fill="rgba(34,197,94,0.1)" stroke="#22C55E" stroke-width="1.5"/>
  <text x="440" y="122" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="800" fill="#34D399">37<tspan fill="#F59E0B">.</tspan>5</text>

  <!-- Explanation row -->
  <text x="80" y="148" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#94A3B8">÷10: point moves left</text>
  <text x="440" y="148" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#94A3B8">×10: point moves right</text>
  <text x="260" y="148" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#F59E0B" font-weight="700">3.75</text>

  <!-- Rule box -->
  <rect x="20" y="160" width="480" height="30" rx="8" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="260" y="180" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#CBD5E1">
    ×10ⁿ = shift point n places right · ÷10ⁿ = shift n places left
  </text>
</svg>
