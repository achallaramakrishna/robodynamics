<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <defs><style>.bg{fill:#0D1B2A;}</style></defs>
  <rect width="200" height="180" rx="12" class="bg"/>
  <text x="100" y="22" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#818CF8">Deficit Chip</text>

  <!-- Chip -->
  <rect x="30" y="38" width="140" height="90" rx="14" fill="rgba(239,68,68,0.12)" stroke="#EF4444" stroke-width="2.5"/>

  <!-- Number -->
  <text x="100" y="80" text-anchor="middle" font-family="Inter,sans-serif" font-size="36" font-weight="900" fill="#F87171">97</text>

  <!-- Deficit badge -->
  <rect x="116" y="42" width="50" height="26" rx="6" fill="#EF4444"/>
  <text x="141" y="58" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="800" fill="#fff">−3</text>

  <text x="100" y="116" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#94A3B8">below 100</text>

  <!-- Arrow pointing up to 100 -->
  <line x1="100" y1="134" x2="100" y2="150" stroke="#EF4444" stroke-width="2"/>
  <polygon points="96,150 100,160 104,150" fill="#EF4444"/>
  <text x="100" y="174" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">needs +3 → 100</text>
</svg>
