<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: none; }
      .distance-line { stroke: #eab308; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 10 10; }
      .marker { fill: #334155; rx: 8px; }
      .text-light { fill: #f8fafc; font-family: system-ui, sans-serif; font-weight: bold; font-size: 28px; }
      .text-gold { fill: #eab308; font-family: system-ui, sans-serif; font-weight: bold; font-size: 32px; }
      .arrow { fill: #eab308; }
    </style>
  </defs>

  <rect width="600" height="150" class="bg"/>

  <!-- Left Marker -->
  <rect x="40" y="60" width="100" height="50" class="marker"/>
  <text x="90" y="95" class="text-light" text-anchor="middle">637</text>

  <!-- Right Marker -->
  <rect x="460" y="60" width="100" height="50" class="marker"/>
  <text x="510" y="95" class="text-light" text-anchor="middle">1000</text>

  <!-- Distance Line -->
  <line x1="160" y1="85" x2="440" y2="85" class="distance-line"/>
  <polygon points="430,75 450,85 430,95" class="arrow"/>
  <polygon points="170,75 150,85 170,95" class="arrow"/>

  <!-- Label -->
  <text x="300" y="60" class="text-gold" text-anchor="middle">Distance = 363</text>

</svg>
