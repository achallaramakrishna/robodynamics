<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <style>
      .bg { fill: #0D1B2A; }
      .card { fill: #0A1628; stroke: #1E3A5F; stroke-width: 1.5; rx: 12; }
      .title { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; fill: #818CF8; }
      .sutra { font-family: 'Inter', sans-serif; font-size: 11px; fill: #475569; }
      .label { font-family: 'Inter', sans-serif; font-size: 13px; fill: #94A3B8; }
      .num { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; fill: #F1F5F9; }
      .accent { fill: #818CF8; }
      .green { fill: #34D399; }
      .amber { fill: #F59E0B; }
      .arrow { stroke: #6366F1; stroke-width: 2; fill: none; marker-end: url(#arr); }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366F1"/>
    </marker>
  </defs>
  <rect width="480" height="320" rx="14" class="bg"/>

  <!-- Title -->
  <text x="240" y="28" text-anchor="middle" class="title">Ekadhikena Pattern — Tables 11 to 19</text>
  <text x="240" y="46" text-anchor="middle" class="sutra">Ekadhikena Pūrveṇa — "by one more than the previous"</text>

  <!-- Rule box -->
  <rect x="20" y="58" width="440" height="36" rx="8" fill="#1E3A5F" opacity="0.6"/>
  <text x="240" y="81" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" fill="#CBD5E1">
    Rule: <tspan fill="#F59E0B" font-weight="700">N × 11</tspan> = outer digits of N, middle = sum of digits of N
  </text>

  <!-- Examples: 3 tables side by side -->
  <!-- 14 × 1 to 4 -->
  <rect x="20" y="104" width="130" height="200" rx="10" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="85" y="126" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">Table of 14</text>
  <line x1="30" y1="132" x2="140" y2="132" stroke="#1E3A5F" stroke-width="1"/>
  <!-- rows -->
  <g font-family="Inter,sans-serif" font-size="13">
    <text x="38" y="152" fill="#94A3B8">14 × 1 =</text><text x="128" y="152" text-anchor="end" fill="#F1F5F9" font-weight="700">14</text>
    <text x="38" y="173" fill="#94A3B8">14 × 2 =</text><text x="128" y="173" text-anchor="end" fill="#F1F5F9" font-weight="700">28</text>
    <text x="38" y="194" fill="#94A3B8">14 × 3 =</text><text x="128" y="194" text-anchor="end" fill="#F1F5F9" font-weight="700">42</text>
    <text x="38" y="215" fill="#34D399" font-weight="700">14 × 7 =</text><text x="128" y="215" text-anchor="end" fill="#34D399" font-weight="700">98</text>
    <text x="38" y="236" fill="#94A3B8">14 × 8 =</text><text x="128" y="236" text-anchor="end" fill="#F1F5F9" font-weight="700">112</text>
    <text x="38" y="257" fill="#94A3B8">14 × 9 =</text><text x="128" y="257" text-anchor="end" fill="#F1F5F9" font-weight="700">126</text>
    <text x="38" y="278" fill="#94A3B8">14 × 10 =</text><text x="128" y="278" text-anchor="end" fill="#F1F5F9" font-weight="700">140</text>
  </g>

  <!-- 16 × table -->
  <rect x="175" y="104" width="130" height="200" rx="10" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="240" y="126" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">Table of 16</text>
  <line x1="185" y1="132" x2="295" y2="132" stroke="#1E3A5F" stroke-width="1"/>
  <g font-family="Inter,sans-serif" font-size="13">
    <text x="193" y="152" fill="#94A3B8">16 × 1 =</text><text x="283" y="152" text-anchor="end" fill="#F1F5F9" font-weight="700">16</text>
    <text x="193" y="173" fill="#94A3B8">16 × 2 =</text><text x="283" y="173" text-anchor="end" fill="#F1F5F9" font-weight="700">32</text>
    <text x="193" y="194" fill="#94A3B8">16 × 3 =</text><text x="283" y="194" text-anchor="end" fill="#F1F5F9" font-weight="700">48</text>
    <text x="193" y="215" fill="#34D399" font-weight="700">16 × 7 =</text><text x="283" y="215" text-anchor="end" fill="#34D399" font-weight="700">112</text>
    <text x="193" y="236" fill="#94A3B8">16 × 8 =</text><text x="283" y="236" text-anchor="end" fill="#F1F5F9" font-weight="700">128</text>
    <text x="193" y="257" fill="#94A3B8">16 × 9 =</text><text x="283" y="257" text-anchor="end" fill="#F1F5F9" font-weight="700">144</text>
    <text x="193" y="278" fill="#94A3B8">16 × 10 =</text><text x="283" y="278" text-anchor="end" fill="#F1F5F9" font-weight="700">160</text>
  </g>

  <!-- 19 × table -->
  <rect x="330" y="104" width="130" height="200" rx="10" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="395" y="126" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">Table of 19</text>
  <line x1="340" y1="132" x2="450" y2="132" stroke="#1E3A5F" stroke-width="1"/>
  <g font-family="Inter,sans-serif" font-size="13">
    <text x="348" y="152" fill="#94A3B8">19 × 1 =</text><text x="452" y="152" text-anchor="end" fill="#F1F5F9" font-weight="700">19</text>
    <text x="348" y="173" fill="#94A3B8">19 × 2 =</text><text x="452" y="173" text-anchor="end" fill="#F1F5F9" font-weight="700">38</text>
    <text x="348" y="194" fill="#94A3B8">19 × 3 =</text><text x="452" y="194" text-anchor="end" fill="#F1F5F9" font-weight="700">57</text>
    <text x="348" y="215" fill="#F59E0B" font-weight="700">19 × 5 =</text><text x="452" y="215" text-anchor="end" fill="#F59E0B" font-weight="700">95</text>
    <text x="348" y="236" fill="#94A3B8">19 × 7 =</text><text x="452" y="236" text-anchor="end" fill="#F1F5F9" font-weight="700">133</text>
    <text x="348" y="257" fill="#94A3B8">19 × 9 =</text><text x="452" y="257" text-anchor="end" fill="#F1F5F9" font-weight="700">171</text>
    <text x="348" y="278" fill="#94A3B8">19 × 10 =</text><text x="452" y="278" text-anchor="end" fill="#F1F5F9" font-weight="700">190</text>
  </g>
</svg>
