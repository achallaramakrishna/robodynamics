<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .text-light { fill: #f8fafc; font-family: system-ui, sans-serif; font-weight: bold; font-size: 32px; }
      .text-gray { fill: #94a3b8; font-family: system-ui, sans-serif; font-weight: bold; font-size: 28px; }
    </style>
  </defs>

  <rect width="900" height="150" class="bg" rx="16"/>

  <text x="80" y="85" class="text-light" text-anchor="middle">48 × 5</text>
  <text x="170" y="85" class="text-gray" text-anchor="middle">=</text>

  <text x="250" y="85" class="text-light" text-anchor="middle">48 ×</text>
  <text x="320" y="75" class="text-light" text-anchor="middle">10</text>
  <line x1="300" y1="85" x2="340" y2="85" stroke="#f8fafc" stroke-width="3"/>
  <text x="320" y="115" class="text-light" text-anchor="middle">2</text>

  <text x="390" y="85" class="text-gray" text-anchor="middle">=</text>

  <text x="450" y="85" class="text-light" text-anchor="middle">(48</text>
  <text x="500" y="85" class="text-light" text-anchor="middle">÷</text>
  <text x="540" y="85" class="text-light" text-anchor="middle">2)</text>
  <text x="590" y="85" class="text-light" text-anchor="middle">× 10</text>

  <text x="670" y="85" class="text-gray" text-anchor="middle">=</text>
  
  <text x="750" y="85" class="text-light" text-anchor="middle">24 × 10</text>

  <text x="850" y="85" class="text-light" fill="#eab308" text-anchor="middle">= 240</text>
</svg>
