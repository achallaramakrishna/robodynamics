<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs><style>.bg{fill:#0D1B2A;}</style></defs>
  <rect width="200" height="240" rx="12" class="bg"/>
  <text x="100" y="22" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#818CF8">Fraction Card</text>

  <!-- Fraction display -->
  <rect x="20" y="36" width="160" height="130" rx="12" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Numerator -->
  <text x="100" y="92" text-anchor="middle" font-family="Inter,sans-serif" font-size="48" font-weight="900" fill="#818CF8">3</text>
  <text x="20" y="116" font-family="Inter,sans-serif" font-size="11" fill="#475569" x="35">numerator</text>

  <!-- Fraction bar -->
  <line x1="36" y1="110" x2="164" y2="110" stroke="#6366F1" stroke-width="3"/>

  <!-- Denominator -->
  <text x="100" y="155" text-anchor="middle" font-family="Inter,sans-serif" font-size="48" font-weight="900" fill="#F59E0B">4</text>
  <text x="140" y="168" font-family="Inter,sans-serif" font-size="11" fill="#475569">denom.</text>

  <!-- Labels -->
  <text x="100" y="192" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" fill="#94A3B8">¾ = 3 out of 4</text>
  <rect x="20" y="204" width="160" height="28" rx="6" fill="#1E3A5F" opacity="0.7"/>
  <text x="100" y="223" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#CBD5E1">= 0.75 = 75%</text>
</svg>
