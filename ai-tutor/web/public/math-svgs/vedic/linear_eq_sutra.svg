<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200" font-family="Nunito,sans-serif">
  <rect width="380" height="200" rx="14" fill="#eff6ff"/>
  <text x="190" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Anurupyena — Solve by Proportion (Linear Eq)</text>
  <text x="190" y="42" text-anchor="middle" font-size="11" fill="#1d4ed8">Solve: 3x + 6 = 21</text>

  <!-- Balance beam visual -->
  <!-- Fulcrum -->
  <polygon points="190,145 175,168 205,168" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Beam -->
  <line x1="60" y1="140" x2="320" y2="140" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>

  <!-- Left side: 3x+6 -->
  <rect x="60" y="90" width="100" height="46" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="119" text-anchor="middle" font-size="18" font-weight="800" fill="#1e40af">3x + 6</text>

  <!-- Right side: 21 -->
  <rect x="220" y="90" width="100" height="46" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="270" y="119" text-anchor="middle" font-size="18" font-weight="800" fill="#1e40af">21</text>

  <!-- Step labels -->
  <text x="190" y="185" text-anchor="middle" font-size="11" fill="#374151">Subtract 6 both sides: 3x = 15  →  x = <tspan font-weight="800" fill="#16a34a">5</tspan></text>

  <!-- Steps -->
  <text x="20" y="60" font-size="11" fill="#1e40af" font-weight="700">① Isolate variable term: 3x = 21 − 6 = 15</text>
  <text x="20" y="78" font-size="11" fill="#1e40af" font-weight="700">② Divide: x = 15 ÷ 3 = 5</text>
</svg>
