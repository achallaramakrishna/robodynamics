<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220">
  <defs><style>.bg{fill:#0D1B2A;}</style>
    <marker id="n" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6z" fill="#6366F1"/>
    </marker>
  </defs>
  <rect width="520" height="220" rx="14" class="bg"/>
  <text x="260" y="24" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">Near-100 Adjustment — 97 + 96</text>
  <text x="260" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">Round up to 100, add, then remove the extra</text>

  <!-- Step 1: round to 100 -->
  <rect x="20" y="56" width="480" height="40" rx="8" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="30" y="71" font-family="Inter,sans-serif" font-size="12" fill="#64748B" font-weight="600">Step 1:</text>
  <text x="90" y="71" font-family="Inter,sans-serif" font-size="13" fill="#F87171">97 = 100 − 3</text>
  <text x="90" y="89" font-family="Inter,sans-serif" font-size="13" fill="#F87171">96 = 100 − 4</text>
  <text x="320" y="80" font-family="Inter,sans-serif" font-size="12" fill="#64748B">deviations: −3 and −4</text>

  <!-- Step 2: add rounded values -->
  <rect x="20" y="104" width="480" height="30" rx="8" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="30" y="124" font-family="Inter,sans-serif" font-size="12" fill="#64748B" font-weight="600">Step 2:</text>
  <text x="90" y="124" font-family="Inter,sans-serif" font-size="13" fill="#CBD5E1">100 + 100 = <tspan fill="#818CF8" font-weight="700">200</tspan></text>

  <!-- Step 3: subtract deviations -->
  <rect x="20" y="142" width="480" height="30" rx="8" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="30" y="162" font-family="Inter,sans-serif" font-size="12" fill="#64748B" font-weight="600">Step 3:</text>
  <text x="90" y="162" font-family="Inter,sans-serif" font-size="13" fill="#CBD5E1">200 − (3 + 4) = 200 − 7 = <tspan fill="#22C55E" font-weight="800" font-size="15">193</tspan></text>

  <!-- Final answer box -->
  <rect x="20" y="182" width="480" height="30" rx="8" fill="rgba(34,197,94,0.12)" stroke="#22C55E" stroke-width="1.5"/>
  <text x="260" y="202" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#34D399" font-weight="700">
    97 + 96 = 193 ✓
  </text>
</svg>
