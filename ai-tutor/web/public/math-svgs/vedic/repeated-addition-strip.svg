<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180">
  <defs>
    <style>.bg{fill:#0D1B2A;}</style>
    <marker id="ra" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6z" fill="#34D399"/>
    </marker>
  </defs>
  <rect width="520" height="180" rx="14" class="bg"/>
  <text x="260" y="26" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">Repeated Addition — 17 × 4 = 17 + 17 + 17 + 17</text>
  <text x="260" y="44" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">Each chip adds another 17</text>

  <!-- Chips: 4 boxes each labelled +17 -->
  <g>
    <!-- Chip 1 -->
    <rect x="30" y="60" width="90" height="60" rx="10" fill="#0A1628" stroke="#22C55E" stroke-width="2"/>
    <text x="75" y="88" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="800" fill="#22C55E">17</text>
    <text x="75" y="106" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#34D399">×1 = 17</text>
    <!-- Arrow -->
    <line x1="122" y1="90" x2="138" y2="90" stroke="#34D399" stroke-width="2" marker-end="url(#ra)"/>

    <!-- Chip 2 -->
    <rect x="140" y="60" width="90" height="60" rx="10" fill="#0A1628" stroke="#3B82F6" stroke-width="2"/>
    <text x="185" y="88" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="800" fill="#3B82F6">34</text>
    <text x="185" y="106" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#60A5FA">×2 = 34</text>
    <line x1="232" y1="90" x2="248" y2="90" stroke="#34D399" stroke-width="2" marker-end="url(#ra)"/>

    <!-- Chip 3 -->
    <rect x="250" y="60" width="90" height="60" rx="10" fill="#0A1628" stroke="#8B5CF6" stroke-width="2"/>
    <text x="295" y="88" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="800" fill="#8B5CF6">51</text>
    <text x="295" y="106" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#A78BFA">×3 = 51</text>
    <line x1="342" y1="90" x2="358" y2="90" stroke="#34D399" stroke-width="2" marker-end="url(#ra)"/>

    <!-- Chip 4 (result) -->
    <rect x="360" y="52" width="120" height="76" rx="10" fill="rgba(34,197,94,0.1)" stroke="#22C55E" stroke-width="2.5"/>
    <text x="420" y="84" text-anchor="middle" font-family="Inter,sans-serif" font-size="26" font-weight="900" fill="#22C55E">68</text>
    <text x="420" y="106" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#34D399" font-weight="700">×4 = 68 ✓</text>
  </g>

  <!-- Expression -->
  <text x="260" y="154" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" fill="#CBD5E1">
    17 + 17 + 17 + 17 = 68 &nbsp; → &nbsp; 17 × 4 = 68
  </text>
  <text x="260" y="172" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#64748B">
    Repeated addition is the foundation — multiplication is just a shortcut for it
  </text>
</svg>
