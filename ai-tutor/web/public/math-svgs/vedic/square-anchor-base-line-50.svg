<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180">
  <defs><style>.bg{fill:#0D1B2A;}</style></defs>
  <rect width="520" height="180" rx="14" class="bg"/>
  <text x="260" y="24" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">Anchor Base Line — 50</text>
  <text x="260" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">Find deviation d from 50, then: left = 25+d, right = d²</text>

  <!-- Number line 40..60 -->
  <line x1="40" y1="90" x2="480" y2="90" stroke="#1E3A5F" stroke-width="2"/>
  <!-- Ticks -->
  <g font-family="Inter,sans-serif" font-size="11" fill="#94A3B8">
    <line x1="40" y1="84" x2="40" y2="96" stroke="#334155" stroke-width="1.5"/>
    <text x="40" y="110" text-anchor="middle">40</text>
    <line x1="128" y1="84" x2="128" y2="96" stroke="#334155" stroke-width="1.5"/>
    <text x="128" y="110" text-anchor="middle">44</text>
    <line x1="172" y1="84" x2="172" y2="96" stroke="#334155" stroke-width="1.5"/>
    <text x="172" y="110" text-anchor="middle">46</text>
    <line x1="216" y1="84" x2="216" y2="96" stroke="#EF4444" stroke-width="1.5"/>
    <text x="216" y="110" text-anchor="middle" fill="#F87171">48</text>
    <line x1="260" y1="78" x2="260" y2="102" stroke="#6366F1" stroke-width="3"/>
    <text x="260" y="116" text-anchor="middle" fill="#818CF8" font-weight="700" font-size="14">50</text>
    <text x="260" y="130" text-anchor="middle" fill="#475569" font-size="10">anchor</text>
    <line x1="304" y1="84" x2="304" y2="96" stroke="#22C55E" stroke-width="1.5"/>
    <text x="304" y="110" text-anchor="middle" fill="#34D399">52</text>
    <line x1="348" y1="84" x2="348" y2="96" stroke="#22C55E" stroke-width="1.5"/>
    <text x="348" y="110" text-anchor="middle" fill="#34D399">54</text>
    <line x1="392" y1="84" x2="392" y2="96" stroke="#334155" stroke-width="1.5"/>
    <text x="392" y="110" text-anchor="middle">56</text>
    <line x1="480" y1="84" x2="480" y2="96" stroke="#334155" stroke-width="1.5"/>
    <text x="480" y="110" text-anchor="middle">60</text>
  </g>

  <!-- Deficit arrows -->
  <line x1="216" y1="82" x2="256" y2="82" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="236" y="74" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#F87171">d=−2</text>
  <!-- Surplus arrow -->
  <line x1="260" y1="82" x2="300" y2="82" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="280" y="74" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#34D399">d=+2</text>

  <!-- Formula reminder -->
  <rect x="20" y="148" width="480" height="26" rx="8" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="260" y="165" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#CBD5E1">
    48² → d=−2: left=25−2=<tspan fill="#3B82F6" font-weight="700">23</tspan>, right=(−2)²=<tspan fill="#3B82F6" font-weight="700">04</tspan> →  <tspan fill="#22C55E" font-weight="800">2304</tspan>
  </text>
</svg>
