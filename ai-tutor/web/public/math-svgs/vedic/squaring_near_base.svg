<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" font-family="Nunito,sans-serif">
  <rect width="360" height="220" rx="14" fill="#fff7ed"/>
  <text x="180" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">Squaring Near Base — 98²</text>

  <!-- Base marker -->
  <rect x="135" y="34" width="90" height="26" rx="6" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/>
  <text x="180" y="51" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">Base = 100</text>

  <!-- 98 box -->
  <rect x="120" y="70" width="120" height="50" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="180" y="103" text-anchor="middle" font-size="34" font-weight="800" fill="#ea580c">98</text>

  <!-- Deficit arrow -->
  <line x1="180" y1="60" x2="180" y2="70" stroke="#ef4444" stroke-width="2" marker-end="url(#rArr)"/>
  <text x="220" y="67" font-size="11" fill="#ef4444" font-weight="700">deficit = 2</text>

  <!-- Step 1: left part = 98-2 = 96 -->
  <text x="50" y="148" font-size="12" fill="#c2410c" font-weight="700">Step 1 (left):</text>
  <text x="50" y="164" font-size="12" fill="#374151">98 − 2 = <tspan font-weight="800" fill="#16a34a">96</tspan></text>

  <!-- Step 2: right part = 2² = 4 → 04 -->
  <text x="50" y="184" font-size="12" fill="#c2410c" font-weight="700">Step 2 (right):</text>
  <text x="50" y="200" font-size="12" fill="#374151">2² = 4 → write as <tspan font-weight="800" fill="#16a34a">04</tspan></text>

  <!-- Visual right-side box division -->
  <line x1="240" y1="130" x2="350" y2="130" stroke="#d1d5db" stroke-width="1"/>
  <rect x="242" y="136" width="48" height="36" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="266" y="160" text-anchor="middle" font-size="22" font-weight="800" fill="#15803d">96</text>
  <rect x="296" y="136" width="48" height="36" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="320" y="160" text-anchor="middle" font-size="22" font-weight="800" fill="#15803d">04</text>
  <text x="295" y="130" text-anchor="middle" font-size="10" fill="#6b7280">|</text>

  <!-- Answer -->
  <rect x="110" y="188" width="140" height="28" rx="8" fill="#7c2d12"/>
  <text x="180" y="207" text-anchor="middle" font-size="14" font-weight="800" fill="white">98² = 9604 ✓</text>

  <defs>
    <marker id="rArr" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#ef4444"/>
    </marker>
  </defs>
</svg>
