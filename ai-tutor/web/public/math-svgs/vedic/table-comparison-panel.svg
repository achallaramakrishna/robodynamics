<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280">
  <defs><style>.bg{fill:#0D1B2A;}.panel{fill:#0A1628;stroke:#1E3A5F;stroke-width:1.5;}</style></defs>
  <rect width="520" height="280" rx="14" class="bg"/>
  <text x="260" y="26" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">Table Comparison — 10s, 11s, and 15s Side by Side</text>
  <text x="260" y="44" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">See how each table grows relative to the ×10 anchor</text>

  <!-- Three column panels -->
  <!-- 10 × N -->
  <rect x="20" y="56" width="145" height="210" rx="10" class="panel"/>
  <text x="92" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#64748B">× 10</text>
  <line x1="30" y1="84" x2="155" y2="84" stroke="#1E3A5F" stroke-width="1"/>
  <g font-family="Inter,sans-serif" font-size="12" fill="#64748B">
    <text x="92" y="103" text-anchor="middle">10</text>
    <text x="92" y="123" text-anchor="middle">20</text>
    <text x="92" y="143" text-anchor="middle">30</text>
    <text x="92" y="163" text-anchor="middle">40</text>
    <text x="92" y="183" text-anchor="middle">50</text>
    <text x="92" y="203" text-anchor="middle">60</text>
    <text x="92" y="223" text-anchor="middle">70</text>
    <text x="92" y="243" text-anchor="middle">80</text>
    <text x="92" y="256" text-anchor="middle">90</text>
  </g>

  <!-- 11 × N - highlighted differences -->
  <rect x="188" y="56" width="145" height="210" rx="10" fill="#0A1628" stroke="#818CF8" stroke-width="2"/>
  <text x="260" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#818CF8">× 11 (+1 each)</text>
  <line x1="198" y1="84" x2="323" y2="84" stroke="#818CF8" stroke-width="1"/>
  <g font-family="Inter,sans-serif" font-size="12">
    <text x="235" y="103" fill="#94A3B8" text-anchor="end">10</text><text x="243" y="103" fill="#818CF8" font-weight="700">+1=</text><text x="320" y="103" fill="#818CF8" font-weight="700" text-anchor="end">11</text>
    <text x="235" y="123" fill="#94A3B8" text-anchor="end">20</text><text x="243" y="123" fill="#818CF8" font-weight="700">+2=</text><text x="320" y="123" fill="#818CF8" font-weight="700" text-anchor="end">22</text>
    <text x="235" y="143" fill="#94A3B8" text-anchor="end">30</text><text x="243" y="143" fill="#818CF8" font-weight="700">+3=</text><text x="320" y="143" fill="#818CF8" font-weight="700" text-anchor="end">33</text>
    <text x="235" y="163" fill="#94A3B8" text-anchor="end">40</text><text x="243" y="163" fill="#818CF8" font-weight="700">+4=</text><text x="320" y="163" fill="#818CF8" font-weight="700" text-anchor="end">44</text>
    <text x="235" y="183" fill="#94A3B8" text-anchor="end">50</text><text x="243" y="183" fill="#818CF8" font-weight="700">+5=</text><text x="320" y="183" fill="#818CF8" font-weight="700" text-anchor="end">55</text>
    <text x="235" y="203" fill="#94A3B8" text-anchor="end">60</text><text x="243" y="203" fill="#818CF8" font-weight="700">+6=</text><text x="320" y="203" fill="#818CF8" font-weight="700" text-anchor="end">66</text>
    <text x="235" y="223" fill="#94A3B8" text-anchor="end">70</text><text x="243" y="223" fill="#818CF8" font-weight="700">+7=</text><text x="320" y="223" fill="#818CF8" font-weight="700" text-anchor="end">77</text>
    <text x="235" y="243" fill="#94A3B8" text-anchor="end">80</text><text x="243" y="243" fill="#818CF8" font-weight="700">+8=</text><text x="320" y="243" fill="#818CF8" font-weight="700" text-anchor="end">88</text>
    <text x="235" y="256" fill="#94A3B8" text-anchor="end">90</text><text x="243" y="256" fill="#818CF8" font-weight="700">+9=</text><text x="320" y="256" fill="#818CF8" font-weight="700" text-anchor="end">99</text>
  </g>

  <!-- 15 × N -->
  <rect x="356" y="56" width="145" height="210" rx="10" fill="#0A1628" stroke="#F59E0B" stroke-width="2"/>
  <text x="428" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#F59E0B">× 15 (+5 each)</text>
  <line x1="366" y1="84" x2="491" y2="84" stroke="#F59E0B" stroke-width="1"/>
  <g font-family="Inter,sans-serif" font-size="12">
    <text x="428" y="103" text-anchor="middle" fill="#F59E0B" font-weight="700">15</text>
    <text x="428" y="123" text-anchor="middle" fill="#F59E0B" font-weight="700">30</text>
    <text x="428" y="143" text-anchor="middle" fill="#F59E0B" font-weight="700">45</text>
    <text x="428" y="163" text-anchor="middle" fill="#F59E0B" font-weight="700">60</text>
    <text x="428" y="183" text-anchor="middle" fill="#F59E0B" font-weight="700">75</text>
    <text x="428" y="203" text-anchor="middle" fill="#F59E0B" font-weight="700">90</text>
    <text x="428" y="223" text-anchor="middle" fill="#F59E0B" font-weight="700">105</text>
    <text x="428" y="243" text-anchor="middle" fill="#F59E0B" font-weight="700">120</text>
    <text x="428" y="256" text-anchor="middle" fill="#F59E0B" font-weight="700">135</text>
  </g>
</svg>
