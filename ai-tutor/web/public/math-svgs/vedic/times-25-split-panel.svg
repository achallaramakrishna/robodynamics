<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/><stop offset="100%" stop-color="#060D1A"/>
    </linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto">
      <polygon points="0 0,9 3,0 6" fill="#F59E0B"/>
    </marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="520" height="200" fill="url(#bg)" rx="12"/>
  <rect width="520" height="200" fill="none" stroke="#1E293B" stroke-width="1.5" rx="12"/>

  <text x="260" y="22" font-size="11" font-weight="800" fill="#F59E0B" text-anchor="middle" letter-spacing="1">MULTIPLY BY 25 — The ÷4 then ×100 Shortcut</text>
  <text x="260" y="38" font-size="10" fill="#475569" text-anchor="middle">Because 25 = 100 ÷ 4</text>

  <!-- Step 1 box: problem -->
  <rect x="30" y="52" width="100" height="70" rx="12" fill="#1E293B" stroke="#818CF840" stroke-width="1.5"/>
  <text x="80" y="76" font-size="11" fill="#94A3B8" text-anchor="middle" font-weight="700">Problem</text>
  <text x="80" y="100" font-size="22" font-weight="900" fill="#F8FAFC" text-anchor="middle">36 × 25</text>
  <text x="80" y="116" font-size="10" fill="#64748B" text-anchor="middle">= ?</text>

  <!-- Arrow 1 -->
  <line x1="132" y1="87" x2="158" y2="87" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="145" y="80" font-size="9" fill="#F59E0B" text-anchor="middle">÷2</text>

  <!-- Step 2: halve once -->
  <rect x="160" y="52" width="90" height="70" rx="12" fill="#201A0A" stroke="#F59E0B" stroke-width="2"/>
  <text x="205" y="74" font-size="10" fill="#F59E0B" text-anchor="middle" font-weight="700">Halve 1</text>
  <text x="205" y="96" font-size="20" font-weight="900" fill="#F8FAFC" text-anchor="middle">36 ÷ 2</text>
  <text x="205" y="114" font-size="13" font-weight="700" fill="#FCD34D" text-anchor="middle">= 18</text>

  <!-- Arrow 2 -->
  <line x1="252" y1="87" x2="268" y2="87" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="260" y="80" font-size="9" fill="#F59E0B" text-anchor="middle">÷2</text>

  <!-- Step 3: halve again -->
  <rect x="270" y="52" width="90" height="70" rx="12" fill="#201A0A" stroke="#F59E0B" stroke-width="2"/>
  <text x="315" y="74" font-size="10" fill="#F59E0B" text-anchor="middle" font-weight="700">Halve 2</text>
  <text x="315" y="96" font-size="20" font-weight="900" fill="#F8FAFC" text-anchor="middle">18 ÷ 2</text>
  <text x="315" y="114" font-size="13" font-weight="700" fill="#FCD34D" text-anchor="middle">= 9</text>

  <!-- Arrow 3 -->
  <line x1="362" y1="87" x2="378" y2="87" stroke="#22C55E" stroke-width="2" marker-end="url(#arr)"/>
  <text x="370" y="80" font-size="9" fill="#22C55E" text-anchor="middle">×100</text>

  <!-- Answer -->
  <rect x="380" y="52" width="110" height="70" rx="12" fill="#142010" stroke="#22C55E" stroke-width="2.5" filter="url(#glow)"/>
  <text x="435" y="76" font-size="11" fill="#4ADE80" text-anchor="middle" font-weight="700">Answer</text>
  <text x="435" y="102" font-size="24" font-weight="900" fill="#FCD34D" text-anchor="middle">900</text>
  <text x="435" y="116" font-size="9" fill="#4ADE80" text-anchor="middle">9 × 100</text>

  <!-- Rule box -->
  <rect x="80" y="138" width="360" height="46" rx="10" fill="#0D1525" stroke="#F59E0B40" stroke-width="1"/>
  <text x="260" y="157" font-size="11" font-weight="800" fill="#F59E0B" text-anchor="middle">Rule: n × 25 = (n ÷ 4) × 100</text>
  <text x="260" y="176" font-size="10" fill="#64748B" text-anchor="middle">Works cleanly when n is divisible by 4 (otherwise use ÷2 twice + remainder)</text>
</svg>
