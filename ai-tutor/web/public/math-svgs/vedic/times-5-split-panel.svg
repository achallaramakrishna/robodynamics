<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/><stop offset="100%" stop-color="#060D1A"/>
    </linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto">
      <polygon points="0 0,9 3,0 6" fill="#A78BFA"/>
    </marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="520" height="200" fill="url(#bg)" rx="12"/>
  <rect width="520" height="200" fill="none" stroke="#1E293B" stroke-width="1.5" rx="12"/>

  <text x="260" y="22" font-size="11" font-weight="800" fill="#A78BFA" text-anchor="middle" letter-spacing="1">MULTIPLY BY 5 — The ÷2 then ×10 Shortcut</text>
  <text x="260" y="38" font-size="10" fill="#475569" text-anchor="middle">Because 5 = 10 ÷ 2</text>

  <!-- Step 1 box: problem -->
  <rect x="30" y="52" width="100" height="70" rx="12" fill="#1E293B" stroke="#818CF840" stroke-width="1.5"/>
  <text x="80" y="76" font-size="11" fill="#94A3B8" text-anchor="middle" font-weight="700">Problem</text>
  <text x="80" y="100" font-size="22" font-weight="900" fill="#F8FAFC" text-anchor="middle">48 × 5</text>
  <text x="80" y="116" font-size="10" fill="#64748B" text-anchor="middle">= ?</text>

  <!-- Arrow 1 -->
  <line x1="132" y1="87" x2="158" y2="87" stroke="#A78BFA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="145" y="80" font-size="9" fill="#A78BFA" text-anchor="middle">÷2</text>

  <!-- Step 2: halve the number -->
  <rect x="160" y="52" width="100" height="70" rx="12" fill="#1E1840" stroke="#818CF8" stroke-width="2"/>
  <text x="210" y="76" font-size="11" fill="#818CF8" text-anchor="middle" font-weight="700">Step 1</text>
  <text x="210" y="100" font-size="22" font-weight="900" fill="#F8FAFC" text-anchor="middle">48 ÷ 2</text>
  <text x="210" y="116" font-size="14" font-weight="700" fill="#818CF8" text-anchor="middle">= 24</text>

  <!-- Arrow 2 -->
  <line x1="262" y1="87" x2="288" y2="87" stroke="#A78BFA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="275" y="80" font-size="9" fill="#A78BFA" text-anchor="middle">×10</text>

  <!-- Step 3: multiply by 10 -->
  <rect x="290" y="52" width="100" height="70" rx="12" fill="#1A2A1A" stroke="#22C55E" stroke-width="2" filter="url(#glow)"/>
  <text x="340" y="76" font-size="11" fill="#22C55E" text-anchor="middle" font-weight="700">Step 2</text>
  <text x="340" y="100" font-size="22" font-weight="900" fill="#F8FAFC" text-anchor="middle">24 × 10</text>
  <text x="340" y="116" font-size="14" font-weight="700" fill="#4ADE80" text-anchor="middle">= 240</text>

  <!-- Arrow 3 -->
  <line x1="392" y1="87" x2="418" y2="87" stroke="#22C55E" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Answer box -->
  <rect x="420" y="52" width="80" height="70" rx="12" fill="#142010" stroke="#22C55E" stroke-width="2.5" filter="url(#glow)"/>
  <text x="460" y="76" font-size="11" fill="#4ADE80" text-anchor="middle" font-weight="700">Answer</text>
  <text x="460" y="102" font-size="26" font-weight="900" fill="#FCD34D" text-anchor="middle">240</text>

  <!-- Rule box -->
  <rect x="80" y="138" width="360" height="46" rx="10" fill="#0D1525" stroke="#A78BFA40" stroke-width="1"/>
  <text x="260" y="157" font-size="11" font-weight="800" fill="#A78BFA" text-anchor="middle">Rule: n × 5 = (n ÷ 2) × 10</text>
  <text x="260" y="176" font-size="10" fill="#64748B" text-anchor="middle">If n is odd: n × 5 = ((n−1) ÷ 2) × 10 + 5</text>
</svg>
