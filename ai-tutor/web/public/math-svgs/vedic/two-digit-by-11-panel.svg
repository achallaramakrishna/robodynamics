<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220">
  <rect width="420" height="220" rx="24" fill="#EAF2FF"/>
  <text x="40" y="48" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#3B3A8C">32 ? 11 = 352</text>
  <text x="40" y="88" font-family="Segoe UI, Arial" font-size="18" fill="#1F2440">1. Keep 3 and 2 outside</text>
  <text x="40" y="118" font-family="Segoe UI, Arial" font-size="18" fill="#1F2440">2. Add 3 + 2 = 5 in the middle</text>
  <rect x="268" y="64" width="112" height="92" rx="18" fill="white" stroke="#E91E8C" stroke-width="3"/>
  <text x="324" y="122" text-anchor="middle" font-family="Segoe UI, Arial" font-size="42" font-weight="700" fill="#E91E8C">352</text>
  <text x="210" y="192" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="#6B7290">outer | sum | outer</text>
</svg>
