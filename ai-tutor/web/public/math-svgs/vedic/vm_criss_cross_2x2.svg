<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" font-family="Nunito,sans-serif">
  <rect width="380" height="240" rx="14" fill="#fffbeb"/>
  <text x="190" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Urdhva-Tiryak — 2-Digit × 2-Digit Criss-Cross</text>

  <!-- Problem: 23 × 14 -->
  <text x="190" y="50" text-anchor="middle" font-size="15" fill="#92400e">23  ×  14</text>

  <!-- Digit boxes -->
  <!-- 2  3 -->
  <rect x="70" y="60" width="44" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="92" y="88" text-anchor="middle" font-size="26" font-weight="800" fill="#b45309">2</text>

  <rect x="126" y="60" width="44" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="148" y="88" text-anchor="middle" font-size="26" font-weight="800" fill="#b45309">3</text>

  <!-- 1  4 -->
  <rect x="210" y="60" width="44" height="44" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="232" y="88" text-anchor="middle" font-size="26" font-weight="800" fill="#15803d">1</text>

  <rect x="266" y="60" width="44" height="44" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="288" y="88" text-anchor="middle" font-size="26" font-weight="800" fill="#15803d">4</text>

  <!-- Step 1: Units — 3×4 (vertical right) -->
  <line x1="148" y1="104" x2="288" y2="104" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="0"/>
  <text x="218" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#ef4444">Step 1: 3×4 = 12  → write 2, carry 1</text>

  <!-- Step 2: Cross — 2×4 + 3×1 (diagonal lines) -->
  <line x1="92" y1="60" x2="288" y2="104" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="148" y1="60" x2="232" y2="104" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="190" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#8b5cf6">Step 2: 2×4 + 3×1 + 1(carry) = 12  → write 2, carry 1</text>

  <!-- Step 3: Tens — 2×1 (vertical left) -->
  <line x1="92" y1="60" x2="232" y2="60" stroke="#2563eb" stroke-width="2.5"/>
  <text x="190" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">Step 3: 2×1 + 1(carry) = 3</text>

  <!-- Answer -->
  <rect x="130" y="183" width="120" height="30" rx="8" fill="#1d4ed8"/>
  <text x="190" y="203" text-anchor="middle" font-size="15" font-weight="800" fill="white">Answer: 322</text>

  <!-- Step labels -->
  <text x="30" y="122" font-size="10" fill="#ef4444" font-weight="700">①</text>
  <text x="30" y="148" font-size="10" fill="#8b5cf6" font-weight="700">②</text>
  <text x="30" y="170" font-size="10" fill="#2563eb" font-weight="700">③</text>
</svg>
