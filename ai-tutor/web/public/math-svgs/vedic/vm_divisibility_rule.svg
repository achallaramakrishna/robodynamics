<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="380" height="250" font-family="Nunito,sans-serif">
  <rect width="380" height="250" rx="14" fill="#fffbeb"/>
  <text x="190" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Advanced Divisibility Rules</text>

  <!-- Row for 7 -->
  <rect x="20" y="38" width="36" height="28" rx="6" fill="#fbbf24"/>
  <text x="38" y="57" text-anchor="middle" font-size="16" font-weight="800" fill="#78350f">÷7</text>
  <rect x="62" y="38" width="298" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="211" y="57" text-anchor="middle" font-size="11" fill="#92400e">Subtract 2 × last digit from rest: 203 → 20−6=14 ✓</text>

  <!-- Row for 11 -->
  <rect x="20" y="74" width="36" height="28" rx="6" fill="#a78bfa"/>
  <text x="38" y="93" text-anchor="middle" font-size="16" font-weight="800" fill="#4c1d95">÷11</text>
  <rect x="62" y="74" width="298" height="28" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="211" y="93" text-anchor="middle" font-size="11" fill="#5b21b6">Alternating sum = 0 or ±11: 1331 → 1−3+3−1=0 ✓</text>

  <!-- Row for 13 -->
  <rect x="20" y="110" width="36" height="28" rx="6" fill="#34d399"/>
  <text x="38" y="129" text-anchor="middle" font-size="16" font-weight="800" fill="#064e3b">÷13</text>
  <rect x="62" y="110" width="298" height="28" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="211" y="129" text-anchor="middle" font-size="11" fill="#065f46">Add 4 × last digit to rest: 169 → 16+36=52, 5+8=13 ✓</text>

  <!-- 1001 = 7×11×13 insight -->
  <rect x="20" y="152" width="340" height="52" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="190" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">Key Insight: 1001 = 7 × 11 × 13</text>
  <text x="190" y="190" text-anchor="middle" font-size="11" fill="#78350f">If divisible by 1001, it's divisible by 7, 11 AND 13</text>

  <!-- Speed test example -->
  <rect x="20" y="214" width="340" height="30" rx="8" fill="#b45309"/>
  <text x="190" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="white">Test 1001: 1−0+0−1=0 (÷11 ✓) | 100−2=98, 9−16 → keep going ✓</text>
</svg>
