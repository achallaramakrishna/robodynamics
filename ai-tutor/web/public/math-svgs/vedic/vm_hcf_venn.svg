<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="380" height="230" font-family="Nunito,sans-serif">
  <rect width="380" height="230" rx="14" fill="#eff6ff"/>
  <text x="190" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">HCF — Common Factors Overlap</text>
  <text x="190" y="44" text-anchor="middle" font-size="12" fill="#374151">Example: HCF of 24 and 36</text>

  <!-- Left circle: factors of 24 -->
  <circle cx="145" cy="130" r="80" fill="#dbeafe" fill-opacity="0.7" stroke="#3b82f6" stroke-width="2"/>
  <text x="95" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">Factors of 24</text>
  <text x="88" y="120" text-anchor="middle" font-size="13" fill="#1e40af">1</text>
  <text x="78" y="140" text-anchor="middle" font-size="13" fill="#1e40af">2</text>
  <text x="92" y="158" text-anchor="middle" font-size="13" fill="#1e40af">8</text>
  <text x="78" y="172" text-anchor="middle" font-size="13" fill="#1e40af">24</text>

  <!-- Right circle: factors of 36 -->
  <circle cx="235" cy="130" r="80" fill="#dcfce7" fill-opacity="0.7" stroke="#22c55e" stroke-width="2"/>
  <text x="292" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Factors of 36</text>
  <text x="295" y="120" text-anchor="middle" font-size="13" fill="#166534">9</text>
  <text x="296" y="140" text-anchor="middle" font-size="13" fill="#166534">18</text>
  <text x="292" y="158" text-anchor="middle" font-size="13" fill="#166534">36</text>

  <!-- Overlap region: common factors -->
  <text x="190" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">Common</text>
  <text x="190" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">1, 2, 3</text>
  <text x="190" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">4, 6</text>
  <text x="190" y="168" text-anchor="middle" font-size="18" font-weight="800" fill="#dc2626">12 ★</text>

  <!-- HCF label -->
  <rect x="115" y="195" width="150" height="26" rx="8" fill="#7c3aed"/>
  <text x="190" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="white">HCF(24, 36) = 12</text>
</svg>
