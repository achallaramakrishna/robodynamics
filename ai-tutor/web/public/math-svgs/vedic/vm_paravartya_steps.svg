<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="380" height="220" font-family="Nunito,sans-serif">
  <rect width="380" height="220" rx="14" fill="#f0fdf4"/>
  <text x="190" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Paravartya — Divide by Transpose</text>
  <text x="190" y="42" text-anchor="middle" font-size="11" fill="#166534">Example: 1234 ÷ 12</text>

  <!-- Divisor analysis -->
  <text x="30" y="70" font-size="12" fill="#374151" font-weight="700">Divisor: 12 → Lead digit 1, Transpose: −2</text>

  <!-- Dividend row -->
  <text x="30" y="96" font-size="11" fill="#6b7280">Dividend digits:</text>
  <!-- Boxes for 1 2 3 4 -->
  <rect x="30" y="102" width="38" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="49" y="126" text-anchor="middle" font-size="22" font-weight="800" fill="#1d4ed8">1</text>

  <rect x="76" y="102" width="38" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="95" y="126" text-anchor="middle" font-size="22" font-weight="800" fill="#1d4ed8">2</text>

  <rect x="122" y="102" width="38" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="141" y="126" text-anchor="middle" font-size="22" font-weight="800" fill="#1d4ed8">3</text>

  <rect x="168" y="102" width="38" height="38" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="187" y="126" text-anchor="middle" font-size="22" font-weight="800" fill="#be185d">4</text>
  <text x="187" y="152" text-anchor="middle" font-size="10" fill="#be185d">remainder</text>

  <!-- Process arrows -->
  <text x="240" y="110" font-size="11" fill="#374151">Step 1: bring down 1</text>
  <text x="240" y="128" font-size="11" fill="#374151">Step 2: 1 × (−2) = −2</text>
  <text x="240" y="146" font-size="11" fill="#374151">Step 3: 2 + (−2) = 0 → next digit</text>

  <!-- Quotient result -->
  <rect x="30" y="165" width="160" height="36" rx="8" fill="#166534"/>
  <text x="110" y="188" text-anchor="middle" font-size="15" font-weight="800" fill="white">Quotient: 102 R 10</text>

  <text x="210" y="185" font-size="11" fill="#166534" font-weight="700">1234 ÷ 12 = 102 r10</text>
  <text x="210" y="200" font-size="10" fill="#64748b">(verify: 102×12 + 10 = 1234 ✓)</text>
</svg>
