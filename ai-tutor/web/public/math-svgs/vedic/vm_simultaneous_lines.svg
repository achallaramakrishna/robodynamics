<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="380" height="230" font-family="Nunito,sans-serif">
  <rect width="380" height="230" rx="14" fill="#f0f9ff"/>
  <text x="190" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">Simultaneous Equations — Intersection Point</text>

  <!-- Axes -->
  <line x1="50" y1="190" x2="340" y2="190" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="50" y1="190" x2="50" y2="40" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ay)"/>
  <text x="345" y="194" font-size="11" fill="#64748b">x</text>
  <text x="44" y="36" text-anchor="middle" font-size="11" fill="#64748b">y</text>

  <!-- Grid lines -->
  <line x1="50" y1="140" x2="340" y2="140" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="50" y1="90" x2="340" y2="90" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="100" y1="40" x2="100" y2="190" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="160" y1="40" x2="160" y2="190" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="220" y1="40" x2="220" y2="190" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="280" y1="40" x2="280" y2="190" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Axis labels -->
  <text x="100" y="202" text-anchor="middle" font-size="10" fill="#64748b">1</text>
  <text x="160" y="202" text-anchor="middle" font-size="10" fill="#64748b">2</text>
  <text x="220" y="202" text-anchor="middle" font-size="10" fill="#64748b">3</text>
  <text x="280" y="202" text-anchor="middle" font-size="10" fill="#64748b">4</text>
  <text x="42" y="144" text-anchor="end" font-size="10" fill="#64748b">1</text>
  <text x="42" y="94" text-anchor="end" font-size="10" fill="#64748b">2</text>

  <!-- Line 1: 2x + 3y = 12 → passes (0,4) → (6,0) mapped to coords -->
  <!-- (0,4) → x=50, y=90   (6,0) → x=410 off chart, use (4,1.33) → (280,123) -->
  <line x1="50" y1="50" x2="340" y2="163" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="342" y="162" font-size="11" font-weight="700" fill="#2563eb">2x+3y=12</text>

  <!-- Line 2: x + y = 5 → (0,5)→(5,0) mapped -->
  <!-- (0,5) → x=50, y=40  (5,0) → x=350, y=190 -->
  <line x1="50" y1="50" x2="310" y2="190" stroke="#16a34a" stroke-width="2.5"/>
  <text x="312" y="189" font-size="11" font-weight="700" fill="#15803d">x+y=5</text>

  <!-- Intersection point: x=3, y=2 → (220, 90) -->
  <circle cx="220" cy="90" r="7" fill="#ef4444" stroke="white" stroke-width="2"/>
  <text x="226" y="82" font-size="12" font-weight="700" fill="#dc2626">(3, 2)</text>
  <line x1="220" y1="90" x2="220" y2="190" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="50" y1="90" x2="220" y2="90" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Result box -->
  <rect x="90" y="196" width="200" height="22" rx="8" fill="#1e3a8a"/>
  <text x="190" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="white">Solution: x = 3, y = 2</text>

  <defs>
    <marker id="ax" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
    <marker id="ay" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto"><path d="M0,8 L4,0 L8,8 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
