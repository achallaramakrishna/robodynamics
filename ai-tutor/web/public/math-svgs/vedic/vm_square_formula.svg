<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="380" height="230" font-family="Nunito,sans-serif">
  <rect width="380" height="230" rx="14" fill="#fff7ed"/>
  <text x="190" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">Squaring Near a Base — Vedic Method</text>

  <!-- Example: 47² = (50 − 3)² -->
  <text x="190" y="52" text-anchor="middle" font-size="14" fill="#92400e">47² = (50 − 3)²</text>

  <!-- Three boxes for expansion -->
  <!-- a² -->
  <rect x="20" y="64" width="90" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="65" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">50²</text>
  <text x="65" y="108" text-anchor="middle" font-size="18" font-weight="800" fill="#d97706">2500</text>

  <!-- − 2ab -->
  <rect x="145" y="64" width="90" height="56" rx="10" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <text x="190" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">−2×50×3</text>
  <text x="190" y="108" text-anchor="middle" font-size="18" font-weight="800" fill="#ef4444">−300</text>

  <!-- + b² -->
  <rect x="270" y="64" width="90" height="56" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="315" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">3²</text>
  <text x="315" y="108" text-anchor="middle" font-size="18" font-weight="800" fill="#16a34a">9</text>

  <!-- Connectors -->
  <text x="127" y="96" text-anchor="middle" font-size="22" fill="#6b7280">−</text>
  <text x="252" y="96" text-anchor="middle" font-size="22" fill="#6b7280">+</text>

  <!-- Arrows down -->
  <line x1="65" y1="122" x2="65" y2="145" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="190" y1="122" x2="190" y2="145" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="315" y1="122" x2="315" y2="145" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Calculation row -->
  <text x="190" y="163" text-anchor="middle" font-size="13" fill="#374151">2500  −  300  +  9  =</text>

  <!-- Result box -->
  <rect x="120" y="175" width="140" height="32" rx="10" fill="#1d4ed8"/>
  <text x="190" y="197" text-anchor="middle" font-size="18" font-weight="800" fill="white">47² = 2209</text>

  <!-- Sutra tag -->
  <text x="190" y="222" text-anchor="middle" font-size="10" fill="#9ca3af">Sutra: (a − b)² = a² − 2ab + b²</text>
</svg>
