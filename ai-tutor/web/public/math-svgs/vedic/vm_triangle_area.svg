<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="380" height="230" font-family="Nunito,sans-serif">
  <rect width="380" height="230" rx="14" fill="#f0fdf4"/>
  <text x="190" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Triangle Area — Pythagorean Triples</text>

  <!-- Triangle: 3-4-5 -->
  <polygon points="60,190 220,190 220,70" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>

  <!-- Right angle box -->
  <rect x="208" y="178" width="12" height="12" fill="none" stroke="#16a34a" stroke-width="1.5"/>

  <!-- Side labels -->
  <text x="140" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">base = 4</text>
  <text x="228" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">h = 3</text>

  <!-- Hypotenuse label -->
  <text x="128" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">c = 5</text>

  <!-- Height dashed -->
  <line x1="220" y1="70" x2="220" y2="190" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Pythagorean triple badge -->
  <rect x="260" y="60" width="110" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="315" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">3² + 4² = 5²</text>
  <text x="315" y="96" text-anchor="middle" font-size="11" fill="#78350f">9 + 16 = 25 ✓</text>
  <text x="315" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Triple: (3,4,5)</text>

  <!-- Area formula -->
  <text x="190" y="150" text-anchor="middle" font-size="13" fill="#374151">Area = ½ × base × height</text>
  <text x="190" y="167" text-anchor="middle" font-size="13" fill="#374151">= ½ × 4 × 3</text>

  <!-- Result box -->
  <rect x="110" y="178" width="150" height="26" rx="8" fill="#166534"/>
  <text x="185" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="white">Area = 6 sq units</text>
</svg>
