<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <!-- body -->
  <rect x="40" y="30" width="120" height="140" rx="8" fill="#1565c0"/>
  <rect x="50" y="40" width="100" height="80" rx="4" fill="#0d47a1"/>
  <!-- sensor grid -->
  <line x1="60" y1="50" x2="60" y2="110" stroke="#1976d2" stroke-width="1.5"/>
  <line x1="75" y1="50" x2="75" y2="110" stroke="#1976d2" stroke-width="1.5"/>
  <line x1="90" y1="50" x2="90" y2="110" stroke="#1976d2" stroke-width="1.5"/>
  <line x1="105" y1="50" x2="105" y2="110" stroke="#1976d2" stroke-width="1.5"/>
  <line x1="120" y1="50" x2="120" y2="110" stroke="#1976d2" stroke-width="1.5"/>
  <line x1="135" y1="50" x2="135" y2="110" stroke="#1976d2" stroke-width="1.5"/>
  <line x1="50" y1="60" x2="150" y2="60" stroke="#1976d2" stroke-width="1.5"/>
  <line x1="50" y1="75" x2="150" y2="75" stroke="#1976d2" stroke-width="1.5"/>
  <line x1="50" y1="90" x2="150" y2="90" stroke="#1976d2" stroke-width="1.5"/>
  <line x1="50" y1="105" x2="150" y2="105" stroke="#1976d2" stroke-width="1.5"/>
  <!-- chip label -->
  <text x="100" y="138" font-family="Arial" font-size="18" fill="white" text-anchor="middle" font-weight="bold">DHT11</text>
  <!-- pins -->
  <rect x="60" y="170" width="12" height="40" rx="3" fill="#bbb"/>
  <rect x="90" y="170" width="12" height="40" rx="3" fill="#bbb"/>
  <rect x="120" y="170" width="12" height="40" rx="3" fill="#bbb"/>
  <!-- pin labels -->
  <text x="66" y="225" font-family="monospace" font-size="10" fill="#c62828" text-anchor="middle">VCC</text>
  <text x="96" y="225" font-family="monospace" font-size="10" fill="#333" text-anchor="middle">DATA</text>
  <text x="126" y="225" font-family="monospace" font-size="10" fill="#1565c0" text-anchor="middle">GND</text>
  <!-- title -->
  <text x="100" y="20" font-family="Arial" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">DHT11 Temp &amp; Humidity</text>
  <text x="100" y="248" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">3.3–5V • ±2°C / ±5%RH</text>
</svg>
