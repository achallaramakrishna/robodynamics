<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <!-- PCB -->
  <rect x="20" y="30" width="200" height="110" rx="6" fill="#1b5e20"/>
  <!-- Two ultrasonic transducers -->
  <circle cx="80" cy="85" r="30" fill="#111"/><circle cx="80" cy="85" r="22" fill="#333"/>
  <circle cx="80" cy="85" r="14" fill="#111"/>
  <text x="80" y="89" font-family="monospace" font-size="10" fill="#777" text-anchor="middle">T</text>
  <circle cx="160" cy="85" r="30" fill="#111"/><circle cx="160" cy="85" r="22" fill="#333"/>
  <circle cx="160" cy="85" r="14" fill="#111"/>
  <text x="160" y="89" font-family="monospace" font-size="10" fill="#777" text-anchor="middle">R</text>
  <!-- pins -->
  <rect x="45" y="140" width="10" height="25" rx="2" fill="#bbb"/>
  <rect x="80" y="140" width="10" height="25" rx="2" fill="#bbb"/>
  <rect x="115" y="140" width="10" height="25" rx="2" fill="#bbb"/>
  <rect x="150" y="140" width="10" height="25" rx="2" fill="#bbb"/>
  <!-- pin labels -->
  <text x="50" y="175" font-family="monospace" font-size="9" fill="#c62828" text-anchor="middle">VCC</text>
  <text x="85" y="175" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">TRIG</text>
  <text x="120" y="175" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">ECHO</text>
  <text x="155" y="175" font-family="monospace" font-size="9" fill="#1565c0" text-anchor="middle">GND</text>
  <!-- label -->
  <text x="120" y="20" font-family="Arial" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">HC-SR04 Ultrasonic</text>
  <text x="120" y="57" font-family="monospace" font-size="9" fill="#4caf50" text-anchor="middle">2cm–400cm range</text>
</svg>
