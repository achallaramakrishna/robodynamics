<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="112" y="112" width="800" height="800" rx="40" fill="#FDF4FF"/>
  
  <g id="letter_aha">
    <text x="200" y="600" font-family="Sanskrit, serif" font-size="500" font-weight="900" fill="#2563EB">अः</text>
  </g>
  
  <g id="object_aha">
    <!-- Visualizing the sound Aha! as a pulse -->
    <circle cx="750" cy="500" r="100" stroke="#2563EB" stroke-width="4" stroke-dasharray="20 20"/>
    <circle cx="750" cy="500" r="150" stroke="#2563EB" stroke-width="2" stroke-dasharray="10 10" opacity="0.5"/>
  </g>

  <text x="512" y="880" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="900" font-size="64" fill="#1F2937">अः (खाली)</text>
  <text x="512" y="940" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="500" font-size="32" fill="#6B7280">AHA - Empty / Visarga</text>
</svg>
