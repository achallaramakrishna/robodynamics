<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="112" y="112" width="800" height="800" rx="40" fill="#F0FDF4"/>
  
  <g id="letter_da_dental">
    <text x="250" y="600" font-family="Sanskrit, serif" font-size="500" font-weight="900" fill="#2563EB">द</text>
  </g>
  
  <g id="object_dawat">
    <!-- Inkpot -->
    <rect x="680" y="550" width="140" height="120" rx="10" fill="#1E40AF"/>
