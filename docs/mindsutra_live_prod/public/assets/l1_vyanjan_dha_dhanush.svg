    <line x1="650" y1="550" x2="850" y2="550" stroke="#475569" stroke-width="6"/> <!-- Arrow -->
  </g>

  <text x="512" y="880" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="900" font-size="64" fill="#1F2937">ध से धनुष</text>
  <text x="512" y="940" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="500" font-size="32" fill="#6B7280">DHA for Dhanush (Bow)</text>
