<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="112" y="112" width="800" height="800" rx="40" fill="#F0FDF4"/>
  
  <g id="letter_dha_dental">
    <text x="250" y="600" font-family="Sanskrit, serif" font-size="500" font-weight="900" fill="#2563EB">ध</text>
  </g>
  
  <g id="object_dhanush">
    <!-- Bow & Arrow -->
    <path d="M680 400C850 400 850 700 680 700" stroke="#92400E" stroke-width="12" fill="none" stroke-linecap="round"/> <!-- Bow -->
