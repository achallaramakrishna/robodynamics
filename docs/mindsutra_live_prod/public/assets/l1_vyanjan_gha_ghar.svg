<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="112" y="112" width="800" height="800" rx="40" fill="#F0F9FF"/>
  
  <g id="letter_gha">
    <text x="200" y="600" font-family="Sanskrit, serif" font-size="500" font-weight="900" fill="#2563EB">घ</text>
  </g>
  
  <g id="object_ghar">
    <!-- Simple House -->
    <rect x="680" y="500" width="160" height="150" fill="#EEF2FF" stroke="#2563EB" stroke-width="4"/>
    <path d="M660 500L760 400L860 500H660Z" fill="#F093FB" fill-opacity="0.2" stroke="#2563EB" stroke-width="4"/> <!-- Roof -->
    <rect x="740" y="580" width="40" height="70" fill="#2563EB"/> <!-- Door -->
  </g>

  <text x="512" y="880" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="900" font-size="64" fill="#1F2937">घ से घर</text>
  <text x="512" y="940" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="500" font-size="32" fill="#6B7280">GHA for Ghar (House)</text>
</svg>
