<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="112" y="112" width="800" height="800" rx="40" fill="#FFF7ED"/>
  
  <g id="letter_jha_cons">
    <text x="220" y="600" font-family="Sanskrit, serif" font-size="500" font-weight="900" fill="#2563EB">झ</text>
  </g>
  
  <g id="object_jhanda">
    <!-- Indian Tricolor (Simplfied) -->
    <rect x="700" y="350" width="8" height="400" fill="#4B5563"/> <!-- Pole -->
    <rect x="708" y="380" width="120" height="30" fill="#FF9933"/> <!-- Orange -->
    <rect x="708" y="410" width="120" height="30" fill="#FFFFFF"/> <!-- White -->
    <rect x="708" y="440" width="120" height="30" fill="#138808"/> <!-- Green -->
    <circle cx="768" cy="425" r="8" stroke="#000080" stroke-width="1"/> <!-- Chakra -->
  </g>

  <text x="512" y="880" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="900" font-size="64" fill="#1F2937">झ से झंडा</text>
  <text x="512" y="940" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="500" font-size="32" fill="#6B7280">JHA for Jhanda (Flag)</text>
</svg>
