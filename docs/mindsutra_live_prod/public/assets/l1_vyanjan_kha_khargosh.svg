<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="112" y="112" width="800" height="800" rx="40" fill="#FFF7ED"/>
  
  <g id="letter_kha">
    <text x="200" y="600" font-family="Sanskrit, serif" font-size="500" font-weight="900" fill="#2563EB">ख</text>
  </g>
  
  <g id="object_khargosh">
    <!-- Stylized Rabbit Face -->
    <path d="M700 550C700 500 740 450 750 450C760 450 800 500 800 550V650H700V550Z" fill="#F3F4F6" stroke="#94A3B8" stroke-width="4"/>
    <path d="M720 450V350H740V450" fill="#FBCFE8" stroke="#94A3B8" stroke-width="4"/> <!-- Ear 1 -->
    <path d="M760 450V350H780V450" fill="#FBCFE8" stroke="#94A3B8" stroke-width="4"/> <!-- Ear 2 -->
    <circle cx="730" cy="520" r="10" fill="#1E293B"/> <!-- Eye 1 -->
    <circle cx="770" cy="520" r="10" fill="#1E293B"/> <!-- Eye 2 -->
    <circle cx="750" cy="550" r="8" fill="#F472B6"/> <!-- Nose -->
  </g>

  <text x="512" y="880" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="900" font-size="64" fill="#1F2937">ख से खरगोश</text>
  <text x="512" y="940" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="500" font-size="32" fill="#6B7280">KHA for Khargosh (Rabbit)</text>
</svg>
