<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="112" y="112" width="800" height="800" rx="40" fill="#F0FDF4"/>
  
  <g id="letter_tha_dental">
    <text x="250" y="600" font-family="Sanskrit, serif" font-size="500" font-weight="900" fill="#2563EB">थ</text>
  </g>
  
  <g id="object_tharmas">
    <!-- Thermos Flask -->
    <rect x="700" y="400" width="100" height="280" rx="20" fill="#3B82F6"/>
    <rect x="720" y="370" width="60" height="30" rx="5" fill="#1D4ED8"/> <!-- Cap -->
    <path d="M700 450H800" stroke="white" stroke-width="4" opacity="0.3"/>
  </g>

  <text x="512" y="880" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="900" font-size="64" fill="#1F2937">थ से थरमस</text>
  <text x="512" y="940" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="500" font-size="32" fill="#6B7280">THA for Tharmas (Thermos)</text>
</svg>
