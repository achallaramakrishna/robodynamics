<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="112" y="112" width="800" height="800" rx="40" fill="#FEF2F2"/>
  
  <g id="letter_tha_retro">
    <text x="250" y="600" font-family="Sanskrit, serif" font-size="500" font-weight="900" fill="#2563EB">ठ</text>
  </g>
  
  <g id="object_thathera">
    <!-- Copper Pot being hammered -->
    <circle cx="750" cy="580" r="120" fill="#B45309" stroke="#92400E" stroke-width="4"/>
    <rect x="680" y="440" width="40" height="100" transform="rotate(-45 680 440)" fill="#475569"/> <!-- Hammer -->
  </g>

  <text x="512" y="880" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="900" font-size="64" fill="#1F2937">ठ से ठठेरा</text>
  <text x="512" y="940" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="500" font-size="32" fill="#6B7280">THA for Thathera (Coppersmith)</text>
</svg>
