<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160">
  <!-- Axes -->
  <line x1="30" y1="10" x2="30" y2="130" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="130" x2="190" y2="130" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <!-- Grid lines -->
  <line x1="30" y1="100" x2="190" y2="100" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="30" y1="70"  x2="190" y2="70"  stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="30" y1="40"  x2="190" y2="40"  stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Line -->
  <polyline points="50,110 85,80 120,60 155,40 180,55" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dots -->
  <circle cx="50"  cy="110" r="5" fill="#3b82f6"/>
  <circle cx="85"  cy="80"  r="5" fill="#3b82f6"/>
  <circle cx="120" cy="60"  r="5" fill="#3b82f6"/>
  <circle cx="155" cy="40"  r="5" fill="#3b82f6"/>
  <circle cx="180" cy="55"  r="5" fill="#3b82f6"/>
</svg>
