<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>L1 Crystal Burst - Success Animation</title>
  
  <style>
    .star { transform-origin: center; filter: drop-shadow(0 0 5px gold); }
    @keyframes burst {
      0% { transform: scale(0) rotate(0); opacity: 0; }
      50% { transform: scale(1.2) rotate(45deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    .burst-active { animation: burst 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  </style>

  <g id="sparkles">
    {/* Central Crystal */}
    <path class="star burst-active" d="M100,50 L115,85 L150,100 L115,115 L100,150 L85,115 L50,100 L85,85 Z" fill="#FACC15" />
    
    {/* Tiny Bits */}
    <circle cx="50" cy="50" r="4" fill="#38BDF8">
      <animate attributeName="cy" from="100" to="30" dur="0.6s" fill="freeze" />
      <animate attributeName="opacity" values="0;1;0" dur="0.6s" fill="freeze" />
    </circle>
    <circle cx="150" cy="50" r="4" fill="#38BDF8">
      <animate attributeName="cy" from="100" to="30" dur="0.6s" fill="freeze" />
      <animate attributeName="opacity" values="0;1;0" dur="0.6s" fill="freeze" />
    </circle>
    <circle cx="100" cy="20" r="5" fill="#F472B6">
       <animate attributeName="cy" from="100" to="20" dur="0.5s" fill="freeze" />
       <animate attributeName="opacity" values="0;1;0" dur="0.5s" fill="freeze" />
    </circle>
  </g>

  <text x="100" y="180" text-anchor="middle" font-size="16" font-weight="900" fill="#FACC15">SUPERB, YAAR! 🎆</text>
</svg>
