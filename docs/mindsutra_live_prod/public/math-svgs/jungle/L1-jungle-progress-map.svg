<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <title>L1 Jungle Progress Map - Sparky’s Magic Pattern Jungle</title>
  
  <style>
    .leaf-group { transform-origin: center bottom; }
    .completed .leaf-group { animation: sway 2s infinite ease-in-out; }
    @keyframes sway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    .mango { transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); transform: scale(0); opacity: 0; }
    .completed .mango { transform: scale(1); opacity: 1; }
    .banyan-tree { cursor: pointer; transition: filter 0.3s; }
    .banyan-tree:hover { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5)); }
  </style>

  <rect width="800" height="600" fill="#ECFDF5" />
  
  <g id="scenery">
    <path d="M0,500 Q400,450 800,500 L800,600 L0,600 Z" fill="#D1FAE5" />
    <path d="M0,550 Q400,500 800,550 L800,600 L0,600 Z" fill="#A7F3D0" />
  </g>

  <g id="trees">
    {/* Tree 1: Lesson 1 */}
    <g id="tree1" class="banyan-tree completed">
      <rect x="150" y="350" width="20" height="150" fill="#78350F" />
      <g class="leaf-group">
         <circle cx="160" cy="320" r="50" fill="#059669" />
         <circle cx="130" cy="340" r="40" fill="#10B981" />
         <circle cx="190" cy="340" r="40" fill="#10B981" />
      </g>
      <circle class="mango" cx="160" cy="320" r="10" fill="#FACC15" />
      <text x="160" y="470" text-anchor="middle" font-size="12" font-weight="900" fill="#064E3B">MAGIC VINE</text>
    </g>

    {/* Tree 2: Lesson 2 */}
    <g id="tree2" class="banyan-tree">
      <rect x="330" y="320" width="25" height="180" fill="#78350F" />
      <g class="leaf-group">
         <circle cx="342" cy="280" r="60" fill="#059669" />
         <circle cx="302" cy="310" r="45" fill="#10B981" />
         <circle cx="382" cy="310" r="45" fill="#10B981" />
      </g>
      <circle class="mango" cx="342" cy="280" r="12" fill="#FACC15" />
      <text x="342" y="470" text-anchor="middle" font-size="12" font-weight="900" fill="#064E3B">CRYSTAL BRIDGE</text>
    </g>

    {/* Tree 3: Lesson 3 */}
    <g id="tree3" class="banyan-tree">
      <rect x="520" y="340" width="20" height="160" fill="#78350F" />
      <g class="leaf-group">
         <circle cx="530" cy="300" r="55" fill="#059669" />
         <circle cx="495" cy="325" r="42" fill="#10B981" />
         <circle cx="565" cy="325" r="42" fill="#10B981" />
      </g>
      <circle class="mango" cx="530" cy="300" r="10" fill="#FACC15" />
      <text x="530" y="470" text-anchor="middle" font-size="12" font-weight="900" fill="#064E3B">PARROT TALK</text>
    </g>

    {/* Tree 4: Lesson 4 */}
    <g id="tree4" class="banyan-tree">
      <rect x="680" y="370" width="18" height="130" fill="#78350F" />
      <g class="leaf-group">
         <circle cx="689" cy="340" r="45" fill="#059669" />
         <circle cx="664" cy="360" r="35" fill="#10B981" />
         <circle cx="714" cy="360" r="35" fill="#10B981" />
      </g>
      <circle class="mango" cx="689" cy="340" r="8" fill="#FACC15" />
      <text x="689" y="470" text-anchor="middle" font-size="12" font-weight="900" fill="#064E3B">PALM SCROLLS</text>
    </g>
  </g>

  <g id="crystal-counter" transform="translate(650, 40)">
     <rect width="120" height="40" rx="20" fill="rgba(15, 23, 42, 0.8)" border="1px solid #38BDF8" />
     <text x="60" y="27" text-anchor="middle" fill="#38BDF8" font-size="18" font-weight="900" id="crystal-count">5 / 20</text>
     <path d="M15,20 L25,20 M20,15 L20,25" stroke="#38BDF8" stroke-width="2">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
     </path>
  </g>

  <text x="400" y="80" text-anchor="middle" font-size="32" font-weight="900" fill="#064E3B">Sparky’s Magic Pattern Jungle</text>
  <text x="400" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#059669">Complete all 4 trees to save the jungle!</text>

  <g id="sparky-character" transform="translate(50, 440)">
     <circle r="30" fill="#EA580C" />
     <path d="M-15,-10 L-35,-25 L-20,0 Z" fill="#EA580C" />
     <path d="M15,-10 L35,-25 L20,0 Z" fill="#EA580C" />
     <circle cx="-10" cy="-5" r="3" fill="white" />
     <circle cx="10" cy="-5" r="3" fill="white" />
     <circle cx="0" cy="10" r="5" fill="#FDBA74" />
     <text x="0" y="55" text-anchor="middle" font-size="14" font-weight="900" fill="#EA580C">🐾 Sparky</text>
  </g>
</svg>
