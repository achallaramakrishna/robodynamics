<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <title>L2 Olympiad Island Progress Map</title>
  
  <style>
    .tower { filter: drop-shadow(0 0 5px rgba(56, 189, 248, 0.3)); cursor: pointer; transition: all 0.3s; }
    .tower:hover { filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6)); transform: translateY(-5px); }
    .crystal-beam { stroke-dasharray: 1000; stroke-dashoffset: 1000; opacity: 0; }
    .active .crystal-beam { animation: beam-draw 2s forwards; opacity: 1; }
    @keyframes beam-draw { to { stroke-dashoffset: 0; } }
    .shimmer { animation: shimmer-glow 3s infinite; }
    @keyframes shimmer-glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  </style>

  <rect width="800" height="600" fill="#0F172A" />
  
  {/* Sea */}
  <path d="M0,450 Q400,430 800,450 L800,600 L0,600 Z" fill="#1E293B" />
  <path d="M0,480 Q400,460 800,480 L800,600 L0,600 Z" fill="#0F172A" />

  {/* Island */}
  <path d="M100,450 Q400,400 700,450 L750,550 Q400,580 50,550 Z" fill="#334155" />

  {/* Towers */}
  {/* Tower 1: Blood Relations */}
  <g id="tower1" class="tower active" transform="translate(180, 250)">
    <rect x="0" y="0" width="40" height="150" fill="#475569" rx="5" />
    <polygon points="0,0 20,-30 40,0" fill="#38BDF8" />
    <circle cx="20" cy="-30" r="10" fill="#38BDF8" class="shimmer" />
    <text x="20" y="170" text-anchor="middle" fill="#94A3B8" font-size="12" font-weight="900">BLOOD TREE</text>
  </g>

  {/* Tower 2: Direction Sense */}
  <g id="tower2" class="tower" transform="translate(320, 200)">
    <rect x="0" y="0" width="40" height="200" fill="#475569" rx="5" />
    <polygon points="0,0 20,-30 40,0" fill="#38BDF8" />
    <circle cx="20" cy="-30" r="10" fill="#38BDF8" class="shimmer" />
    <text x="20" y="220" text-anchor="middle" fill="#94A3B8" font-size="12" font-weight="900">NAVIGATOR</text>
  </g>

  {/* Tower 3: Fractions */}
  <g id="tower3" class="tower" transform="translate(460, 230)">
    <rect x="0" y="0" width="40" height="170" fill="#475569" rx="5" />
    <polygon points="0,0 20,-30 40,0" fill="#38BDF8" />
    <circle cx="20" cy="-30" r="10" fill="#38BDF8" class="shimmer" />
    <text x="20" y="190" text-anchor="middle" fill="#94A3B8" font-size="12" font-weight="900">RATIO LAB</text>
  </g>

  {/* Tower 4: Syllogisms */}
  <g id="tower4" class="tower" transform="translate(600, 280)">
    <rect x="0" y="0" width="40" height="120" fill="#475569" rx="5" />
    <polygon points="0,0 20,-30 40,0" fill="#38BDF8" />
    <circle cx="20" cy="-30" r="10" fill="#38BDF8" class="shimmer" />
    <text x="20" y="140" text-anchor="middle" fill="#94A3B8" font-size="12" font-weight="900">LOGIC VENN</text>
  </g>

  <g id="crystal-count" transform="translate(650, 40)">
     <rect width="120" height="40" rx="20" fill="rgba(56, 189, 248, 0.1)" stroke="#38BDF8" />
     <text x="60" y="27" text-anchor="middle" fill="#38BDF8" font-size="18" font-weight="900">0 / 20</text>
  </g>

  <text x="400" y="80" text-anchor="middle" font-size="32" font-weight="900" fill="#F8FAFC">Olympiad Island</text>
  <text x="400" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#38BDF8">Power the 4 Crystal Towers to win!</text>

  <g id="sparky-pilot" transform="translate(70, 450)">
     <circle r="40" fill="#F97316" />
     <path d="M-20,-15 L-45,-35 L-25,5 Z" fill="#F97316" />
     <path d="M20,-15 L45,-35 L25,5 Z" fill="#F97316" />
     <circle cx="-15" cy="-5" r="4" fill="white" />
     <circle cx="15" cy="-5" r="4" fill="white" />
     <circle cx="0" cy="15" r="6" fill="#FFEDD5" />
     <text x="0" y="70" text-anchor="middle" font-size="16" font-weight="900" fill="#F97316">MISSION CONTROL</text>
  </g>
</svg>
