<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs><style>.bg{fill:#0D1B2A;}</style></defs>
  <rect width="520" height="160" rx="14" class="bg"/>
  <text x="260" y="24" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">Ones-Tens Split — 12 × 1..9</text>
  <text x="260" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">Ones digit pattern repeats: 2, 4, 6, 8, 0, 2, 4, 6, 8 …</text>

  <!-- 9 chips arranged horizontally -->
  <g>
    <!-- 12×1 = 12 -->
    <rect x="14" y="58" width="50" height="62" rx="8" fill="#0A1628" stroke="#22C55E" stroke-width="1.5"/>
    <text x="39" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748B">×1</text>
    <text x="34" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="#22C55E">1</text>
    <text x="50" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="#F59E0B">2</text>
    <text x="39" y="115" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94A3B8">= 12</text>

    <!-- 12×2 = 24 -->
    <rect x="70" y="58" width="50" height="62" rx="8" fill="#0A1628" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="95" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748B">×2</text>
    <text x="90" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="#22C55E">2</text>
    <text x="106" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="#F59E0B">4</text>
    <text x="95" y="115" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94A3B8">= 24</text>

    <!-- 12×3 = 36 -->
    <rect x="126" y="58" width="50" height="62" rx="8" fill="#0A1628" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="151" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748B">×3</text>
    <text x="146" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="#22C55E">3</text>
    <text x="162" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="#F59E0B">6</text>
    <text x="151" y="115" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94A3B8">= 36</text>

    <!-- 12×4 = 48 -->
    <rect x="182" y="58" width="50" height="62" rx="8" fill="#0A1628" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="207" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748B">×4</text>
    <text x="202" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="#22C55E">4</text>
    <text x="218" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="#F59E0B">8</text>
    <text x="207" y="115" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94A3B8">= 48</text>

    <!-- 12×5 = 60 -->
    <rect x="238" y="58" width="50" height="62" rx="8" fill="#0A1628" stroke="#22C55E" stroke-width="1.5"/>
    <text x="263" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748B">×5</text>
    <text x="258" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="#22C55E">6</text>
    <text x="274" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="#F59E0B">0</text>
    <text x="263" y="115" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94A3B8">= 60</text>

    <!-- 12×6 = 72 -->
    <rect x="294" y="58" width="50" height="62" rx="8" fill="#0A1628" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="319" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748B">×6</text>
    <text x="314" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="#22C55E">7</text>
    <text x="330" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="#F59E0B">2</text>
    <text x="319" y="115" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94A3B8">= 72</text>

    <!-- 12×7 = 84 -->
    <rect x="350" y="58" width="50" height="62" rx="8" fill="#0A1628" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="375" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748B">×7</text>
    <text x="370" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="#22C55E">8</text>
    <text x="386" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="#F59E0B">4</text>
    <text x="375" y="115" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94A3B8">= 84</text>

    <!-- 12×8 = 96 -->
    <rect x="406" y="58" width="50" height="62" rx="8" fill="#0A1628" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="431" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748B">×8</text>
    <text x="426" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="#22C55E">9</text>
    <text x="442" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="#F59E0B">6</text>
    <text x="431" y="115" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94A3B8">= 96</text>

    <!-- 12×9 = 108 -->
    <rect x="462" y="58" width="50" height="62" rx="8" fill="rgba(34,197,94,0.1)" stroke="#22C55E" stroke-width="2.5"/>
    <text x="487" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#22C55E" font-weight="700">×9</text>
    <text x="478" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="800" fill="#22C55E">10</text>
    <text x="504" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="800" fill="#F59E0B">8</text>
    <text x="487" y="115" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94A3B8">= 108</text>
  </g>

  <!-- Ones pattern label -->
  <text x="260" y="145" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#F59E0B" font-weight="700">
    Ones: 2 · 4 · 6 · 8 · 0 · 2 · 4 · 6 · 8 — same cycle as 2s table!
  </text>
</svg>
