<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <defs>
    <style>
      .bg{fill:#0D1B2A;}
      .panel{fill:#0A1628;stroke:#1E3A5F;stroke-width:1.5;}
      .hdr{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;fill:#818CF8;}
      .sub{font-family:'Inter',sans-serif;font-size:11px;fill:#475569;}
      .t{font-family:'Inter',sans-serif;}
    </style>
  </defs>
  <rect width="480" height="300" rx="14" class="bg"/>
  <text x="240" y="28" text-anchor="middle" class="hdr">Ones-and-Tens Pattern — Tables 11–19</text>
  <text x="240" y="46" text-anchor="middle" class="sub">The units digit cycles: add the multiplier digit each time</text>

  <!-- For 13 × 1..10 showing ones digit pattern -->
  <rect x="20" y="60" width="200" height="225" rx="10" class="panel"/>
  <text x="120" y="82" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#3B82F6">Table of 13</text>
  <line x1="30" y1="88" x2="210" y2="88" stroke="#1E3A5F" stroke-width="1"/>

  <!-- Column headers inside -->
  <text x="50" y="104" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#6366F1">×</text>
  <text x="90" y="104" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#6366F1">Result</text>
  <text x="145" y="104" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#22C55E">Tens</text>
  <text x="185" y="104" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#F59E0B">Ones</text>

  <g font-family="Inter,sans-serif" font-size="12">
    <text x="50" y="121" text-anchor="middle" fill="#94A3B8">1</text>
    <text x="90" y="121" text-anchor="middle" fill="#F1F5F9" font-weight="700">13</text>
    <text x="145" y="121" text-anchor="middle" fill="#22C55E" font-weight="700">1</text>
    <text x="185" y="121" text-anchor="middle" fill="#F59E0B" font-weight="700">3</text>

    <text x="50" y="139" text-anchor="middle" fill="#94A3B8">2</text>
    <text x="90" y="139" text-anchor="middle" fill="#F1F5F9" font-weight="700">26</text>
    <text x="145" y="139" text-anchor="middle" fill="#22C55E" font-weight="700">2</text>
    <text x="185" y="139" text-anchor="middle" fill="#F59E0B" font-weight="700">6</text>

    <text x="50" y="157" text-anchor="middle" fill="#94A3B8">3</text>
    <text x="90" y="157" text-anchor="middle" fill="#F1F5F9" font-weight="700">39</text>
    <text x="145" y="157" text-anchor="middle" fill="#22C55E" font-weight="700">3</text>
    <text x="185" y="157" text-anchor="middle" fill="#F59E0B" font-weight="700">9</text>

    <text x="50" y="175" text-anchor="middle" fill="#94A3B8">4</text>
    <text x="90" y="175" text-anchor="middle" fill="#F1F5F9" font-weight="700">52</text>
    <text x="145" y="175" text-anchor="middle" fill="#22C55E" font-weight="700">5</text>
    <text x="185" y="175" text-anchor="middle" fill="#F59E0B" font-weight="700">2</text>

    <text x="50" y="193" text-anchor="middle" fill="#94A3B8">5</text>
    <text x="90" y="193" text-anchor="middle" fill="#F1F5F9" font-weight="700">65</text>
    <text x="145" y="193" text-anchor="middle" fill="#22C55E" font-weight="700">6</text>
    <text x="185" y="193" text-anchor="middle" fill="#F59E0B" font-weight="700">5</text>

    <text x="50" y="211" text-anchor="middle" fill="#94A3B8">6</text>
    <text x="90" y="211" text-anchor="middle" fill="#F1F5F9" font-weight="700">78</text>
    <text x="145" y="211" text-anchor="middle" fill="#22C55E" font-weight="700">7</text>
    <text x="185" y="211" text-anchor="middle" fill="#F59E0B" font-weight="700">8</text>

    <text x="50" y="229" text-anchor="middle" fill="#94A3B8">7</text>
    <text x="90" y="229" text-anchor="middle" fill="#F1F5F9" font-weight="700">91</text>
    <text x="145" y="229" text-anchor="middle" fill="#22C55E" font-weight="700">9</text>
    <text x="185" y="229" text-anchor="middle" fill="#F59E0B" font-weight="700">1</text>

    <text x="50" y="247" text-anchor="middle" fill="#94A3B8">8</text>
    <text x="90" y="247" text-anchor="middle" fill="#F1F5F9" font-weight="700">104</text>
    <text x="145" y="247" text-anchor="middle" fill="#22C55E" font-weight="700">10</text>
    <text x="185" y="247" text-anchor="middle" fill="#F59E0B" font-weight="700">4</text>

    <text x="50" y="265" text-anchor="middle" fill="#94A3B8">9</text>
    <text x="90" y="265" text-anchor="middle" fill="#F1F5F9" font-weight="700">117</text>
    <text x="145" y="265" text-anchor="middle" fill="#22C55E" font-weight="700">11</text>
    <text x="185" y="265" text-anchor="middle" fill="#F59E0B" font-weight="700">7</text>

    <text x="50" y="275" text-anchor="middle" fill="#94A3B8">10</text>
    <text x="90" y="275" text-anchor="middle" fill="#F1F5F9" font-weight="700">130</text>
    <text x="145" y="275" text-anchor="middle" fill="#22C55E" font-weight="700">13</text>
    <text x="185" y="275" text-anchor="middle" fill="#F59E0B" font-weight="700">0</text>
  </g>

  <!-- Pattern insight panel -->
  <rect x="240" y="60" width="225" height="225" rx="10" class="panel"/>
  <text x="352" y="82" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#818CF8">Pattern Insight</text>
  <line x1="250" y1="88" x2="455" y2="88" stroke="#1E3A5F" stroke-width="1"/>

  <text x="250" y="112" font-family="Inter,sans-serif" font-size="12" fill="#CBD5E1">Ones digit of 13×N:</text>
  <text x="250" y="130" font-family="Inter,sans-serif" font-size="12" fill="#F59E0B" font-weight="700">3, 6, 9, 2, 5, 8, 1, 4, 7, 0</text>
  <text x="250" y="150" font-family="Inter,sans-serif" font-size="11" fill="#64748B">… cycles through 10 values</text>

  <rect x="250" y="162" width="205" height="2" fill="#1E3A5F"/>

  <text x="250" y="182" font-family="Inter,sans-serif" font-size="12" fill="#CBD5E1">Key observation:</text>
  <text x="250" y="200" font-family="Inter,sans-serif" font-size="12" fill="#34D399">• Ones digit adds 3 each step</text>
  <text x="250" y="218" font-family="Inter,sans-serif" font-size="12" fill="#34D399">• Tens digit = quotient of cumulative</text>
  <text x="250" y="236" font-family="Inter,sans-serif" font-size="12" fill="#34D399">• No memorisation needed!</text>

  <rect x="250" y="248" width="205" height="30" rx="6" fill="rgba(99,102,241,0.15)" stroke="#6366F166" stroke-width="1"/>
  <text x="352" y="268" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#818CF8" font-weight="700">
    13 × N = (N + floor(3N/10)) tens | (3N mod 10) ones
  </text>
</svg>
