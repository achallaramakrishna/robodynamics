<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280">
  <defs><style>.bg{fill:#0D1B2A;}</style></defs>
  <rect width="520" height="280" rx="14" class="bg"/>
  <text x="260" y="26" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">Row Growth — How 15 × N Grows</text>
  <text x="260" y="44" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">Each extra row adds 15 more. Visualise the growth.</text>

  <!-- Rows of 15 blocks -->
  <g>
    <!-- Row 1: 15 blocks -->
    <rect x="20" y="58" width="200" height="20" rx="4" fill="#22C55E" opacity="0.7"/>
    <text x="235" y="73" font-family="Inter,sans-serif" font-size="12" fill="#22C55E" font-weight="700">15 × 1 = 15</text>

    <!-- Row 2: 30 blocks -->
    <rect x="20" y="82" width="200" height="20" rx="4" fill="#3B82F6" opacity="0.7"/>
    <rect x="20" y="104" width="200" height="20" rx="4" fill="#3B82F6" opacity="0.5"/>
    <text x="235" y="97" font-family="Inter,sans-serif" font-size="12" fill="#3B82F6" font-weight="700">15 × 2 = 30</text>

    <!-- Row 3: 45 blocks (3 rows) -->
    <rect x="20" y="128" width="200" height="20" rx="4" fill="#8B5CF6" opacity="0.7"/>
    <rect x="20" y="150" width="200" height="20" rx="4" fill="#8B5CF6" opacity="0.55"/>
    <rect x="20" y="172" width="200" height="20" rx="4" fill="#8B5CF6" opacity="0.4"/>
    <text x="235" y="152" font-family="Inter,sans-serif" font-size="12" fill="#8B5CF6" font-weight="700">15 × 3 = 45</text>

    <!-- Row 4 label + annotation -->
    <rect x="20" y="196" width="200" height="20" rx="4" fill="#F59E0B" opacity="0.7"/>
    <rect x="20" y="218" width="200" height="20" rx="4" fill="#F59E0B" opacity="0.55"/>
    <rect x="20" y="240" width="200" height="20" rx="4" fill="#F59E0B" opacity="0.4"/>
    <rect x="20" y="240" width="100" height="20" rx="0" fill="#F59E0B" opacity="0.2"/>
    <text x="235" y="226" font-family="Inter,sans-serif" font-size="12" fill="#F59E0B" font-weight="700">15 × 4 = 60</text>
  </g>

  <!-- Growth arrow on left -->
  <line x1="12" y1="68" x2="12" y2="258" stroke="#6366F1" stroke-width="2"/>
  <polygon points="8,258 12,268 16,258" fill="#6366F1"/>
  <text x="8" y="163" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#818CF8" transform="rotate(-90,8,163)">growing →</text>

  <!-- Key insight box -->
  <rect x="340" y="58" width="160" height="180" rx="10" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="420" y="80" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#818CF8">Key Pattern</text>
  <text x="350" y="102" font-family="Inter,sans-serif" font-size="12" fill="#CBD5E1">+15 each row</text>
  <text x="350" y="120" font-family="Inter,sans-serif" font-size="13" fill="#22C55E" font-weight="700">15 × 1 = 15</text>
  <text x="350" y="138" font-family="Inter,sans-serif" font-size="13" fill="#3B82F6" font-weight="700">15 × 2 = 30</text>
  <text x="350" y="156" font-family="Inter,sans-serif" font-size="13" fill="#8B5CF6" font-weight="700">15 × 3 = 45</text>
  <text x="350" y="174" font-family="Inter,sans-serif" font-size="13" fill="#F59E0B" font-weight="700">15 × 4 = 60</text>
  <text x="350" y="198" font-family="Inter,sans-serif" font-size="11" fill="#64748B">ends in 0 or 5</text>
  <text x="350" y="214" font-family="Inter,sans-serif" font-size="11" fill="#34D399">always! ✓</text>

  <text x="260" y="272" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#64748B">
    Visual growth = multiplication intuition
  </text>
</svg>
