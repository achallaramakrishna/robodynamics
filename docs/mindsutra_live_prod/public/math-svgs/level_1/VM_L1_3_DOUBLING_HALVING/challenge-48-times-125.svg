<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="280" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="42" y="58" fill="#0F172A" font-size="26" font-family="Arial, sans-serif" font-weight="700">Double and Halve Challenge</text>
  <text x="42" y="84" fill="#475569" font-size="14" font-family="Arial, sans-serif">Keep the product the same while turning one factor into 1000.</text>

  <rect x="42" y="112" width="296" height="154" rx="18" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="60" y="144" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">Start here</text>
  <text x="190" y="188" text-anchor="middle" fill="#111827" font-size="40" font-family="Arial, sans-serif" font-weight="800">48 x 125</text>
  <text x="190" y="222" text-anchor="middle" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">halve 48, double 125</text>
  <text x="190" y="248" text-anchor="middle" fill="#6B7280" font-size="14" font-family="Arial, sans-serif">Each halving must match one doubling.</text>

  <rect x="382" y="112" width="296" height="154" rx="18" fill="#ECFDF5" stroke="#86EFAC"/>
  <text x="400" y="144" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">Transformation</text>
  <text x="530" y="178" text-anchor="middle" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="800">48 x 125</text>
  <text x="530" y="204" text-anchor="middle" fill="#166534" font-size="20" font-family="Arial, sans-serif" font-weight="700">-> 24 x 250</text>
  <text x="530" y="228" text-anchor="middle" fill="#166534" font-size="20" font-family="Arial, sans-serif" font-weight="700">-> 12 x 500</text>
  <text x="530" y="252" text-anchor="middle" fill="#166534" font-size="20" font-family="Arial, sans-serif" font-weight="700">-> 6 x 1000 = 6000</text>
</svg>
