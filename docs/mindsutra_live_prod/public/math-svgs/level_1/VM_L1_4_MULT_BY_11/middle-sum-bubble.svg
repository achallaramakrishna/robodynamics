<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="system-ui,-apple-system,sans-serif">
  <!-- Background -->
  <rect width="560" height="300" fill="#EEF2FF" rx="16"/>

  <!-- Step label -->
  <text x="280" y="28" text-anchor="middle" font-size="12" fill="#6366f1" font-weight="700" letter-spacing="1.5">YOUR TURN — GUIDED PRACTICE</text>

  <!-- ══ Source number: 43 ══ -->
  <rect x="188" y="44" width="72" height="72" rx="12" fill="#3730a3" stroke="#818cf8" stroke-width="2"/>
  <text x="224" y="100" text-anchor="middle" font-size="46" font-weight="800" fill="white">4</text>

  <text x="280" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#818cf8">×11</text>

  <rect x="300" y="44" width="72" height="72" rx="12" fill="#3730a3" stroke="#818cf8" stroke-width="2"/>
  <text x="336" y="100" text-anchor="middle" font-size="46" font-weight="800" fill="white">3</text>

  <!-- Arrow down -->
  <line x1="280" y1="122" x2="280" y2="148" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="5,3" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.3s" fill="freeze"/>
  </line>
  <polygon points="274,145 280,155 286,145" fill="#818cf8" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.3s" fill="freeze"/>
  </polygon>

  <!-- ══ Three result boxes ══ -->
  <!-- Left box -->
  <rect x="62" y="158" width="108" height="86" rx="14" fill="#3730a3" stroke="#818cf8" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.35s" fill="freeze"/>
  </rect>
  <text x="116" y="215" text-anchor="middle" font-size="44" font-weight="800" fill="white" opacity="0">4
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.4s" fill="freeze"/>
  </text>
  <text x="116" y="254" text-anchor="middle" font-size="11" fill="#a5b4fc" opacity="0">first digit (A)
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- Arrow from left source to left box -->
  <path d="M 224,118 C 224,138 116,138 116,158" stroke="#818cf8" stroke-width="1.8" fill="none" stroke-dasharray="5,3" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.3s" fill="freeze"/>
  </path>
  <polygon points="111,153 116,162 121,153" fill="#818cf8" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.3s" fill="freeze"/>
  </polygon>

  <!-- Middle box -->
  <rect x="226" y="158" width="108" height="86" rx="14" fill="#5b21b6" stroke="#a78bfa" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.35s" fill="freeze"/>
  </rect>
  <!-- Middle annotation: 4+3 = ? — hint appears first -->
  <text x="280" y="142" text-anchor="middle" font-size="13" fill="#fbbf24" font-weight="700" opacity="0">4 + 3 = ?
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.35s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="2.4s" dur="0.3s" fill="freeze"/>
  </text>
  <!-- Then reveals the answer -->
  <text x="280" y="142" text-anchor="middle" font-size="13" fill="#fbbf24" font-weight="700" opacity="0">4 + 3 = 7
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.35s" fill="freeze"/>
  </text>
  <line x1="280" y1="145" x2="280" y2="158" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,2" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.3s" fill="freeze"/>
  </line>
  <!-- Middle value: blank first, then 7 -->
  <text x="280" y="215" text-anchor="middle" font-size="44" font-weight="800" fill="#fbbf24" opacity="0">7
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.4s" fill="freeze"/>
  </text>
  <text x="280" y="254" text-anchor="middle" font-size="11" fill="#c4b5fd" opacity="0">A + B = 7 ✓
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- Right box -->
  <rect x="390" y="158" width="108" height="86" rx="14" fill="#3730a3" stroke="#818cf8" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.35s" fill="freeze"/>
  </rect>
  <text x="444" y="215" text-anchor="middle" font-size="44" font-weight="800" fill="white" opacity="0">3
    <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.4s" fill="freeze"/>
  </text>
  <text x="444" y="254" text-anchor="middle" font-size="11" fill="#a5b4fc" opacity="0">last digit (B)
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- Arrow from right source to right box -->
  <path d="M 336,118 C 336,138 444,138 444,158" stroke="#818cf8" stroke-width="1.8" fill="none" stroke-dasharray="5,3" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.3s" fill="freeze"/>
  </path>
  <polygon points="439,153 444,162 449,153" fill="#818cf8" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.3s" fill="freeze"/>
  </polygon>

  <!-- ══ No carry badge ══ -->
  <rect x="208" y="260" width="144" height="22" rx="8" fill="#065f46" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.3s" fill="freeze"/>
  </rect>
  <text x="280" y="275" text-anchor="middle" font-size="11" fill="#6ee7b7" font-weight="700" opacity="0">7 &lt; 10 — no carry needed!
    <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- ══ Answer ══ -->
  <text x="280" y="296" text-anchor="middle" font-size="18" font-weight="800" fill="#16a34a" opacity="0">43 × 11 = 473 ✓
    <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.5s" fill="freeze"/>
  </text>
</svg>
