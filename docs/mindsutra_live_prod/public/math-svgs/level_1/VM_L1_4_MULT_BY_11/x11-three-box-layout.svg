<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="system-ui,-apple-system,sans-serif">
  <!-- Background -->
  <rect width="560" height="300" fill="#EEF2FF" rx="16"/>

  <!-- Step label -->
  <text x="280" y="28" text-anchor="middle" font-size="12" fill="#6366f1" font-weight="700" letter-spacing="1.5">THE × 11 TRICK — THREE BOXES</text>

  <!-- ══ Source number: 46 ══ -->
  <!-- Digit "4" (tens) -->
  <rect x="188" y="44" width="72" height="72" rx="12" fill="#3730a3" stroke="#818cf8" stroke-width="2"/>
  <text x="224" y="100" text-anchor="middle" font-size="46" font-weight="800" fill="white">4</text>

  <!-- ×11 label -->
  <text x="280" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#818cf8">×11</text>

  <!-- Digit "6" (units) -->
  <rect x="300" y="44" width="72" height="72" rx="12" fill="#3730a3" stroke="#818cf8" stroke-width="2"/>
  <text x="336" y="100" text-anchor="middle" font-size="46" font-weight="800" fill="white">6</text>

  <!-- ══ Arrow down ══ -->
  <line x1="280" y1="122" x2="280" y2="148" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="5,3" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.3s" fill="freeze"/>
  </line>
  <polygon points="274,145 280,155 286,145" fill="#818cf8" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.3s" fill="freeze"/>
  </polygon>

  <!-- ══ Three result boxes ══ -->
  <!-- Left box (A = first digit of number) -->
  <rect x="62" y="158" width="108" height="86" rx="14" fill="#3730a3" stroke="#818cf8" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.35s" fill="freeze"/>
  </rect>
  <text x="116" y="215" text-anchor="middle" font-size="44" font-weight="800" fill="white" opacity="0">4
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.4s" fill="freeze"/>
  </text>
  <text x="116" y="254" text-anchor="middle" font-size="11" fill="#a5b4fc" letter-spacing="0.5" opacity="0">first digit (A)
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- Arrow from left source "4" to left box -->
  <path d="M 224,118 C 224,138 116,138 116,158" stroke="#818cf8" stroke-width="1.8" fill="none" stroke-dasharray="5,3" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.3s" fill="freeze"/>
  </path>
  <polygon points="111,153 116,162 121,153" fill="#818cf8" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.3s" fill="freeze"/>
  </polygon>

  <!-- Middle box (A+B = digit sum) -->
  <rect x="226" y="158" width="108" height="86" rx="14" fill="#5b21b6" stroke="#a78bfa" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.35s" fill="freeze"/>
  </rect>
  <!-- Middle annotation: 4+6 -->
  <text x="280" y="142" text-anchor="middle" font-size="13" fill="#fbbf24" font-weight="700" opacity="0">4 + 6 = 10
    <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.35s" fill="freeze"/>
  </text>
  <line x1="280" y1="145" x2="280" y2="158" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,2" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.3s" fill="freeze"/>
  </line>
  <!-- Middle value "10" — note: this triggers carry! shown in amber -->
  <text x="280" y="215" text-anchor="middle" font-size="38" font-weight="800" fill="#fbbf24" opacity="0">10
    <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.4s" fill="freeze"/>
  </text>
  <text x="280" y="254" text-anchor="middle" font-size="11" fill="#c4b5fd" letter-spacing="0.5" opacity="0">A + B (middle)
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- Right box (B = last digit of number) -->
  <rect x="390" y="158" width="108" height="86" rx="14" fill="#3730a3" stroke="#818cf8" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.35s" fill="freeze"/>
  </rect>
  <text x="444" y="215" text-anchor="middle" font-size="44" font-weight="800" fill="white" opacity="0">6
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.4s" fill="freeze"/>
  </text>
  <text x="444" y="254" text-anchor="middle" font-size="11" fill="#a5b4fc" letter-spacing="0.5" opacity="0">last digit (B)
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- Arrow from right source "6" to right box -->
  <path d="M 336,118 C 336,138 444,138 444,158" stroke="#818cf8" stroke-width="1.8" fill="none" stroke-dasharray="5,3" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.3s" fill="freeze"/>
  </path>
  <polygon points="439,153 444,162 449,153" fill="#818cf8" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.3s" fill="freeze"/>
  </polygon>

  <!-- ══ Carry note ══ -->
  <text x="280" y="278" text-anchor="middle" font-size="12" fill="#f59e0b" font-weight="700" opacity="0">4+6=10 → write 0, carry 1 → left becomes 4+1=5 → Answer: 506
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.5s" fill="freeze"/>
  </text>

  <!-- ══ Answer ══ -->
  <text x="280" y="296" text-anchor="middle" font-size="16" font-weight="800" fill="#16a34a" opacity="0">46 × 11 = 506 ✓
    <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.5s" fill="freeze"/>
  </text>
</svg>
