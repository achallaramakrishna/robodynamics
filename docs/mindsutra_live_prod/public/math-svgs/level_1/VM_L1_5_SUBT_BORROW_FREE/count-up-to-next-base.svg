<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .text-light { fill: #f8fafc; font-family: system-ui, sans-serif; font-weight: bold; font-size: 28px; }
      .text-blue { fill: #3b82f6; font-family: system-ui, sans-serif; font-weight: bold; font-size: 24px; }
      .text-purple { fill: #a855f7; font-family: system-ui, sans-serif; font-weight: bold; font-size: 24px; }
      .text-gold { fill: #eab308; font-family: system-ui, sans-serif; font-weight: bold; font-size: 24px; }
      .arrow { fill: none; stroke: #3b82f6; stroke-width: 4; marker-end: url(#arrowhead-blue); stroke-dasharray: 8 4;}
      .arrow-purple { fill: none; stroke: #a855f7; stroke-width: 4; marker-end: url(#arrowhead-purple); stroke-dasharray: 8 4;}
      .arrow-gold { fill: none; stroke: #eab308; stroke-width: 4; marker-end: url(#arrowhead-gold); stroke-dasharray: 8 4;}
      .line-base { stroke: #334155; stroke-width: 6; stroke-linecap: round; }
      .tick { stroke: #cbd5e1; stroke-width: 4; }
    </style>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6" /></marker>
    <marker id="arrowhead-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a855f7" /></marker>
    <marker id="arrowhead-gold" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eab308" /></marker>
  </defs>

  <rect width="600" height="250" class="bg" rx="16"/>

  <!-- Base Number Line -->
  <line x1="50" y1="180" x2="550" y2="180" class="line-base"/>
  
  <!-- Ticks -->
  <line x1="80" y1="170" x2="80" y2="190" class="tick"/>
  <text x="80" y="225" class="text-light" text-anchor="middle">247</text>

  <line x1="200" y1="170" x2="200" y2="190" class="tick"/>
  <text x="200" y="225" class="text-light" text-anchor="middle">250</text>

  <line x1="520" y1="170" x2="520" y2="190" class="tick"/>
  <text x="520" y="225" class="text-light" text-anchor="middle">1000</text>

  <!-- Jumps -->
  <!-- 247 to 250 -->
  <path d="M 80 150 Q 140 100 190 150" class="arrow"/>
  <text x="140" y="110" class="text-blue" text-anchor="middle">+3</text>

  <!-- 250 to 1000 -->
  <path d="M 210 150 Q 360 -20 510 150" class="arrow-gold"/>
  <text x="360" y="60" class="text-gold" text-anchor="middle">+750</text>

  <!-- Total Jump -->
  <text x="360" y="100" class="text-light" text-anchor="middle">Total: 753</text>

</svg>
