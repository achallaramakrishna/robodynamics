<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs><style>.bg{fill:#0D1B2A;}</style>
    <marker id="g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6z" fill="#22C55E"/>
    </marker>
  </defs>
  <rect width="520" height="200" rx="14" class="bg"/>
  <text x="260" y="24" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">Complement to 100 — 100 − 54</text>
  <text x="260" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">The gap from 54 to 100 = complement</text>

  <!-- Big bar representing 1000 -->
  <rect x="30" y="68" width="460" height="36" rx="6" fill="#1E3A5F"/>
  <text x="260" y="56" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#94A3B8">Total span = 100</text>

  <!-- 372 portion (filled) -->
  <rect x="30" y="68" width="171" height="36" rx="6" fill="#EF444444" stroke="#EF4444" stroke-width="1.5"/>
  <text x="115" y="91" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#F87171">54</text>

  <!-- Gap portion (answer) -->
  <rect x="201" y="68" width="289" height="36" rx="0" fill="rgba(34,197,94,0.25)" stroke="#22C55E" stroke-width="2"/>
  <rect x="201" y="68" width="289" height="36" rx="0" fill="none" stroke-dasharray="6 3" stroke="#22C55E" stroke-width="1" opacity="0.4"/>
  <text x="346" y="91" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="800" fill="#22C55E">46</text>
  <text x="346" y="107" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#34D399">← complement (gap)</text>

  <!-- Brace annotations -->
  <line x1="30" y1="115" x2="200" y2="115" stroke="#EF4444" stroke-width="1.5"/>
  <text x="115" y="130" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#F87171">54 (subtracted)</text>
  <line x1="201" y1="115" x2="489" y2="115" stroke="#22C55E" stroke-width="1.5"/>
  <text x="346" y="130" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#34D399" font-weight="700">46 = complement</text>

  <!-- Complement working -->
  <rect x="30" y="148" width="460" height="42" rx="8" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="260" y="167" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" fill="#CBD5E1">
    9−5=<tspan fill="#22C55E" font-weight="700">4</tspan>  ·  10−4=<tspan fill="#22C55E" font-weight="700">6</tspan>  →  Gap = <tspan fill="#22C55E" font-weight="800">46</tspan>
  </text>
  <text x="260" y="184" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">Nikhilam: all digits from 9, last from 10</text>
</svg>
