<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: none; }
      .board { fill: #0f172a; rx: 16px; stroke: #eab308; stroke-width: 4; }
      .text-title { fill: #eab308; font-family: system-ui, sans-serif; font-weight: bold; font-size: 32px; text-transform: uppercase; }
      .text-rule { fill: #f8fafc; font-family: system-ui, sans-serif; font-weight: bold; font-size: 24px; }
      .text-highlight { fill: #22c55e; }
    </style>
  </defs>

  <rect width="600" height="250" class="bg"/>
  <rect x="20" y="20" width="560" height="210" class="board"/>

  <text x="300" y="70" class="text-title" text-anchor="middle">The Shortcut Rules</text>

  <text x="300" y="130" class="text-rule" text-anchor="middle">For 5: <tspan class="text-highlight">Halve</tspan> the number, then <tspan class="text-highlight">add a zero</tspan> (×10).</text>
  
  <text x="300" y="190" class="text-rule" text-anchor="middle">For 25: <tspan class="text-highlight">Quarter</tspan> the number, then <tspan class="text-highlight">add two zeros</tspan> (×100).</text>

</svg>
