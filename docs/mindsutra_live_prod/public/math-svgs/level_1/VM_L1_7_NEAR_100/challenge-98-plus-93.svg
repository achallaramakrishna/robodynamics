<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="280" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="42" y="58" fill="#0F172A" font-size="26" font-family="Arial, sans-serif" font-weight="700">Try It Mentally</text>
  <text x="42" y="84" fill="#475569" font-size="14" font-family="Arial, sans-serif">Both numbers are below 100, so start from 200 and subtract the total shortage.</text>

  <rect x="42" y="112" width="296" height="154" rx="18" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="60" y="146" fill="#991B1B" font-size="18" font-family="Arial, sans-serif" font-weight="700">Deviations</text>
  <text x="190" y="196" text-anchor="middle" fill="#111827" font-size="38" font-family="Arial, sans-serif" font-weight="800">98 -> -2</text>
  <text x="190" y="232" text-anchor="middle" fill="#111827" font-size="38" font-family="Arial, sans-serif" font-weight="800">93 -> -7</text>

  <rect x="382" y="112" width="296" height="154" rx="18" fill="#ECFDF5" stroke="#86EFAC"/>
  <text x="400" y="146" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">Mental move</text>
  <text x="530" y="190" text-anchor="middle" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="800">200 - 9</text>
  <text x="530" y="220" text-anchor="middle" fill="#166534" font-size="20" font-family="Arial, sans-serif" font-weight="700">(-2) + (-7) = -9</text>
  <text x="530" y="248" text-anchor="middle" fill="#166534" font-size="28" font-family="Arial, sans-serif" font-weight="800">191</text>
</svg>
