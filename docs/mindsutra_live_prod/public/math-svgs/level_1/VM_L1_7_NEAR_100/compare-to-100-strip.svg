<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: none; }
      .text-num { fill: #f8fafc; font-family: system-ui, sans-serif; font-weight: bold; font-size: 40px; }
      .text-base { fill: #eab308; font-family: system-ui, sans-serif; font-weight: bold; font-size: 56px; }
      .text-diff-negative { fill: #ef4444; font-family: system-ui, sans-serif; font-weight: bold; font-size: 24px; }
      .text-diff-positive { fill: #22c55e; font-family: system-ui, sans-serif; font-weight: bold; font-size: 24px; }
      .box { fill: #1e293b; rx: 8px; stroke: #334155; stroke-width: 2; }
      .arrow { fill: none; stroke: #cbd5e1; stroke-width: 4; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#cbd5e1" /></marker>
  </defs>

  <rect width="800" height="150" class="bg"/>

  <rect x="80" y="40" width="90" height="70" class="box"/>
  <text x="125" y="85" class="text-num" text-anchor="middle">97</text>

  <path d="M 180 75 L 300 75" class="arrow"/>
  <text x="240" y="65" class="text-diff-negative" text-anchor="middle">- 3</text>

  <text x="400" y="90" class="text-base" text-anchor="middle">100</text>

  <path d="M 500 75 L 620 75" class="arrow"/>
  <text x="560" y="65" class="text-diff-positive" text-anchor="middle">+ 3</text>

  <rect x="630" y="40" width="100" height="70" class="box"/>
  <text x="680" y="85" class="text-num" text-anchor="middle">103</text>

</svg>
