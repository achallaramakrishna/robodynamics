<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="280" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="42" y="58" fill="#0F172A" font-size="26" font-family="Arial, sans-serif" font-weight="700">Near-100 Worked Example</text>
  <text x="42" y="84" fill="#475569" font-size="14" font-family="Arial, sans-serif">Both numbers are below 100, so both deviations are negative.</text>

  <rect x="42" y="112" width="210" height="154" rx="18" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="60" y="144" fill="#991B1B" font-size="18" font-family="Arial, sans-serif" font-weight="700">First number</text>
  <text x="147" y="188" text-anchor="middle" fill="#111827" font-size="42" font-family="Arial, sans-serif" font-weight="800">97</text>
  <text x="147" y="222" text-anchor="middle" fill="#DC2626" font-size="24" font-family="Arial, sans-serif" font-weight="700">100 - 3</text>
  <text x="147" y="246" text-anchor="middle" fill="#B91C1C" font-size="16" font-family="Arial, sans-serif" font-weight="700">deviation = -3</text>

  <rect x="264" y="112" width="210" height="154" rx="18" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="282" y="144" fill="#991B1B" font-size="18" font-family="Arial, sans-serif" font-weight="700">Second number</text>
  <text x="369" y="188" text-anchor="middle" fill="#111827" font-size="42" font-family="Arial, sans-serif" font-weight="800">89</text>
  <text x="369" y="222" text-anchor="middle" fill="#DC2626" font-size="24" font-family="Arial, sans-serif" font-weight="700">100 - 11</text>
  <text x="369" y="246" text-anchor="middle" fill="#B91C1C" font-size="16" font-family="Arial, sans-serif" font-weight="700">deviation = -11</text>

  <rect x="486" y="112" width="192" height="154" rx="18" fill="#ECFDF5" stroke="#86EFAC"/>
  <text x="582" y="144" text-anchor="middle" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">Base thinking</text>
  <text x="582" y="186" text-anchor="middle" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="800">200 - 14</text>
  <text x="582" y="214" text-anchor="middle" fill="#166534" font-size="20" font-family="Arial, sans-serif" font-weight="700">(-3) + (-11) = -14</text>
  <text x="582" y="244" text-anchor="middle" fill="#166534" font-size="28" font-family="Arial, sans-serif" font-weight="800">186</text>
</svg>
