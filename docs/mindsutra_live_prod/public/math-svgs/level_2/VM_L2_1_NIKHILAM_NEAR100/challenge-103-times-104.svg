<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="280" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="42" y="58" fill="#0F172A" font-size="26" font-family="Arial, sans-serif" font-weight="700">Positive Deviations</text>
  <text x="42" y="84" fill="#475569" font-size="14" font-family="Arial, sans-serif">The same method works above 100 too.</text>

  <rect x="42" y="112" width="210" height="154" rx="18" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="147" y="144" text-anchor="middle" fill="#1D4ED8" font-size="18" font-family="Arial, sans-serif" font-weight="700">Deviations</text>
  <text x="147" y="186" text-anchor="middle" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="800">103 -> +3</text>
  <text x="147" y="224" text-anchor="middle" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="800">104 -> +4</text>

  <rect x="264" y="112" width="190" height="154" rx="18" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="359" y="144" text-anchor="middle" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">Left</text>
  <text x="359" y="194" text-anchor="middle" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="800">103 + 4 = 107</text>

  <rect x="486" y="112" width="192" height="154" rx="18" fill="#ECFDF5" stroke="#86EFAC"/>
  <text x="582" y="144" text-anchor="middle" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">Right</text>
  <text x="582" y="194" text-anchor="middle" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="800">3 x 4 = 12</text>
  <text x="582" y="236" text-anchor="middle" fill="#166534" font-size="28" font-family="Arial, sans-serif" font-weight="800">10712</text>
</svg>
