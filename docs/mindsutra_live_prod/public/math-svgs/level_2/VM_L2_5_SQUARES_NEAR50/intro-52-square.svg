<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="280" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="42" y="58" fill="#0F172A" font-size="26" font-family="Arial, sans-serif" font-weight="700">Square Near 50</text>
  <text x="42" y="84" fill="#475569" font-size="14" font-family="Arial, sans-serif">Use 25 as the left anchor and the deviation from 50 as the right correction.</text>

  <rect x="42" y="112" width="296" height="154" rx="18" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="60" y="144" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">Lesson example</text>
  <text x="190" y="184" text-anchor="middle" fill="#111827" font-size="34" font-family="Arial, sans-serif" font-weight="800">52²</text>
  <text x="190" y="218" text-anchor="middle" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">d = +2 from 50</text>
  <text x="190" y="246" text-anchor="middle" fill="#111827" font-size="28" font-family="Arial, sans-serif" font-weight="800">27 | 04 = 2704</text>

  <rect x="382" y="112" width="296" height="154" rx="18" fill="#ECFDF5" stroke="#86EFAC"/>
  <text x="400" y="144" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">Rule</text>
  <text x="530" y="184" text-anchor="middle" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="800">Left = 25 + d</text>
  <text x="530" y="216" text-anchor="middle" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="800">Right = d²</text>
  <text x="530" y="246" text-anchor="middle" fill="#6B7280" font-size="14" font-family="Arial, sans-serif">Right part always uses 2 digits.</text>
</svg>
