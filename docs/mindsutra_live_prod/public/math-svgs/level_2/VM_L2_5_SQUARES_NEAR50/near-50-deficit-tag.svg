<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs><style>.bg{fill:#0D1B2A;}</style></defs>
  <rect width="200" height="200" rx="12" class="bg"/>
  <text x="100" y="22" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#818CF8">Near-50 Deficit</text>

  <!-- Main number -->
  <rect x="24" y="34" width="152" height="80" rx="12" fill="rgba(239,68,68,0.12)" stroke="#EF4444" stroke-width="2"/>
  <text x="100" y="85" text-anchor="middle" font-family="Inter,sans-serif" font-size="40" font-weight="900" fill="#F87171">47</text>

  <!-- Deviation badge -->
  <rect x="120" y="38" width="50" height="28" rx="7" fill="#EF4444"/>
  <text x="145" y="57" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="800" fill="#fff">d=−3</text>

  <!-- 50 anchor indicator -->
  <line x1="100" y1="122" x2="100" y2="140" stroke="#EF4444" stroke-width="2"/>
  <polygon points="96,140 100,150 104,140" fill="#EF4444"/>
  <rect x="60" y="152" width="80" height="26" rx="6" fill="#1E3A5F"/>
  <text x="100" y="170" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#818CF8">50</text>

  <!-- Formula -->
  <text x="100" y="192" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#64748B">Left = 25 + (−3) = 22</text>
</svg>
