<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="280" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="42" y="58" fill="#0F172A" font-size="26" font-family="Arial, sans-serif" font-weight="700">Fraction Challenge</text>
  <text x="42" y="84" fill="#475569" font-size="14" font-family="Arial, sans-serif">Reduce in steps until no common factor remains.</text>

  <rect x="42" y="112" width="296" height="154" rx="18" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="60" y="144" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">Start</text>
  <text x="190" y="182" text-anchor="middle" fill="#111827" font-size="34" font-family="Arial, sans-serif" font-weight="800">144 / 180</text>
  <text x="190" y="216" text-anchor="middle" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">÷4 -> 36 / 45</text>
  <text x="190" y="244" text-anchor="middle" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">÷9 -> 4 / 5</text>

  <rect x="382" y="112" width="296" height="154" rx="18" fill="#ECFDF5" stroke="#86EFAC"/>
  <text x="400" y="144" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">Simplest form</text>
  <text x="530" y="196" text-anchor="middle" fill="#111827" font-size="34" font-family="Arial, sans-serif" font-weight="800">4 / 5</text>
  <text x="530" y="232" text-anchor="middle" fill="#166534" font-size="16" font-family="Arial, sans-serif" font-weight="700">Numerator = 4</text>
</svg>
