<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="280" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="42" y="58" fill="#0F172A" font-size="26" font-family="Arial, sans-serif" font-weight="700">Simplify by Inspection</text>
  <text x="42" y="84" fill="#475569" font-size="14" font-family="Arial, sans-serif">Look for common factors first instead of starting long HCF work.</text>

  <rect x="42" y="112" width="296" height="154" rx="18" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="60" y="144" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">Lesson example</text>
  <text x="190" y="178" text-anchor="middle" fill="#111827" font-size="32" font-family="Arial, sans-serif" font-weight="800">36 / 48</text>
  <text x="190" y="214" text-anchor="middle" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">both divisible by 12</text>
  <text x="190" y="244" text-anchor="middle" fill="#111827" font-size="28" font-family="Arial, sans-serif" font-weight="800">3 / 4</text>

  <rect x="382" y="112" width="296" height="154" rx="18" fill="#ECFDF5" stroke="#86EFAC"/>
  <text x="400" y="144" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">Quick checks</text>
  <text x="530" y="182" text-anchor="middle" fill="#111827" font-size="20" font-family="Arial, sans-serif" font-weight="700">even? divisible by 3?</text>
  <text x="530" y="214" text-anchor="middle" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">digit-sum check helps</text>
  <text x="530" y="244" text-anchor="middle" fill="#6B7280" font-size="14" font-family="Arial, sans-serif">Cancel only after you spot a shared factor.</text>
</svg>
