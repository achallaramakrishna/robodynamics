<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="280" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="42" y="58" fill="#0F172A" font-size="26" font-family="Arial, sans-serif" font-weight="700">Flag Division Intro</text>
  <text x="42" y="84" fill="#475569" font-size="14" font-family="Arial, sans-serif">Hoist the divisor, then move digit by digit through the dividend.</text>

  <rect x="42" y="112" width="120" height="154" rx="18" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="102" y="150" text-anchor="middle" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">Divisor</text>
  <text x="102" y="214" text-anchor="middle" fill="#111827" font-size="44" font-family="Arial, sans-serif" font-weight="800">3</text>

  <rect x="194" y="112" width="236" height="154" rx="18" fill="#ECFDF5" stroke="#86EFAC"/>
  <text x="312" y="150" text-anchor="middle" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">Dividend</text>
  <text x="312" y="214" text-anchor="middle" fill="#111827" font-size="44" font-family="Arial, sans-serif" font-weight="800">483</text>

  <rect x="462" y="112" width="216" height="154" rx="18" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="570" y="150" text-anchor="middle" fill="#9A3412" font-size="18" font-family="Arial, sans-serif" font-weight="700">Expected result</text>
  <text x="570" y="202" text-anchor="middle" fill="#111827" font-size="34" font-family="Arial, sans-serif" font-weight="800">161</text>
  <text x="570" y="236" text-anchor="middle" fill="#6B7280" font-size="14" font-family="Arial, sans-serif">483 divided by 3</text>
</svg>
