<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#111827"/>
  <rect x="0" y="0" width="800" height="8" fill="#F97316"/>
  <text x="40" y="44" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">Worked Example: 96^2</text>
  <text x="40" y="74" fill="#FDBA74" font-size="16" font-weight="600" font-family="Verdana, sans-serif">Deficiency from 100 is 4</text>
  <rect x="60" y="112" width="680" height="220" rx="18" fill="#0F172A" stroke="#475569" stroke-width="2"/>
  <text x="92" y="156" fill="#E2E8F0" font-size="24" font-weight="800" font-family="Verdana, sans-serif">d = 96 - 100 = -4</text>
  <text x="92" y="198" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">Left = 96 - 4 = 92</text>
  <text x="92" y="238" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">Right = (-4)^2 = 16</text>
  <text x="92" y="286" fill="#86EFAC" font-size="32" font-weight="900" font-family="Verdana, sans-serif">96^2 = 9216</text>
</svg>
