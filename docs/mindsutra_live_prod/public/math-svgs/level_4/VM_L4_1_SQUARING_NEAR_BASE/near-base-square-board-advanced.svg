<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="400" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="6" fill="#10B981"/>

  <text x="400" y="50" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#F8FAFC" text-anchor="middle">Yāvadūnam Squaring</text>
  <text x="400" y="80" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#94A3B8" text-anchor="middle">"Whatever the deficiency, lessen it still further"</text>

  <g transform="translate(150, 140)">
    <line x1="250" y1="0" x2="250" y2="180" stroke="#475569" stroke-width="3" stroke-dasharray="8 4" />
    
    <g font-family="'JetBrains Mono'" font-size="54" font-weight="900">
      <text x="50" y="60" fill="#F8FAFC">98²</text>
      
      <line x1="0" y1="90" x2="500" y2="90" stroke="#475569" stroke-width="2" />

      <g transform="translate(0, 160)">
        <text x="20" y="0" fill="#F59E0B" filter="url(#glow)">96</text>
        <text x="280" y="0" fill="#F43F5E" filter="url(#glow)">04</text>
      </g>
    </g>

    <g transform="translate(30, 40)" font-family="Inter" font-size="12" font-weight="700">
       <path d="M 120,30 Q 150,70 180,30" stroke="#6366F1" fill="none" stroke-width="2" marker-end="url(#arrow)" />
       <text x="150" y="85" fill="#818CF8" text-anchor="middle">d = -2</text>
    </g>
  </g>

  <g transform="translate(140, 340)" font-family="Inter" font-size="14" font-weight="600">
    <rect width="520" height="40" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="260" y="25" fill="#94A3B8" text-anchor="middle">
      <tspan fill="#F59E0B">Left: 98 - 2 = 96</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#F43F5E">Right: 2² = 04</tspan>
    </text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366F1" />
    </marker>
  </defs>
</svg>