<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="50" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#F8FAFC" text-anchor="middle">Vedic Fraction Addition</text>
  <text x="400" y="80" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#94A3B8" text-anchor="middle">"Ānurūpyena — The Cross-Multiply Method"</text>

  <!-- Fraction Grid -->
  <g transform="translate(200, 150)">
    <!-- Term 1 -->
    <g transform="translate(0, 0)" font-family="'JetBrains Mono'" font-size="64" font-weight="900" fill="#F8FAFC">
      <text x="30" y="40" text-anchor="middle">2</text>
      <line x1="0" y1="60" x2="60" y2="60" stroke="#F8FAFC" stroke-width="4" />
      <text x="30" y="120" text-anchor="middle">3</text>
    </g>

    <!-- Plus Sign -->
    <text x="110" y="70" font-family="Inter" font-size="48" font-weight="800" fill="#64748B" text-anchor="middle">+</text>

    <!-- Term 2 -->
    <g transform="translate(160, 0)" font-family="'JetBrains Mono'" font-size="64" font-weight="900" fill="#F8FAFC">
      <text x="30" y="40" text-anchor="middle">3</text>
      <line x1="0" y1="60" x2="60" y2="60" stroke="#F8FAFC" stroke-width="4" />
      <text x="30" y="120" text-anchor="middle">5</text>
    </g>

    <!-- Equals Sign -->
    <text x="270" y="70" font-family="Inter" font-size="48" font-weight="800" fill="#64748B" text-anchor="middle">=</text>

    <!-- Result -->
    <g transform="translate(340, 0)" font-family="'JetBrains Mono'" font-size="64" font-weight="900">
      <text x="40" y="40" fill="#10B981" filter="url(#glow)" text-anchor="middle">19</text>
      <line x1="0" y1="60" x2="80" y2="60" stroke="#F8FAFC" stroke-width="4" />
      <text x="40" y="120" fill="#F59E0B" filter="url(#glow)" text-anchor="middle">15</text>
    </g>

    <!-- Cross Multiply Arrows -->
    <g stroke="#6366F1" stroke-width="2" fill="none" opacity="0.6">
       <!-- 2 * 5 -->
       <path d="M 40,40 Q 110,60 180,100" marker-end="url(#arrow)" />
       <!-- 3 * 3 -->
       <path d="M 40,100 Q 110,60 180,40" marker-end="url(#arrow)" />
       <!-- Denominators -->
       <path d="M 40,130 Q 110,160 180,130" marker-end="url(#arrow)" stroke="#F59E0B" />
    </g>
  </g>

  <!-- Explanation -->
  <g transform="translate(140, 360)" font-family="Inter" font-size="14" font-weight="600">
     <text x="260" y="0" fill="#94A3B8" text-anchor="middle">
       Numerator: (2 × 5) + (3 × 3) = 19
       <tspan dx="40" fill="#475569">|</tspan>
       <tspan dx="40" fill="#F59E0B">Denominator: 3 × 5 = 15</tspan>
     </text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366F1" />
    </marker>
  </defs>
</svg>