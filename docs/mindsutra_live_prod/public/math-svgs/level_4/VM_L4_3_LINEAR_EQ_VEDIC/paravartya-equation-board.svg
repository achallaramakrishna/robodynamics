<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="400" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="6" fill="#6366F1"/>

  <text x="400" y="50" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#F8FAFC" text-anchor="middle">Parāvartya Sutrā</text>
  <text x="400" y="80" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#94A3B8" text-anchor="middle">"Transpose and Apply" — Linear Equations in 1 Step</text>

  <g transform="translate(150, 150)">
    <g font-family="'JetBrains Mono'" font-size="48" font-weight="900">
      <text x="0" y="60" fill="#F8FAFC">3x + 7 = x + 15</text>
      
      <!-- Visual breakdown arrows -->
      <g stroke="#6366F1" stroke-width="2" fill="none" opacity="0.6">
         <!-- Transpose 7 to right -->
         <path d="M 120,70 Q 250,140 380,70" marker-end="url(#arrow)" />
         <!-- Transpose x to left -->
         <path d="M 280,30 Q 150,-20 30,30" marker-end="url(#arrow)" />
      </g>

      <g transform="translate(0, 170)">
        <text x="50" y="0" font-size="32" fill="#94A3B8">x = </text>
        <g fill="#10B981" filter="url(#glow)" font-size="44">
           <text x="150" y="-30" text-anchor="middle">15 - 7</text>
           <line x1="100" y1="-15" x2="200" y2="-15" stroke="#F8FAFC" stroke-width="3" />
           <text x="150" y="30" text-anchor="middle">3 - 1</text>
        </g>
        <text x="240" y="0" font-size="44" fill="#F8FAFC">= 4</text>
      </g>
    </g>
  </g>

  <g transform="translate(140, 110)" font-family="Inter" font-size="12" font-weight="800">
    <text x="25" y="0" fill="#6366F1">COEFFICIENTS</text>
    <text x="280" y="0" fill="#F59E0B">CONSTANTS</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366F1" />
    </marker>
  </defs>
</svg>