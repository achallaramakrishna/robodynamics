<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="400" height="200" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Term Shift -->
  <g transform="translate(50, 100)" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="28">
     <text x="0" y="0" fill="#F8FAFC">5x</text>
     <text x="40" y="0" fill="#F43F5E">- 3</text>
     <text x="120" y="0" fill="#F8FAFC">=</text>
     <text x="160" y="0" fill="#F8FAFC">2x</text>
     <text x="200" y="0" fill="#F59E0B">+ 9</text>

     <!-- Arrows -->
     <g stroke="#6366F1" stroke-width="2" fill="none" opacity="0.8">
        <!-- 2x to left -->
        <path d="M 160,10 L 40,10" marker-end="url(#arrow)" />
        <text x="100" y="40" fill="#818CF8" font-size="12" text-anchor="middle">- 2x</text>
        
        <!-- -3 to right -->
        <path d="M 80,-30 L 220,-30" marker-end="url(#arrow)" />
        <text x="150" y="-45" fill="#818CF8" font-size="12" text-anchor="middle">+ 3</text>
     </g>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366F1" />
    </marker>
  </defs>
</svg>