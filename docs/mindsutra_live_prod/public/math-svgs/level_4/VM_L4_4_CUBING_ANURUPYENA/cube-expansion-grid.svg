<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="400" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="6" fill="#EC4899"/>

  <text x="400" y="50" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#F8FAFC" text-anchor="middle">Ānurūpyena Cubing</text>
  <text x="400" y="80" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#94A3B8" text-anchor="middle">The 4-Slot Expansion Pattern (a+b)³</text>

  <g transform="translate(100, 150)">
    <!-- 4 Slots -->
    <g font-family="'JetBrains Mono'" font-size="52" font-weight="900" text-anchor="middle">
      <!-- Slot 1 -->
      <g transform="translate(75, 50)">
        <rect x="-60" y="-70" width="120" height="140" rx="12" fill="#1E293B" stroke="#EC4899" stroke-width="2" />
        <text y="15" fill="#F8FAFC">1</text>
        <text y="100" font-size="14" fill="#64748B" font-family="Inter">a³</text>
      </g>

      <text x="150" y="50" fill="#334155" font-size="32">|</text>

      <!-- Slot 2 -->
      <g transform="translate(225, 50)">
        <rect x="-60" y="-70" width="120" height="140" rx="12" fill="#1E293B" stroke="#EC4899" stroke-width="2" />
        <text y="15" fill="#F8FAFC">6</text>
        <text y="100" font-size="14" fill="#64748B" font-family="Inter">3a²b</text>
      </g>

      <text x="300" y="50" fill="#334155" font-size="32">|</text>

      <!-- Slot 3 -->
      <g transform="translate(375, 50)">
        <rect x="-60" y="-70" width="120" height="140" rx="12" fill="#1E293B" stroke="#EC4899" stroke-width="2" />
        <text y="15" fill="#F8FAFC">12</text>
        <text y="100" font-size="14" fill="#64748B" font-family="Inter">3ab²</text>
      </g>

      <text x="450" y="50" fill="#334155" font-size="32">|</text>

      <!-- Slot 4 -->
      <g transform="translate(525, 50)">
        <rect x="-60" y="-70" width="120" height="140" rx="12" fill="#1E293B" stroke="#EC4899" stroke-width="2" />
        <text y="15" fill="#F8FAFC">8</text>
        <text y="100" font-size="14" fill="#64748B" font-family="Inter">b³</text>
      </g>
    </g>

    <!-- Final Result -->
    <g transform="translate(300, 220)" text-anchor="middle">
       <line x1="-200" y1="0" x2="300" y2="0" stroke="#334155" stroke-width="2" />
       <text y="50" font-family="'JetBrains Mono'" font-size="52" font-weight="900" fill="#D946EF" filter="url(#glow)">1728</text>
       <text y="80" font-family="Inter" font-size="12" font-weight="800" fill="#94A3B8" opacity="0.6">12³ RESULT</text>
    </g>
  </g>
</svg>