<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="800" height="6" fill="#F59E0B"/>

  <!-- Titles -->
  <text x="400" y="50" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">
    Nikhilam — Near 1000
  </text>
  <text x="400" y="80" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#94A3B8" text-anchor="middle">
    Multiply numbers close to the base 1000
  </text>

  <!-- Main Board Area -->
  <g transform="translate(150, 130)">
    <!-- Vertical Separator Line -->
    <line x1="250" y1="0" x2="250" y2="200" stroke="#475569" stroke-width="3" stroke-dasharray="8 4" />

    <!-- Numbers and Deviations -->
    <g font-family="'JetBrains Mono', monospace" font-size="42" font-weight="800">
      <!-- Number 1 -->
      <text x="50" y="50" fill="#F8FAFC">998</text>
      <text x="300" y="50" fill="#F43F5E">−002</text>
      
      <!-- Multiplication Sign -->
      <text x="10" y="110" font-size="30" fill="#64748B">×</text>

      <!-- Number 2 -->
      <text x="50" y="110" fill="#F8FAFC">993</text>
      <text x="300" y="110" fill="#F43F5E">−007</text>

      <!-- Horizontal line -->
      <line x1="0" y1="140" x2="500" y2="140" stroke="#F8FAFC" stroke-width="4" />

      <!-- Result Parts -->
      <g filter="url(#glow)">
        <text x="50" y="190" fill="#10B981">991</text>
        <text x="300" y="190" fill="#3B82F6">014</text>
      </g>
    </g>

    <!-- Formula Arrows -->
    <g stroke="#6366F1" stroke-width="2" fill="none" opacity="0.6">
       <!-- Cross sum arrow 1 -->
       <path d="M 150,55 L 290,105" marker-end="url(#arrow)" />
       <!-- Vertical product arrow -->
       <path d="M 370,55 L 370,100" />
    </g>
    
    <!-- Marker definition -->
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366F1" />
      </marker>
    </defs>

    <!-- Logic Tags -->
    <rect x="-10" y="10" width="40" height="24" rx="4" fill="#6366F1" opacity="0.2" />
    <text x="10" y="27" font-family="Inter" font-size="12" fill="#818CF8" text-anchor="middle" font-weight="700">N₁</text>
    
    <rect x="260" y="10" width="40" height="24" rx="4" fill="#F43F5E" opacity="0.2" />
    <text x="280" y="27" font-family="Inter" font-size="12" fill="#FB7185" text-anchor="middle" font-weight="700">D₁</text>
  </g>

  <!-- Explanation Tags -->
  <g transform="translate(140, 350)" font-family="Inter" font-size="14" font-weight="600">
    <rect x="0" y="0" width="220" height="30" rx="8" fill="#10B981" opacity="0.1" />
    <text x="110" y="20" fill="#34D399" text-anchor="middle">Left: 998 − 7 = 991</text>
    
    <rect x="270" y="0" width="220" height="30" rx="8" fill="#3B82F6" opacity="0.1" />
    <text x="380" y="20" fill="#60A5FA" text-anchor="middle">Right: 2 × 7 = 014</text>
  </g>
</svg>