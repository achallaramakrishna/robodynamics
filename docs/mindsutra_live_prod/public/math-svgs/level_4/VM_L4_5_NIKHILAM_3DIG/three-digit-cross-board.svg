<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#111827"/>
  <rect x="0" y="0" width="800" height="8" fill="#F97316"/>
  <text x="40" y="44" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">Challenge: 1003 x 1005</text>
  <text x="40" y="74" fill="#FDBA74" font-size="16" font-weight="600" font-family="Verdana, sans-serif">Positive deviations use the same cross-sum method</text>
  <rect x="56" y="108" width="688" height="236" rx="18" fill="#0F172A" stroke="#475569" stroke-width="2"/>
  <text x="88" y="154" fill="#E2E8F0" font-size="24" font-weight="800" font-family="Verdana, sans-serif">d1 = +3, d2 = +5</text>
  <text x="88" y="196" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">Left = 1003 + 5 = 1008</text>
  <text x="88" y="236" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">Right = 3 x 5 = 015</text>
  <text x="88" y="286" fill="#86EFAC" font-size="30" font-weight="900" font-family="Verdana, sans-serif">1003 x 1005 = 1008015</text>
</svg>
