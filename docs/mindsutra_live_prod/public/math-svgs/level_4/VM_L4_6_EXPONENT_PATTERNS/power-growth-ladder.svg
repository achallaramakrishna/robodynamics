<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#111827"/>
  <rect x="0" y="0" width="800" height="8" fill="#F97316"/>
  <text x="40" y="44" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">Power Growth Ladder</text>
  <text x="40" y="74" fill="#FDBA74" font-size="16" font-weight="600" font-family="Verdana, sans-serif">Use anchor powers instead of recomputing from 1</text>
  <text x="90" y="158" fill="#F8FAFC" font-size="24" font-weight="800" font-family="Verdana, sans-serif">2^5 = 32</text>
  <text x="230" y="158" fill="#F8FAFC" font-size="24" font-weight="800" font-family="Verdana, sans-serif">2^6 = 64</text>
  <text x="370" y="158" fill="#F8FAFC" font-size="24" font-weight="800" font-family="Verdana, sans-serif">2^7 = 128</text>
  <text x="520" y="158" fill="#FDE68A" font-size="24" font-weight="900" font-family="Verdana, sans-serif">2^10 = 1024</text>
  <line x1="150" y1="170" x2="220" y2="170" stroke="#38BDF8" stroke-width="4"/>
  <line x1="290" y1="170" x2="360" y2="170" stroke="#38BDF8" stroke-width="4"/>
  <line x1="452" y1="170" x2="512" y2="170" stroke="#38BDF8" stroke-width="4"/>
  <text x="270" y="236" fill="#E2E8F0" font-size="22" font-weight="800" font-family="Verdana, sans-serif">Step up by multiplying by the base</text>
  <text x="246" y="282" fill="#86EFAC" font-size="24" font-weight="900" font-family="Verdana, sans-serif">32 -> 64 -> 128</text>
</svg>
