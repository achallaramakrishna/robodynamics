<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#111827"/>
  <rect x="0" y="0" width="800" height="8" fill="#F97316"/>
  <text x="40" y="44" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">Worked Example: 2^7</text>
  <text x="40" y="74" fill="#FDBA74" font-size="16" font-weight="600" font-family="Verdana, sans-serif">Start from an anchor and step up</text>
  <text x="88" y="168" fill="#F8FAFC" font-size="26" font-weight="800" font-family="Verdana, sans-serif">2^5 = 32</text>
  <text x="258" y="168" fill="#F8FAFC" font-size="26" font-weight="800" font-family="Verdana, sans-serif">2^6 = 64</text>
  <text x="432" y="168" fill="#86EFAC" font-size="26" font-weight="900" font-family="Verdana, sans-serif">2^7 = 128</text>
  <line x1="170" y1="180" x2="246" y2="180" stroke="#38BDF8" stroke-width="4"/>
  <line x1="344" y1="180" x2="420" y2="180" stroke="#38BDF8" stroke-width="4"/>
  <text x="206" y="160" fill="#E2E8F0" font-size="18" font-weight="700" font-family="Verdana, sans-serif">x2</text>
  <text x="380" y="160" fill="#E2E8F0" font-size="18" font-weight="700" font-family="Verdana, sans-serif">x2</text>
  <text x="88" y="264" fill="#FDE68A" font-size="22" font-weight="900" font-family="Verdana, sans-serif">Alternative: 2^10 / 2^3 = 1024 / 8 = 128</text>
</svg>
