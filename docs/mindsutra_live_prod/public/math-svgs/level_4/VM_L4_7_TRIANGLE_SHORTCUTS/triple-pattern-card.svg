<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#0F172A"/>
  <rect x="0" y="0" width="800" height="8" fill="#F97316"/>
  <text x="40" y="44" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">Common Pythagorean Triples</text>
  <text x="40" y="74" fill="#FDBA74" font-size="16" font-weight="600" font-family="Verdana, sans-serif">Memorize the pattern, then scale it</text>
  <text x="88" y="158" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">3-4-5 -> area 6</text>
  <text x="88" y="206" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">5-12-13 -> area 30</text>
  <text x="88" y="254" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">8-15-17 -> area 60</text>
  <text x="88" y="302" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">7-24-25 -> area 84</text>
  <text x="440" y="206" fill="#FDE68A" font-size="24" font-weight="900" font-family="Verdana, sans-serif">Multiply all sides by the same number</text>
  <text x="440" y="250" fill="#86EFAC" font-size="24" font-weight="900" font-family="Verdana, sans-serif">6-8-10 and 15-20-25 are scaled triples</text>
</svg>
