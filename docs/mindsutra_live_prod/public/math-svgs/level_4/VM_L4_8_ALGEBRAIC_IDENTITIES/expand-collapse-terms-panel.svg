<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#111827" />
  <rect x="0" y="0" width="800" height="8" fill="#F43F5E" />

  <text x="40" y="46" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">
    Guided Practice: (x − 4)²
  </text>
  <text x="40" y="76" fill="#FDA4AF" font-size="16" font-weight="600" font-family="Verdana, sans-serif">
    Use the square-of-a-difference identity
  </text>

  <rect x="40" y="108" width="220" height="236" rx="18" fill="#3B0824" stroke="#F472B6" stroke-width="2" />
  <text x="60" y="146" fill="#FCE7F3" font-size="24" font-weight="800" font-family="Verdana, sans-serif">Identity</text>
  <text x="60" y="196" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">(a − b)²</text>
  <text x="60" y="232" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">= a² − 2ab + b²</text>
  <text x="60" y="286" fill="#FDE68A" font-size="22" font-weight="800" font-family="Verdana, sans-serif">a = x, b = 4</text>

  <rect x="286" y="108" width="220" height="236" rx="18" fill="#1E1B4B" stroke="#C4B5FD" stroke-width="2" />
  <text x="306" y="146" fill="#F5F3FF" font-size="24" font-weight="800" font-family="Verdana, sans-serif">Three terms</text>
  <text x="306" y="194" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">a² = x²</text>
  <text x="306" y="230" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">−2ab = −2·x·4 = −8x</text>
  <text x="306" y="266" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">b² = 16</text>

  <rect x="532" y="108" width="228" height="236" rx="18" fill="#052E16" stroke="#4ADE80" stroke-width="2" />
  <text x="552" y="146" fill="#DCFCE7" font-size="24" font-weight="800" font-family="Verdana, sans-serif">Expansion</text>
  <text x="552" y="214" fill="#86EFAC" font-size="32" font-weight="900" font-family="Verdana, sans-serif">x² − 8x + 16</text>
  <text x="552" y="274" fill="#FDE68A" font-size="22" font-weight="800" font-family="Verdana, sans-serif">Constant term = 16</text>
</svg>
