<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#111827" />
  <rect x="0" y="0" width="800" height="8" fill="#A78BFA" />

  <text x="40" y="46" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">
    Three Core Algebraic Identities
  </text>
  <text x="40" y="76" fill="#DDD6FE" font-size="16" font-weight="600" font-family="Verdana, sans-serif">
    Recognize the structure, then substitute
  </text>

  <rect x="40" y="108" width="220" height="220" rx="18" fill="#1E1B4B" stroke="#C4B5FD" stroke-width="2" />
  <text x="60" y="148" fill="#F5F3FF" font-size="24" font-weight="800" font-family="Verdana, sans-serif">(a + b)²</text>
  <text x="60" y="198" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">a² + 2ab + b²</text>
  <text x="60" y="252" fill="#FDE68A" font-size="20" font-weight="800" font-family="Verdana, sans-serif">Example: (x + 5)²</text>

  <rect x="290" y="108" width="220" height="220" rx="18" fill="#3B0824" stroke="#F472B6" stroke-width="2" />
  <text x="310" y="148" fill="#FCE7F3" font-size="24" font-weight="800" font-family="Verdana, sans-serif">(a − b)²</text>
  <text x="310" y="198" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">a² − 2ab + b²</text>
  <text x="310" y="252" fill="#FDE68A" font-size="20" font-weight="800" font-family="Verdana, sans-serif">Example: (x − 4)²</text>

  <rect x="540" y="108" width="220" height="220" rx="18" fill="#052E16" stroke="#4ADE80" stroke-width="2" />
  <text x="560" y="148" fill="#DCFCE7" font-size="24" font-weight="800" font-family="Verdana, sans-serif">(a + b)(a − b)</text>
  <text x="560" y="198" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">a² − b²</text>
  <text x="560" y="252" fill="#FDE68A" font-size="20" font-weight="800" font-family="Verdana, sans-serif">Example: (x + 7)(x − 7)</text>
</svg>
