<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#111827"/>
  <rect x="0" y="0" width="800" height="8" fill="#F97316"/>
  <text x="40" y="44" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">Guided Practice: sqrt(5329)</text>
  <text x="40" y="74" fill="#FDBA74" font-size="16" font-weight="600" font-family="Verdana, sans-serif">Pair the digits: 53 | 29</text>
  <rect x="58" y="116" width="684" height="214" rx="18" fill="#0F172A" stroke="#475569" stroke-width="2"/>
  <text x="92" y="160" fill="#E2E8F0" font-size="24" font-weight="800" font-family="Verdana, sans-serif">Last digit 9 -> root ends in 3 or 7</text>
  <text x="92" y="214" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">53 sits between 49 and 64, so tens digit = 7</text>
  <text x="92" y="274" fill="#86EFAC" font-size="30" font-weight="900" font-family="Verdana, sans-serif">73^2 = 5329 -> answer is 73</text>
</svg>
