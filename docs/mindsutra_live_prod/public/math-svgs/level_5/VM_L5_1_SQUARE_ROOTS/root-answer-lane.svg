<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#0F172A" />
  <rect x="0" y="0" width="800" height="8" fill="#F97316" />
  <text x="40" y="44" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">Challenge: sqrt(9604)</text>
  <text x="40" y="74" fill="#FDBA74" font-size="16" font-weight="600" font-family="Verdana, sans-serif">Use both the left pair and the end digit</text>
  <rect x="60" y="116" width="680" height="212" rx="18" fill="#111827" stroke="#475569" stroke-width="2" />
  <text x="88" y="160" fill="#E2E8F0" font-size="24" font-weight="800" font-family="Verdana, sans-serif">Pairs: 96 | 04</text>
  <text x="88" y="206" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">Ends in 4 -> root ends in 2 or 8</text>
  <text x="88" y="246" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">floor(sqrt(96)) = 9 -> candidates 92 or 98</text>
  <text x="88" y="292" fill="#86EFAC" font-size="30" font-weight="900" font-family="Verdana, sans-serif">98^2 = 9604 -> answer is 98</text>
</svg>
