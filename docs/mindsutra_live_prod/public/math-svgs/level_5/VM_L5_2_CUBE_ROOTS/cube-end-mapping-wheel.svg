<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#0F172A" />
  <rect x="0" y="0" width="800" height="8" fill="#F97316" />
  <text x="40" y="44" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">Unique Cube-End Mapping</text>
  <text x="40" y="74" fill="#FDBA74" font-size="16" font-weight="600" font-family="Verdana, sans-serif">No ambiguity: each cube end gives one root end</text>
  <rect x="44" y="110" width="220" height="228" rx="18" fill="#1E1B4B" stroke="#C4B5FD" stroke-width="2" />
  <text x="66" y="148" fill="#F5F3FF" font-size="22" font-weight="800" font-family="Verdana, sans-serif">Direct matches</text>
  <text x="66" y="188" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">1 -> 1</text>
  <text x="66" y="220" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">4 -> 4</text>
  <text x="66" y="252" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">5 -> 5</text>
  <text x="66" y="284" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">6 -> 6</text>
  <text x="66" y="316" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">9 -> 9, 0 -> 0</text>
  <rect x="290" y="110" width="220" height="228" rx="18" fill="#052E16" stroke="#4ADE80" stroke-width="2" />
  <text x="312" y="148" fill="#DCFCE7" font-size="22" font-weight="800" font-family="Verdana, sans-serif">Swap pairs</text>
  <text x="312" y="198" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">2 -> 8</text>
  <text x="312" y="238" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">8 -> 2</text>
  <text x="312" y="278" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">3 -> 7</text>
  <text x="312" y="318" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">7 -> 3</text>
  <rect x="536" y="110" width="220" height="228" rx="18" fill="#111827" stroke="#94A3B8" stroke-width="2" />
  <text x="558" y="148" fill="#E2E8F0" font-size="22" font-weight="800" font-family="Verdana, sans-serif">Example</text>
  <text x="558" y="194" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">19683 ends in 3</text>
  <text x="558" y="236" fill="#FDE68A" font-size="26" font-weight="900" font-family="Verdana, sans-serif">So the root ends in 7</text>
</svg>
