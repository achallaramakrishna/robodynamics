<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#111827" />
  <rect x="0" y="0" width="800" height="8" fill="#F97316" />
  <text x="40" y="44" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">Worked Example: cbrt(17576)</text>
  <text x="40" y="74" fill="#FDBA74" font-size="16" font-weight="600" font-family="Verdana, sans-serif">Triple grouping makes the root visible</text>
  <rect x="52" y="108" width="696" height="236" rx="18" fill="#0F172A" stroke="#475569" stroke-width="2" />
  <text x="84" y="154" fill="#E2E8F0" font-size="24" font-weight="800" font-family="Verdana, sans-serif">17 | 576</text>
  <text x="84" y="198" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">Last digit 6 -> root ends 6</text>
  <text x="84" y="238" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">17 sits between 8 and 27, so the tens digit is 2</text>
  <text x="84" y="286" fill="#86EFAC" font-size="30" font-weight="900" font-family="Verdana, sans-serif">cbrt(17576) = 26</text>
</svg>
