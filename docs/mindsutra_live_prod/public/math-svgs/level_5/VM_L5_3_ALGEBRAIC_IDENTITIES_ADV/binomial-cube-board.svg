<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#0F172A" />
  <rect x="0" y="0" width="800" height="8" fill="#F97316" />
  <text x="40" y="44" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">Worked Example: (x + 2)^3</text>
  <text x="40" y="74" fill="#FDBA74" font-size="16" font-weight="600" font-family="Verdana, sans-serif">Use 1-3-3-1 with a = x and b = 2</text>
  <rect x="52" y="108" width="696" height="236" rx="18" fill="#111827" stroke="#475569" stroke-width="2" />
  <text x="84" y="154" fill="#E2E8F0" font-size="24" font-weight="800" font-family="Verdana, sans-serif">x^3</text>
  <text x="200" y="154" fill="#FDE68A" font-size="24" font-weight="900" font-family="Verdana, sans-serif">+ 3x^2(2)</text>
  <text x="394" y="154" fill="#FDE68A" font-size="24" font-weight="900" font-family="Verdana, sans-serif">+ 3x(4)</text>
  <text x="550" y="154" fill="#E2E8F0" font-size="24" font-weight="800" font-family="Verdana, sans-serif">+ 8</text>
  <text x="84" y="226" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">= x^3 + 6x^2 + 12x + 8</text>
  <text x="84" y="290" fill="#86EFAC" font-size="30" font-weight="900" font-family="Verdana, sans-serif">Answer: x^3 + 6x^2 + 12x + 8</text>
</svg>
