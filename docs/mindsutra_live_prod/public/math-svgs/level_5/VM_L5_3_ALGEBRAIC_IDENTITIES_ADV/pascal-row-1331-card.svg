<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#0F172A" />
  <rect x="0" y="0" width="800" height="8" fill="#F97316" />
  <text x="40" y="44" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">(a +/- b)^3 and Pascal 1-3-3-1</text>
  <text x="40" y="74" fill="#FDBA74" font-size="16" font-weight="600" font-family="Verdana, sans-serif">Four terms, same coefficients every time</text>
  <rect x="58" y="120" width="684" height="208" rx="18" fill="#111827" stroke="#475569" stroke-width="2" />
  <text x="106" y="172" fill="#FDE68A" font-size="40" font-weight="900" font-family="Verdana, sans-serif">1   3   3   1</text>
  <text x="104" y="226" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">(x + 2)^3 = x^3 + 3x^2(2) + 3x(2^2) + 2^3</text>
  <text x="104" y="278" fill="#86EFAC" font-size="30" font-weight="900" font-family="Verdana, sans-serif">x^3 + 6x^2 + 12x + 8</text>
</svg>
