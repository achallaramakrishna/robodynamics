<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>

  <rect width="800" height="400" rx="18" fill="url(#bg)" />
  <rect x="0" y="0" width="800" height="8" fill="#FB7185" />

  <text x="40" y="48" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">
    Simultaneous Equations
  </text>
  <text x="40" y="78" fill="#C4B5FD" font-size="16" font-weight="600" font-family="Verdana, sans-serif">
    Same denominator, two cross-multiplied numerators
  </text>

  <rect x="36" y="102" width="250" height="112" rx="18" fill="#1E1B4B" stroke="#A78BFA" stroke-width="2" />
  <text x="60" y="148" fill="#F8FAFC" font-size="30" font-weight="700" font-family="Verdana, sans-serif">2x + 3y = 7</text>
  <text x="60" y="188" fill="#F8FAFC" font-size="30" font-weight="700" font-family="Verdana, sans-serif">x + 2y = 4</text>

  <rect x="314" y="102" width="450" height="112" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
  <text x="338" y="138" fill="#E2E8F0" font-size="22" font-weight="800" font-family="Verdana, sans-serif">Label the coefficients</text>
  <text x="338" y="172" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">a₁=2  b₁=3  c₁=7</text>
  <text x="338" y="202" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">a₂=1  b₂=2  c₂=4</text>

  <rect x="36" y="236" width="222" height="126" rx="18" fill="#3F3F46" stroke="#FDE68A" stroke-width="2" />
  <text x="56" y="270" fill="#FEF3C7" font-size="22" font-weight="800" font-family="Verdana, sans-serif">Step 1: D</text>
  <text x="56" y="304" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">D = a₁b₂ − a₂b₁</text>
  <text x="56" y="336" fill="#FDE68A" font-size="28" font-weight="800" font-family="Verdana, sans-serif">2×2 − 1×3 = 1</text>

  <rect x="282" y="236" width="232" height="126" rx="18" fill="#0F3D2E" stroke="#34D399" stroke-width="2" />
  <text x="302" y="270" fill="#D1FAE5" font-size="22" font-weight="800" font-family="Verdana, sans-serif">Step 2: x</text>
  <text x="302" y="304" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">(c₁b₂ − c₂b₁) / D</text>
  <text x="302" y="336" fill="#86EFAC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">(7×2 − 4×3)/1 = 2</text>

  <rect x="538" y="236" width="226" height="126" rx="18" fill="#3B0824" stroke="#F472B6" stroke-width="2" />
  <text x="558" y="270" fill="#FBCFE8" font-size="22" font-weight="800" font-family="Verdana, sans-serif">Step 3: y</text>
  <text x="558" y="304" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">(a₁c₂ − a₂c₁) / D</text>
  <text x="558" y="336" fill="#F9A8D4" font-size="28" font-weight="800" font-family="Verdana, sans-serif">(2×4 − 1×7)/1 = 1</text>

  <text x="634" y="386" fill="#F8FAFC" font-size="20" font-weight="700" font-family="Verdana, sans-serif">Solution: (x, y) = (2, 1)</text>
</svg>
