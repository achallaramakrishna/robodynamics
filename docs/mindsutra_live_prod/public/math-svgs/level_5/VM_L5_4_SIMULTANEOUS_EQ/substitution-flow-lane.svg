<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#111827" />
  <rect x="0" y="0" width="800" height="8" fill="#22C55E" />

  <text x="40" y="46" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">
    Guided Practice: x + y = 5, 2x − y = 4
  </text>
  <text x="40" y="76" fill="#BBF7D0" font-size="16" font-weight="600" font-family="Verdana, sans-serif">
    Start with D, then build x cleanly
  </text>

  <rect x="40" y="108" width="190" height="236" rx="18" fill="#052E16" stroke="#4ADE80" stroke-width="2" />
  <text x="60" y="144" fill="#DCFCE7" font-size="24" font-weight="800" font-family="Verdana, sans-serif">Step 1</text>
  <text x="60" y="184" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">a₁=1  b₁=1</text>
  <text x="60" y="216" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">a₂=2  b₂=−1</text>
  <text x="60" y="266" fill="#FDE68A" font-size="26" font-weight="800" font-family="Verdana, sans-serif">D = 1×(−1) − 2×1</text>
  <text x="60" y="302" fill="#FDE68A" font-size="30" font-weight="900" font-family="Verdana, sans-serif">D = −3</text>

  <rect x="254" y="108" width="236" height="236" rx="18" fill="#172554" stroke="#60A5FA" stroke-width="2" />
  <text x="274" y="144" fill="#DBEAFE" font-size="24" font-weight="800" font-family="Verdana, sans-serif">Step 2</text>
  <text x="274" y="184" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">x = (5×−1 − 4×1)/−3</text>
  <text x="274" y="224" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">= (−5 − 4)/−3</text>
  <text x="274" y="268" fill="#93C5FD" font-size="30" font-weight="900" font-family="Verdana, sans-serif">x = 3</text>

  <rect x="514" y="108" width="246" height="236" rx="18" fill="#3F3F46" stroke="#FBBF24" stroke-width="2" />
  <text x="534" y="144" fill="#FEF3C7" font-size="24" font-weight="800" font-family="Verdana, sans-serif">Quick check</text>
  <text x="534" y="184" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">x + y = 5</text>
  <text x="534" y="216" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">3 + y = 5</text>
  <text x="534" y="252" fill="#FDE68A" font-size="30" font-weight="900" font-family="Verdana, sans-serif">y = 2</text>
  <text x="534" y="298" fill="#FDE68A" font-size="20" font-weight="800" font-family="Verdana, sans-serif">So the guided answer for x is 3.</text>
</svg>
