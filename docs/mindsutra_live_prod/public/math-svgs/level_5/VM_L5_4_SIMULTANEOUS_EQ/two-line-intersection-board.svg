<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#0F172A" />
  <rect x="0" y="0" width="800" height="8" fill="#F97316" />

  <text x="40" y="46" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">
    Worked Example: 2x + 3y = 7, x + 2y = 4
  </text>
  <text x="40" y="76" fill="#CBD5E1" font-size="16" font-weight="600" font-family="Verdana, sans-serif">
    Determinant first, then x and y
  </text>

  <rect x="38" y="106" width="250" height="236" rx="18" fill="#111827" stroke="#38BDF8" stroke-width="2" />
  <text x="60" y="142" fill="#F8FAFC" font-size="26" font-weight="800" font-family="Verdana, sans-serif">Labels</text>
  <text x="60" y="182" fill="#E2E8F0" font-size="24" font-weight="700" font-family="Verdana, sans-serif">a₁=2  b₁=3  c₁=7</text>
  <text x="60" y="218" fill="#E2E8F0" font-size="24" font-weight="700" font-family="Verdana, sans-serif">a₂=1  b₂=2  c₂=4</text>
  <text x="60" y="272" fill="#FDE68A" font-size="26" font-weight="800" font-family="Verdana, sans-serif">D = 2×2 − 1×3</text>
  <text x="60" y="306" fill="#FDE68A" font-size="30" font-weight="900" font-family="Verdana, sans-serif">D = 1</text>

  <rect x="310" y="106" width="218" height="236" rx="18" fill="#0F3D2E" stroke="#34D399" stroke-width="2" />
  <text x="332" y="142" fill="#D1FAE5" font-size="26" font-weight="800" font-family="Verdana, sans-serif">Solve x</text>
  <text x="332" y="186" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">x = (c₁b₂ − c₂b₁)/D</text>
  <text x="332" y="226" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">= (7×2 − 4×3)/1</text>
  <text x="332" y="266" fill="#86EFAC" font-size="30" font-weight="900" font-family="Verdana, sans-serif">= (14 − 12)/1 = 2</text>

  <rect x="550" y="106" width="212" height="236" rx="18" fill="#3B0824" stroke="#F472B6" stroke-width="2" />
  <text x="572" y="142" fill="#FBCFE8" font-size="26" font-weight="800" font-family="Verdana, sans-serif">Solve y</text>
  <text x="572" y="186" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">y = (a₁c₂ − a₂c₁)/D</text>
  <text x="572" y="226" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">= (2×4 − 1×7)/1</text>
  <text x="572" y="266" fill="#F9A8D4" font-size="30" font-weight="900" font-family="Verdana, sans-serif">= (8 − 7)/1 = 1</text>

  <text x="40" y="378" fill="#F8FAFC" font-size="22" font-weight="800" font-family="Verdana, sans-serif">
    Final answer: x = 2, y = 1
  </text>
</svg>
