  <text x="577" y="270" fill="#F8FAFC" font-size="20" font-weight="800" font-family="Verdana, sans-serif">A×E</text>
  <text x="82" y="322" fill="#FDE68A" font-size="20" font-weight="800" font-family="Verdana, sans-serif">Middle column is the longest.</text>
