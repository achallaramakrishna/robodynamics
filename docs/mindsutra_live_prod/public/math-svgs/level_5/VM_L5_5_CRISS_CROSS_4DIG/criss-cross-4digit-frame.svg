  <rect x="474" y="236" width="68" height="54" rx="10" fill="#1E293B" stroke="#64748B" />
  <rect x="552" y="236" width="68" height="54" rx="10" fill="#1E293B" stroke="#64748B" />
  <text x="99" y="270" fill="#F8FAFC" font-size="20" font-weight="800" font-family="Verdana, sans-serif">D×H</text>
  <text x="171" y="270" fill="#F8FAFC" font-size="20" font-weight="800" font-family="Verdana, sans-serif">2 terms</text>
  <text x="249" y="270" fill="#F8FAFC" font-size="20" font-weight="800" font-family="Verdana, sans-serif">3 terms</text>
