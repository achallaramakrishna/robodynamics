  <text x="168" y="194" fill="#CBD5E1" font-size="34" font-weight="700" font-family="Verdana, sans-serif">1 1 1 1</text>
  <line x1="146" y1="156" x2="342" y2="156" stroke="#38BDF8" stroke-width="3" />
  <text x="410" y="148" fill="#E2E8F0" font-size="22" font-weight="800" font-family="Verdana, sans-serif">Columns from right to left</text>
  <text x="410" y="188" fill="#FDE68A" font-size="24" font-weight="800" font-family="Verdana, sans-serif">C1   C2   C3   C4   C5   C6   C7</text>
  <rect x="84" y="236" width="68" height="54" rx="10" fill="#1E293B" stroke="#64748B" />
