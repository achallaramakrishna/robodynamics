  <text x="40" y="44" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">4-Digit x 4-Digit in 7 Columns</text>
  <text x="40" y="74" fill="#FDBA74" font-size="16" font-weight="600" font-family="Verdana, sans-serif">Example frame: 1234 x 1111</text>
  <rect x="48" y="102" width="704" height="236" rx="18" fill="#111827" stroke="#475569" stroke-width="2" />
