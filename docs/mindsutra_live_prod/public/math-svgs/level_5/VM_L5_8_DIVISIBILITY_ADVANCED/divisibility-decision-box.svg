<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052E16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="800" height="400" rx="18" fill="url(#bg)" />
  <rect x="0" y="0" width="800" height="8" fill="#22C55E" />

  <text x="40" y="48" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">
    Divisibility Tests: 7, 11, 13
  </text>
  <text x="40" y="78" fill="#BBF7D0" font-size="16" font-weight="600" font-family="Verdana, sans-serif">
    Three quick checks, no long division
  </text>

  <rect x="36" y="110" width="228" height="218" rx="18" fill="#14532D" stroke="#86EFAC" stroke-width="2" />
  <text x="58" y="146" fill="#ECFDF5" font-size="26" font-weight="800" font-family="Verdana, sans-serif">Rule for 7</text>
  <text x="58" y="182" fill="#F8FAFC" font-size="20" font-weight="700" font-family="Verdana, sans-serif">Rest − 2×last</text>
  <text x="58" y="214" fill="#D1FAE5" font-size="18" font-weight="700" font-family="Verdana, sans-serif">1001 → 100 − 2×1</text>
  <text x="58" y="244" fill="#FDE68A" font-size="24" font-weight="800" font-family="Verdana, sans-serif">98 → yes</text>
  <text x="58" y="282" fill="#BBF7D0" font-size="18" font-weight="700" font-family="Verdana, sans-serif">75 → 7 − 2×5 = −3</text>
  <text x="58" y="310" fill="#FCA5A5" font-size="22" font-weight="800" font-family="Verdana, sans-serif">not divisible</text>

  <rect x="286" y="110" width="228" height="218" rx="18" fill="#1E1B4B" stroke="#C4B5FD" stroke-width="2" />
  <text x="308" y="146" fill="#F5F3FF" font-size="26" font-weight="800" font-family="Verdana, sans-serif">Rule for 11</text>
  <text x="308" y="182" fill="#F8FAFC" font-size="20" font-weight="700" font-family="Verdana, sans-serif">Alternating sum</text>
  <text x="308" y="214" fill="#DDD6FE" font-size="18" font-weight="700" font-family="Verdana, sans-serif">132 → 1 − 3 + 2</text>
  <text x="308" y="244" fill="#FDE68A" font-size="24" font-weight="800" font-family="Verdana, sans-serif">0 → yes</text>
  <text x="308" y="282" fill="#DDD6FE" font-size="18" font-weight="700" font-family="Verdana, sans-serif">121 → 1 − 2 + 1</text>
  <text x="308" y="310" fill="#86EFAC" font-size="22" font-weight="800" font-family="Verdana, sans-serif">0 → divisible</text>

  <rect x="536" y="110" width="228" height="218" rx="18" fill="#3F3F46" stroke="#FDE68A" stroke-width="2" />
  <text x="558" y="146" fill="#FFFBEB" font-size="26" font-weight="800" font-family="Verdana, sans-serif">Rule for 13</text>
  <text x="558" y="182" fill="#F8FAFC" font-size="20" font-weight="700" font-family="Verdana, sans-serif">Rest + 4×last</text>
  <text x="558" y="214" fill="#FEF3C7" font-size="18" font-weight="700" font-family="Verdana, sans-serif">286 → 28 + 4×6</text>
  <text x="558" y="244" fill="#FDE68A" font-size="24" font-weight="800" font-family="Verdana, sans-serif">52 → yes</text>
  <text x="558" y="282" fill="#FEF3C7" font-size="18" font-weight="700" font-family="Verdana, sans-serif">170 → 17 + 4×0</text>
  <text x="558" y="310" fill="#FCA5A5" font-size="22" font-weight="800" font-family="Verdana, sans-serif">17 → no</text>

  <text x="40" y="368" fill="#F8FAFC" font-size="18" font-weight="700" font-family="Verdana, sans-serif">
    Decision tip: reduce to a small number, then test that small result.
  </text>
</svg>
