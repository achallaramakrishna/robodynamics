<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#111827" />
  <rect x="0" y="0" width="800" height="8" fill="#A78BFA" />
  <text x="40" y="46" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">Divisibility by 11</text>
  <text x="40" y="76" fill="#DDD6FE" font-size="16" font-weight="600" font-family="Verdana, sans-serif">Alternating sum of digits</text>

  <rect x="40" y="110" width="320" height="230" rx="18" fill="#1E1B4B" stroke="#C4B5FD" stroke-width="2" />
  <text x="60" y="148" fill="#F5F3FF" font-size="24" font-weight="800" font-family="Verdana, sans-serif">Rule</text>
  <text x="60" y="190" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">Odd-position digits</text>
  <text x="60" y="222" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">minus even-position digits</text>
  <text x="60" y="262" fill="#FDE68A" font-size="24" font-weight="800" font-family="Verdana, sans-serif">If the result is 0 or a multiple of 11, it works.</text>

  <rect x="388" y="110" width="372" height="230" rx="18" fill="#0F172A" stroke="#94A3B8" stroke-width="2" />
  <text x="408" y="148" fill="#E2E8F0" font-size="24" font-weight="800" font-family="Verdana, sans-serif">Example: 132</text>
  <text x="408" y="192" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Verdana, sans-serif">1 − 3 + 2 = 0</text>
  <text x="408" y="228" fill="#86EFAC" font-size="28" font-weight="900" font-family="Verdana, sans-serif">0 means divisible by 11</text>
  <text x="408" y="268" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Verdana, sans-serif">So 132 ÷ 11 = 12</text>
  <text x="408" y="306" fill="#FDE68A" font-size="20" font-weight="800" font-family="Verdana, sans-serif">Also: 121 → 1 − 2 + 1 = 0</text>
</svg>
