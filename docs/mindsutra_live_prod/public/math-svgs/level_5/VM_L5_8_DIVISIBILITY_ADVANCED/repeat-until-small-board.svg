<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="18" fill="#0F172A" />
  <rect x="0" y="0" width="800" height="8" fill="#22C55E" />
  <text x="40" y="44" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">Guided Practice: 132 ÷ 11</text>
  <text x="40" y="74" fill="#BBF7D0" font-size="16" font-weight="600" font-family="Verdana, sans-serif">Use the alternating-sum test</text>
  <rect x="52" y="106" width="696" height="236" rx="18" fill="#111827" stroke="#475569" stroke-width="2" />
  <text x="84" y="154" fill="#E2E8F0" font-size="24" font-weight="800" font-family="Verdana, sans-serif">Digits: 1, 3, 2</text>
  <text x="84" y="206" fill="#F8FAFC" font-size="28" font-weight="800" font-family="Verdana, sans-serif">Alternating sum = 1 − 3 + 2</text>
  <text x="84" y="256" fill="#FDE68A" font-size="34" font-weight="900" font-family="Verdana, sans-serif">= 0</text>
  <text x="84" y="310" fill="#86EFAC" font-size="24" font-weight="800" font-family="Verdana, sans-serif">0 is divisible by 11, so 132 is divisible by 11.</text>
</svg>
