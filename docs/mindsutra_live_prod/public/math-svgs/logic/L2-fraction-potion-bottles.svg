<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <title>L2 Ratio Potion Lab - Olympiad Island Lab</title>
  
  <rect width="800" height="600" fill="#F8FAFC" />
  
  {/* Lab Background */}
  <rect y="400" width="800" height="200" fill="#334155" />
  <path d="M0,400 Q400,380 800,400" stroke="#1E293B" stroke-width="4" fill="none" />

  {/* Potion Bottles */}
  <g id="bottles" transform="translate(100, 100)">
    {/* Bottle A */}
    <g id="bottle-a">
       <rect x="0" y="50" width="120" height="250" rx="15" fill="none" stroke="#64748B" stroke-width="4" />
       {/* Liquid Fill */}
       <rect x="4" y="175" width="112" height="121" rx="10" fill="#38BDF8" opacity="0.8">
          <animate attributeName="height" from="0" to="121" dur="1s" fill="freeze" />
          <animate attributeName="y" from="296" to="175" dur="1s" fill="freeze" />
       </rect>
       <text x="60" y="325" text-anchor="middle" font-weight="900" fill="#334155">1 / 2</text>
    </g>

    {/* Bottle B */}
    <g id="bottle-b" transform="translate(200, 0)">
       <rect x="0" y="50" width="120" height="250" rx="15" fill="none" stroke="#64748B" stroke-width="4" />
       <rect x="4" y="235" width="112" height="61" rx="10" fill="#F472B6" opacity="0.8">
          <animate attributeName="height" from="0" to="61" dur="1s" fill="freeze" />
          <animate attributeName="y" from="296" to="235" dur="1s" fill="freeze" />
       </rect>
       <text x="60" y="325" text-anchor="middle" font-weight="900" fill="#334155">1 / 4</text>
    </g>

    {/* Bottle C */}
    <g id="bottle-c" transform="translate(400, 0)">
       <rect x="0" y="50" width="120" height="250" rx="15" fill="none" stroke="#64748B" stroke-width="4" />
       <rect x="4" y="54" width="112" height="242" rx="10" fill="#FACC15" opacity="0.8">
          <animate attributeName="height" from="0" to="242" dur="1s" fill="freeze" />
          <animate attributeName="y" from="296" to="54" dur="1s" fill="freeze" />
       </rect>
       <text x="60" y="325" text-anchor="middle" font-weight="900" fill="#334155">1 / 1 (FULL)</text>
    </g>
  </g>

  {/* Recipe Card */}
  <g id="recipe" transform="translate(450, 420)">
     <rect width="320" height="150" rx="20" fill="#FDE68A" stroke="#B45309" stroke-width="2" />
     <path d="M0,30 L320,30" stroke="#B45309" stroke-width="2" fill="none" />
     <text x="160" y="20" text-anchor="middle" font-weight="900" fill="#B45309">RECIPE SCROLL</text>
     <text x="20" y="60" font-size="14" fill="#92400E">1 Bottle = 3 Spoons Syrup</text>
     <text x="20" y="90" font-size="14" font-weight="900" fill="#B45309">HOW MANY SPOONS FOR 4 BOTTLES?</text>
     
     <g transform="translate(50, 110)">
        <circle r="15" fill="white" stroke="#B45309" />
        <text y="5" text-anchor="middle" font-weight="900">12</text>
     </g>
  </g>

  {/* Lab Bubbles */}
  <g id="bubbles">
     <circle cx="150" cy="450" r="5" fill="white" opacity="0.5">
        <animate attributeName="cy" from="450" to="300" dur="2s" repeatCount="indefinite" />
     </circle>
     <circle cx="350" cy="480" r="8" fill="white" opacity="0.3">
        <animate attributeName="cy" from="480" to="250" dur="3s" repeatCount="indefinite" />
     </circle>
  </g>

  <text x="400" y="50" text-anchor="middle" font-size="28" font-weight="900" fill="#1E3A8A">Olympiad Island Potion Lab</text>
</svg>
