<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <title>L3 Code Matrix Grid - Sky Academy Terminal</title>
  
  <rect width="800" height="600" fill="#0C4A6E" />
  
  {/* Neon Border */}
  <rect x="20" y="20" width="760" height="560" rx="20" fill="none" stroke="#7DD3FC" stroke-width="2" opacity="0.5" />
  
  {/* Matrix Grid */}
  <g id="matrix" transform="translate(150, 100)">
     {/* Grid Background */}
     <rect width="400" height="400" rx="10" fill="#0F172A" stroke="#7DD3FC" stroke-width="2" />
     
     {/* Rows & Columns Lines */}
     <path d="M80,0 L80,400 M160,0 L160,400 M240,0 L240,400 M320,0 L320,400" stroke="#1E293B" stroke-width="1" />
     <path d="M0,80 L400,80 M0,160 L400,160 M0,240 L400,240 M0,320 L400,320" stroke="#1E293B" stroke-width="1" />

     {/* Labels */}
     <g font-size="20" font-weight="900" fill="#7DD3FC" opacity="0.6">
        <text x="40" y="-15" text-anchor="middle">1</text>
        <text x="120" y="-15" text-anchor="middle">2</text>
        <text x="200" y="-15" text-anchor="middle">3</text>
        <text x="280" y="-15" text-anchor="middle">4</text>
        <text x="360" y="-15" text-anchor="middle">5</text>
        
        <text x="-25" y="45" text-anchor="middle">1</text>
        <text x="-25" y="125" text-anchor="middle">2</text>
        <text x="-25" y="205" text-anchor="middle">3</text>
        <text x="-25" y="285" text-anchor="middle">4</text>
        <text x="-25" y="365" text-anchor="middle">5</text>
     </g>

     {/* Sample Letters (Row 1-5, Col 1-5) */}
     <g font-size="24" font-weight="900" fill="white">
        <text x="40" y="48" text-anchor="middle" id="cell-11">A</text>
        <text x="120" y="48" text-anchor="middle">B</text>
        <text x="200" y="48" text-anchor="middle" id="cell-13">C</text>
        <text x="280" y="48" text-anchor="middle" id="cell-14">D</text>
        <text x="360" y="48" text-anchor="middle">E</text>

        <text x="40" y="208" text-anchor="middle">K</text>
        <text x="280" y="208" text-anchor="middle" id="cell-34">N</text>
        <text x="360" y="208" text-anchor="middle" id="cell-35">O</text>

        <text x="200" y="288" text-anchor="middle" id="cell-43">S</text>
        <text x="360" y="368" text-anchor="middle" id="cell-55">T</text>
     </g>
  </g>

  {/* Decoding Panel */}
  <g transform="translate(570, 100)">
     <rect width="200" height="250" rx="15" fill="#1E293B" stroke="#7DD3FC" />
     <text x="100" y="30" text-anchor="middle" fill="#7DD3FC" font-size="14" font-weight="900">SKY TERMINAL</text>
     <path d="M20,50 L180,50" stroke="#7DD3FC" opacity="0.3" />
     <text x="20" y="80" fill="#94A3B8" font-size="12">INPUT CODE:</text>
     <text x="20" y="110" fill="white" font-size="20" font-weight="900">14-34-33-45</text>
     
     <rect x="20" y="150" width="160" height="60" rx="5" fill="#0C4A6E" />
     <text x="100" y="175" text-anchor="middle" fill="#7DD3FC" font-size="12">PASSWORD:</text>
     <text x="100" y="200" text-anchor="middle" fill="white" font-size="22" font-weight="900" opacity="0.3">_ _ _ _</text>
  </g>

  {/* Scholar Badge */}
  <g transform="translate(670, 480)">
     <circle r="40" fill="rgba(125, 211, 252, 0.1)" stroke="#7DD3FC" />
     <text text-anchor="middle" y="5" fill="#FACC15" font-size="10" font-weight="900">CODE MASTER</text>
  </g>

  <text x="400" y="50" text-anchor="middle" font-size="28" font-weight="900" fill="white">Matrix Decode Mission</text>
</svg>
