<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <title>L3 3D Pillar Cube - Orientation Trials</title>
  
  <rect width="800" height="600" fill="#0C4A6E" />
  
  {/* Isometric Cube Visual */}
  <g id="isometric-cube" transform="translate(400, 300)">
     {/* Top Face */}
     <path id="face-top" d="M0,-100 L120,-40 L0,20 L-120,-40 Z" fill="#7DD3FC" stroke="#0C4A6E" stroke-width="2" />
     <text y="-40" text-anchor="middle" font-size="40" font-weight="900" fill="#0C4A6E">4</text>

     {/* Front-Left Face */}
     <path id="face-left" d="M-120,-40 L0,20 L0,140 L-120,80 Z" fill="#38BDF8" stroke="#0C4A6E" stroke-width="2" />
     <text x="-60" y="60" text-anchor="middle" font-size="40" font-weight="900" fill="#0C4A6E">2</text>

     {/* Front-Right Face */}
     <path id="face-right" d="M120,-40 L0,20 L0,140 L120,80 Z" fill="#0EA5E9" stroke="#0C4A6E" stroke-width="2" />
     <text x="60" y="60" text-anchor="middle" font-size="40" font-weight="900" fill="#0C4A6E">1</text>
  </g>

  {/* Rotation Controls */}
  <g transform="translate(50, 450)">
     <rect width="200" height="120" rx="20" fill="#1E293B" stroke="#7DD3FC" />
     <text x="100" y="30" text-anchor="middle" fill="#7DD3FC" font-size="14" font-weight="900">ROTATE PILLAR</text>
     
     <g transform="translate(40, 60)" cursor="pointer">
        <circle r="20" fill="#334155" />
        <path d="M-10,0 L10,0 M0,-10 L-10,0 L0,10" stroke="white" fill="none" />
        <text x="0" y="45" text-anchor="middle" fill="#94A3B8" font-size="10">LEFT</text>
     </g>

     <g transform="translate(160, 60)" cursor="pointer">
        <circle r="20" fill="#334155" />
        <path d="M-10,0 L10,0 M0,-10 L10,0 L0,10" stroke="white" fill="none" />
        <text x="0" y="45" text-anchor="middle" fill="#94A3B8" font-size="10">RIGHT</text>
     </g>
  </g>

  {/* Mission Card */}
  <g transform="translate(300, 450)">
     <rect width="450" height="120" rx="20" fill="#0F172A" stroke="#FACC15" stroke-width="2" />
     <text x="20" y="40" fill="#FACC15" font-size="16" font-weight="900">MISSION: IDENTIFY THE BOTTOM FACE</text>
     <text x="20" y="70" fill="#94A3B8" font-size="14">Rule: This is a STANDARD DIE.</text>
     <text x="20" y="95" fill="white" font-size="14" font-weight="900">Opposite faces sum to 7. Top face = 4.</text>
  </g>

  <text x="400" y="50" text-anchor="middle" font-size="28" font-weight="900" fill="white">Pillar Cube Orientation</text>
</svg>
