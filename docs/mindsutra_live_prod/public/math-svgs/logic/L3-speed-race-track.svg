<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <title>L3 Hyperspace Tracker - Sky Race Logic</title>
  
  <rect width="800" height="600" fill="#0C4A6E" />
  
  {/* Race Track Paths */}
  <g id="tracks" transform="translate(100, 150)">
     {/* Lane 1 */}
     <rect width="600" height="40" rx="20" fill="#1E293B" stroke="#7DD3FC" stroke-width="2" />
     <path d="M50,20 L550,20" stroke="#7DD3FC" stroke-dasharray="10,10" opacity="0.3" />
     
     {/* Lane 2 */}
     <rect y="100" width="600" height="40" rx="20" fill="#1E293B" stroke="#F472B6" stroke-width="2" />
     <path d="M50,120 L550,120" stroke="#F472B6" stroke-dasharray="10,10" opacity="0.3" />
     
     {/* Checkpoints */}
     <line x1="150" y1="-20" x2="150" y2="160" stroke="white" stroke-width="2" stroke-dasharray="5,5" opacity="0.2" />
     <line x1="300" y1="-20" x2="300" y2="160" stroke="white" stroke-width="2" stroke-dasharray="5,5" opacity="0.2" />
     <line x1="450" y1="-20" x2="450" y2="160" stroke="white" stroke-width="2" stroke-dasharray="5,5" opacity="0.2" />

     {/* Racer A (Faster) */}
     <g id="racer-a" transform="translate(300, 20)">
        <path d="M-20,-10 L20,0 L-20,10 Z" fill="#7DD3FC" />
        <circle r="5" fill="#FACC15">
           <animate attributeName="opacity" values="1;0.2;1" dur="0.2s" repeatCount="indefinite" />
        </circle>
        <text y="-25" text-anchor="middle" fill="#7DD3FC" font-size="10" font-weight="900">PILOT A: 50 km/h</text>
     </g>

     {/* Racer B (Slower) */}
     <g id="racer-b" transform="translate(150, 120)">
        <path d="M-20,-10 L20,0 L-20,10 Z" fill="#F472B6" />
        <circle r="5" fill="#FACC15">
           <animate attributeName="opacity" values="1;0.2;1" dur="0.4s" repeatCount="indefinite" />
        </circle>
        <text y="35" text-anchor="middle" fill="#F472B6" font-size="10" font-weight="900">PILOT B: 25 km/h</text>
     </g>
  </g>

  {/* Analytics Dashboard */}
  <g transform="translate(100, 450)">
     <rect width="600" height="120" rx="20" fill="#0F172A" stroke="#7DD3FC" />
     <text x="300" y="30" text-anchor="middle" fill="#7DD3FC" font-size="16" font-weight="900">RACE COMMAND ANALYTICS</text>
     
     <g transform="translate(50, 60)">
        <text fill="#94A3B8" font-size="12">DISTANCE: 100 km</text>
        <text y="25" fill="white" font-size="14" font-weight="900">TIME TO TARGET:</text>
     </g>
     
     <g transform="translate(350, 60)">
        <rect width="100" height="40" rx="5" fill="#1E293B" />
        <text x="50" y="25" text-anchor="middle" fill="#7DD3FC" font-size="20" font-weight="900">2 Hr</text>
        <text x="50" y="55" text-anchor="middle" fill="#94A3B8" font-size="10">RACER A</text>
     </g>

     <g transform="translate(470, 60)">
        <rect width="100" height="40" rx="5" fill="#1E293B" />
        <text x="50" y="25" text-anchor="middle" fill="#F472B6" font-size="20" font-weight="900">4 Hr</text>
        <text x="50" y="55" text-anchor="middle" fill="#94A3B8" font-size="10">RACER B</text>
     </g>
  </g>

  <text x="400" y="80" text-anchor="middle" font-size="28" font-weight="900" fill="white">Hyperspace Speed Trials</text>
</svg>
