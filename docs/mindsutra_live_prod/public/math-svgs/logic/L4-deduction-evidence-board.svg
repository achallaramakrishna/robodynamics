<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <title>L4 Evidence Board - Campus Deduction Trial</title>
  
  <rect width="800" height="600" fill="#0F172A" />
  
  {/* Glass Board Background */}
  <rect x="50" y="80" width="700" height="420" rx="15" fill="#1E293B" stroke="#334155" stroke-width="4" opacity="0.8" />
  
  {/* String Thread Layer (Sample link) */}
  <path d="M150,200 Q400,180 650,200" stroke="#EF4444" stroke-width="2" fill="none" stroke-dasharray="5,5" opacity="0.6">
     <animate attributeName="stroke-dashoffset" from="100" to="0" dur="5s" repeatCount="indefinite" />
  </path>

  {/* Clue Panels (Pinned Cards) */}
  <g id="clue-cards">
     {/* Card 1 */}
     <g transform="translate(80, 120)">
        <rect width="180" height="80" rx="5" fill="#FDE68A" stroke="#B45309" stroke-width="2" />
        <path d="M90,0 L90,-20" stroke="#EF4444" stroke-width="2" />
        <circle cx="90" cy="0" r="4" fill="#EF4444" />
        <text x="10" y="30" font-size="12" font-weight="900" fill="#92400E">CLUE #1</text>
        <text x="10" y="55" font-size="11" fill="#78350F">B is not at the end.</text>
     </g>

     {/* Card 2 */}
     <g transform="translate(310, 100)">
        <rect width="180" height="80" rx="5" fill="#FDE68A" stroke="#B45309" stroke-width="2" />
        <circle cx="90" cy="0" r="4" fill="#EF4444" />
        <text x="10" y="30" font-size="12" font-weight="900" fill="#92400E">CLUE #2</text>
        <text x="10" y="55" font-size="11" fill="#78350F">A is not in the middle.</text>
     </g>

     {/* Card 3 */}
     <g transform="translate(540, 120)">
        <rect width="180" height="80" rx="5" fill="#FDE68A" stroke="#B45309" stroke-width="2" />
        <circle cx="90" cy="0" r="4" fill="#EF4444" />
        <text x="10" y="30" font-size="12" font-weight="900" fill="#92400E">CLUE #3</text>
        <text x="10" y="55" font-size="11" fill="#78350F">C is far left.</text>
     </g>
  </g>

  {/* Elimination Grid (Interactive) */}
  <g id="logic-grid" transform="translate(150, 250)">
     <rect width="500" height="150" fill="#0F172A" stroke="#334155" />
     <path d="M166,0 L166,150 M333,0 L333,150" stroke="#334155" />
     
     <g font-size="14" font-weight="900" fill="#60A5FA" text-anchor="middle">
        <text x="83" y="180">POS 1</text>
        <text x="250" y="180">POS 2</text>
        <text x="416" y="180">POS 3</text>
     </g>

     {/* Elimination Cross (Sample) */}
     <g id="cross-sample" transform="translate(250, 75)">
        <line x1="-20" y1="-20" x2="20" y2="20" stroke="#EF4444" stroke-width="4" />
        <line x1="20" y1="-20" x2="-20" y2="20" stroke="#EF4444" stroke-width="4" />
        <text y="50" text-anchor="middle" fill="#EF4444" font-size="10">IMPOSSIBLE</text>
     </g>
  </g>

  {/* Verdict Stamp FX */}
  <g transform="translate(680, 520)" opacity="0.4">
     <circle r="40" fill="none" stroke="#10B981" stroke-width="4" />
     <text text-anchor="middle" y="5" fill="#10B981" font-size="12" font-weight="900">VERDICT</text>
  </g>

  <text x="400" y="50" text-anchor="middle" font-size="28" font-weight="900" fill="white">Campus Evidence Board</text>
</svg>
