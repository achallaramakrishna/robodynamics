<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">Alphabet Test</title>
  <desc id="desc">Colorful alphabet blocks showing missing-letter reasoning.</desc>
  <rect width="480" height="320" rx="28" fill="#EEF6FF"/>
  <circle cx="88" cy="82" r="44" fill="#93C5FD"/>
  <circle cx="392" cy="76" r="36" fill="#FDE68A"/>
  <rect x="40" y="120" width="400" height="148" rx="24" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="4"/>
  <text x="72" y="84" font-family="Verdana, sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">A B C</text>
  <rect x="76" y="158" width="72" height="72" rx="16" fill="#60A5FA"/>
  <rect x="164" y="158" width="72" height="72" rx="16" fill="#34D399"/>
  <rect x="252" y="158" width="72" height="72" rx="16" fill="#FBBF24"/>
  <rect x="340" y="158" width="72" height="72" rx="16" fill="#FCA5A5" stroke="#EF4444" stroke-width="4" stroke-dasharray="8 8"/>
  <text x="101" y="205" font-family="Verdana, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">D</text>
  <text x="190" y="205" font-family="Verdana, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">E</text>
  <text x="278" y="205" font-family="Verdana, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">F</text>
  <text x="367" y="205" font-family="Verdana, sans-serif" font-size="34" font-weight="700" fill="#EF4444">?</text>
  <text x="128" y="286" font-family="Verdana, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">Find the missing letter</text>
</svg>
