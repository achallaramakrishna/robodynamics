  <rect x="34" y="34" width="412" height="252" rx="24" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="4"/>
  <circle cx="142" cy="154" r="72" fill="#EFF6FF" stroke="#60A5FA" stroke-width="6"/>
  <circle cx="142" cy="154" r="6" fill="#1E3A8A"/>
  <path d="M142 154V112" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round"/>
  <path d="M142 154L178 170" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round"/>
  <text x="136" y="98" font-family="Verdana, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A">12</text>
  <text x="197" y="159" font-family="Verdana, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A">3</text>
