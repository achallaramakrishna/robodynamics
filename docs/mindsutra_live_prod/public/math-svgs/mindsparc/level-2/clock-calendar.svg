  <text x="270" y="202" font-family="Verdana, sans-serif" font-size="16" fill="#78350F">Sun   ?</text>
  <text x="112" y="278" font-family="Verdana, sans-serif" font-size="20" font-weight="700" fill="#9D174D">Read time and day clues</text>
