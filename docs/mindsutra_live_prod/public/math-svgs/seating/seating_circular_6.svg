  <circle cx="100" cy="28"  r="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <circle cx="165" cy="58"  r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="165" cy="142" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="100" cy="172" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="35"  cy="142" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
