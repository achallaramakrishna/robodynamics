<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/><stop offset="100%" stop-color="#060D1A"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="520" height="220" fill="url(#bg)" rx="12"/>
  <rect width="520" height="220" fill="none" stroke="#1E293B" stroke-width="1.5" rx="12"/>

  <text x="260" y="22" font-size="11" font-weight="800" fill="#E91E87" text-anchor="middle" letter-spacing="1">COMPLEMENT SUBTRACTION PANEL</text>

  <!-- Title row -->
  <text x="80" y="46" font-size="10" fill="#475569" text-anchor="middle">Digit</text>
  <text x="180" y="46" font-size="10" fill="#475569" text-anchor="middle">Rule</text>
  <text x="280" y="46" font-size="10" fill="#475569" text-anchor="middle">Working</text>
  <text x="400" y="46" font-size="10" fill="#475569" text-anchor="middle">Complement</text>
  <text x="480" y="46" font-size="10" fill="#475569" text-anchor="middle">Type</text>
  <!-- Header line -->
  <line x1="30" y1="52" x2="510" y2="52" stroke="#1E293B" stroke-width="1"/>

  <!-- Row 1: Thousands digit (leading 1 of 1000) -->
  <text x="80" y="76" font-size="18" font-weight="900" fill="#F8FAFC" text-anchor="middle">0</text>
  <text x="180" y="76" font-size="10" fill="#94A3B8" text-anchor="middle">leading zeros</text>
  <text x="280" y="76" font-size="13" fill="#64748B" text-anchor="middle">(skip)</text>
  <text x="400" y="76" font-size="13" fill="#64748B" text-anchor="middle">—</text>
  <text x="480" y="76" font-size="10" fill="#64748B" text-anchor="middle">—</text>
  <line x1="30" y1="88" x2="510" y2="88" stroke="#0F172A" stroke-width="1"/>

  <!-- Row 2: Hundreds 6 → 9-6=3 -->
  <text x="80" y="112" font-size="18" font-weight="900" fill="#F8FAFC" text-anchor="middle">6</text>
  <text x="180" y="112" font-size="11" fill="#818CF8" text-anchor="middle">9 − digit</text>
  <text x="280" y="112" font-size="14" font-weight="700" fill="#E2E8F0" text-anchor="middle">9 − 6</text>
  <text x="400" y="112" font-size="20" font-weight="900" fill="#818CF8" text-anchor="middle" filter="url(#glow)">3</text>
  <text x="480" y="112" font-size="9" fill="#818CF8" text-anchor="middle">from 9</text>
  <line x1="30" y1="124" x2="510" y2="124" stroke="#0F172A" stroke-width="1"/>

  <!-- Row 3: Tens 3 → 9-3=6 -->
  <text x="80" y="148" font-size="18" font-weight="900" fill="#F8FAFC" text-anchor="middle">3</text>
  <text x="180" y="148" font-size="11" fill="#818CF8" text-anchor="middle">9 − digit</text>
  <text x="280" y="148" font-size="14" font-weight="700" fill="#E2E8F0" text-anchor="middle">9 − 3</text>
  <text x="400" y="148" font-size="20" font-weight="900" fill="#818CF8" text-anchor="middle" filter="url(#glow)">6</text>
  <text x="480" y="148" font-size="9" fill="#818CF8" text-anchor="middle">from 9</text>
  <line x1="30" y1="160" x2="510" y2="160" stroke="#0F172A" stroke-width="1"/>

  <!-- Row 4: Units 7 → 10-7=3 (LAST digit) -->
  <text x="80" y="184" font-size="18" font-weight="900" fill="#FCD34D" text-anchor="middle">7</text>
  <text x="180" y="184" font-size="11" fill="#E91E87" text-anchor="middle">10 − digit</text>
  <text x="280" y="184" font-size="14" font-weight="700" fill="#FCD34D" text-anchor="middle">10 − 7</text>
  <text x="400" y="184" font-size="20" font-weight="900" fill="#E91E87" text-anchor="middle" filter="url(#glow)">3</text>
  <text x="480" y="184" font-size="9" fill="#E91E87" text-anchor="middle">from 10 !</text>
  <line x1="30" y1="196" x2="510" y2="196" stroke="#1E293B" stroke-width="1"/>

  <!-- Answer -->
  <text x="260" y="213" font-size="11" font-weight="800" fill="#22C55E" text-anchor="middle">Answer: 363 — zero borrows, zero stress ✓</text>
</svg>
