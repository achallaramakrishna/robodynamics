<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e293b; rx: 16px; stroke: #334155; stroke-width: 4; }
      .text-light { fill: #f8fafc; font-family: system-ui, sans-serif; font-weight: bold; font-size: 32px; }
      .text-base { fill: #eab308; font-family: system-ui, sans-serif; font-weight: bold; font-size: 32px; }
      .text-deficit { fill: #ef4444; font-family: system-ui, sans-serif; font-weight: bold; font-size: 32px; }
      .text-surplus { fill: #22c55e; font-family: system-ui, sans-serif; font-weight: bold; font-size: 32px; }
      .text-label-d { fill: #ef4444; font-family: system-ui, sans-serif; font-size: 16px; font-weight: bold; }
      .text-label-s { fill: #22c55e; font-family: system-ui, sans-serif; font-size: 16px; font-weight: bold; }
    </style>
  </defs>

  <rect width="600" height="200" class="bg"/>

  <text x="300" y="50" class="text-base" text-anchor="middle">Base 100</text>

  <!-- Deficit -->
  <rect x="50" y="80" width="220" height="90" fill="#0f172a" rx="12"/>
  <text x="160" y="115" class="text-light" text-anchor="middle">97</text>
  <text x="220" y="115" class="text-deficit" text-anchor="middle">-3</text>
  <text x="160" y="150" class="text-label-d" text-anchor="middle">Deficit</text>

  <!-- Surplus -->
  <rect x="330" y="80" width="220" height="90" fill="#0f172a" rx="12"/>
  <text x="440" y="115" class="text-light" text-anchor="middle">103</text>
  <text x="500" y="115" class="text-surplus" text-anchor="middle">+3</text>
  <text x="440" y="150" class="text-label-s" text-anchor="middle">Surplus</text>

</svg>
