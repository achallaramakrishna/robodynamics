<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" width="380" height="280" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/><stop offset="100%" stop-color="#060D1A"/>
    </linearGradient>
  </defs>
  <rect width="380" height="280" fill="url(#bg)" rx="12"/>
  <rect width="380" height="280" fill="none" stroke="#1E293B" stroke-width="1.5" rx="12"/>
  <text x="190" y="22" font-size="11" font-weight="800" fill="#A78BFA" text-anchor="middle" letter-spacing="1">DOUBLE-HALF LADDER — Find 32 × 15</text>

  <!-- Column headers -->
  <text x="110" y="46" font-size="10" font-weight="700" fill="#60A5FA" text-anchor="middle">DOUBLE →</text>
  <text x="270" y="46" font-size="10" font-weight="700" fill="#4ADE80" text-anchor="middle">← HALVE</text>
  <text x="190" y="46" font-size="10" fill="#334155" text-anchor="middle">×</text>

  <!-- Rows of the ladder -->
  <!-- Row 1 -->
  <rect x="60" y="54" width="100" height="32" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="110" y="75" font-size="16" font-weight="900" fill="#F8FAFC" text-anchor="middle">32</text>
  <text x="190" y="75" font-size="14" fill="#475569" text-anchor="middle">×</text>
  <rect x="220" y="54" width="100" height="32" rx="8" fill="#1E293B" stroke="#22C55E" stroke-width="1.5"/>
  <text x="270" y="75" font-size="16" font-weight="900" fill="#F8FAFC" text-anchor="middle">15</text>

  <!-- Arrow down -->
  <text x="110" y="100" font-size="9" fill="#93C5FD" text-anchor="middle">×2 ↓</text>
  <text x="270" y="100" font-size="9" fill="#86EFAC" text-anchor="middle">÷2 ↓</text>

  <!-- Row 2 -->
  <rect x="60" y="106" width="100" height="32" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="110" y="127" font-size="16" font-weight="900" fill="#F8FAFC" text-anchor="middle">64</text>
  <text x="190" y="127" font-size="14" fill="#475569" text-anchor="middle">×</text>
  <rect x="220" y="106" width="100" height="32" rx="8" fill="#1E293B" stroke="#22C55E" stroke-width="1.5"/>
  <text x="270" y="127" font-size="13" font-weight="700" fill="#FCD34D" text-anchor="middle">7.5 ✗</text>

  <!-- Odd → skip note -->
  <text x="190" y="152" font-size="8" fill="#EF4444" text-anchor="middle">odd — skip</text>
  <text x="110" y="152" font-size="9" fill="#93C5FD" text-anchor="middle">×2 ↓</text>
  <text x="270" y="152" font-size="9" fill="#86EFAC" text-anchor="middle">÷2 ↓</text>

  <!-- Row 3 -->
  <rect x="60" y="158" width="100" height="32" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="110" y="179" font-size="16" font-weight="900" fill="#F8FAFC" text-anchor="middle">128</text>
  <text x="190" y="179" font-size="14" fill="#475569" text-anchor="middle">×</text>
  <rect x="220" y="158" width="100" height="32" rx="8" fill="#142010" stroke="#22C55E" stroke-width="2"/>
  <text x="270" y="179" font-size="16" font-weight="900" fill="#86EFAC" text-anchor="middle">3</text>

  <!-- Odd → keep note -->
  <text x="190" y="204" font-size="8" fill="#22C55E" text-anchor="middle">odd → keep</text>
  <text x="110" y="204" font-size="9" fill="#93C5FD" text-anchor="middle">×2 ↓</text>
  <text x="270" y="204" font-size="9" fill="#86EFAC" text-anchor="middle">÷2 ↓</text>

  <!-- Row 4 -->
  <rect x="60" y="210" width="100" height="32" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="110" y="231" font-size="16" font-weight="900" fill="#F8FAFC" text-anchor="middle">256</text>
  <text x="190" y="231" font-size="14" fill="#475569" text-anchor="middle">×</text>
  <rect x="220" y="210" width="100" height="32" rx="8" fill="#142010" stroke="#22C55E" stroke-width="2"/>
  <text x="270" y="231" font-size="16" font-weight="900" fill="#86EFAC" text-anchor="middle">1</text>
  <!-- Keep marker -->
  <text x="190" y="255" font-size="8" fill="#22C55E" text-anchor="middle">odd → keep</text>

  <!-- Answer -->
  <rect x="60" y="260" width="260" height="15" rx="5" fill="#0D2040" stroke="#818CF8" stroke-width="1"/>
  <text x="190" y="272" font-size="10" font-weight="800" fill="#818CF8" text-anchor="middle">Answer: 128×3 + 256×1 = 384 + 256 = 480 ✗ — use simpler path: 32→16×2×15=480</text>
</svg>
