<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280">
  <defs><style>.bg{fill:#0D1B2A;}.cell{fill:#0A1628;stroke:#1E3A5F;stroke-width:1;}</style></defs>
  <rect width="520" height="280" rx="14" class="bg"/>
  <text x="260" y="24" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">Flag Division Board — 4578 ÷ 7</text>
  <text x="260" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">Dhvajāṅka — divide step-by-step with running adjustment</text>

  <!-- Divisor box (flag) -->
  <rect x="20" y="60" width="50" height="50" rx="8" fill="rgba(99,102,241,0.15)" stroke="#6366F1" stroke-width="2"/>
  <text x="45" y="82" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" font-weight="800" fill="#818CF8">7</text>
  <text x="45" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#6366F1">divisor</text>

  <!-- Dividend digits -->
  <g>
    <rect x="90" y="60" width="50" height="50" rx="8" class="cell"/>
    <text x="115" y="94" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="800" fill="#F1F5F9">4</text>

    <rect x="150" y="60" width="50" height="50" rx="8" class="cell"/>
    <text x="175" y="94" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="800" fill="#F1F5F9">5</text>

    <rect x="210" y="60" width="50" height="50" rx="8" class="cell"/>
    <text x="235" y="94" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="800" fill="#F1F5F9">7</text>

    <rect x="270" y="60" width="50" height="50" rx="8" class="cell"/>
    <text x="295" y="94" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="800" fill="#F1F5F9">8</text>
  </g>

  <!-- Step labels -->
  <text x="115" y="126" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#64748B">÷7=?</text>
  <text x="175" y="126" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#64748B">adjust</text>
  <text x="235" y="126" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#64748B">adjust</text>
  <text x="295" y="126" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#64748B">last</text>

  <!-- Quotient row -->
  <text x="80" y="158" font-family="Inter,sans-serif" font-size="12" fill="#94A3B8" font-weight="600">Quotient:</text>
  <rect x="90" y="142" width="50" height="32" rx="6" fill="rgba(99,102,241,0.1)" stroke="#6366F1" stroke-width="1.5"/>
  <text x="115" y="163" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#818CF8">6</text>

  <rect x="150" y="142" width="50" height="32" rx="6" fill="rgba(99,102,241,0.1)" stroke="#6366F1" stroke-width="1.5"/>
  <text x="175" y="163" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#818CF8">5</text>

  <rect x="210" y="142" width="50" height="32" rx="6" fill="rgba(99,102,241,0.1)" stroke="#6366F1" stroke-width="1.5"/>
  <text x="235" y="163" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#818CF8">4</text>

  <!-- Remainder -->
  <rect x="270" y="142" width="80" height="32" rx="6" fill="rgba(245,158,11,0.1)" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="310" y="163" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#F59E0B">R=0</text>

  <!-- Step-by-step working -->
  <rect x="20" y="192" width="486" height="76" rx="10" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="28" y="212" font-family="Inter,sans-serif" font-size="12" fill="#94A3B8" font-weight="600">Working:</text>
  <text x="28" y="230" font-family="Inter,sans-serif" font-size="12" fill="#CBD5E1">
    4÷7: Q=<tspan fill="#818CF8" font-weight="700">0</tspan>, R=4 → 4×10+5=45 → 45÷7=<tspan fill="#818CF8" font-weight="700">6</tspan> R3
  </text>
  <text x="28" y="248" font-family="Inter,sans-serif" font-size="12" fill="#CBD5E1">
    3×10+7=37 → 37÷7=<tspan fill="#818CF8" font-weight="700">5</tspan> R2 → 2×10+8=28 → 28÷7=<tspan fill="#818CF8" font-weight="700">4</tspan> R<tspan fill="#F59E0B" font-weight="700">0</tspan>
  </text>
  <text x="28" y="261" font-family="Inter,sans-serif" font-size="12" fill="#34D399" font-weight="700">
    4578 ÷ 7 = 654 remainder 0 ✓
  </text>
</svg>
