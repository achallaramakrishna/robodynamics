<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" fill="none">
  <rect width="720" height="240" rx="24" fill="#F8FAFC"/>
  <rect x="24" y="24" width="672" height="192" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="42" y="58" fill="#0F172A" font-size="24" font-family="Arial, sans-serif" font-weight="700">97 needs 3 more to become 100</text>
  <text x="42" y="84" fill="#475569" font-size="14" font-family="Arial, sans-serif">That small gap is the complement we move from the other addend.</text>
  <rect x="64" y="126" width="582" height="32" rx="16" fill="#E2E8F0"/>
  <rect x="64" y="126" width="564" height="32" rx="16" fill="#3B82F6"/>
  <rect x="628" y="126" width="18" height="32" rx="9" fill="#22C55E"/>
  <text x="64" y="182" fill="#1E293B" font-size="16" font-family="Arial, sans-serif" font-weight="700">97</text>
  <text x="628" y="182" fill="#166534" font-size="16" font-family="Arial, sans-serif" font-weight="700">+3</text>
  <text x="660" y="182" fill="#1E293B" font-size="16" font-family="Arial, sans-serif" font-weight="700">100</text>
</svg>
