<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="280" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="42" y="58" fill="#0F172A" font-size="26" font-family="Arial, sans-serif" font-weight="700">Complete the Whole</text>
  <text x="42" y="84" fill="#475569" font-size="14" font-family="Arial, sans-serif">Move a small part so the first number reaches a friendly base.</text>

  <rect x="42" y="112" width="296" height="154" rx="18" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="60" y="146" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">Original problem</text>
  <text x="190" y="210" text-anchor="middle" fill="#111827" font-size="44" font-family="Arial, sans-serif" font-weight="800">97 + 5</text>

  <rect x="382" y="112" width="296" height="154" rx="18" fill="#ECFDF5" stroke="#86EFAC"/>
  <text x="400" y="146" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">Friendly-base move</text>
  <text x="530" y="190" text-anchor="middle" fill="#111827" font-size="28" font-family="Arial, sans-serif" font-weight="700">97 needs 3</text>
  <text x="530" y="222" text-anchor="middle" fill="#166534" font-size="24" font-family="Arial, sans-serif" font-weight="700">100 + 2 = 102</text>
</svg>
