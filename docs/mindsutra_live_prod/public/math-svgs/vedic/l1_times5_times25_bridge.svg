<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="280" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="42" y="58" fill="#0F172A" font-size="26" font-family="Arial, sans-serif" font-weight="700">Turn x5 and x25 into Easy Steps</text>
  <text x="42" y="84" fill="#475569" font-size="14" font-family="Arial, sans-serif">Both shortcuts come from changing the multiplier into a friendly base.</text>

  <rect x="42" y="112" width="296" height="154" rx="18" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="60" y="144" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">Multiply by 5</text>
  <text x="190" y="182" text-anchor="middle" fill="#111827" font-size="24" font-family="Arial, sans-serif" font-weight="800">x5 = /2 then x10</text>
  <text x="190" y="214" text-anchor="middle" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">74 x 5 -> 37 x 10 -> 370</text>
  <text x="190" y="244" text-anchor="middle" fill="#6B7280" font-size="14" font-family="Arial, sans-serif">Halve first, then shift one place.</text>

  <rect x="382" y="112" width="296" height="154" rx="18" fill="#ECFDF5" stroke="#86EFAC"/>
  <text x="400" y="144" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">Multiply by 25</text>
  <text x="530" y="182" text-anchor="middle" fill="#111827" font-size="24" font-family="Arial, sans-serif" font-weight="800">x25 = /4 then x100</text>
  <text x="530" y="214" text-anchor="middle" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">52 x 25 -> 13 x 100 -> 1300</text>
  <text x="530" y="244" text-anchor="middle" fill="#6B7280" font-size="14" font-family="Arial, sans-serif">Quarter first, then shift two places.</text>
</svg>
