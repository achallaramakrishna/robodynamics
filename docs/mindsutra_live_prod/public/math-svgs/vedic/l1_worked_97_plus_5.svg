<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="280" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="42" y="58" fill="#0F172A" font-size="26" font-family="Arial, sans-serif" font-weight="700">Worked Example: 97 + 5</text>
  <text x="42" y="84" fill="#475569" font-size="14" font-family="Arial, sans-serif">Split the 5 into 3 and 2 so the first number becomes 100.</text>

  <rect x="42" y="112" width="198" height="154" rx="18" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="60" y="142" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">Step 1</text>
  <text x="60" y="184" fill="#111827" font-size="24" font-family="Arial, sans-serif" font-weight="700">97 + 3 = 100</text>
  <text x="60" y="216" fill="#475569" font-size="14" font-family="Arial, sans-serif">Give 3 to the 97.</text>

  <rect x="262" y="112" width="198" height="154" rx="18" fill="#ECFDF5" stroke="#86EFAC"/>
  <text x="280" y="142" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">Step 2</text>
  <text x="280" y="184" fill="#111827" font-size="24" font-family="Arial, sans-serif" font-weight="700">5 - 3 = 2</text>
  <text x="280" y="216" fill="#475569" font-size="14" font-family="Arial, sans-serif">The leftover part is 2.</text>

  <rect x="482" y="112" width="198" height="154" rx="18" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="500" y="142" fill="#9A3412" font-size="18" font-family="Arial, sans-serif" font-weight="700">Step 3</text>
  <text x="500" y="184" fill="#111827" font-size="24" font-family="Arial, sans-serif" font-weight="700">100 + 2 = 102</text>
  <text x="500" y="216" fill="#475569" font-size="14" font-family="Arial, sans-serif">Now the addition is easy.</text>
</svg>
