<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220">
  <defs><style>.bg{fill:#0D1B2A;}</style></defs>
  <rect width="520" height="220" rx="14" class="bg"/>
  <text x="260" y="24" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">Left | Right Square Split — 47²</text>
  <text x="260" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">Step-by-step: find d, compute left, compute right, join</text>

  <!-- Step boxes horizontal flow -->
  <!-- Step 1 -->
  <rect x="14" y="58" width="108" height="80" rx="10" fill="#0A1628" stroke="#6366F1" stroke-width="1.5"/>
  <text x="68" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#6366F1" font-weight="700">Step 1: d</text>
  <text x="68" y="102" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="800" fill="#F1F5F9">47</text>
  <text x="68" y="126" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" fill="#F87171" font-weight="700">d = −3</text>

  <!-- Arrow 1→2 -->
  <line x1="124" y1="98" x2="140" y2="98" stroke="#6366F1" stroke-width="2"/>
  <polygon points="136,94 146,98 136,102" fill="#6366F1"/>

  <!-- Step 2 left part -->
  <rect x="142" y="58" width="108" height="80" rx="10" fill="#0A1628" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="196" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#3B82F6" font-weight="700">Step 2: Left</text>
  <text x="196" y="104" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#CBD5E1">25 + (−3)</text>
  <text x="196" y="126" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="800" fill="#3B82F6">= 22</text>

  <!-- Arrow 2→3 -->
  <line x1="252" y1="98" x2="268" y2="98" stroke="#6366F1" stroke-width="2"/>
  <polygon points="264,94 274,98 264,102" fill="#6366F1"/>

  <!-- Step 3 right part -->
  <rect x="270" y="58" width="108" height="80" rx="10" fill="#0A1628" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="324" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#F59E0B" font-weight="700">Step 3: Right</text>
  <text x="324" y="104" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#CBD5E1">(−3)² = 09</text>
  <text x="324" y="126" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="800" fill="#F59E0B">= 09</text>

  <!-- Arrow 3→4 -->
  <line x1="380" y1="98" x2="396" y2="98" stroke="#6366F1" stroke-width="2"/>
  <polygon points="392,94 402,98 392,102" fill="#6366F1"/>

  <!-- Step 4 join -->
  <rect x="398" y="50" width="108" height="96" rx="10" fill="rgba(34,197,94,0.1)" stroke="#22C55E" stroke-width="2"/>
  <text x="452" y="76" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#22C55E" font-weight="700">Answer</text>
  <text x="452" y="104" text-anchor="middle" font-family="Inter,sans-serif" font-size="32" font-weight="900" fill="#22C55E">2209</text>
  <text x="452" y="134" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#34D399">22 | 09</text>

  <!-- Joining indicator -->
  <rect x="14" y="156" width="492" height="52" rx="10" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="260" y="176" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" fill="#CBD5E1">
    Join Left and Right:  <tspan fill="#3B82F6" font-weight="700">22</tspan> | <tspan fill="#F59E0B" font-weight="700">09</tspan>  =  <tspan fill="#22C55E" font-weight="800">2209</tspan>
  </text>
  <text x="260" y="197" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">
    Right part must always be 2 digits — pad with leading zero if needed (e.g. 09)
  </text>
</svg>
