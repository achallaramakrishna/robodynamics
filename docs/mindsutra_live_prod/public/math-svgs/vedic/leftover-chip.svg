<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: none; }
      .chip-bg { fill: #1e293b; stroke: #8b5cf6; stroke-width: 4; rx: 24px; }
      .text-light { fill: #f8fafc; font-family: system-ui, sans-serif; font-weight: bold; font-size: 48px; }
      .text-label { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 18px; font-weight: 500; }
    </style>
  </defs>

  <rect width="200" height="200" class="bg"/>

  <rect x="20" y="40" width="160" height="120" class="chip-bg"/>
  <text x="100" y="115" class="text-light" text-anchor="middle">5</text>
  <text x="100" y="185" class="text-label" text-anchor="middle">Leftover Part</text>
</svg>
