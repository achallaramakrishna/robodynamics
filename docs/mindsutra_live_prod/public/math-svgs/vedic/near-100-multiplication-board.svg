  <text x="84" y="88" text-anchor="middle" font-size="34" font-family="Arial" font-weight="700" fill="#334155">97</text>
  <text x="214" y="88" text-anchor="middle" font-size="30" font-family="Arial" font-weight="700" fill="#334155">?</text>
  <text x="316" y="88" text-anchor="middle" font-size="34" font-family="Arial" font-weight="700" fill="#334155">96</text>
