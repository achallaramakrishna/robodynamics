<svg width="520" height="280" viewBox="0 0 520 280" xmlns="http://www.w3.org/2000/svg">
  <rect x="12" y="12" width="496" height="256" rx="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
