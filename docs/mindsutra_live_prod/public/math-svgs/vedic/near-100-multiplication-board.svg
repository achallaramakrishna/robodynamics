  <line x1="98" y1="122" x2="300" y2="78" stroke="#E91E8C" stroke-width="4" stroke-linecap="round"/>
  <text x="198" y="112" text-anchor="middle" font-size="28" font-family="Arial" font-weight="700" fill="#7C3AED">X</text>
