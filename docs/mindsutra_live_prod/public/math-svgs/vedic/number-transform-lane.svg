<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e293b; rx: 12px; }
      .station { fill: #334155; rx: 8px; stroke: #64748b; stroke-width: 2; }
      .text-num { fill: #f8fafc; font-family: system-ui, sans-serif; font-weight: bold; font-size: 40px; }
      .text-station { fill: #3b82f6; font-family: system-ui, sans-serif; font-weight: bold; font-size: 24px; }
      .text-gold { fill: #eab308; font-family: system-ui, sans-serif; font-weight: bold; font-size: 48px; }
      .arrow { fill: none; stroke: #cbd5e1; stroke-width: 4; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#cbd5e1" /></marker>
  </defs>

  <rect width="800" height="200" class="bg"/>

  <text x="80" y="115" class="text-num" text-anchor="middle">48</text>

  <path d="M 130 100 L 220 100" class="arrow"/>
  
  <!-- Station 1: Halve -->
  <rect x="240" y="60" width="120" height="80" class="station"/>
  <text x="300" y="110" class="text-station" text-anchor="middle">÷ 2</text>

  <path d="M 380 100 L 450 100" class="arrow"/>
  
  <!-- Interim number -->
  <text x="490" y="115" class="text-num" text-anchor="middle">24</text>

  <path d="M 530 100 L 600 100" class="arrow"/>

  <!-- Station 2: Add zero -->
  <rect x="620" y="60" width="120" height="80" class="station"/>
  <text x="680" y="110" class="text-station" text-anchor="middle">× 10</text>

  <path d="M 760 100 L 820 100" class="arrow"/>

  <!-- Final -->
  <text x="880" y="120" class="text-gold" text-anchor="middle">240</text>
  
  <!-- Fixing the viewBox to fit the final bit -->
</svg>
