<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180">
  <defs><style>.bg{fill:#0D1B2A;}.box{fill:#0A1628;stroke:#1E3A5F;stroke-width:1.5;}</style>
    <marker id="r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6z" fill="#6366F1"/>
    </marker>
  </defs>
  <rect width="520" height="180" rx="14" class="bg"/>
  <text x="260" y="24" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">Reduce Fraction Flow — 48/72</text>
  <text x="260" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">Divide both by HCF until irreducible</text>

  <!-- Step 1: 48/72 -->
  <rect x="14" y="58" width="80" height="70" rx="10" class="box"/>
  <text x="54" y="84" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="800" fill="#F87171">48</text>
  <line x1="24" y1="96" x2="84" y2="96" stroke="#6366F1" stroke-width="2"/>
  <text x="54" y="120" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="800" fill="#F87171">72</text>

  <line x1="96" y1="93" x2="112" y2="93" stroke="#6366F1" stroke-width="2" marker-end="url(#r)"/>
  <text x="104" y="86" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#6366F1">÷2</text>

  <!-- 24/36 -->
  <rect x="114" y="58" width="80" height="70" rx="10" fill="#0A1628" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="154" y="84" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="800" fill="#3B82F6">24</text>
  <line x1="124" y1="96" x2="184" y2="96" stroke="#3B82F6" stroke-width="2"/>
  <text x="154" y="120" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="800" fill="#3B82F6">36</text>

  <line x1="196" y1="93" x2="212" y2="93" stroke="#6366F1" stroke-width="2" marker-end="url(#r)"/>
  <text x="204" y="86" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#6366F1">÷2</text>

  <!-- 12/18 -->
  <rect x="214" y="58" width="80" height="70" rx="10" fill="#0A1628" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="254" y="84" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="800" fill="#8B5CF6">12</text>
  <line x1="224" y1="96" x2="284" y2="96" stroke="#8B5CF6" stroke-width="2"/>
  <text x="254" y="120" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="800" fill="#8B5CF6">18</text>

  <line x1="296" y1="93" x2="312" y2="93" stroke="#6366F1" stroke-width="2" marker-end="url(#r)"/>
  <text x="304" y="86" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#6366F1">÷3</text>

  <!-- 4/6 -->
  <rect x="314" y="58" width="80" height="70" rx="10" fill="#0A1628" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="354" y="84" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="800" fill="#F59E0B">4</text>
  <line x1="324" y1="96" x2="384" y2="96" stroke="#F59E0B" stroke-width="2"/>
  <text x="354" y="120" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="800" fill="#F59E0B">6</text>

  <line x1="396" y1="93" x2="412" y2="93" stroke="#6366F1" stroke-width="2" marker-end="url(#r)"/>
  <text x="404" y="86" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#6366F1">÷2</text>

  <!-- Final: 2/3 -->
  <rect x="414" y="50" width="92" height="86" rx="10" fill="rgba(34,197,94,0.1)" stroke="#22C55E" stroke-width="2.5"/>
  <text x="460" y="82" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="900" fill="#22C55E">2</text>
  <line x1="426" y1="97" x2="496" y2="97" stroke="#22C55E" stroke-width="2.5"/>
  <text x="460" y="126" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="900" fill="#22C55E">3</text>

  <!-- Label -->
  <text x="260" y="158" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#34D399" font-weight="700">
    Vedic shortcut: HCF(48,72) = 24 → 48÷24=2, 72÷24=3 → 2/3 in one step ✓
  </text>
</svg>
