<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs>
    <style>
      .bg{fill:#0D1B2A;}
      .t{font-family:'Inter',sans-serif;}
    </style>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6z" fill="#6366F1"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="520" height="200" rx="14" class="bg"/>
  <text x="260" y="24" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#818CF8">Skip-Count Number Line — 16 × 1 to 5</text>
  <text x="260" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">Each hop = +16 (skip 16 at a time)</text>

  <!-- Number line -->
  <line x1="30" y1="100" x2="490" y2="100" stroke="#1E3A5F" stroke-width="2"/>
  <line x1="490" y1="100" x2="480" y2="95" stroke="#1E3A5F" stroke-width="2"/>
  <line x1="490" y1="100" x2="480" y2="105" stroke="#1E3A5F" stroke-width="2"/>

  <!-- Tick marks at 0, 16, 32, 48, 64, 80 -->
  <g font-family="Inter,sans-serif" font-size="13" font-weight="700">
    <!-- 0 -->
    <line x1="50" y1="92" x2="50" y2="108" stroke="#475569" stroke-width="1.5"/>
    <text x="50" y="122" text-anchor="middle" fill="#64748B">0</text>

    <!-- 16 -->
    <line x1="140" y1="92" x2="140" y2="108" stroke="#22C55E" stroke-width="2"/>
    <text x="140" y="122" text-anchor="middle" fill="#22C55E">16</text>
    <text x="140" y="138" text-anchor="middle" font-size="10" fill="#22C55E">×1</text>

    <!-- 32 -->
    <line x1="230" y1="92" x2="230" y2="108" stroke="#22C55E" stroke-width="2"/>
    <text x="230" y="122" text-anchor="middle" fill="#22C55E">32</text>
    <text x="230" y="138" text-anchor="middle" font-size="10" fill="#22C55E">×2</text>

    <!-- 48 -->
    <line x1="320" y1="92" x2="320" y2="108" stroke="#22C55E" stroke-width="2"/>
    <text x="320" y="122" text-anchor="middle" fill="#22C55E">48</text>
    <text x="320" y="138" text-anchor="middle" font-size="10" fill="#22C55E">×3</text>

    <!-- 64 -->
    <line x1="410" y1="92" x2="410" y2="108" stroke="#22C55E" stroke-width="2"/>
    <text x="410" y="122" text-anchor="middle" fill="#22C55E">64</text>
    <text x="410" y="138" text-anchor="middle" font-size="10" fill="#22C55E">×4</text>
  </g>

  <!-- Hop arcs -->
  <path d="M50,98 Q95,60 138,98" stroke="#6366F1" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M140,98 Q185,60 228,98" stroke="#6366F1" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M230,98 Q275,60 318,98" stroke="#6366F1" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M320,98 Q365,60 408,98" stroke="#6366F1" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- +16 labels above arcs -->
  <text x="95" y="58" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#818CF8" font-weight="700">+16</text>
  <text x="185" y="58" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#818CF8" font-weight="700">+16</text>
  <text x="275" y="58" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#818CF8" font-weight="700">+16</text>
  <text x="365" y="58" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#818CF8" font-weight="700">+16</text>

  <!-- Reminder note -->
  <rect x="30" y="155" width="460" height="32" rx="8" fill="#1E3A5F" opacity="0.5"/>
  <text x="260" y="175" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#CBD5E1">
    ✅ Skip-count gives you the multiplication table — no memorising needed!
  </text>
</svg>
