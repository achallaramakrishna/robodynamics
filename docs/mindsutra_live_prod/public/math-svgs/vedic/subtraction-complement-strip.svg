<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A0F1C"/><stop offset="100%" stop-color="#060D1A"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#E91E87"/>
    </marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="520" height="180" fill="url(#bg)" rx="12"/>
  <rect width="520" height="180" fill="none" stroke="#1E293B" stroke-width="1.5" rx="12"/>

  <text x="260" y="22" font-size="11" font-weight="800" fill="#E91E87" text-anchor="middle" letter-spacing="2">BORROW-FREE — 1000 − 637</text>
  <text x="260" y="38" font-size="9" fill="#475569" text-anchor="middle">All digits from 9, last digit from 10 (Nikhilam rule)</text>

  <!-- Problem display -->
  <!-- 1000 - 637 -->
  <!-- Show digit-by-digit complement -->

  <!-- Step boxes -->
  <!-- Digit: 6 → 9−6 = 3 -->
  <rect x="40" y="52" width="120" height="80" rx="12" fill="#1E293B" stroke="#818CF840" stroke-width="1"/>
  <text x="100" y="75" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">Hundreds digit</text>
  <text x="100" y="97" font-size="22" font-weight="900" fill="#F8FAFC" text-anchor="middle">9 − 6 = 3</text>
  <text x="100" y="118" font-size="10" fill="#4ADE80" text-anchor="middle">✓ from 9</text>

  <!-- Arrow -->
  <line x1="170" y1="92" x2="200" y2="92" stroke="#334155" stroke-width="1.5"/>

  <!-- Digit: 3 → 9−3 = 6 -->
  <rect x="200" y="52" width="120" height="80" rx="12" fill="#1E293B" stroke="#818CF840" stroke-width="1"/>
  <text x="260" y="75" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">Tens digit</text>
  <text x="260" y="97" font-size="22" font-weight="900" fill="#F8FAFC" text-anchor="middle">9 − 3 = 6</text>
  <text x="260" y="118" font-size="10" fill="#4ADE80" text-anchor="middle">✓ from 9</text>

  <!-- Arrow -->
  <line x1="330" y1="92" x2="360" y2="92" stroke="#334155" stroke-width="1.5"/>

  <!-- Digit: 7 → 10−7 = 3 (last digit from 10) -->
  <rect x="360" y="52" width="120" height="80" rx="12" fill="#1E1830" stroke="#E91E87" stroke-width="2" filter="url(#glow)"/>
  <text x="420" y="75" font-size="11" font-weight="700" fill="#E91E87" text-anchor="middle">Units digit</text>
  <text x="420" y="97" font-size="22" font-weight="900" fill="#FCD34D" text-anchor="middle">10 − 7 = 3</text>
  <text x="420" y="118" font-size="10" fill="#E91E87" text-anchor="middle">LAST → from 10</text>

  <!-- Answer strip -->
  <rect x="40" y="146" width="440" height="26" rx="8" fill="#0D1525" stroke="#22C55E40" stroke-width="1"/>
  <text x="100" y="163" font-size="12" fill="#94A3B8" text-anchor="middle">1000 − 637</text>
  <text x="250" y="163" font-size="14" fill="#64748B" text-anchor="middle">=</text>
  <text x="380" y="163" font-size="14" font-weight="900" fill="#22C55E" text-anchor="middle">3   6   3   = 363 ✓</text>
</svg>
