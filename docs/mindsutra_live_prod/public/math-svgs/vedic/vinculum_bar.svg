<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="340" height="200" font-family="Nunito,sans-serif">
  <rect width="340" height="200" rx="14" fill="#f8fafc"/>
  <text x="170" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Vinculum — Bar Numbers</text>
  <text x="170" y="42" text-anchor="middle" font-size="11" fill="#475569">Convert 18 → vinculum form</text>

  <!-- 18 is close to 20 -->
  <text x="80" y="90" text-anchor="middle" font-size="13" fill="#64748b">18 = 20 − 2</text>

  <!-- Big 18 -->
  <rect x="30" y="55" width="80" height="52" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="70" y="90" text-anchor="middle" font-size="30" font-weight="800" fill="#334155">18</text>

  <!-- Arrow -->
  <line x1="115" y1="81" x2="155" y2="81" stroke="#64748b" stroke-width="2" marker-end="url(#gArr)"/>
  <text x="135" y="75" text-anchor="middle" font-size="10" fill="#64748b">rewrite</text>

  <!-- Vinculum form: 2 with bar over 2̄ -->
  <rect x="160" y="55" width="80" height="52" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <!-- 2 in tens place -->
  <text x="185" y="90" text-anchor="middle" font-size="30" font-weight="800" fill="#be185d">2</text>
  <!-- 2-bar for units -->
  <text x="215" y="90" text-anchor="middle" font-size="30" font-weight="800" fill="#dc2626">2̄</text>
  <!-- vinculum bar drawn over the 2 -->
  <line x1="202" y1="60" x2="230" y2="60" stroke="#dc2626" stroke-width="3"/>

  <text x="200" y="122" text-anchor="middle" font-size="11" fill="#be185d">= 20 + (−2) = 18</text>

  <!-- Why use it? -->
  <rect x="20" y="138" width="300" height="50" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="170" y="157" text-anchor="middle" font-size="11" fill="#374151" font-weight="700">Why? Vinculum digits are always ≤ 5</text>
  <text x="170" y="174" text-anchor="middle" font-size="11" fill="#374151">This makes mental arithmetic faster and cleaner!</text>
  <text x="170" y="191" text-anchor="middle" font-size="10" fill="#64748b">Used in: subtraction, division, simplification</text>

  <defs>
    <marker id="gArr" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
