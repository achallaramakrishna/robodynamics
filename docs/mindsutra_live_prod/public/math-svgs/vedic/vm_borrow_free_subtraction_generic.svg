<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="280" rx="24" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="42" y="58" fill="#0F172A" font-size="26" font-family="Arial, sans-serif" font-weight="700">Borrow-Free Subtraction</text>
  <text x="42" y="84" fill="#475569" font-size="14" font-family="Arial, sans-serif">Turn subtraction into complement thinking so the student can avoid digit-by-digit borrowing stress.</text>

  <rect x="42" y="112" width="198" height="154" rx="18" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="60" y="142" fill="#1D4ED8" font-size="18" font-family="Arial, sans-serif" font-weight="700">Step One</text>
  <text x="60" y="176" fill="#111827" font-size="20" font-family="Arial, sans-serif" font-weight="700">Find the complement</text>
  <text x="60" y="208" fill="#6B7280" font-size="14" font-family="Arial, sans-serif">Think of the gap up to the base.</text>

  <rect x="262" y="112" width="198" height="154" rx="18" fill="#ECFDF5" stroke="#86EFAC"/>
  <text x="280" y="142" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">Step Two</text>
  <text x="280" y="176" fill="#111827" font-size="20" font-family="Arial, sans-serif" font-weight="700">Add the helpful value</text>
  <text x="280" y="208" fill="#6B7280" font-size="14" font-family="Arial, sans-serif">Use addition first, then adjust once.</text>

  <rect x="482" y="112" width="198" height="154" rx="18" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="500" y="142" fill="#C2410C" font-size="18" font-family="Arial, sans-serif" font-weight="700">Mental Cue</text>
  <text x="500" y="176" fill="#111827" font-size="20" font-family="Arial, sans-serif" font-weight="700">gap -> add -> adjust</text>
  <text x="500" y="208" fill="#6B7280" font-size="14" font-family="Arial, sans-serif">This keeps the process calm and structured.</text>
</svg>
