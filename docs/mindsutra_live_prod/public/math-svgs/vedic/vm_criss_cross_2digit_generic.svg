<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="280" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="42" y="58" fill="#0F172A" font-size="26" font-family="Arial, sans-serif" font-weight="700">Criss-Cross Multiplication</text>
  <text x="42" y="84" fill="#475569" font-size="14" font-family="Arial, sans-serif">Read the answer from right to left: vertical, cross, vertical. Keep carries organized as you go.</text>

  <rect x="42" y="112" width="186" height="154" rx="18" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="60" y="142" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">First step</text>
  <text x="60" y="176" fill="#1E293B" font-size="20" font-family="Arial, sans-serif" font-weight="700">right vertical product</text>
  <text x="60" y="208" fill="#475569" font-size="14" font-family="Arial, sans-serif">This gives the rightmost digit and the first carry.</text>

  <rect x="266" y="112" width="186" height="154" rx="18" fill="#ECFDF5" stroke="#86EFAC"/>
  <text x="284" y="142" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">Middle step</text>
  <text x="284" y="176" fill="#1E293B" font-size="20" font-family="Arial, sans-serif" font-weight="700">cross and add</text>
  <text x="284" y="208" fill="#475569" font-size="14" font-family="Arial, sans-serif">Combine the cross products and include any carry.</text>

  <rect x="490" y="112" width="186" height="154" rx="18" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="508" y="142" fill="#9A3412" font-size="18" font-family="Arial, sans-serif" font-weight="700">Final step</text>
  <text x="508" y="176" fill="#1E293B" font-size="20" font-family="Arial, sans-serif" font-weight="700">left vertical product</text>
  <text x="508" y="208" fill="#475569" font-size="14" font-family="Arial, sans-serif">Finish with the left side and carry forward once more if needed.</text>
</svg>
