<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="380" height="230" font-family="Nunito,sans-serif">
  <rect width="380" height="230" rx="14" fill="#fefce8"/>
  <text x="190" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">(a+b)(a−b) = a² − b² — Area Model</text>

  <!-- Large a×a square -->
  <rect x="30" y="40" width="160" height="160" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="110" y="128" text-anchor="middle" font-size="32" font-weight="800" fill="#a16207">a²</text>
  <text x="110" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">a</text>
  <text x="20" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">a</text>

  <!-- b×b cut out (top right) -->
  <rect x="162" y="40" width="28" height="28" rx="4" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
  <text x="176" y="59" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">b²</text>
  <text x="176" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">b</text>

  <!-- Rearrange arrow -->
  <text x="220" y="130" text-anchor="middle" font-size="26" fill="#6b7280">→</text>

  <!-- Rearranged rectangle (a+b) × (a-b) -->
  <rect x="250" y="60" width="110" height="80" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="305" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">(a+b) × (a−b)</text>
  <text x="305" y="52" text-anchor="middle" font-size="12" fill="#166534">a + b</text>
  <text x="244" y="105" text-anchor="middle" font-size="12" fill="#166534">a−b</text>

  <!-- Formula -->
  <text x="305" y="168" text-anchor="middle" font-size="13" fill="#374151">Remove b² corner</text>
  <text x="305" y="186" text-anchor="middle" font-size="13" fill="#374151">→ rearrange strip</text>

  <!-- Result box -->
  <rect x="230" y="198" width="150" height="26" rx="8" fill="#ca8a04"/>
  <text x="305" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="white">(a+b)(a−b) = a² − b²</text>
</svg>
