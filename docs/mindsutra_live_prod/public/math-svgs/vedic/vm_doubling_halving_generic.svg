<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="280" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="42" y="58" fill="#0F172A" font-size="26" font-family="Arial, sans-serif" font-weight="700">Doubling and Halving</text>
  <text x="42" y="84" fill="#475569" font-size="14" font-family="Arial, sans-serif">Make one factor easier by doubling one side and halving the other. The product stays the same.</text>

  <rect x="42" y="112" width="198" height="154" rx="18" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="60" y="142" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">Halve the even factor</text>
  <text x="60" y="176" fill="#1E293B" font-size="18" font-family="Arial, sans-serif" font-weight="700">smaller -> smaller -> easy</text>
  <text x="60" y="208" fill="#475569" font-size="14" font-family="Arial, sans-serif">Keep halving until the number feels friendly.</text>

  <rect x="262" y="112" width="198" height="154" rx="18" fill="#ECFDF5" stroke="#86EFAC"/>
  <text x="280" y="142" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">Double the other factor</text>
  <text x="280" y="176" fill="#1E293B" font-size="18" font-family="Arial, sans-serif" font-weight="700">bigger -> bigger -> round</text>
  <text x="280" y="208" fill="#475569" font-size="14" font-family="Arial, sans-serif">Match each halving with one doubling.</text>

  <rect x="482" y="112" width="198" height="154" rx="18" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="500" y="142" fill="#9A3412" font-size="18" font-family="Arial, sans-serif" font-weight="700">Finish with the easy pair</text>
  <text x="500" y="176" fill="#1E293B" font-size="18" font-family="Arial, sans-serif" font-weight="700">round factor x small factor</text>
  <text x="500" y="208" fill="#475569" font-size="14" font-family="Arial, sans-serif">This turns hard multiplication into a quick mental step.</text>
</svg>
