<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="380" height="230" font-family="Nunito,sans-serif">
  <rect width="380" height="230" rx="14" fill="#f0f9ff"/>
  <text x="190" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">Power Patterns — Spot the Doubling</text>

  <!-- Table headers -->
  <rect x="20" y="36" width="60" height="24" rx="4" fill="#1e3a8a"/>
  <text x="50" y="53" text-anchor="middle" font-size="12" font-weight="700" fill="white">n</text>
  <rect x="82" y="36" width="80" height="24" rx="4" fill="#1e3a8a"/>
  <text x="122" y="53" text-anchor="middle" font-size="12" font-weight="700" fill="white">2ⁿ</text>
  <rect x="164" y="36" width="80" height="24" rx="4" fill="#7c3aed"/>
  <text x="204" y="53" text-anchor="middle" font-size="12" font-weight="700" fill="white">3ⁿ</text>
  <rect x="246" y="36" width="114" height="24" rx="4" fill="#be185d"/>
  <text x="303" y="53" text-anchor="middle" font-size="12" font-weight="700" fill="white">Diff (2ⁿ)</text>

  <!-- Rows -->
  <!-- n=1 -->
  <text x="50" y="80" text-anchor="middle" font-size="13" fill="#374151">1</text>
  <text x="122" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">2</text>
  <text x="204" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">3</text>
  <text x="303" y="80" text-anchor="middle" font-size="11" fill="#9d174d">—</text>

  <!-- n=2 -->
  <text x="50" y="103" text-anchor="middle" font-size="13" fill="#374151">2</text>
  <text x="122" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">4</text>
  <text x="204" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">9</text>
  <text x="303" y="103" text-anchor="middle" font-size="11" fill="#9d174d">+2</text>

  <!-- n=3 -->
  <text x="50" y="126" text-anchor="middle" font-size="13" fill="#374151">3</text>
  <text x="122" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">8</text>
  <text x="204" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">27</text>
  <text x="303" y="126" text-anchor="middle" font-size="11" fill="#9d174d">+4</text>

  <!-- n=4 -->
  <text x="50" y="149" text-anchor="middle" font-size="13" fill="#374151">4</text>
  <text x="122" y="149" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">16</text>
  <text x="204" y="149" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">81</text>
  <text x="303" y="149" text-anchor="middle" font-size="11" fill="#9d174d">+8</text>

  <!-- n=5 -->
  <text x="50" y="172" text-anchor="middle" font-size="13" fill="#374151">5</text>
  <text x="122" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">32</text>
  <text x="204" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">243</text>
  <text x="303" y="172" text-anchor="middle" font-size="11" fill="#9d174d">+16</text>

  <!-- Doubling arrow -->
  <text x="150" y="82" font-size="10" fill="#3b82f6">×2↓</text>
  <text x="150" y="106" font-size="10" fill="#3b82f6">×2↓</text>
  <text x="150" y="130" font-size="10" fill="#3b82f6">×2↓</text>
  <text x="150" y="153" font-size="10" fill="#3b82f6">×2↓</text>

  <!-- Note -->
  <rect x="20" y="186" width="340" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="190" y="200" text-anchor="middle" font-size="11" fill="#1e40af">Differences in 2ⁿ are also powers of 2 (doubling pattern)</text>
  <text x="190" y="216" text-anchor="middle" font-size="11" fill="#1e40af">2¹⁰ = 1024   |   2ⁿ × 2ᵐ = 2ⁿ⁺ᵐ  (law of exponents)</text>
</svg>
