<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="680" height="280" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="42" y="58" fill="#0F172A" font-size="26" font-family="Arial, sans-serif" font-weight="700">Near-Hundred Thinking</text>
  <text x="42" y="84" fill="#475569" font-size="14" font-family="Arial, sans-serif">When numbers sit close to a friendly base, use the distance to the base to simplify the arithmetic.</text>

  <rect x="42" y="112" width="198" height="154" rx="18" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="60" y="142" fill="#3730A3" font-size="18" font-family="Arial, sans-serif" font-weight="700">Find the gap</text>
  <text x="60" y="176" fill="#1E293B" font-size="20" font-family="Arial, sans-serif" font-weight="700">How far from the base?</text>
  <text x="60" y="208" fill="#475569" font-size="14" font-family="Arial, sans-serif">Look for a small adjustment, not a long sum.</text>

  <rect x="262" y="112" width="198" height="154" rx="18" fill="#ECFDF5" stroke="#86EFAC"/>
  <text x="280" y="142" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">Bridge through the base</text>
  <text x="280" y="176" fill="#1E293B" font-size="20" font-family="Arial, sans-serif" font-weight="700">complete -> adjust</text>
  <text x="280" y="208" fill="#475569" font-size="14" font-family="Arial, sans-serif">Reach the friendly base first, then finish the rest.</text>

  <rect x="482" y="112" width="198" height="154" rx="18" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="500" y="142" fill="#9A3412" font-size="18" font-family="Arial, sans-serif" font-weight="700">Mental Cue</text>
  <text x="500" y="176" fill="#1E293B" font-size="20" font-family="Arial, sans-serif" font-weight="700">base -> gap -> final answer</text>
  <text x="500" y="208" fill="#475569" font-size="14" font-family="Arial, sans-serif">This keeps the method visual without locking it to one example.</text>
</svg>
