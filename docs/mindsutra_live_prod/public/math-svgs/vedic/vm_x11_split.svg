<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="340" height="200" font-family="Nunito,sans-serif">
  <rect width="340" height="200" rx="14" fill="#fdf4ff"/>
  <text x="170" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#581c87">The 11-Trick — Split and Add</text>
  <text x="170" y="42" text-anchor="middle" font-size="11" fill="#7e22ce">Example: 53 × 11 = ?</text>

  <!-- 5  3 -->
  <rect x="80" y="55" width="52" height="52" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="106" y="88" text-anchor="middle" font-size="30" font-weight="800" fill="#6d28d9">5</text>

  <rect x="208" y="55" width="52" height="52" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="234" y="88" text-anchor="middle" font-size="30" font-weight="800" fill="#6d28d9">3</text>

  <!-- Middle sum -->
  <rect x="144" y="75" width="52" height="32" rx="8" fill="#f59e0b"/>
  <text x="170" y="96" text-anchor="middle" font-size="18" font-weight="800" fill="white">8</text>
  <text x="170" y="116" text-anchor="middle" font-size="10" fill="#78350f">5+3=8</text>

  <!-- Arrows from 5 and 3 to middle -->
  <line x1="132" y1="88" x2="144" y2="91" stroke="#8b5cf6" stroke-width="2" marker-end="url(#vArr)"/>
  <line x1="208" y1="88" x2="196" y2="91" stroke="#8b5cf6" stroke-width="2" marker-end="url(#vArr)"/>

  <!-- Result label -->
  <text x="170" y="140" text-anchor="middle" font-size="12" fill="#581c87">Keep first digit — Insert sum — Keep last digit</text>

  <!-- Answer boxes -->
  <rect x="80" y="152" width="44" height="38" rx="8" fill="#6d28d9"/>
  <text x="102" y="177" text-anchor="middle" font-size="22" font-weight="800" fill="white">5</text>

  <rect x="148" y="152" width="44" height="38" rx="8" fill="#f59e0b"/>
  <text x="170" y="177" text-anchor="middle" font-size="22" font-weight="800" fill="white">8</text>

  <rect x="216" y="152" width="44" height="38" rx="8" fill="#6d28d9"/>
  <text x="238" y="177" text-anchor="middle" font-size="22" font-weight="800" fill="white">3</text>

  <text x="170" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#581c87">= 583 ✓</text>

  <defs>
    <marker id="vArr" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#8b5cf6"/>
    </marker>
  </defs>
</svg>
