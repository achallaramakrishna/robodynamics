<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="100" y="20" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Consonant Position (क/ख/च)</text>

  <!-- Head outline -->
  <circle cx="100" cy="80" r="45" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Face features -->
  <!-- Eyes -->
  <circle cx="85" cy="65" r="5" fill="#333"/>
  <circle cx="115" cy="65" r="5" fill="#333"/>

  <!-- Nose -->
  <line x1="100" y1="65" x2="100" y2="80" stroke="#333" stroke-width="1.5"/>

  <!-- Mouth - CONSONANT NEUTRAL -->
  <path d="M 80 95 Q 100 110 120 95" fill="#FF6B6B" stroke="#333" stroke-width="2"/>

  <!-- Tongue position indicators -->
  <g id="tongue-back">
    <ellipse cx="100" cy="115" rx="25" ry="12" fill="none" stroke="#FF8C8C" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="100" y="120" font-size="10" text-anchor="middle" fill="#FF8C8C">Tongue</text>
  </g>

  <!-- Palate indicator -->
  <path d="M 85 85 Q 100 75 115 85" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="130" y="82" font-size="10" fill="#333">Palate</text>

  <!-- Teeth -->
  <line x1="80" y1="90" x2="120" y2="90" stroke="#333" stroke-width="1"/>
  <line x1="80" y1="95" x2="120" y2="95" stroke="#333" stroke-width="0.5"/>
  <line x1="85" y1="90" x2="85" y2="95" stroke="#333" stroke-width="0.5"/>
  <line x1="95" y1="90" x2="95" y2="95" stroke="#333" stroke-width="0.5"/>
  <line x1="105" y1="90" x2="105" y2="95" stroke="#333" stroke-width="0.5"/>
  <line x1="115" y1="90" x2="115" y2="95" stroke="#333" stroke-width="0.5"/>

  <!-- Label -->
  <text x="100" y="180" font-size="14" text-anchor="middle" fill="#333">Consonant Articulation</text>
  <text x="100" y="200" font-size="12" text-anchor="middle" fill="#666">Tongue touches roof or teeth</text>
  <text x="100" y="220" font-size="12" text-anchor="middle" fill="#666">Creates stop or friction</text>
</svg>
