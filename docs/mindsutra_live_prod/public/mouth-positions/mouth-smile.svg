<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="100" y="20" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Smile Mouth (इ/ई)</text>

  <!-- Head outline -->
  <circle cx="100" cy="80" r="45" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Face features -->
  <!-- Eyes -->
  <circle cx="85" cy="65" r="5" fill="#333"/>
  <circle cx="115" cy="65" r="5" fill="#333"/>
  <!-- Happy eyes -->
  <path d="M 80 65 Q 85 70 90 65" fill="none" stroke="#333" stroke-width="1"/>
  <path d="M 110 65 Q 115 70 120 65" fill="none" stroke="#333" stroke-width="1"/>

  <!-- Nose -->
  <line x1="100" y1="65" x2="100" y2="80" stroke="#333" stroke-width="1.5"/>

  <!-- Mouth - SMILE (stretched horizontally) -->
  <path d="M 75 100 Q 100 115 125 100" fill="#FF6B6B" stroke="#333" stroke-width="2"/>
  <path d="M 75 100 Q 100 105 125 100" fill="#FFB3B3" stroke="none"/>

  <!-- Teeth hint -->
  <line x1="85" y1="100" x2="85" y2="105" stroke="#333" stroke-width="0.5"/>
  <line x1="100" y1="100" x2="100" y2="105" stroke="#333" stroke-width="0.5"/>
  <line x1="115" y1="100" x2="115" y2="105" stroke="#333" stroke-width="0.5"/>

  <!-- Label -->
  <text x="100" y="180" font-size="14" text-anchor="middle" fill="#333">Sound: इ or ई</text>
  <text x="100" y="200" font-size="12" text-anchor="middle" fill="#666">Mouth stretched in smile</text>
  <text x="100" y="220" font-size="12" text-anchor="middle" fill="#666">Smaller opening</text>
</svg>
