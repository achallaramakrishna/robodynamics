<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="100" y="20" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Wide Open Mouth (अ/आ)</text>

  <!-- Head outline -->
  <circle cx="100" cy="80" r="45" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Face features -->
  <!-- Eyes -->
  <circle cx="85" cy="65" r="5" fill="#333"/>
  <circle cx="115" cy="65" r="5" fill="#333"/>

  <!-- Nose -->
  <line x1="100" y1="65" x2="100" y2="80" stroke="#333" stroke-width="1.5"/>

  <!-- Mouth - WIDE OPEN -->
  <ellipse cx="100" cy="100" rx="30" ry="25" fill="#FF6B6B" stroke="#333" stroke-width="2"/>

  <!-- Tongue visible -->
  <ellipse cx="100" cy="110" rx="20" ry="15" fill="#FF8C8C" stroke="none"/>

  <!-- Throat -->
  <path d="M 85 125 Q 100 140 115 125" fill="#FFB3B3" stroke="#333" stroke-width="1"/>

  <!-- Label -->
  <text x="100" y="180" font-size="14" text-anchor="middle" fill="#333">Sound: अ or आ</text>
  <text x="100" y="200" font-size="12" text-anchor="middle" fill="#666">Mouth very open</text>
  <text x="100" y="220" font-size="12" text-anchor="middle" fill="#666">Like saying "Ah" at doctor</text>
</svg>
