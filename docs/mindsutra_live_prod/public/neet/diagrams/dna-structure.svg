<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label { font-size: 12px; font-weight: bold; fill: #333; }
      .text { font-size: 10px; fill: #555; }
      .sugar { fill: #e74c3c; }
      .phosphate { fill: #3498db; }
      .base { fill: #27ae60; }
      .bond { stroke-width: 2; }
    </style>
  </defs>

  <!-- Title -->
  <text x="200" y="25" class="label" text-anchor="middle" font-size="16">DNA STRUCTURE</text>

  <!-- Double Helix Backbone (Left) -->
  <path d="M 100 60 Q 120 120 100 180 Q 80 240 100 300 Q 120 360 100 420"
        stroke="#3498db" stroke-width="4" fill="none"/>

  <!-- Double Helix Backbone (Right) -->
  <path d="M 300 60 Q 280 120 300 180 Q 320 240 300 300 Q 280 360 300 420"
        stroke="#3498db" stroke-width="4" fill="none"/>

  <!-- Hydrogen Bonds (connecting bases) -->
  <line x1="105" y1="90" x2="295" y2="90" stroke="#27ae60" stroke-width="2"/>
  <line x1="105" y1="150" x2="295" y2="150" stroke="#27ae60" stroke-width="2"/>
  <line x1="105" y1="210" x2="295" y2="210" stroke="#27ae60" stroke-width="2"/>
  <line x1="105" y1="270" x2="295" y2="270" stroke="#27ae60" stroke-width="2"/>
  <line x1="105" y1="330" x2="295" y2="330" stroke="#27ae60" stroke-width="2"/>
  <line x1="105" y1="390" x2="295" y2="390" stroke="#27ae60" stroke-width="2"/>

  <!-- Base Pairs (simplified) -->
  <circle cx="110" cy="90" r="5" class="base"/>
  <circle cx="290" cy="90" r="5" class="base"/>

  <circle cx="110" cy="150" r="5" class="base"/>
  <circle cx="290" cy="150" r="5" class="base"/>

  <circle cx="110" cy="210" r="5" class="base"/>
  <circle cx="290" cy="210" r="5" class="base"/>

  <circle cx="110" cy="270" r="5" class="base"/>
  <circle cx="290" cy="270" r="5" class="base"/>

  <circle cx="110" cy="330" r="5" class="base"/>
  <circle cx="290" cy="330" r="5" class="base"/>

  <circle cx="110" cy="390" r="5" class="base"/>
  <circle cx="290" cy="390" r="5" class="base"/>

  <!-- Sugar-Phosphate Backbone Labels -->
  <circle cx="80" cy="80" r="6" class="phosphate"/>
  <text x="70" y="45" class="label" font-size="11">Phosphate</text>

  <circle cx="80" cy="120" r="6" class="sugar"/>
  <text x="70" y="140" class="label" font-size="11">Sugar</text>

  <!-- Base Pair Label -->
  <text x="200" y="115" class="label" text-anchor="middle" font-size="11">Nitrogenous Bases</text>

  <!-- Legend Box -->
  <rect x="20" y="440" width="360" height="50" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="3"/>
  <text x="35" y="460" class="text"><tspan font-weight="bold">Components:</tspan></text>
  <text x="35" y="475" class="text">• Phosphate groups (blue) • Deoxyribose sugar (red) • Nitrogenous bases (green)</text>

  <!-- Direction arrows -->
  <text x="50" y="35" class="label" font-size="11">5'</text>
  <text x="50" y="430" class="label" font-size="11">3'</text>
  <text x="350" y="35" class="label" font-size="11">3'</text>
  <text x="350" y="430" class="label" font-size="11">5'</text>
</svg>