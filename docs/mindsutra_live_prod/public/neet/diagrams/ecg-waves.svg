<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" width="560" height="580" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="560" height="580" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="280" y="30" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">ECG — Electrocardiogram Waves</text>
  <text x="280" y="48" text-anchor="middle" fill="#64748b" font-size="11">NEET Biology | Body Fluids and Circulation</text>

  <!-- ═══════════════════════════════════ -->
  <!-- GRID BACKGROUND for ECG            -->
  <!-- ═══════════════════════════════════ -->
  <rect x="30" y="60" width="500" height="200" rx="6" fill="#0d1117" stroke="#1e293b" stroke-width="1"/>

  <!-- Grid lines (minor) -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.6">
    <!-- Vertical -->
    <line x1="80" y1="60" x2="80" y2="260"/>
    <line x1="130" y1="60" x2="130" y2="260"/>
    <line x1="180" y1="60" x2="180" y2="260"/>
    <line x1="230" y1="60" x2="230" y2="260"/>
    <line x1="280" y1="60" x2="280" y2="260"/>
    <line x1="330" y1="60" x2="330" y2="260"/>
    <line x1="380" y1="60" x2="380" y2="260"/>
    <line x1="430" y1="60" x2="430" y2="260"/>
    <line x1="480" y1="60" x2="480" y2="260"/>
    <!-- Horizontal -->
    <line x1="30" y1="110" x2="530" y2="110"/>
    <line x1="30" y1="160" x2="530" y2="160"/>
    <line x1="30" y1="210" x2="530" y2="210"/>
  </g>

  <!-- Baseline -->
  <line x1="30" y1="180" x2="530" y2="180" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ═══════════════════════════════════ -->
  <!-- ECG WAVEFORM                       -->
  <!-- ═══════════════════════════════════ -->
  <!-- One complete cardiac cycle: P → Q → R → S → T -->
  <!-- Starting flat line -->
  <polyline points="
    30,180
    60,180
    75,180
    80,170
    90,190
    100,180
    115,180
    125,178
    130,250
    140,70
    150,250
    155,180
    170,180
    180,185
    210,185
    220,175
    240,175
    255,183
    270,180
    300,180
    330,180
    360,180
    390,180
    420,180
    450,180
    480,180
    530,180"
    fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Second cycle (faded) for context -->
  <polyline points="
    300,180
    310,180
    320,170
    330,190
    340,180
    350,178
    355,250
    365,70
    375,250
    380,180
    390,185
    420,185
    430,175
    450,175
    460,183
    480,180
    530,180"
    fill="none" stroke="#166534" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.5"/>

  <!-- ═══════════════════════════════════ -->
  <!-- WAVE LABELS with leader lines      -->
  <!-- ═══════════════════════════════════ -->

  <!-- P wave label -->
  <line x1="85" y1="170" x2="85" y2="95" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="85" cy="170" r="3" fill="#38bdf8"/>
  <rect x="58" y="75" width="54" height="20" rx="4" fill="#1e3a5f"/>
  <text x="85" y="89" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="bold">P wave</text>

  <!-- Q wave label -->
  <line x1="125" y1="178" x2="95" y2="248" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="125" cy="178" r="3" fill="#fbbf24"/>
  <rect x="64" y="250" width="54" height="20" rx="4" fill="#422006"/>
  <text x="91" y="264" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="bold">Q</text>

  <!-- R wave label (tallest peak) -->
  <line x1="140" y1="70" x2="170" y2="52" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="140" cy="70" r="4" fill="#f87171"/>
  <rect x="155" y="38" width="54" height="20" rx="4" fill="#450a0a"/>
  <text x="182" y="52" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">R wave</text>

  <!-- S wave label -->
  <line x1="155" y1="250" x2="195" y2="270" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="155" cy="250" r="3" fill="#a78bfa"/>
  <rect x="190" y="260" width="30" height="20" rx="4" fill="#2e1065"/>
  <text x="205" y="274" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">S</text>

  <!-- T wave label -->
  <line x1="220" y1="175" x2="220" y2="95" stroke="#fb923c" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="220" cy="175" r="3" fill="#fb923c"/>
  <rect x="196" y="75" width="54" height="20" rx="4" fill="#431407"/>
  <text x="223" y="89" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="bold">T wave</text>

  <!-- Baseline label -->
  <text x="535" y="184" fill="#475569" font-size="9">baseline</text>

  <!-- ═══════════════════════════════════ -->
  <!-- INTERVAL BRACKETS                  -->
  <!-- ═══════════════════════════════════ -->

  <!-- PR interval -->
  <line x1="75" y1="268" x2="155" y2="268" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="75" y1="264" x2="75" y2="272" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="155" y1="264" x2="155" y2="272" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="115" y="282" text-anchor="middle" fill="#7dd3fc" font-size="9">P-R interval</text>
  <text x="115" y="292" text-anchor="middle" fill="#7dd3fc" font-size="9">0.12–0.20 s</text>

  <!-- QRS complex bracket -->
  <line x1="125" y1="295" x2="160" y2="295" stroke="#f87171" stroke-width="1.5"/>
  <line x1="125" y1="291" x2="125" y2="299" stroke="#f87171" stroke-width="1.5"/>
  <line x1="160" y1="291" x2="160" y2="299" stroke="#f87171" stroke-width="1.5"/>
  <text x="143" y="310" text-anchor="middle" fill="#fca5a5" font-size="9">QRS</text>
  <text x="143" y="320" text-anchor="middle" fill="#fca5a5" font-size="9">0.06–0.10 s</text>

  <!-- QT interval -->
  <line x1="125" y1="330" x2="260" y2="330" stroke="#fb923c" stroke-width="1.5"/>
  <line x1="125" y1="326" x2="125" y2="334" stroke="#fb923c" stroke-width="1.5"/>
  <line x1="260" y1="326" x2="260" y2="334" stroke="#fb923c" stroke-width="1.5"/>
  <text x="193" y="344" text-anchor="middle" fill="#fdba74" font-size="9">Q-T interval</text>

  <!-- ═══════════════════════════════════ -->
  <!-- WAVE MEANING TABLE                 -->
  <!-- ═══════════════════════════════════ -->
  <rect x="20" y="355" width="520" height="145" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="280" y="374" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="bold">WHAT EACH WAVE REPRESENTS</text>

  <!-- Table rows -->
  <!-- Row P -->
  <rect x="30" y="382" width="500" height="22" rx="0" fill="#0f172a"/>
  <circle cx="52" cy="393" r="7" fill="#38bdf8"/>
  <text x="52" y="397" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="bold">P</text>
  <text x="72" y="397" fill="#7dd3fc" font-size="11" font-weight="bold">P wave</text>
  <text x="140" y="397" fill="#cbd5e1" font-size="10">— Atrial depolarisation (atria contract)</text>
  <text x="415" y="397" fill="#64748b" font-size="9">SA node fires → atria</text>

  <!-- Row QRS -->
  <rect x="30" y="404" width="500" height="22" rx="0" fill="#1a0a0a"/>
  <circle cx="52" cy="415" r="7" fill="#f87171"/>
  <text x="52" y="419" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="bold">QRS</text>
  <text x="72" y="419" fill="#fca5a5" font-size="11" font-weight="bold">QRS complex</text>
  <text x="180" y="419" fill="#cbd5e1" font-size="10">— Ventricular depolarisation (ventricles contract)</text>
  <text x="415" y="419" fill="#64748b" font-size="9">AV node → Bundle of His</text>

  <!-- Row T -->
  <rect x="30" y="426" width="500" height="22" rx="0" fill="#0f172a"/>
  <circle cx="52" cy="437" r="7" fill="#fb923c"/>
  <text x="52" y="441" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="bold">T</text>
  <text x="72" y="441" fill="#fdba74" font-size="11" font-weight="bold">T wave</text>
  <text x="140" y="441" fill="#cbd5e1" font-size="10">— Ventricular repolarisation (ventricles relax)</text>
  <text x="415" y="441" fill="#64748b" font-size="9">Recovery phase</text>

  <!-- Note about atrial repolarisation -->
  <rect x="30" y="450" width="500" height="18" rx="0" fill="#172033"/>
  <text x="280" y="463" text-anchor="middle" fill="#7dd3fc" font-size="9">★ Atrial repolarisation hidden within QRS complex — not visible as separate wave</text>

  <!-- Conduction pathway -->
  <rect x="30" y="470" width="500" height="22" rx="0" fill="#0a1628"/>
  <text x="40" y="485" fill="#64748b" font-size="10" font-weight="bold">Conduction:</text>
  <text x="120" y="485" fill="#94a3b8" font-size="10">SA node → AV node → Bundle of His → Purkinje fibres → ventricular walls</text>

  <!-- ═══════════════════════════════════ -->
  <!-- NEET TRAPS                         -->
  <!-- ═══════════════════════════════════ -->
  <rect x="20" y="512" width="520" height="58" rx="8" fill="#1c0a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="280" y="529" text-anchor="middle" fill="#f87171" font-size="11" font-weight="bold">NEET TRAPS</text>
  <text x="32" y="544" fill="#fca5a5" font-size="10">① SA node = pacemaker (60–72 beats/min). AV node = secondary pacemaker (40–60/min) if SA fails</text>
  <text x="32" y="558" fill="#fca5a5" font-size="10">② P wave = ATRIAL depolarisation only. QRS = VENTRICULAR depolarisation (NOT both chambers)</text>
  <text x="32" y="572" fill="#fca5a5" font-size="10">③ Normal heart rate in adult = 72 bpm. Tachycardia &gt;100 bpm. Bradycardia &lt;60 bpm</text>

</svg>
