<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 16px; font-weight: bold; fill: #2c3e50; }
      .label { font-size: 11px; font-weight: bold; fill: #333; }
      .text { font-size: 10px; fill: #555; }
      .positive { fill: #e74c3c; }
      .negative { fill: #3498db; }
      .fieldline { stroke: #f39c12; stroke-width: 1.5; fill: none; }
      .arrow { marker-end: url(#arrow-orange); }
    </style>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f39c12"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="250" y="30" class="title" text-anchor="middle">ELECTRIC FIELD PATTERNS</text>

  <!-- ===== POSITIVE CHARGE ===== -->
  <g id="positive-charge">
    <!-- Central charge -->
    <circle cx="125" cy="150" r="20" class="positive" stroke="#c0392b" stroke-width="2"/>
    <text x="125" y="157" class="label" text-anchor="middle" fill="white" font-size="14">+Q</text>

    <!-- Field lines radiating outward -->
    <path d="M 145 150 L 185 150" class="fieldline arrow"/>
    <path d="M 140 130 L 173 110" class="fieldline arrow"/>
    <path d="M 140 170 L 173 190" class="fieldline arrow"/>
    <path d="M 125 130 L 125 90" class="fieldline arrow"/>
    <path d="M 125 170 L 125 210" class="fieldline arrow"/>
    <path d="M 110 130 L 77 110" class="fieldline arrow"/>
    <path d="M 110 170 L 77 190" class="fieldline arrow"/>
    <path d="M 105 150 L 65 150" class="fieldline arrow"/>

    <!-- Label -->
    <text x="125" y="240" class="label" text-anchor="middle" font-size="11">Positive Charge</text>
    <text x="125" y="256" class="text" text-anchor="middle" font-size="9">Field lines point outward</text>
  </g>

  <!-- ===== NEGATIVE CHARGE ===== -->
  <g id="negative-charge">
    <!-- Central charge -->
    <circle cx="375" cy="150" r="20" class="negative" stroke="#2980b9" stroke-width="2"/>
    <text x="375" y="157" class="label" text-anchor="middle" fill="white" font-size="14">-Q</text>

    <!-- Field lines pointing inward -->
    <path d="M 355 150 L 315 150" class="fieldline" style="marker-end: url(#arrow-blue);"/>
    <path d="M 360 130 L 327 110" class="fieldline" style="marker-end: url(#arrow-blue);"/>
    <path d="M 360 170 L 327 190" class="fieldline" style="marker-end: url(#arrow-blue);"/>
    <path d="M 375 130 L 375 90" class="fieldline" style="marker-end: url(#arrow-blue);"/>
    <path d="M 375 170 L 375 210" class="fieldline" style="marker-end: url(#arrow-blue);"/>
    <path d="M 390 130 L 423 110" class="fieldline" style="marker-end: url(#arrow-blue);"/>
    <path d="M 390 170 L 423 190" class="fieldline" style="marker-end: url(#arrow-blue);"/>
    <path d="M 395 150 L 435 150" class="fieldline" style="marker-end: url(#arrow-blue);"/>

    <!-- Label -->
    <text x="375" y="240" class="label" text-anchor="middle" font-size="11">Negative Charge</text>
    <text x="375" y="256" class="text" text-anchor="middle" font-size="9">Field lines point inward</text>

    <!-- Arrow marker for blue -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3498db"/>
    </marker>
  </g>

  <!-- ===== DIPOLE (Bottom) ===== -->
  <g id="dipole">
    <!-- Positive charge -->
    <circle cx="180" cy="380" r="15" class="positive" stroke="#c0392b" stroke-width="2"/>
    <text x="180" y="386" class="label" text-anchor="middle" fill="white" font-size="12">+</text>

    <!-- Negative charge -->
    <circle cx="320" cy="380" r="15" class="negative" stroke="#2980b9" stroke-width="2"/>
    <text x="320" y="386" class="label" text-anchor="middle" fill="white" font-size="12">−</text>

    <!-- Field lines -->
    <path d="M 195 365 Q 220 330 305 365" class="fieldline" stroke="#f39c12"/>
    <path d="M 195 395 Q 220 430 305 395" class="fieldline" stroke="#f39c12"/>
    <path d="M 165 380 Q 150 350 150 330" class="fieldline" stroke="#f39c12"/>
    <path d="M 165 380 Q 150 410 150 430" class="fieldline" stroke="#f39c12"/>
    <path d="M 335 380 Q 350 350 350 330" class="fieldline" stroke="#f39c12"/>
    <path d="M 335 380 Q 350 410 350 430" class="fieldline" stroke="#f39c12"/>

    <!-- Label -->
    <text x="250" y="465" class="label" text-anchor="middle" font-size="11">Electric Dipole</text>
    <text x="250" y="481" class="text" text-anchor="middle" font-size="9">Field lines from + to −</text>
  </g>

  <!-- Legend -->
  <rect x="20" y="320" width="460" height="40" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="3"/>
  <text x="30" y="340" class="label" font-size="10">Key: Electric field strength decreases with distance (E ∝ 1/r²)</text>
  <text x="30" y="356" class="text">Field lines start from + charges and end on − charges</text>
</svg>