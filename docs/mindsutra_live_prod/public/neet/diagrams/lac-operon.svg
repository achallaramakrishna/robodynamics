<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 660" width="580" height="660" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="580" height="660" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="290" y="30" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">Lac Operon — Gene Regulation</text>
  <text x="290" y="48" text-anchor="middle" fill="#64748b" font-size="11">NEET Biology | Molecular Biology</text>

  <!-- ═══════════════════════════════════ -->
  <!-- SECTION A: REPRESSED (no lactose)  -->
  <!-- ═══════════════════════════════════ -->

  <!-- Section A header -->
  <rect x="20" y="60" width="540" height="22" rx="5" fill="#1e3a5f"/>
  <text x="290" y="76" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">STATE 1 — Lactose ABSENT (Operon OFF)</text>

  <!-- DNA strand line -->
  <line x1="30" y1="130" x2="550" y2="130" stroke="#475569" stroke-width="2"/>
  <line x1="30" y1="136" x2="550" y2="136" stroke="#334155" stroke-width="2"/>

  <!-- i gene (regulatory gene) -->
  <rect x="32" y="110" width="72" height="38" rx="4" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="68" y="126" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="bold">i gene</text>
  <text x="68" y="138" text-anchor="middle" fill="#93c5fd" font-size="9">(regulator)</text>

  <!-- Promoter -->
  <rect x="116" y="110" width="52" height="38" rx="4" fill="#1e2d1e" stroke="#4ade80" stroke-width="1.5"/>
  <text x="142" y="126" text-anchor="middle" fill="#86efac" font-size="10" font-weight="bold">P</text>
  <text x="142" y="138" text-anchor="middle" fill="#86efac" font-size="9">Promoter</text>

  <!-- Operator -->
  <rect x="180" y="110" width="52" height="38" rx="4" fill="#2d1b1b" stroke="#f87171" stroke-width="1.5"/>
  <text x="206" y="126" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">O</text>
  <text x="206" y="138" text-anchor="middle" fill="#fca5a5" font-size="9">Operator</text>

  <!-- Structural genes -->
  <rect x="244" y="110" width="68" height="38" rx="4" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="278" y="126" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">lacZ</text>
  <text x="278" y="138" text-anchor="middle" fill="#a78bfa" font-size="9">β-galactosidase</text>

  <rect x="322" y="110" width="60" height="38" rx="4" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="352" y="126" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">lacY</text>
  <text x="352" y="138" text-anchor="middle" fill="#a78bfa" font-size="9">Permease</text>

  <rect x="392" y="110" width="60" height="38" rx="4" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="422" y="126" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">lacA</text>
  <text x="422" y="138" text-anchor="middle" fill="#a78bfa" font-size="9">Transacetylase</text>

  <!-- Repressor protein (active) blocking operator -->
  <!-- Repressor shape -->
  <ellipse cx="206" cy="88" rx="26" ry="16" fill="#dc2626" stroke="#fca5a5" stroke-width="1.5" opacity="0.9"/>
  <text x="206" y="92" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Repressor</text>
  <!-- Arrow from repressor down to operator -->
  <line x1="206" y1="104" x2="206" y2="112" stroke="#f87171" stroke-width="2" marker-end="url(#redArrow)"/>

  <!-- BLOCKED symbol on structural genes -->
  <rect x="244" y="106" width="208" height="46" rx="4" fill="#dc2626" opacity="0.12" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="350" y="172" text-anchor="middle" fill="#f87171" font-size="11" font-weight="bold">✗ TRANSCRIPTION BLOCKED</text>

  <!-- i gene → repressor mRNA → repressor protein -->
  <path d="M68,110 Q68,92 110,88 Q140,86 180,88" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#blueArrow)"/>
  <text x="112" y="80" fill="#7dd3fc" font-size="9">always transcribed</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- SECTION B: INDUCED (lactose present)   -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Section B header -->
  <rect x="20" y="210" width="540" height="22" rx="5" fill="#14532d"/>
  <text x="290" y="226" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="bold">STATE 2 — Lactose PRESENT (Operon ON)</text>

  <!-- DNA strand line -->
  <line x1="30" y1="280" x2="550" y2="280" stroke="#475569" stroke-width="2"/>
  <line x1="30" y1="286" x2="550" y2="286" stroke="#334155" stroke-width="2"/>

  <!-- i gene -->
  <rect x="32" y="260" width="72" height="38" rx="4" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="68" y="276" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="bold">i gene</text>
  <text x="68" y="288" text-anchor="middle" fill="#93c5fd" font-size="9">(regulator)</text>

  <!-- Promoter -->
  <rect x="116" y="260" width="52" height="38" rx="4" fill="#1e2d1e" stroke="#4ade80" stroke-width="1.5"/>
  <text x="142" y="276" text-anchor="middle" fill="#86efac" font-size="10" font-weight="bold">P</text>
  <text x="142" y="288" text-anchor="middle" fill="#86efac" font-size="9">Promoter</text>

  <!-- Operator (open — no repressor) -->
  <rect x="180" y="260" width="52" height="38" rx="4" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="206" y="276" text-anchor="middle" fill="#86efac" font-size="10" font-weight="bold">O</text>
  <text x="206" y="288" text-anchor="middle" fill="#86efac" font-size="9">OPEN</text>

  <!-- Structural genes (active) -->
  <rect x="244" y="260" width="68" height="38" rx="4" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="278" y="276" text-anchor="middle" fill="#86efac" font-size="10" font-weight="bold">lacZ</text>
  <text x="278" y="288" text-anchor="middle" fill="#a7f3d0" font-size="9">β-galactosidase</text>

  <rect x="322" y="260" width="60" height="38" rx="4" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="352" y="276" text-anchor="middle" fill="#86efac" font-size="10" font-weight="bold">lacY</text>
  <text x="352" y="288" text-anchor="middle" fill="#a7f3d0" font-size="9">Permease</text>

  <rect x="392" y="260" width="60" height="38" rx="4" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="422" y="276" text-anchor="middle" fill="#86efac" font-size="10" font-weight="bold">lacA</text>
  <text x="422" y="288" text-anchor="middle" fill="#a7f3d0" font-size="9">Transacetylase</text>

  <!-- Inducer (allolactose) binding repressor -->
  <!-- Repressor grayed out + inducer -->
  <ellipse cx="155" cy="245" rx="22" ry="13" fill="#6b7280" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="155" y="249" text-anchor="middle" fill="#e5e7eb" font-size="8">Repressor</text>
  <text x="155" y="259" text-anchor="middle" fill="#e5e7eb" font-size="8">(inactive)</text>

  <!-- Inducer molecule -->
  <ellipse cx="206" cy="245" rx="20" ry="12" fill="#fbbf24" stroke="#fde68a" stroke-width="1.5"/>
  <text x="206" y="249" text-anchor="middle" fill="#1c1917" font-size="8" font-weight="bold">Inducer</text>
  <text x="206" y="259" text-anchor="middle" fill="#451a03" font-size="7">(allolactose)</text>

  <!-- Arrow: inducer binds repressor -->
  <path d="M186,245 Q172,240 170,248" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#yellowArrow)"/>
  <text x="140" y="232" fill="#fde68a" font-size="9">binds &amp; inactivates</text>

  <!-- RNA polymerase on promoter -->
  <ellipse cx="142" cy="252" rx="18" ry="11" fill="#1d4ed8" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="142" y="255" text-anchor="middle" fill="#dbeafe" font-size="8">RNA</text>
  <text x="142" y="264" text-anchor="middle" fill="#dbeafe" font-size="7">Polymerase</text>

  <!-- Transcription arrow -->
  <path d="M196,279 L540,279" stroke="#4ade80" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#greenArrow)"/>
  <text x="380" y="273" fill="#86efac" font-size="10" font-weight="bold">→ mRNA transcribed</text>

  <!-- Proteins produced -->
  <text x="290" y="320" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="bold">✓ Enzymes produced → Lactose digested</text>

  <!-- ═══════════════════════════════════ -->
  <!-- MECHANISM SUMMARY TABLE            -->
  <!-- ═══════════════════════════════════ -->
  <rect x="20" y="340" width="540" height="175" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="290" y="360" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="bold">NEET QUICK SUMMARY</text>

  <!-- Table header -->
  <rect x="30" y="368" width="520" height="20" rx="3" fill="#0f172a"/>
  <text x="120" y="382" text-anchor="middle" fill="#64748b" font-size="10" font-weight="bold">Condition</text>
  <text x="280" y="382" text-anchor="middle" fill="#64748b" font-size="10" font-weight="bold">Repressor</text>
  <text x="400" y="382" text-anchor="middle" fill="#64748b" font-size="10" font-weight="bold">Operator</text>
  <text x="505" y="382" text-anchor="middle" fill="#64748b" font-size="10" font-weight="bold">Genes</text>

  <!-- Row 1 -->
  <line x1="30" y1="390" x2="550" y2="390" stroke="#334155" stroke-width="0.5"/>
  <text x="120" y="403" text-anchor="middle" fill="#fca5a5" font-size="10">No lactose</text>
  <text x="280" y="403" text-anchor="middle" fill="#f87171" font-size="10">Active (binds O)</text>
  <text x="400" y="403" text-anchor="middle" fill="#f87171" font-size="10">BLOCKED</text>
  <text x="505" y="403" text-anchor="middle" fill="#f87171" font-size="10">OFF</text>

  <!-- Row 2 -->
  <line x1="30" y1="410" x2="550" y2="410" stroke="#334155" stroke-width="0.5"/>
  <text x="120" y="423" text-anchor="middle" fill="#86efac" font-size="10">Lactose present</text>
  <text x="280" y="423" text-anchor="middle" fill="#4ade80" font-size="10">Inactive (inducer)</text>
  <text x="400" y="423" text-anchor="middle" fill="#4ade80" font-size="10">OPEN</text>
  <text x="505" y="423" text-anchor="middle" fill="#4ade80" font-size="10">ON</text>

  <!-- Row 3 -->
  <line x1="30" y1="430" x2="550" y2="430" stroke="#334155" stroke-width="0.5"/>
  <text x="120" y="443" text-anchor="middle" fill="#fde68a" font-size="10">Glucose + Lactose</text>
  <text x="280" y="443" text-anchor="middle" fill="#fbbf24" font-size="10">Inactive</text>
  <text x="400" y="443" text-anchor="middle" fill="#fbbf24" font-size="10">open (but weak)</text>
  <text x="505" y="443" text-anchor="middle" fill="#fbbf24" font-size="10">low</text>

  <!-- Glucose preference note -->
  <rect x="30" y="455" width="520" height="20" rx="3" fill="#172033"/>
  <text x="290" y="469" text-anchor="middle" fill="#7dd3fc" font-size="10">★ Glucose preferred over lactose (catabolite repression) — CAP site inactive when glucose present</text>

  <!-- Key players -->
  <line x1="30" y1="480" x2="550" y2="480" stroke="#334155" stroke-width="0.5"/>
  <text x="80" y="497" fill="#94a3b8" font-size="10" font-weight="bold">Key players:</text>
  <text x="170" y="497" fill="#7dd3fc" font-size="10">i gene → repressor protein</text>
  <text x="355" y="497" fill="#fbbf24" font-size="10">allolactose = actual inducer</text>
  <text x="80" y="510" fill="#94a3b8" font-size="10" font-weight="bold">Products:</text>
  <text x="170" y="510" fill="#a78bfa" font-size="10">lacZ (β-gal) + lacY (permease) + lacA (transacetylase)</text>

  <!-- ═══════════════════════════════════ -->
  <!-- COMMON NEET TRAPS                  -->
  <!-- ═══════════════════════════════════ -->
  <rect x="20" y="528" width="540" height="80" rx="8" fill="#1c0a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="290" y="546" text-anchor="middle" fill="#f87171" font-size="11" font-weight="bold">NEET TRAPS — Don't lose these marks</text>
  <text x="32" y="562" fill="#fca5a5" font-size="10">① Inducer is <tspan font-weight="bold">allolactose</tspan> (not lactose itself) — lactose is converted to allolactose by β-galactosidase</text>
  <text x="32" y="577" fill="#fca5a5" font-size="10">② i gene is NOT part of the operon — it has its own promoter, constitutively expressed</text>
  <text x="32" y="592" fill="#fca5a5" font-size="10">③ The repressor is a <tspan font-weight="bold">protein</tspan> (not RNA) — encoded by i gene</text>
  <text x="32" y="607" fill="#fca5a5" font-size="10">④ Operon concept by <tspan font-weight="bold">Jacob &amp; Monod, 1961</tspan> (Nobel Prize) — E. coli system</text>

  <!-- Arrows defs -->
  <defs>
    <marker id="redArrow" markerWidth="7" markerHeight="7" refX="3" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#f87171"/>
    </marker>
    <marker id="blueArrow" markerWidth="7" markerHeight="7" refX="3" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="greenArrow" markerWidth="7" markerHeight="7" refX="3" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#4ade80"/>
    </marker>
    <marker id="yellowArrow" markerWidth="7" markerHeight="7" refX="3" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#fbbf24"/>
    </marker>
  </defs>

</svg>
