<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 16px; font-weight: bold; fill: #2c3e50; }
      .label { font-size: 11px; font-weight: bold; fill: #333; }
      .text { font-size: 9px; fill: #555; }
      .wave { stroke: #3498db; stroke-width: 2; fill: none; }
      .axis { stroke: #95a5a6; stroke-width: 1; stroke-dasharray: 2,2; }
      .arrow { fill: #2c3e50; }
    </style>
  </defs>

  <!-- Title -->
  <text x="300" y="30" class="title" text-anchor="middle">WAVE PROPERTIES</text>

  <!-- ===== SINUSOIDAL WAVE ===== -->
  <g id="wave">
    <!-- Horizontal axis -->
    <line x1="40" y1="120" x2="560" y2="120" stroke="#95a5a6" stroke-width="2"/>
    <text x="570" y="125" class="label" font-size="10">x</text>

    <!-- Wave -->
    <path d="M 40 120 Q 60 100 80 120 Q 100 140 120 120 Q 140 100 160 120 Q 180 140 200 120 Q 220 100 240 120 Q 260 140 280 120 Q 300 100 320 120 Q 340 140 360 120 Q 380 100 400 120 Q 420 140 440 120 Q 460 100 480 120 Q 500 140 520 120 Q 540 100 560 120"
          class="wave"/>

    <!-- Wavelength indicator -->
    <line x1="40" y1="155" x2="160" y2="155" stroke="#e74c3c" stroke-width="2"/>
    <polygon points="40,155 35,150 35,160" class="arrow"/>
    <polygon points="160,155 165,150 165,160" class="arrow"/>
    <text x="100" y="175" class="label" text-anchor="middle" font-size="10">λ (Wavelength)</text>

    <!-- Amplitude indicator -->
    <line x1="15" y1="100" x2="15" y2="140" stroke="#27ae60" stroke-width="2"/>
    <polygon points="15,100 10,105 20,105" class="arrow"/>
    <polygon points="15,140 10,135 20,135" class="arrow"/>
    <text x="8" y="125" class="label" font-size="10" fill="#27ae60">A</text>
  </g>

  <!-- Crest and Trough labels -->
  <circle cx="80" cy="100" r="3" fill="#e74c3c"/>
  <text x="80" y="85" class="text" text-anchor="middle" font-size="9">Crest</text>

  <circle cx="200" cy="140" r="3" fill="#3498db"/>
  <text x="200" y="160" class="text" text-anchor="middle" font-size="9">Trough</text>

  <!-- ===== FREQUENCY COMPARISON ===== -->
  <text x="40" y="220" class="label" font-size="12">Frequency & Period Comparison:</text>

  <!-- High frequency wave -->
  <g id="high-freq">
    <line x1="40" y1="260" x2="540" y2="260" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 40 260 Q 55 250 70 260 Q 85 270 100 260 Q 115 250 130 260 Q 145 270 160 260 Q 175 250 190 260 Q 205 270 220 260 Q 235 250 250 260 Q 265 270 280 260 Q 295 250 310 260 Q 325 270 340 260"
          class="wave" stroke="#e74c3c"/>
    <text x="20" y="265" class="text" font-size="9">High f</text>
    <text x="350" y="265" class="text" font-size="9">Short λ</text>
  </g>

  <!-- Low frequency wave -->
  <g id="low-freq">
    <line x1="40" y1="310" x2="540" y2="310" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 40 310 Q 95 280 150 310 Q 205 340 260 310 Q 315 280 370 310 Q 425 340 480 310"
          class="wave" stroke="#27ae60"/>
    <text x="20" y="315" class="text" font-size="9">Low f</text>
    <text x="350" y="315" class="text" font-size="9">Long λ</text>
  </g>

  <!-- ===== WAVE EQUATION ===== -->
  <rect x="40" y="340" width="520" height="50" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
  <text x="300" y="360" class="label" text-anchor="middle" font-size="12">Wave Equation: v = f × λ</text>
  <text x="300" y="380" class="text" text-anchor="middle" font-size="10">where v = velocity, f = frequency, λ = wavelength</text>
</svg>