<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="560" height="560" fill="#0f172a" rx="12"/>
  <text x="280" y="30" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">Young's Double Slit Experiment (YDSE)</text>
  <text x="280" y="48" text-anchor="middle" fill="#64748b" font-size="11">NEET Physics | Wave Optics</text>

  <!-- ═══════════════════ -->
  <!-- SOURCE + SLITS     -->
  <!-- ═══════════════════ -->

  <!-- Light source -->
  <circle cx="52" cy="220" r="16" fill="#fbbf24" opacity="0.9"/>
  <circle cx="52" cy="220" r="10" fill="#fef08a"/>
  <text x="52" y="252" text-anchor="middle" fill="#fbbf24" font-size="10">Source</text>
  <text x="52" y="264" text-anchor="middle" fill="#fbbf24" font-size="10">(λ)</text>

  <!-- Incident rays from source -->
  <line x1="68" y1="215" x2="155" y2="190" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4,2" opacity="0.6"/>
  <line x1="68" y1="220" x2="155" y2="220" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4,2" opacity="0.6"/>
  <line x1="68" y1="225" x2="155" y2="250" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4,2" opacity="0.6"/>

  <!-- Single slit barrier (S0) -->
  <rect x="155" y="120" width="10" height="65" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="155" y="195" width="10" height="10" rx="1" fill="#64748b"/><!-- single slit gap -->
  <rect x="155" y="215" width="10" height="65" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="110" text-anchor="middle" fill="#64748b" font-size="9">S₀</text>

  <!-- Double slit barrier -->
  <rect x="240" y="90" width="12" height="95" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <!-- Slit S1 gap -->
  <rect x="240" y="185" width="12" height="14" rx="1" fill="#38bdf8" opacity="0.3"/>
  <circle cx="246" cy="192" r="3" fill="#38bdf8"/>
  <!-- Space between slits -->
  <rect x="240" y="199" width="12" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <!-- Slit S2 gap -->
  <rect x="240" y="221" width="12" height="14" rx="1" fill="#38bdf8" opacity="0.3"/>
  <circle cx="246" cy="228" r="3" fill="#38bdf8"/>
  <!-- Bottom barrier -->
  <rect x="240" y="235" width="12" height="95" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

  <!-- S1 and S2 labels -->
  <text x="238" y="196" text-anchor="end" fill="#38bdf8" font-size="11" font-weight="bold">S₁</text>
  <text x="238" y="232" text-anchor="end" fill="#38bdf8" font-size="11" font-weight="bold">S₂</text>

  <!-- Slit separation 'd' brace -->
  <line x1="260" y1="192" x2="260" y2="228" stroke="#f472b6" stroke-width="1.5"/>
  <line x1="257" y1="192" x2="263" y2="192" stroke="#f472b6" stroke-width="1.5"/>
  <line x1="257" y1="228" x2="263" y2="228" stroke="#f472b6" stroke-width="1.5"/>
  <text x="272" y="214" fill="#f472b6" font-size="11" font-weight="bold">d</text>

  <!-- ═══════════════════════════ -->
  <!-- RAYS FROM S1 AND S2        -->
  <!-- ═══════════════════════════ -->

  <!-- Rays from S1 to screen (fan out) -->
  <line x1="252" y1="192" x2="420" y2="130" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
  <line x1="252" y1="192" x2="420" y2="162" stroke="#38bdf8" stroke-width="1.4" opacity="0.7"/>
  <line x1="252" y1="192" x2="420" y2="210" stroke="#38bdf8" stroke-width="1.8" opacity="0.9"/>
  <line x1="252" y1="192" x2="420" y2="258" stroke="#38bdf8" stroke-width="1.4" opacity="0.7"/>
  <line x1="252" y1="192" x2="420" y2="290" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>

  <!-- Rays from S2 to screen (fan out) -->
  <line x1="252" y1="228" x2="420" y2="130" stroke="#60a5fa" stroke-width="1.2" opacity="0.5"/>
  <line x1="252" y1="228" x2="420" y2="162" stroke="#60a5fa" stroke-width="1.4" opacity="0.7"/>
  <line x1="252" y1="228" x2="420" y2="210" stroke="#60a5fa" stroke-width="1.8" opacity="0.9"/>
  <line x1="252" y1="228" x2="420" y2="258" stroke="#60a5fa" stroke-width="1.4" opacity="0.7"/>
  <line x1="252" y1="228" x2="420" y2="290" stroke="#60a5fa" stroke-width="1.2" opacity="0.5"/>

  <!-- ═══════════════════════════ -->
  <!-- SCREEN WITH FRINGE PATTERN -->
  <!-- ═══════════════════════════ -->

  <!-- Screen background -->
  <rect x="420" y="80" width="22" height="300" rx="3" fill="#0d1117" stroke="#334155" stroke-width="1"/>

  <!-- Fringe pattern (bright = white, dark = black) -->
  <!-- n=0 central max (brightest) -->
  <rect x="421" y="202" width="20" height="16" fill="#ffffff" opacity="0.95"/>
  <!-- n=±1 bright fringes -->
  <rect x="421" y="168" width="20" height="10" fill="#ffffff" opacity="0.75"/>
  <rect x="421" y="242" width="20" height="10" fill="#ffffff" opacity="0.75"/>
  <!-- n=±2 bright fringes -->
  <rect x="421" y="136" width="20" height="8" fill="#ffffff" opacity="0.5"/>
  <rect x="421" y="276" width="20" height="8" fill="#ffffff" opacity="0.5"/>
  <!-- n=±3 faint -->
  <rect x="421" y="108" width="20" height="6" fill="#ffffff" opacity="0.3"/>
  <rect x="421" y="306" width="20" height="6" fill="#ffffff" opacity="0.3"/>

  <!-- Screen label -->
  <text x="431" y="74" text-anchor="middle" fill="#94a3b8" font-size="10">Screen</text>

  <!-- ═══════════════════════════ -->
  <!-- FRINGE LABELS              -->
  <!-- ═══════════════════════════ -->
  <!-- Central fringe -->
  <line x1="442" y1="210" x2="490" y2="210" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="494" y="214" fill="#ffffff" font-size="11" font-weight="bold">n=0 (central)</text>

  <!-- n=1 fringe -->
  <line x1="442" y1="173" x2="490" y2="173" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="494" y="177" fill="#e2e8f0" font-size="10">n=+1</text>
  <line x1="442" y1="247" x2="490" y2="247" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="494" y="251" fill="#e2e8f0" font-size="10">n=−1</text>

  <!-- n=2 -->
  <line x1="442" y1="140" x2="490" y2="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="494" y="144" fill="#94a3b8" font-size="10">n=+2</text>
  <line x1="442" y1="280" x2="490" y2="280" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="494" y="284" fill="#94a3b8" font-size="10">n=−2</text>

  <!-- Fringe width β -->
  <line x1="408" y1="210" x2="408" y2="173" stroke="#fb923c" stroke-width="1.5"/>
  <line x1="405" y1="210" x2="411" y2="210" stroke="#fb923c" stroke-width="1.5"/>
  <line x1="405" y1="173" x2="411" y2="173" stroke="#fb923c" stroke-width="1.5"/>
  <text x="396" y="194" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="bold">β</text>

  <!-- Distance D -->
  <line x1="252" y1="370" x2="420" y2="370" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="252" y1="367" x2="252" y2="373" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="420" y1="367" x2="420" y2="373" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="336" y="386" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">D (slit to screen distance)</text>

  <!-- ═══════════════════════════ -->
  <!-- FORMULA BOX                -->
  <!-- ═══════════════════════════ -->
  <rect x="20" y="405" width="520" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="280" y="424" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="bold">KEY FORMULAE</text>

  <!-- Formula: fringe width -->
  <rect x="30" y="432" width="240" height="40" rx="6" fill="#0f172a"/>
  <text x="150" y="448" text-anchor="middle" fill="#fb923c" font-size="13" font-weight="bold">β = λD / d</text>
  <text x="150" y="466" text-anchor="middle" fill="#94a3b8" font-size="10">Fringe width (all fringes equal)</text>

  <!-- Formula: bright fringe position -->
  <rect x="290" y="432" width="240" height="40" rx="6" fill="#0f172a"/>
  <text x="410" y="448" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">y_n = nλD / d</text>
  <text x="410" y="466" text-anchor="middle" fill="#94a3b8" font-size="10">Position of nth bright fringe</text>

  <!-- Formula: dark fringe -->
  <rect x="30" y="480" width="240" height="40" rx="6" fill="#0f172a"/>
  <text x="150" y="496" text-anchor="middle" fill="#f87171" font-size="12" font-weight="bold">y_dark = (2n−1)λD / 2d</text>
  <text x="150" y="514" text-anchor="middle" fill="#94a3b8" font-size="10">Position of nth dark fringe</text>

  <!-- What affects β -->
  <rect x="290" y="480" width="240" height="40" rx="6" fill="#0f172a"/>
  <text x="410" y="494" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">β increases if:</text>
  <text x="410" y="508" text-anchor="middle" fill="#86efac" font-size="10">↑D, ↑λ, ↓d, or denser medium (↓λ→↓β)</text>

  <!-- NEET tip -->
  <text x="280" y="533" text-anchor="middle" fill="#475569" font-size="9">★ In water: β_water = β_air/n (fringes narrower) | Central fringe always bright (Δ=0)</text>

</svg>
