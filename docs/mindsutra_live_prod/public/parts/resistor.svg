<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120">
  <!-- leads -->
  <line x1="10" y1="60" x2="60" y2="60" stroke="#bbb" stroke-width="3"/>
  <line x1="220" y1="60" x2="270" y2="60" stroke="#bbb" stroke-width="3"/>
  <!-- body -->
  <rect x="60" y="40" width="160" height="40" rx="10" fill="#c8a96e"/>
  <!-- color bands: 220Ω = red-red-brown-gold -->
  <rect x="85" y="40" width="14" height="40" fill="#cc0000" rx="2"/>
  <rect x="108" y="40" width="14" height="40" fill="#cc0000" rx="2"/>
  <rect x="131" y="40" width="14" height="40" fill="#8B4513" rx="2"/>
  <rect x="178" y="40" width="14" height="40" fill="#FFD700" rx="2"/>
  <!-- label -->
  <text x="140" y="105" font-family="Arial" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">220Ω Resistor</text>
  <text x="140" y="20" font-family="monospace" font-size="12" fill="#666" text-anchor="middle">Red-Red-Brown-Gold</text>
</svg>
