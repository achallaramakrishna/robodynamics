<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <title>L5 Data Sufficiency Vault</title>
  
  <rect width="800" height="600" fill="#0F172A" />
  
  {/* Standard Answer Selector Ring (Right) */}
  <g id="answer-selector" transform="translate(680, 300)">
     <circle r="140" fill="#1E293B" stroke="#334155" stroke-width="2" />
     <g font-size="24" font-weight="900" text-anchor="middle">
        <text x="0" y="-100" fill="#64748B" id="choice-a">A</text>
        <text x="100" y="-30" fill="#64748B" id="choice-b">B</text>
        <text x="60" y="80" fill="#64748B" id="choice-c">C</text>
        <text x="-60" y="80" fill="#64748B" id="choice-d">D</text>
        <text x="-100" y="-30" fill="#64748B" id="choice-e">E</text>
     </g>
  </g>

  {/* Vault Dashboard (Left) */}
  <g transform="translate(50, 50)">
     <rect width="450" height="500" rx="20" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
     <path d="M0,60 L450,60" stroke="#38BDF8" opacity="0.3" />
     <text x="20" y="40" fill="#38BDF8" font-size="14" font-weight="900">VAULT: INSUFFICIENT DATA ALERT</text>
     
     {/* Logic Nodes (Statements) */}
     <g id="stmt-1" transform="translate(50, 150)">
        <rect width="350" height="80" rx="10" fill="#0F172A" stroke="#334155" stroke-width="2" />
        <circle cx="30" cy="40" r="15" fill="#EF4444" id="lock-1" />
        <text x="70" y="45" fill="white" font-size="16">Statement I</text>
        <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
     </g>

     <g id="stmt-2" transform="translate(50, 260)">
        <rect width="350" height="80" rx="10" fill="#0F172A" stroke="#334155" stroke-width="2" />
        <circle cx="30" cy="40" r="15" fill="#EF4444" id="lock-2" />
        <text x="70" y="45" fill="white" font-size="16">Statement II</text>
     </g>

     {/* Scanning Tray */}
     <g id="sufficient-tray" transform="translate(225, 450)">
        <rect x="-150" y="-40" width="300" height="80" rx="10" fill="#334155" opacity="0.5" />
        <text text-anchor="middle" y="5" fill="#64748B" font-size="12" font-weight="900">DRAG STATEMENTS HERE TO SCAN</text>
        
        {/* Scanner Beam */}
        <rect x="-140" y="-30" width="4" height="60" fill="#38BDF8">
           <animate attributeName="x" values="-140;140;-140" dur="4s" repeatCount="indefinite" />
        </rect>
     </g>
  </g>

  <text x="400" y="30" text-anchor="middle" font-size="28" font-weight="900" fill="white">Data Sufficiency Vault</text>
</svg>
