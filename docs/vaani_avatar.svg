<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Circular clip -->
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>

    <!-- Skin gradient -->
    <radialGradient id="skin-grad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FDDBB4"/>
      <stop offset="100%" stop-color="#F0AA78"/>
    </radialGradient>

    <!-- Hair gradient -->
    <radialGradient id="hair-grad" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#3B1A00"/>
      <stop offset="100%" stop-color="#1A0A00"/>
    </radialGradient>

    <!-- Saree gradient -->
    <linearGradient id="saree-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <!-- Blouse gradient -->
    <linearGradient id="blouse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Background gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </radialGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.18)"/>
    </filter>

    <!-- Bindi glow -->
    <radialGradient id="bindi-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4444"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </radialGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="99" fill="#F97316" opacity="0.15"/>
  <circle cx="100" cy="100" r="97" fill="none" stroke="#F97316" stroke-width="3"/>

  <!-- Background fill -->
  <circle cx="100" cy="100" r="96" fill="url(#bg-grad)" clip-path="url(#circle-clip)"/>

  <!-- ── BODY / CLOTHING ── -->
  <!-- Saree drape (background shape behind body) -->
  <ellipse cx="100" cy="182" rx="62" ry="38" fill="url(#saree-grad)" clip-path="url(#circle-clip)"/>

  <!-- Saree border trim -->
  <ellipse cx="100" cy="182" rx="62" ry="38" fill="none" stroke="#F0ABFC" stroke-width="2.5" stroke-dasharray="4 3" clip-path="url(#circle-clip)"/>

  <!-- Torso / blouse -->
  <path d="M68 148 Q100 162 132 148 L138 196 Q100 210 62 196 Z"
        fill="url(#saree-grad)" clip-path="url(#circle-clip)"/>

  <!-- Blouse sleeves & upper body -->
  <path d="M72 130 Q100 144 128 130 L132 152 Q100 164 68 152 Z"
        fill="url(#blouse-grad)" clip-path="url(#circle-clip)"/>

  <!-- Saree pallu draped over shoulder -->
  <path d="M128 130 Q145 118 150 140 Q148 168 138 196 Q128 180 132 152 Z"
        fill="url(#saree-grad)" opacity="0.85" clip-path="url(#circle-clip)"/>

  <!-- Saree pallu decoration dots -->
  <circle cx="140" cy="145" r="2" fill="#F0ABFC" opacity="0.9"/>
  <circle cx="144" cy="158" r="1.5" fill="#F0ABFC" opacity="0.9"/>
  <circle cx="141" cy="170" r="2" fill="#F0ABFC" opacity="0.9"/>

  <!-- Gold necklace -->
  <path d="M82 132 Q100 142 118 132" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="140" r="3" fill="#F59E0B"/>
  <circle cx="91" cy="136" r="2" fill="#F59E0B"/>
  <circle cx="109" cy="136" r="2" fill="#F59E0B"/>

  <!-- Earrings -->
  <circle cx="72" cy="116" r="4" fill="#F59E0B" filter="url(#shadow)"/>
  <circle cx="72" cy="116" r="2" fill="#FCD34D"/>
  <line x1="72" y1="120" x2="72" y2="127" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="72" cy="128" r="2.5" fill="#F59E0B"/>

  <circle cx="128" cy="116" r="4" fill="#F59E0B" filter="url(#shadow)"/>
  <circle cx="128" cy="116" r="2" fill="#FCD34D"/>
  <line x1="128" y1="120" x2="128" y2="127" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="128" cy="128" r="2.5" fill="#F59E0B"/>

  <!-- ── NECK ── -->
  <path d="M90 118 Q100 122 110 118 L112 132 Q100 136 88 132 Z"
        fill="url(#skin-grad)"/>

  <!-- ── HEAD / FACE ── -->
  <!-- Head shape -->
  <ellipse cx="100" cy="88" rx="30" ry="35" fill="url(#skin-grad)" filter="url(#shadow)"/>

  <!-- ── HAIR ── -->
  <!-- Back hair volume -->
  <ellipse cx="100" cy="72" rx="32" ry="28" fill="url(#hair-grad)"/>

  <!-- Hair parting / top -->
  <path d="M100 53 Q102 56 100 58 Q98 56 100 53Z" fill="#E8C5A0"/>

  <!-- Bun (juda) on top-right -->
  <ellipse cx="118" cy="62" rx="10" ry="8" fill="url(#hair-grad)" transform="rotate(-20 118 62)"/>
  <path d="M108 60 Q115 56 124 62 Q118 68 110 65 Z" fill="#3B1A00" opacity="0.6"/>

  <!-- Hair flowers / gajra -->
  <circle cx="112" cy="56" r="3.5" fill="#FBBF24"/>
  <circle cx="120" cy="60" r="3" fill="#F9A8D4"/>
  <circle cx="122" cy="68" r="2.5" fill="#FBBF24"/>
  <circle cx="115" cy="70" r="2" fill="#F9A8D4"/>

  <!-- Side hair strands -->
  <path d="M70 80 Q68 95 72 112" fill="none" stroke="#1A0A00" stroke-width="6" stroke-linecap="round"/>
  <path d="M130 80 Q132 95 128 112" fill="none" stroke="#1A0A00" stroke-width="6" stroke-linecap="round"/>

  <!-- ── FACE FEATURES ── -->

  <!-- Forehead / skin fill over hair top -->
  <ellipse cx="100" cy="73" rx="26" ry="16" fill="url(#skin-grad)"/>

  <!-- Bindi -->
  <circle cx="100" cy="71" r="3.5" fill="url(#bindi-grad)"/>
  <circle cx="100" cy="71" r="1.5" fill="#FF6666"/>

  <!-- Eyebrows -->
  <path d="M84 81 Q90 78 96 80" fill="none" stroke="#3B1A00" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M104 80 Q110 78 116 81" fill="none" stroke="#3B1A00" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes (almond shape) -->
  <!-- Left eye -->
  <path d="M83 87 Q90 83 97 87 Q90 91 83 87Z" fill="white"/>
  <ellipse cx="90" cy="87" rx="4.5" ry="4" fill="#3B1A00"/>
  <circle cx="90" cy="87" r="2.5" fill="#1A0A00"/>
  <circle cx="91.5" cy="85.5" r="1.2" fill="white"/>
  <!-- Eyelid line -->
  <path d="M83 87 Q90 83 97 87" fill="none" stroke="#1A0A00" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Lashes -->
  <path d="M84 86 Q82 84 82 83" fill="none" stroke="#1A0A00" stroke-width="1"/>
  <path d="M87 84 Q86 82 87 81" fill="none" stroke="#1A0A00" stroke-width="1"/>
  <path d="M90 83.5 Q90 81 91 80" fill="none" stroke="#1A0A00" stroke-width="1"/>
  <path d="M93 84 Q94 82 95 81.5" fill="none" stroke="#1A0A00" stroke-width="1"/>
  <path d="M96 86 Q97 84 98 83.5" fill="none" stroke="#1A0A00" stroke-width="1"/>

  <!-- Right eye -->
  <path d="M103 87 Q110 83 117 87 Q110 91 103 87Z" fill="white"/>
  <ellipse cx="110" cy="87" rx="4.5" ry="4" fill="#3B1A00"/>
  <circle cx="110" cy="87" r="2.5" fill="#1A0A00"/>
  <circle cx="111.5" cy="85.5" r="1.2" fill="white"/>
  <!-- Eyelid line -->
  <path d="M103 87 Q110 83 117 87" fill="none" stroke="#1A0A00" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Lashes -->
  <path d="M104 86 Q102 84 102 83" fill="none" stroke="#1A0A00" stroke-width="1"/>
  <path d="M107 84 Q106 82 107 81" fill="none" stroke="#1A0A00" stroke-width="1"/>
  <path d="M110 83.5 Q110 81 111 80" fill="none" stroke="#1A0A00" stroke-width="1"/>
  <path d="M113 84 Q114 82 115 81.5" fill="none" stroke="#1A0A00" stroke-width="1"/>
  <path d="M116 86 Q117 84 118 83.5" fill="none" stroke="#1A0A00" stroke-width="1"/>

  <!-- Nose -->
  <path d="M98 92 Q100 98 102 92" fill="none" stroke="#D4895A" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="97" cy="94" r="1.2" fill="#D4895A" opacity="0.5"/>
  <circle cx="103" cy="94" r="1.2" fill="#D4895A" opacity="0.5"/>

  <!-- Smile / mouth -->
  <path d="M92 103 Q100 110 108 103" fill="none" stroke="#C2714F" stroke-width="2" stroke-linecap="round"/>
  <!-- Lips -->
  <path d="M93 103 Q100 107 107 103 Q104 101 100 101 Q96 101 93 103Z" fill="#E87461" opacity="0.75"/>

  <!-- Cheek blush -->
  <ellipse cx="82" cy="97" rx="6" ry="4" fill="#FFB3A0" opacity="0.5"/>
  <ellipse cx="118" cy="97" rx="6" ry="4" fill="#FFB3A0" opacity="0.5"/>

  <!-- ── HANDS / BOOK ── -->
  <!-- Left hand holding book -->
  <rect x="60" y="155" width="28" height="20" rx="4" fill="#F97316" opacity="0.9" clip-path="url(#circle-clip)"/>
  <rect x="61" y="156" width="13" height="18" rx="3" fill="#FDE68A" clip-path="url(#circle-clip)"/>
  <rect x="75" y="156" width="12" height="18" rx="3" fill="#FEF3C7" clip-path="url(#circle-clip)"/>
  <!-- Book lines -->
  <line x1="63" y1="160" x2="73" y2="160" stroke="#9CA3AF" stroke-width="1" clip-path="url(#circle-clip)"/>
  <line x1="63" y1="163" x2="73" y2="163" stroke="#9CA3AF" stroke-width="1" clip-path="url(#circle-clip)"/>
  <line x1="63" y1="166" x2="73" y2="166" stroke="#9CA3AF" stroke-width="1" clip-path="url(#circle-clip)"/>
  <!-- Hindi letter on book -->
  <text x="77" y="169" font-family="serif" font-size="11" fill="#7C3AED" text-anchor="middle" clip-path="url(#circle-clip)">अ</text>

  <!-- Left hand skin -->
  <ellipse cx="60" cy="164" rx="7" ry="5" fill="url(#skin-grad)" clip-path="url(#circle-clip)"/>

  <!-- Right hand pointing finger -->
  <path d="M135 155 Q145 150 148 158 Q146 165 138 162 Z" fill="url(#skin-grad)" clip-path="url(#circle-clip)"/>

  <!-- ── OUTER RING DECORATION ── -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="url(#saree-grad)" stroke-width="3"/>
  <!-- Small star/dot decorations on ring -->
  <circle cx="100" cy="4" r="3" fill="#F97316"/>
  <circle cx="100" cy="196" r="3" fill="#F97316"/>
  <circle cx="4" cy="100" r="3" fill="#9333EA"/>
  <circle cx="196" cy="100" r="3" fill="#9333EA"/>
  <circle cx="30" cy="30" r="2" fill="#FBBF24"/>
  <circle cx="170" cy="30" r="2" fill="#FBBF24"/>
  <circle cx="30" cy="170" r="2" fill="#FBBF24"/>
  <circle cx="170" cy="170" r="2" fill="#FBBF24"/>
</svg>
